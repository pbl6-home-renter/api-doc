type: object
title: PaginationMeta
description: Cấu trúc phân trang chuẩn (offset hoặc cursor)
properties:
  type:
    type: string
    enum: [offset, cursor]
    description: Loại phân trang đang sử dụng
    example: offset
  pageNo:
    type: integer
    minimum: 1
    description: Số trang hiện tại (dành cho offset pagination)
    example: 1
  pageSize:
    type: integer
    minimum: 1
    maximum: 100
    description: Số lượng bản ghi trên một trang
    example: 20
  totalItems:
    type: integer
    minimum: 0
    description: Tổng số lượng bản ghi thỏa mãn điều kiện lọc
    example: 50
  totalPages:
    type: integer
    minimum: 0
    description: Tổng số trang (dành cho offset pagination)
    example: 3
  hasNextPage:
    type: boolean
    description: Có trang kế tiếp hay không
    example: true
  hasPreviousPage:
    type: boolean
    description: Có trang trước đó hay không
    example: false
  nextCursor:
    type: string
    nullable: true
    description: Con trỏ trang kế tiếp (dành cho cursor pagination)
    example: null
required:
  - type
  - pageSize
  - hasNextPage
