type: object
x-apidog-folder: "Request/Auth"
title: RequestPasswordResetRequest
description: Dữ liệu yêu cầu gửi link đặt lại mật khẩu
additionalProperties: false

properties:
  email:
    type: string
    format: email
    minLength: 5
    maxLength: 254
    pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
    description: Email của tài khoản cần đặt lại mật khẩu
    example: "lan@example.com"

required:
  - email