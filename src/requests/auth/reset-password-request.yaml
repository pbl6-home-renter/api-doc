type: object
x-apidog-folder: "Auth/Request"
title: ResetPasswordRequest
description: Dữ liệu dùng token đặt lại mật khẩu
additionalProperties: false

properties:
  token:
    type: string
    minLength: 1
    writeOnly: true
    description: Token opaque dùng để xác nhận quyền đặt lại mật khẩu
    example: "sR7pQx9Nm2Vk4..."

  newPassword:
    type: string
    minLength: 1
    writeOnly: true
    description: Mật khẩu mới do người dùng thiết lập
    example: "NewP@ssw0rd123"

required:
  - token
  - newPassword