type: object
x-apidog-folder: "RoommateProfile/Request"
title: RoommateProfileSaveRequestDto
description: Dữ liệu đầy đủ để tạo hoặc cập nhật hồ sơ tìm bạn ở ghép
additionalProperties: false

properties:
  gender:
    type: string
    enum: [male, female, other]
    description: Giới tính của bản thân
    example: "female"
  birthYear:
    type: integer
    nullable: true
    description: Năm sinh
    example: 2002
  occupation:
    type: string
    nullable: true
    maxLength: 100
    description: Nghề nghiệp hoặc trường đang theo học
    example: "Sinh viên ĐH Bách Khoa Đà Nẵng"
  preferredProvince:
    type: string
    nullable: true
    maxLength: 100
    description: Tỉnh / Thành phố mong muốn tìm phòng
    example: "Đà Nẵng"
  preferredDistrict:
    type: string
    nullable: true
    maxLength: 100
    description: Quận / Huyện mong muốn tìm phòng
    example: "Liên Chiểu"
  preferredArea:
    type: string
    nullable: true
    minLength: 1
    maxLength: 255
    description: Khu vực mong muốn tìm phòng cụ thể
    example: "Khu vực quanh chợ Hòa Khánh"
  budgetMin:
    type: integer
    minimum: 0
    nullable: true
    description: Ngân sách thuê tối thiểu (VNĐ)
    example: 1500000
  budgetMax:
    type: integer
    minimum: 0
    nullable: true
    description: Ngân sách thuê tối đa (VNĐ)
    example: 2500000
  moveInOn:
    type: string
    format: date
    nullable: true
    description: Ngày dự kiến có thể chuyển vào ở
    example: "2026-10-01"
  bio:
    type: string
    nullable: true
    maxLength: 1000
    description: Lời giới thiệu bản thân
    example: "Mình hòa đồng, sạch sẽ, không hút thuốc. Cần tìm bạn ở ghép share tiền phòng."
  lifestyle:
    type: object
    nullable: true
    description: Các thói quen sinh hoạt dạng strongly-typed flags
    properties:
      cleanAndTidy: { type: boolean, example: true, description: "Ngăn nắp gọn gàng" }
      earlyBird: { type: boolean, example: true, description: "Thức dậy sớm" }
      nightOwl: { type: boolean, example: false, description: "Cú đêm / thức khuya" }
      petFriendly: { type: boolean, example: false, description: "Thích hoặc nuôi thú cưng" }
      smoking: { type: boolean, example: false, description: "Hút thuốc lá" }
      cooking: { type: boolean, example: true, description: "Thường xuyên nấu ăn tại phòng" }
      guestsAllowed: { type: boolean, example: false, description: "Đồng ý dẫn bạn bè về phòng" }
  personality:
    type: object
    nullable: true
    description: Đặc điểm tính cách dạng object linh hoạt
    example:
      introvert: true
      quiet: true
  isVisible:
    type: boolean
    description: Bật/tắt hiển thị công khai hồ sơ trên feed tìm bạn ở ghép
    example: true

required:
  - isVisible
