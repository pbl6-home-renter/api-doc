description: Dữ liệu đổi mật khẩu của người dùng hiện tại
additionalProperties: false

properties:
  currentPassword:
    type: string
    minLength: 1
    writeOnly: true
    description: Mật khẩu hiện tại
    example: "OldP@ssw0rd"

  newPassword:
    type: string
    minLength: 1
    writeOnly: true
