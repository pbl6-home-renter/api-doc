type: object
x-apidog-folder: "Building/Request"
title: BuildingUpdateRequestDto
description: >-
  Dữ liệu cập nhật một phần name/address của tòa nhà. Body rỗng {} được chấp nhận;
  với Building chưa duyệt thuộc người gọi, service vẫn trả 200 và phát BuildingUpdated.
additionalProperties: false

properties:
  name:
    type: string
    description: Thông tin name của tài nguyên trong ngữ cảnh DTO.
    minLength: 1
    maxLength: 254
    example: Tòa nhà Rentify Central Park
  address:
    type: string
    description: Thông tin address của tài nguyên trong ngữ cảnh DTO.
    minLength: 1
    maxLength: 254
    example: 123 Nguyễn Thị Minh Khai
