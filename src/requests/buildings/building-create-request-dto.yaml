type: object
x-apidog-folder: "Building/Request"
title: BuildingCreateRequestDto
description: Dữ liệu tạo tòa nhà mới, gồm tên tòa nhà và địa chỉ.
additionalProperties: false

properties:
  name:
    type: string
    description: Tên tòa nhà hoặc dãy trọ
    minLength: 1
    maxLength: 254
    example: "Nhà trọ Thanh Xuân"
  province:
    type: string
    description: Tỉnh / Thành phố
    minLength: 1
    maxLength: 100
    example: "Thành phố Hồ Chí Minh"
  ward:
    type: string
    description: Phường / Xã
    minLength: 1
    maxLength: 100
    example: "Phường Bến Nghé"
  address:
    type: string
    description: Địa chỉ chi tiết số nhà, ngõ ngách, tên đường
    minLength: 1
    maxLength: 254
    example: "12 Nguyễn Trãi"

required:
  - name
  - province
  - ward
  - address
