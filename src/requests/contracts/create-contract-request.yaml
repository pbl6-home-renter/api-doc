type: object
x-apidog-folder: "Contract/Request"
title: ContractCreateRequestDto
description: Dữ liệu tạo hợp đồng nháp
additionalProperties: false
properties:
  roomId: { type: string, format: uuid }
  tenantId: { type: string, format: uuid, nullable: true }
  tenantName: { type: string, nullable: true, minLength: 1, maxLength: 254 }
  tenantPhone:
    type: string
    nullable: true
    minLength: 10
    maxLength: 12
    pattern: '^0[0-9]{9}$|^\+84[0-9]{9}$'
  depositAmount: { type: integer, minimum: 0 }
  rentPrice: { type: integer, minimum: 0 }
  startDate: { type: string, format: date }
  endDate: { type: string, format: date }
  vehicleCount: { type: integer, minimum: 0, nullable: true }
required: [roomId, tenantId, tenantName, tenantPhone, depositAmount, rentPrice, startDate, endDate, vehicleCount]
