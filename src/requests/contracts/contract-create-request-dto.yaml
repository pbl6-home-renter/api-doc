type: object
x-apidog-folder: "Contract/Request"
title: ContractCreateRequestDto
description: >-
  Dữ liệu tạo hợp đồng nháp theo entity Contract hiện tại của Tenancy-Service.
  landlordId lấy từ JWT, không gửi trong body. Nếu tenantId null hoặc không gửi,
  tenantName và tenantPhone bắt buộc có giá trị. Khi có tenantId, hai trường liên hệ
  được phép null hoặc không gửi; service chưa kiểm tra tài khoản tenant bên Identity.
additionalProperties: false

properties:
  roomId:
    type: string
    format: uuid
    description: Định danh duy nhất của phòng cần lập hợp đồng
    example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
  tenantId:
    type: string
    format: uuid
    nullable: true
    description: Định danh tài khoản khách thuê nếu đã có tài khoản trên Rentify
    example: null
  tenantName:
    type: string
    nullable: true
    minLength: 1
    maxLength: 254
    pattern: '\S'
    description: Họ tên người thuê, không được chỉ chứa khoảng trắng; bắt buộc khi không có tenantId
    example: "Trần Thị B"
  tenantPhone:
    type: string
    nullable: true
    minLength: 10
    maxLength: 12
    pattern: '^(0[0-9]{9}|\+84[0-9]{9})$'
    description: Số điện thoại người thuê; bắt buộc khi không có tenantId
    example: "0901234567"
  depositAmount:
    type: number
    minimum: 0
    description: Số tiền đặt cọc giữ phòng (VNĐ)
    example: 3500000
  rentPrice:
    type: number
    minimum: 0
    description: Tiền thuê dài hạn thỏa thuận trên hợp đồng (VNĐ)
    example: 3500000
  startDate:
    type: string
    format: date
    description: Ngày bắt đầu theo YYYY-MM-DD; phải trước endDate
    example: "2026-10-01"
  endDate:
    type: string
    format: date
    description: Ngày kết thúc theo YYYY-MM-DD; phải sau startDate
    example: "2027-10-01"
  vehicleCount:
    type: integer
    minimum: 0
    maximum: 2147483647
    nullable: true
    description: Số lượng xe máy gửi tại nhà xe
    example: 1

required:
  - roomId
  - depositAmount
  - rentPrice
  - startDate
  - endDate

anyOf:
  - required: [tenantId]
    properties:
      tenantId:
        type: string
        format: uuid
  - required: [tenantName, tenantPhone]
    properties:
      tenantName:
        type: string
      tenantPhone:
        type: string
