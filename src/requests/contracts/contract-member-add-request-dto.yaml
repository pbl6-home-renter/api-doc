type: object
x-apidog-folder: ContractMember/Request
title: ContractMemberAddRequestDto
description: Dữ liệu thêm thành viên ở ghép vào hợp đồng phòng (bỏ thủ tục khai báo
  tạm trú công an)
additionalProperties: false
properties:
  contractId:
    type: string
    format: uuid
    description: Định danh duy nhất của hợp đồng thuê phòng
    example: a81d4284-5f6e-4b68-b762-d3369b12be12
  tenantId:
    type: string
    format: uuid
    nullable: true
    description: Optional explicit account ID. Web sends null; no automatic linking
      by phone or Identity lookup.
    example: null
  tenantName:
    type: string
    minLength: 1
    maxLength: 254
    description: Họ và tên thành viên ở cùng
    example: Lê Văn C
  tenantPhone:
    type: string
    nullable: true
    minLength: 10
    maxLength: 12
    pattern: ^(0[0-9]{9}|\+84[0-9]{9})$
    description: Vietnamese phone number; required when tenantId is null.
    example: '0912345678'
  joinedAt:
    type: string
    format: date
    description: YYYY-MM-DD within the inclusive contract startDate/endDate range.
    example: '2026-10-01'
required:
- contractId
- tenantName
- joinedAt
