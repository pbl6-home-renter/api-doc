
type: object
x-apidog-folder: "Message/Request"
title: MessageSendRequestDto
description: Dữ liệu gửi một tin nhắn văn bản hoặc một tệp đính kèm vào hội thoại.
additionalProperties: false

properties:
  conversationId:
    type: string
    format: uuid
    description: Định danh duy nhất của cuộc hội thoại nhận tin nhắn.
    example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
  clientMessageId:
    type: string
    format: uuid
    description: ID duy nhất do client tạo để retry an toàn.
  type:
    type: string
    enum: [text, image, video, file]
    description: Phân loại nội dung tin nhắn.
    example: "text"
  content:
    type: string
    nullable: true
    maxLength: 4000
    description: Nội dung văn bản của tin nhắn.
    example: "Chào bạn, hôm nay có ai ở nhà không?"
  mediaId:
    type: string
    format: uuid
    nullable: true
    description: ID tệp đã upload nếu type là image, video hoặc file; loại tệp phải khớp với type.
    example: null
  replyToMessageId:
    type: string
    format: uuid
    nullable: true
    description: |-
      (Chat v2, tùy chọn) ID tin được trả lời. Tin gốc phải cùng hội thoại, chưa xóa và là `text`/`image`/`video`/`file`/`bot`; sai thì `422 MESSAGE_REPLY_TARGET_INVALID`.
      Retry cùng `clientMessageId` trả tin đã lưu, không kiểm tra lại tin gốc.
    example: null

required:
  - conversationId
  - clientMessageId
  - type
