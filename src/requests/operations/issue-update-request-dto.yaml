type: object
x-apidog-folder: "IssueReport/Request"
title: IssueReportUpdateRequestDto
description: Dữ liệu cập nhật tiến độ xử lý và nghiệm thu sự cố
additionalProperties: false
minProperties: 1

properties:
  status:
    type: string
    enum: [in_progress, resolved]
    description: Chủ trọ chuyển open sang in_progress, sau đó in_progress sang resolved. Hủy bằng operation cancel riêng.
    example: "resolved"
  assignedTo:
    type: string
    nullable: true
    minLength: 1
    maxLength: 500
    description: Phân công thợ hoặc đơn vị sửa chữa
    example: "Thợ điện nước anh Hùng"
  repairCost:
    type: integer
    minimum: 0
    maximum: 2147483647
    nullable: true
    description: Chi phí bảo dưỡng, thay thế phụ kiện (VNĐ)
    example: 150000
  resolutionNote:
    type: string
    nullable: true
    minLength: 1
    maxLength: 500
    description: Ghi chú kết quả xử lý hoặc nguyên nhân hư hỏng
    example: "Đã thay gioăng cao su mới và vòi xịt inox"
