type: object
x-apidog-folder: "RatePolicy/Request"
title: RatePolicyCreateRequestDto
description: Tạo một bộ đơn giá cho một tòa nhà hoặc phòng.
additionalProperties: false
properties:
  scope:
    type: string
    enum: [building, room]
  buildingId:
    type: string
    format: uuid
    description: Bắt buộc khi scope là building; không gửi khi scope là room.
  roomId:
    type: string
    format: uuid
    description: Bắt buộc khi scope là room; không gửi khi scope là building.
  rates:
    type: array
    minItems: 1
    items:
      $ref: '../../openapi.yaml#/components/schemas/RateItem'
required: [scope, rates]
oneOf:
  - properties:
      scope: { enum: [building] }
    required: [buildingId]
    not:
      properties:
        roomId: {}
      required: [roomId]
  - properties:
      scope: { enum: [room] }
    required: [roomId]
    not:
      properties:
        buildingId: {}
      required: [buildingId]
