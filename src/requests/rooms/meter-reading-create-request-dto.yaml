type: object
title: MeterReadingCreateRequestDto
additionalProperties: false
properties:
  roomId:
    type: string
    format: uuid
  type:
    type: string
    enum:
    - electricity
    - water
  period:
    type: string
    pattern: ^\d{4}-(0[1-9]|1[0-2])$
  currentReading: &id001
    type: string
    pattern: ^(0|[1-9]\d*)(\.\d{1,2})?$
  previousReading: *id001
  isBaseline:
    type: boolean
description: For an initial baseline, previousReading may be supplied; ordinary readings derive it from the previous reading or same-period baseline. Upload evidence after creation.
required:
- roomId
- type
- period
- currentReading
- isBaseline
