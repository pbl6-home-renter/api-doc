type: object
x-apidog-folder: "Room/Request"
title: RoomCreateRequestDto
description: Dữ liệu tạo phòng
additionalProperties: false

properties:
  buildingId:
    type: string
    description: Định danh duy nhất của tòa nhà liên quan.
    format: uuid
    example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
  name:
    type: string
    description: Thông tin name của tài nguyên trong ngữ cảnh DTO.
    minLength: 1
    maxLength: 254
    example: P.201
  floorNumber:
    type: integer
    description: Thông tin floor number của tài nguyên trong ngữ cảnh DTO.
    minimum: 1
    example: 2
  area:
    type: string
    description: Thông tin area của tài nguyên trong ngữ cảnh DTO.
    example: '18.5'
  amenities:
    type: object
    description: Các tiện ích đi kèm
    example:
      aircon: true
  maxOccupancy:
    type: integer
    description: Thông tin max occupancy của tài nguyên trong ngữ cảnh DTO.
    minimum: 1
    example: 3
  genderPolicy:
    type: string
    description: Thông tin gender policy của tài nguyên trong ngữ cảnh DTO.
    enum: [any, male, female]
    example: any
  rentPrice:
    type: integer
    description: Thông tin rent price của tài nguyên trong ngữ cảnh DTO.
    minimum: 0
    example: 3500000

required:
  - buildingId
  - name
  - floorNumber
  - area
  - amenities
  - maxOccupancy
  - genderPolicy
  - rentPrice
