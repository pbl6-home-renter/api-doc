type: object
title: BulkMeterReadingCreateRequestDto
additionalProperties: false
properties:
  buildingId: &id001
    type: string
    format: uuid
  recordedMonth:
    type: string
    pattern: ^\d{4}-(0[1-9]|1[0-2])$
  readings:
    type: array
    minItems: 1
    maxItems: 200
    items:
      type: object
      title: BulkMeterReadingItem
      additionalProperties: false
      properties:
        roomId: *id001
        type:
          type: string
          enum:
          - electricity
          - water
        currentReading:
          type: string
          pattern: ^(0|[1-9]\d*)(\.\d{1,2})?$
      required:
      - roomId
      - type
      - currentReading
description: 'Atomic batch: one invalid reading or missing baseline rolls back the entire request. Images are attached later.'
required:
- buildingId
- recordedMonth
- readings
