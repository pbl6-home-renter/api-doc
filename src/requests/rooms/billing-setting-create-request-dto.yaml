type: object
x-apidog-folder: "BillingSetting/Request"
title: BillingSettingCreateRequestDto
description: Cấu hình ngày thu dự kiến và nhắc nộp; hai ngày độc lập trong khoảng 1–28, không sinh trạng thái quá hạn. Với scope room, server lấy buildingId từ Room.
additionalProperties: false
properties:
  scope:
    type: string
    enum: [building, room]
  buildingId:
    type: string
    format: uuid
    description: Bắt buộc khi scope là building; không gửi khi scope là room.
  roomId:
    type: string
    format: uuid
    description: Bắt buộc khi scope là room; không gửi khi scope là building.
  paymentDueDay:
    type: integer
    minimum: 1
    maximum: 28
    default: 5
    description: Ngày dự kiến thu tiền trong tháng, chỉ để hiển thị.
  remindDay:
    type: integer
    minimum: 1
    maximum: 28
    nullable: true
    description: Ngày nhắc nộp do chủ trọ tự chọn, có thể sau paymentDueDay; null là không nhắc.
  botEnabled:
    type: boolean
    default: true
required: [scope]
oneOf:
  - properties:
      scope: { enum: [building] }
    required: [buildingId]
    not:
      properties:
        roomId: {}
      required: [roomId]
  - properties:
      scope: { enum: [room] }
    required: [roomId]
    not:
      properties:
        buildingId: {}
      required: [buildingId]
