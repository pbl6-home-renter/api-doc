    example: 5
  remindDays:
    type: integer
    description: Thông tin remind days của tài nguyên trong ngữ cảnh DTO.
    minimum: 1
    maximum: 28
    nullable: true
    example: 3
  botEnabled:
    type: boolean
    description: Thông tin bot enabled của tài nguyên trong ngữ cảnh DTO.
    example: true

required:
  - scope
  - roomId
  - dueDays
  - remindDays
  - botEnabled
