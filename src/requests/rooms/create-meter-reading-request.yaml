type: object
x-apidog-folder: "Request/Billing"
title: CreateMeterReadingRequest
description: Dữ liệu tạo chỉ số công tơ đã xác nhận
additionalProperties: false
properties:
  roomId: { type: string, format: uuid }
  type: { type: string, enum: [electricity, water] }
  period: { type: string, minLength: 7, maxLength: 7, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
  previousReading: { type: string }
  currentReading: { type: string }
  readingDate: { type: string, format: date, nullable: true }
  isBaseline: { type: boolean }
  evidenceMediaId: { type: string, format: uuid }
required: [roomId, type, period, previousReading, currentReading, readingDate, isBaseline, evidenceMediaId]
