type: object
x-apidog-folder: "Billing/Request"
title: CreateBillingSettingRequest
description: Dữ liệu tạo cấu hình billing
additionalProperties: false

properties:
  scope:
    type: string
    enum: [building, room]
    example: room
  roomId:
    type: string
    format: uuid
    nullable: true
  dueDays:
    type: integer
    minimum: 1
    maximum: 28
    example: 5
  remindDays:
    type: integer
    minimum: 1
    maximum: 28
    nullable: true
    example: 3
  botEnabled:
    type: boolean
    example: true

required:
  - scope
  - roomId
  - dueDays
  - remindDays
  - botEnabled
