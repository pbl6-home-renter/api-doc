properties:
  paymentDueDay:
    type: integer
    minimum: 1
    maximum: 28
    description: Ngày dự kiến thu tiền trong tháng, chỉ để hiển thị.
  remindDay:
    type: integer
    minimum: 1
    maximum: 28
