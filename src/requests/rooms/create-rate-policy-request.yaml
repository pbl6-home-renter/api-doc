type: object
x-apidog-folder: "RatePolicy/Request"
title: RatePolicyCreateRequestDto
description: Dữ liệu tạo chính sách đơn giá
additionalProperties: false

properties:
  scope:
    type: string
    enum: [building, room]
    example: room
  roomId:
    type: string
    format: uuid
    nullable: true
  name:
    type: string
    example: Điện EVN
  type:
    type: string
    enum: [electricity, water, wifi, cleaning, parking, maintenance, other]
    example: electricity
  rateKind:
    type: string
    enum: [flat, tiered, fixed_per_period, per_head, per_area_m2, per_vehicle]
    example: tiered
  steps:
    type: array
    nullable: true
    items:
      type: object
      properties:
        from: { type: integer, minimum: 0 }
        to: { type: integer, minimum: 0, nullable: true }
        price: { type: integer, minimum: 0 }
      required: [from, to, price]

required:
  - scope
  - roomId
  - name
  - type
  - rateKind
  - steps
