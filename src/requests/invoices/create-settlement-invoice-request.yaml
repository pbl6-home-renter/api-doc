type: object
x-apidog-folder: "Invoice/Request"
title: InvoiceCreateSettlementRequestDto
description: Dữ liệu tạo hóa đơn quyết toán
additionalProperties: false
properties:
  contractId: { type: string, format: uuid }
  period: { type: string, minLength: 7, maxLength: 7, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
  otherFees:
    type: array
    nullable: true
    items:
      type: object
      properties:
        name: { type: string }
        amount: { type: integer }
      required: [name, amount]
  note: { type: string, nullable: true }
required: [contractId, period, otherFees, note]
