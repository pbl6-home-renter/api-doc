type: object
title: InvoiceUpdateRequestDto
additionalProperties: false
properties:
  otherFees:
    type: array
    maxItems: 20
    items:
      type: object
      title: InvoiceFeeInput
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          type: string
          pattern: ^-?(0|[1-9]\d*)(\.\d{1,2})?$
      required:
      - name
      - amount
  note:
    type: string
    nullable: true
    maxLength: 500
description: 'At least one field is required. Omitted fields remain unchanged; [] clears fees; null clears note. otherFees: null and {} are invalid.'
minProperties: 1
