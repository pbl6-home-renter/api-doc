get:
  tags:
  - Operation
  x-apidog-folder: AuditLog
  x-apidog-status: released
  operationId: getAuditLogsAuditlogid
  security:
  - BearerAuth: []
  summary: Get audit log details
  description: Chỉ admin. Trả cùng field của list và thêm metadata. UUID path sai
    trả 400 BAD_REQUEST; ID hợp lệ không tồn tại trả 404 AUDIT_LOG_NOT_FOUND.
  parameters:
  - name: auditLogId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc chi tiết nhật ký.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - AUDIT_LOG_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/AuditLogDetailResponseDto
          example:
            statusCode: 200
            code: AUDIT_LOG_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              actorId: b13d28cf-b1c5-4e78-a54d-017637c47c30
              actorName: Admin Demo
              action: user.locked
              entityType: user
              entityId: 7f94255a-2401-49b7-a0a4-88457633c89e
              sourceService: identity
              createdAt: '2026-11-24T03:00:00.000Z'
              metadata:
                lockReason: Spam
    '400':
      description: UUID path không hợp lệ (ParseUUIDPipe theo convention hiện tại).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - BAD_REQUEST
          example:
            statusCode: 400
            code: BAD_REQUEST
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      description: Không tìm thấy audit log.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - AUDIT_LOG_NOT_FOUND
          example:
            statusCode: 404
            code: AUDIT_LOG_NOT_FOUND
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
