get:
  tags:
  - Operation
  x-apidog-folder: AuditLog
  operationId: getAuditLogsAuditlogid
  summary: Get audit log details
  description: 'admin. Đọc hoặc xuất một bản ghi kiểm toán. Lỗi nghiệp vụ: 403 FORBIDDEN · 404 NOT FOUND.'
  parameters:
  - name: auditLogId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc hoặc xuất một bản ghi kiểm toán.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - AUDIT_LOG_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/AuditLogDetailResponseDto
          example:
            statusCode: 200
            code: AUDIT_LOG_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              action: user.lock
              entityType: user
              entityId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              beforeData:
                status: active
              afterData:
                status: locked
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
