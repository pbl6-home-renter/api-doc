get:
  tags:
  - Operation
  x-apidog-folder: Dashboard
  operationId: getDashboard
  security:
    - BearerAuth: []
  summary: Get system dashboard metrics
  description: 'admin. Đọc số liệu tổng hợp hệ thống. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 INVALID DATE RANGE.'
  parameters:
  - name: from
    in: query
    schema:
      type: string
      format: date
  - name: to
    in: query
    schema:
      type: string
      format: date
  responses:
    '200':
      description: 'Thành công: Đọc số liệu tổng hợp hệ thống.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - DASHBOARD_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/DashboardResponseDto
          example:
            statusCode: 200
            code: DASHBOARD_FETCHED
            data:
              totalUsers: 1250
              totalLandlords: 320
              totalTenants: 930
              totalBuildings: 145
              pendingApprovalBuildings: 8
              totalRooms: 1580
              occupancyRate: '89.2'
              systemTransactionVolume: 3450000000
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
