get:
  tags:
  - Operation
  x-apidog-folder: Dashboard
  operationId: getDashboard
  security:
    - BearerAuth: []
  summary: Get system dashboard metrics
  description: |-
    admin. Đọc số liệu tổng hợp hệ thống. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 INVALID DATE RANGE.

    ### Sequence diagram — Get system dashboard metrics

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

