get:
  tags:
  - Operation
  x-apidog-folder: Dashboard
  x-apidog-status: developing
  operationId: getDashboard
  security:
  - BearerAuth: []
  summary: Get admin building and room statistics
  description: |-
    Admin-only snapshot of Tenancy building and room data at request time.
    Counts exclude soft-deleted buildings and rooms. `totalBuildings` counts
    approved buildings only. `totalRooms` and `roomsByStatus` count rooms only
    in approved buildings. Every room status key is always present, including
    groups with zero rooms, and their sum equals `totalRooms`.
    `occupancyRate` is `occupied / totalRooms * 100`, rounded to one decimal
    place, or 0 when `totalRooms` is 0. No date range or other query filter
    is supported.
  responses:
    '200':
      description: Building and room statistics fetched.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - DASHBOARD_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/DashboardResponseDto
          example:
            statusCode: 200
            code: DASHBOARD_FETCHED
            data:
              totalBuildings: 2
              pendingApprovalBuildings: 2
              rejectedBuildings: 1
              totalRooms: 8
              roomsByStatus:
                available: 2
                occupied: 5
                maintenance: 1
              occupancyRate: 62.5
              generatedAt: '2026-11-24T09:30:00.000Z'
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      description: Request validation failed.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum: [VALIDATION_FAILED]
          example:
            statusCode: 422
            code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
