get:
  tags:
  - Operation
  x-apidog-folder: AuditLog
  x-apidog-status: released
  operationId: getAuditLogs
  security:
  - BearerAuth: []
  summary: Search audit logs
  description: Chỉ admin. Filter kết hợp AND. from/to là date-time có timezone, lọc
    created_at >= from và <= to; so sánh theo thời điểm thực, cho phép bằng nhau.
    Sắp xếp cố định created_at DESC, id DESC. Chỉ hỗ trợ tám query parameter bên dưới;
    field khác trả 422 UNEXPECTED_FIELD. Không hỗ trợ export file.
  parameters:
  - name: action
    in: query
    required: false
    schema:
      type: string
      enum:
      - user.locked
      - user.unlocked
      - user.updated
      - user.deleted
      - appeal.rejected
      - building.approved
      - building.rejected
  - name: entityType
    in: query
    required: false
    schema:
      type: string
      enum:
      - user
      - building
  - name: actorId
    in: query
    required: false
    schema: &id001
      type: string
      format: uuid
  - name: entityId
    in: query
    required: false
    schema: *id001
  - name: from
    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: to
    in: query
    required: false
    schema:
      type: string
      format: date-time
  - name: pageNo
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: pageSize
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  responses:
    '200':
      description: 'Thành công: Tìm kiếm nhật ký chỉ ghi thêm.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - AUDIT_LOGS_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/AuditLogListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: AUDIT_LOGS_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              actorId: b13d28cf-b1c5-4e78-a54d-017637c47c30
              actorName: Admin Demo
              action: user.locked
              entityType: user
              entityId: 7f94255a-2401-49b7-a0a4-88457633c89e
              sourceService: identity
              createdAt: '2026-11-24T03:00:00.000Z'
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      description: 'Enum, UUID query, date-time, phân trang sai hoặc from > to: VALIDATION_FAILED.
        Query ngoài contract: UNEXPECTED_FIELD.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - VALIDATION_FAILED
                - UNEXPECTED_FIELD
          example:
            statusCode: 422
            code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
