  x-apidog-folder: Media
  operationId: postMediaMediaidCompleteUpload
  security:
    - BearerAuth: []
  summary: Complete media upload
  description: |-
    tenant, landlord, admin. Chốt upload. Lỗi nghiệp vụ: 404 NOT FOUND · 403 FORBIDDEN · 409 UPLOAD NOT COMPLETED · 410 TICKET EXPIRED.

    ### Sequence diagram — Complete media upload

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

