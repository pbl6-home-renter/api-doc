post:
  tags:
  - Operation
  x-apidog-folder: Media
  x-apidog-status: released
  operationId: postMediaPresignUpload
  security:
    - BearerAuth: []
  summary: Request presigned upload URL
  description: |-
    tenant, landlord, admin. Bước 1/3 của luồng upload: xin upload ticket + presigned URL để client PUT file trực tiếp lên storage (Cloudflare R2). Server không nhận bytes file.

    **Luồng upload**

    1. `POST /media/presign-upload` → nhận `id`, `uploadUrl`, `requiredHeaders`, `expiresIn`.
    2. `PUT {uploadUrl}` với body là file (binary) và đúng `requiredHeaders` (không gửi `Authorization`).
    3. `POST /media/{id}/complete-upload` → server kiểm tra object trên storage và trả `url` để đọc.

    Liên kết file với thực thể cha được xác định ngay lúc presign qua `ownerType` + `ownerId` + `purpose`; không có bước "gắn" riêng. Các API nghiệp vụ khác (ví dụ `photoMediaIds` khi tạo phòng) nhận `id` của Media đã complete.

    **Quy tắc theo `purpose`** (admin luôn được upload; người upload luôn đọc được file của mình)

    | purpose | ownerType hợp lệ | MIME cho phép | Hiển thị | Ai được upload | Ghi chú |
    |---|---|---|---|---|---|
    | `avatar` | `user` | jpeg, png, webp | public | chính user đó | 1 file/owner, file mới thay file cũ |
    | `cover_photo` | `building`, `room` | jpeg, png, webp | public | landlord sở hữu | 1 file/owner, file mới thay file cũ |
    | `gallery_photo` | `building`, `room` | jpeg, png, webp | public | landlord sở hữu | |
    | `ownership_proof` | `building` | jpeg, png, webp, pdf | private | landlord sở hữu | không xóa được khi building `approved` |
    | `cccd_front`, `cccd_back` | `user`, `contract_member` | jpeg, png, webp | private | chính user, thành viên HĐ, landlord sở hữu | |
    | `contract_template` | `contract` | pdf | private | landlord sở hữu | |
    | `contract_signed` | `contract` | jpeg, png, webp, pdf | private | landlord sở hữu | không xóa được khi HĐ `signed/active/suspended/expired/terminated` |
    | `meter_reading_evidence` | `meter_reading` | jpeg, png, webp | private | landlord sở hữu; tenant của HĐ chỉ với `captureSource = camera_direct` | |
    | `issue_photo` | `issue_report` | jpeg, png, webp | private | người trong HĐ, landlord sở hữu | chưa hỗ trợ (503) |
    | `chat_attachment` | `message` | jpeg, png, webp, pdf | private | người trong hội thoại | chưa hỗ trợ (503) |

    Kích thước tối đa 10 MiB cho mọi purpose. Không hỗ trợ SVG/HTML/video.

    Lỗi nghiệp vụ: 403 FORBIDDEN (không có quyền với thực thể cha, hoặc thực thể cha không tồn tại) · 422 INVALID_PURPOSE (`purpose` không hợp lệ với `ownerType`) · 422 MEDIA_TYPE_NOT_ALLOWED (MIME, đuôi file hoặc kích thước không hợp lệ) · 503 SERVICE_UNAVAILABLE.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client
        participant GW as API Gateway
        participant ID as Identity
        participant TN as Tenancy
        participant R2 as Cloudflare R2

        C->>GW: POST /media/presign-upload {ownerType, ownerId, purpose, fileName, contentType, size}
        GW->>ID: forward + Authorization
        ID->>ID: Kiểm tra purpose ↔ ownerType, MIME, đuôi file, size
        ID->>TN: GET /internal/ownership/{ownerType}/{ownerId} (trừ ownerType = user)
        ID->>ID: Lưu Media pending_upload, ký PUT URL (Content-Type)
        ID-->>C: 201 MEDIA_UPLOAD_TICKET_ISSUED {id, uploadUrl, requiredHeaders, expiresIn}
        C->>R2: PUT uploadUrl + Content-Type (binary)
        R2-->>C: 200
        C->>GW: POST /media/{id}/complete-upload
        GW->>ID: forward
        ID->>R2: HEAD object (so khớp size + Content-Type)
        ID-->>C: 200 MEDIA_UPLOAD_COMPLETED {id, fileType, url}
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/MediaPresignUploadRequestDto
        example:
          ownerType: room
          ownerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          purpose: cover_photo
          fileName: p201.jpg
          contentType: image/jpeg
          size: 248120
  responses:
    '201':
      description: 'Thành công: Xin URL upload đã ký.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - MEDIA_UPLOAD_TICKET_ISSUED
              data:
                $ref: ../../openapi.yaml#/components/schemas/MediaPresignUploadResponseDto
          example:
            statusCode: 201
            code: MEDIA_UPLOAD_TICKET_ISSUED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              ownerType: room
              ownerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              purpose: cover_photo
              uploadUrl: https://account-id.r2.cloudflarestorage.com/rentify-media-public/room/3fa85f64-5717-4562-b3fc-2c963f66afa6/3fa85f64-5717-4562-b3fc-2c963f66afa6.jpg?X-Amz-Signature=abc123
              requiredHeaders:
                Content-Type: image/jpeg
              expiresIn: 900
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/media/{mediaId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      x-apidog-name: Service Unavailable
      description: Hạ tầng xác thực, storage hoặc service sở hữu thực thể cha tạm thời không khả dụng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [503]
              code:
                type: string
                enum:
                  - AUTH_UNAVAILABLE
                  - SERVICE_UNAVAILABLE
                description: |-
                  - AUTH_UNAVAILABLE: Hạ tầng xác thực tạm thời không khả dụng.
                  - SERVICE_UNAVAILABLE: Storage (R2) chưa được cấu hình, hoặc service sở hữu thực thể cha chưa sẵn sàng (hiện tại `issue_report`, `message`).
          examples:
            auth_unavailable:
              summary: AUTH_UNAVAILABLE — Hạ tầng xác thực tạm thời không khả dụng.
              value:
                statusCode: 503
                code: AUTH_UNAVAILABLE
            service_unavailable:
              summary: SERVICE_UNAVAILABLE — Storage hoặc service sở hữu chưa sẵn sàng.
              value:
                statusCode: 503
                code: SERVICE_UNAVAILABLE
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Thông tin tệp hoặc mục đích tải lên không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - MEDIA_TYPE_NOT_ALLOWED
                  - INVALID_PURPOSE
                  - VALIDATION_FAILED
                  - UNEXPECTED_FIELD
                description: |-
                  - MEDIA_TYPE_NOT_ALLOWED: MIME không thuộc danh sách của purpose, đuôi `fileName` không khớp `contentType`, hoặc `size` vượt giới hạn.
                  - INVALID_PURPOSE: Mục đích upload không phù hợp với `ownerType`.
                  - VALIDATION_FAILED: Thiếu field, sai kiểu hoặc sai enum.
                  - UNEXPECTED_FIELD: Body có field ngoài contract.
          examples:
            media_type_not_allowed:
              summary: MEDIA_TYPE_NOT_ALLOWED — Loại MIME hoặc kích thước tệp không được phép.
              value:
                statusCode: 422
                code: MEDIA_TYPE_NOT_ALLOWED
            invalid_purpose:
              summary: INVALID_PURPOSE — Mục đích upload không phù hợp với tài nguyên cha.
              value:
                statusCode: 422
                code: INVALID_PURPOSE
            validation_failed:
              summary: VALIDATION_FAILED — Thiếu field, sai kiểu hoặc sai enum.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
            unexpected_field:
              summary: UNEXPECTED_FIELD — Body có field ngoài contract.
              value:
                statusCode: 422
                code: UNEXPECTED_FIELD
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
