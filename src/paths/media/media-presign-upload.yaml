    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        participant A as Service sở hữu tài nguyên cha
        participant M as MinIO / Object Storage
        C->>G: POST /api/v1/media/presign-upload<br/>Body: ownerType, ownerId, purpose, fileName, contentType<br/>captureSource, size
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Kiểm tra metadata ownerType, ownerId, purpose và tệp
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>A: Đọc tài nguyên cha ownerType/ownerId và quyền actor (service token)
        A-->>S: Kết quả tồn tại và quyền trên tài nguyên cha
        S->>S: Kế thừa quyền tài nguyên cha#59; kiểm tra purpose/MIME/size và captureSource<br/>Ảnh công tơ: tenant camera_direct, landlord được device_storage
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (MEDIA_TYPE_NOT_ALLOWED / INVALID_PURPOSE / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Lưu media và ticket upload đang chờ với storage key
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        S->>M: Tạo signed PUT URL theo storage key, Content-Type và thời hạn ticket
        M-->>S: uploadUrl và requiredHeaders
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 201 MEDIA_UPLOAD_TICKET_ISSUED + data theo DTO<br/>Location: /api/v1/media/{mediaId}
        G-->>C: Chuyển tiếp status, body và header theo contract
        Note over C,M: Bước upload riêng#59; không gửi file bytes qua endpoint presign
        C->>M: PUT file bytes lên uploadUrl với requiredHeaders
        M-->>C: Kết quả upload#59; tiếp tục gọi complete-upload với mediaId
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/MediaPresignUploadRequestDto
        example:
          ownerType: room
          ownerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          purpose: cover_photo
          fileName: p201.jpg
          contentType: image/jpeg
          size: 248120
  responses:
    '201':
      description: 'Thành công: Xin URL upload đã ký.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - MEDIA_UPLOAD_TICKET_ISSUED
              data:
                $ref: ../../openapi.yaml#/components/schemas/MediaPresignUploadResponseDto
          example:
            statusCode: 201
            code: MEDIA_UPLOAD_TICKET_ISSUED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              ownerType: room
              ownerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              purpose: cover_photo
              uploadUrl: https://example.com/upload
              requiredHeaders:
                Content-Type: image/jpeg
              expiresIn: 900
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/media/{mediaId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Thông tin tệp hoặc mục đích tải lên không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - MEDIA_TYPE_NOT_ALLOWED
                  - INVALID_PURPOSE
                  - VALIDATION_FAILED
                description: |-
                  - MEDIA_TYPE_NOT_ALLOWED: Loại MIME hoặc kích thước tệp không được phép.
                  - INVALID_PURPOSE: Mục đích upload không phù hợp với tài nguyên cha.
                  - VALIDATION_FAILED: Lỗi validation khác chưa có mã cụ thể.
          examples:
            media_type_not_allowed:
              summary: MEDIA_TYPE_NOT_ALLOWED — Loại MIME hoặc kích thước tệp không được phép.
              value:
                statusCode: 422
                code: MEDIA_TYPE_NOT_ALLOWED
            invalid_purpose:
              summary: INVALID_PURPOSE — Mục đích upload không phù hợp với tài nguyên cha.
              value:
                statusCode: 422
                code: INVALID_PURPOSE
            validation_failed:
              summary: VALIDATION_FAILED — Lỗi validation khác chưa có mã cụ thể.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
