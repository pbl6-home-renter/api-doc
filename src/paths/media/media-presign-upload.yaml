post:
  tags:
  - Operation
  x-apidog-folder: Media
  operationId: postMediaPresignUpload
  summary: Xin URL upload đã ký
  description: 'tenant, landlord, admin. Xin URL upload đã ký. Lỗi nghiệp vụ: 422 MEDIA TYPE NOT ALLOWED · 422 INVALID
    PURPOSE · 403 FORBIDDEN.'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/MediaPresignUploadRequestDto
        example:
          ownerType: room
          ownerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          purpose: cover_photo
          fileName: p201.jpg
          contentType: image/jpeg
          size: 248120
  responses:
    '201':
      description: 'Thành công: Xin URL upload đã ký.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - MEDIA_UPLOAD_TICKET_ISSUED
              data:
                $ref: ../../openapi.yaml#/components/schemas/MediaPresignUploadResponseDto
          example:
            statusCode: 201
            code: MEDIA_UPLOAD_TICKET_ISSUED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              ownerType: room
              ownerId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              purpose: cover_photo
              uploadUrl: https://example.com/upload
              requiredHeaders:
                Content-Type: image/jpeg
              expiresIn: 900
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/media/{mediaId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
