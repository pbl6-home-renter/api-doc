get:
  tags:
  - Operation
  x-apidog-folder: Media
  operationId: getMediaMediaid
  security:
    - BearerAuth: []
  summary: Get or stream media
  description: |-
    Quyền kế thừa từ tài nguyên cha. Đọc hoặc stream một tệp. Lỗi nghiệp vụ: 404 NOT FOUND · 403 FORBIDDEN · 410 MEDIA DELETED.

    ### Sequence diagram — Get or stream media

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNqtVk1v20YQ_SsD9iIDEpSkziFqYYARaUexJdmk7LSFAWFFrsWtSC5NLu0Khg9FD0URFKiRQ1H0EAuGUbRpkRgpUEA69CAj_4P_pLP8sCxL6ck-WKL27c7Me292eKJY3KZKTYnoYUx9i2qM9EPi7fuAfyQW3I-9Hg2z54CEglksIL6AOpAI6i6j-L30gvagCk3eYy5dWcRuSKy63YANIugxGS4iDIkwaXjELAoG7bNIhEtgpoQxG2MyMaxEGX4RpknYNo9EP6TmztbNjq7dWwSrt0NHyeQ1OMnkbQxies7A78fD6R8-WA5Z3NmUO5vMb7Sx-Hbva2phhoKHpJ_nVK-srW3UYEPvQJUErHr0sOpRm5HqSfrRsE8z3EaOS8ZvMRQPQ-oSwbhfYXYZBiyZfOeBCAmESB-4zGMi29cLKRnA3od3yeRCQB-BvzLMfjzyAbOOwUrGv8UZNAuDceo1WH30BEqddrvbVFtfdg19Z1c3O2auG_XtuaT2aMgOhvD8RQePm1xa0Esmv-C_8ZXfx183TbCI5dDZHqMGHcwVwb_HwPxIELTVgmjgUOIKJ9fYqGTBrn9KJi9xLyrww83e2dFmDepOPEQ-fBAsGf8bQCh9G4kyCGf6N2YkmA_fTEcWPieTK6t8h044mp7DF5Vc7kqHD6ifnW9m5y8t95PHTz6DKB6iAEAsVBhEMnkDlkuYhwLNIsdYXcMGm-Na2hmIu4L-dDQfZHMmaUCEU5Zk2BRPdSju5D4uWHMSz6EiwsCajiFwpqOgen2GlPkO2FL2_kxsM6d09cEDKDVae-pWQ-tuq51n-M9Qm3pHN9C1xcIzXdXSH56qWuGIlUXn3GU_QLNd-LJhXjFwk8nP7I6JZMFapuuPFqSuLwM_9mnYGQa0mn5rZKqIMK1ACjliqOH7vOO0Skaahl2J5k8m38fg8GT8jwUDTELAYYxJ3Kgw_dOT2o8vh7cJ3FxYne9vEXJcluWMPDhi-IxqY_v8FSxjdBVKhm62d4263m21O9319m5Luy-61Bu67t5AHyHuUAb51s-dWSoaTEhv50mpOYebtwhDa77CzLBiNneMCFNClt5-uX93cqjkP220N2RhQ9ozqeD49OEdkY308pasLY53GT9CP5tldEguEDoaQu5S2XxnUHjbcnh2VHpokaj8lOUUKAzwmi1y9HkvrK5t32YeHXYuT00julj6AY4twIlDiZf1YEijgPsRhUfYPY70HNY0fb_EUddn0zF-pDkXrsxWEP8_nC6z1adQWm8bTxuaprfuw01Zoh1mDaiAOHA5seV0QMqyGZHnm4mEhVzMNMpomG_J2SBakvxDvGWautZQu5q-hZfLvbVD86YdeDZh00Svz9KhZ8kevQwKnrNdzdzs61LV3lDQKPW3RwWxiVhuvy0ZHXy861l649ekom6PWANZrx9hb-EAyZ1scQ9HMJR8rCKWOq-UU6ou4DHapdHCq7WlbnVN3djTja5uGG0DMyTQv_32UzAnHbY-81_q8DqOAJweFWnjNPfiB42hLyMmc0mBudWem-0WHIckCIo3tY9RjhNVxFEZetwepicvmzxKWfFo6BFm44vhyb6Cix7dV2qwr9j0gMSu2FdOERQHyGfxxqjU8M6kZSXkcd9RagfEjfAJ35O-4jxfPP0POmf1hA)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        participant A as Service sở hữu tài nguyên cha
        participant M as MinIO / Object Storage
        C->>G: GET /api/v1/media/{mediaId}
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra path, header theo contract
        break path, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc media, ownerType/ownerId và trạng thái xóa
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>A: Đọc tài nguyên cha ownerType/ownerId và quyền actor (service token)
        A-->>S: Kết quả tồn tại và quyền trên tài nguyên cha
        S->>S: Quyền kế thừa tài nguyên cha#59; media chưa bị xóa
        Note over S,D: Không áp role cố định cho media#59; quyền quyết định bởi ownerType/ownerId<br/>Phản hồi thành công là file stream theo response 200 hiện có
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Ticket upload hết hạn hoặc media đã bị xóa theo trạng thái kiểm tra
            S-->>G: 410 (MEDIA_DELETED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>M: Đọc object đã được cấp quyền
        M-->>S: File bytes và metadata
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 File stream#59; Content-Type và Content-Disposition#59; không JSON wrapper
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: mediaId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc hoặc stream một tệp.'
      headers:
        Content-Disposition:
          description: Tên tệp tải xuống.
          schema:
            type: string
        Content-Type:
          description: MIME type của tệp.
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
    '410':
      x-apidog-name: Gone
      description: Tệp đã bị xóa hoặc không còn truy cập được.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [410]
              code:
                type: string
                enum:
                  - MEDIA_DELETED
          examples:
            media_deleted:
              summary: MEDIA_DELETED — Tệp đã bị xóa.
              value:
                statusCode: 410
                code: MEDIA_DELETED
delete:
  tags:
  - Operation
  x-apidog-folder: Media
  operationId: deleteMediaMediaid
  security:
    - BearerAuth: []
  summary: Delete media
  description: |-
    tenant, landlord, admin. Xóa mềm tệp. Lỗi nghiệp vụ: 403 FORBIDDEN · 409 CAN'T DELETE.

    ### Sequence diagram — Delete media

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNqtVt9r21YU_lcO2osDNk679KEeFBRLTdwkcio5aVcC5lq6sS7Rr0hXbk3IQ9lDGGWwkIcx9rCYUEb3gyR0MGYz-qCQ_0P_yc6VZMeOvT3VD7avzrn3nPN93zlXR5LpW1SqSRE9jKlnUoWRbkjcPQ_wQ2Lue7HboWG-DkjImckC4nGoA4mg7jCK_0svaAeqsOV3mEOX5n3XhK-83YA1wulr0p_30IWHQcMeMynotMsiHi5wM4QbszAm4_1KlPvPuynCbduPeDekxvPNyY621Zl3lqdDR-noZ7DT0WUMPDln4HXjfvKrB6ZN8p31ypMnazVQ1E21pUKVBKzae1B1qcVI9Sj7aVjHueta7rqWDi_xAD8MqUM4870Ks8pwwNLRNy7wkECIoIDDXMbzfZ2QkgPYvb1KRxccuuj4E8OchgMPMJcYzHT4S5y75mEwTr0GKw8fQ6nVbLa3ZO3rtq4-31GNllGwQT1rJqldGrL9Pjx70cLjRu9N6KSjH_FreO118emGASYxbTqdkGyaNIqA-wfUA26zdPgpLkNEMDc_Hf5lihQ_8TzRBdktP4DSjibvtNabeuOVqixKTK9BCwHBjD7EwLyIE1TkHN9gU-Jwu5CHXskruvk-Hb3DvUjet5O9d0cbNajbcR9Bx-RF7gGEQvIRL2MxyZ9YNmcevEkGJq7T0bVZvscZ9JJzeFkplFJpCRzy8438_IWYfvHo8VcQxX1kGYjJ_RB4OvoNTIcwF1VwFznG6hoWWD7asqZCv2voJoPZIBt3ugkIt8sCDIviqTbFnb6HBnNGRzNegi0zGUJgJ4OgenOKkHk2WIKy7h1nRgHpyvIylBrarrzZUNrbcmsdv3R5C4WvY7ePDeuqrGQPVmVlLLuleQHcRz9AoVx4otfOGDjp6Ad2TxCiYCXn9TsTstbKKHCYaMiDTGyLe1Sp5Fgp2Mfono5O4rFG822HMcaegJ_87grKh-_707htzFlno_HQR7OoYuBCj-EaScbW_CNYBOQKlHTVaO7odbWtNVvtp80dTflcKMkTlO7jAf5rj4atfkCr2b9GruJDEeStVwiyNO6rrLWLpOQCw40pwFCRZ5gZVsxmjuFhBshCLuZlO94l0hOn3Jyi7W2cTcQTD5fZ4DOxFT-SrHvEBLwUwU8CAcRFAEK4Z4j-zWmCNCb_gJOcu1nrf8CnYnwsYBKdh_gT-g6dqCG3mMnH_6llEZ1fQulpU19tKIqqfQ4Wi5HPxnq6hwkPsw4Vg2owGbfWlLox678neEygXpQ53hF1WRMSzK-wz9ipq-paQxNxvQiFhUNzxvoS6QQXq3LzXs6oLQgQVM_QJ0bnO3EdXfjQwwpnTqo3t7Yarf9u9QwF5_aquCM1H69Xv4fTzyjj7k1RAHg4mlk2oGtCEU6HmAfTqWM2t1eYk-_itQwlT1x2QidL5YyMC3iEs7Gh4STU5M22oeq7qt5Wdb2po5IIdKffc8bgP8QpoPlQxyGN8326_mdGU4OOb_XH99ViIvBO43FUzjyz1lk0-6Wy5NLQJczCt7qjPQmNLt2TarAnWXSfxA7fk47RKQ4sTLJ43ZNqOL5oWQr9uGtLtX3iRLjC16NXvl8Yj_8FmXXcNg)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        participant A as Service sở hữu tài nguyên cha
        C->>G: DELETE /api/v1/media/{mediaId}
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra path, header theo contract
        break path, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc media và liên kết tài nguyên cha
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>A: Đọc tài nguyên cha ownerType/ownerId và quyền actor (service token)
        A-->>S: Kết quả tồn tại và quyền trên tài nguyên cha
        S->>S: Kiểm tra quyền cha và điều kiện được xóa#59; giữ tệp hợp đồng đã ký làm chứng cứ
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (CANNOT_DELETE)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Xóa mềm media#59; không xóa chứng cứ bị bảo vệ
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 204 No Content#59; không JSON body
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: mediaId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '204':
      $ref: ../../openapi.yaml#/components/responses/NoContentResponse
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - CANNOT_DELETE
                description: |-
                  - CANNOT_DELETE: Tài nguyên chưa đủ điều kiện để xóa.
          examples:
            cannot_delete:
              summary: CANNOT_DELETE — Tài nguyên chưa đủ điều kiện để xóa.
              value:
                statusCode: 409
                code: CANNOT_DELETE
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
