get:
  tags:
  - Operation
  x-apidog-folder: Media
  x-apidog-status: released
  operationId: getMediaMediaid
  security:
    - BearerAuth: []
  summary: Get or stream media
  description: |-
    Stream completed media as before. For chat_attachment and conversation_avatar, authorize the caller and redirect to a URL for direct storage access. Private chat media uses a signed R2 GET URL that expires after MEDIA_DOWNLOAD_URL_TTL_SECONDS (default 300 seconds); call this endpoint again to obtain a fresh URL.

    Private chat media requires a Bearer token. Browser clients should use `GET /media/{mediaId}/download-url` and fetch its returned R2 URL directly, avoiding a cross-origin XHR redirect. Other private media keeps the API streaming response.
    For chat_attachment, Community confirms the media is attached to a message in the conversation. Active members may read it; read-only members may read only messages with sequence less than or equal to leftSequence. For conversation_avatar, only active conversation members may read. Admin and uploader read bypasses do not apply.

    Business errors: 401 UNAUTHORIZED, 403 FORBIDDEN, 404 RESOURCE_NOT_FOUND, 410 MEDIA_DELETED, 503 SERVICE_UNAVAILABLE.
  parameters:
  - name: mediaId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: Stream media content (all purposes except chat_attachment).
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '302':
      description: Redirect to a presigned R2 GET URL for chat_attachment or conversation_avatar.
      headers:
        Location:
          description: Direct download URL; private URLs expire after the configured interval.
          schema:
            type: string
            format: uri
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      x-apidog-name: Service Unavailable
      description: Hạ tầng xác thực, storage hoặc service sở hữu thực thể cha tạm thời không khả dụng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [503]
              code:
                type: string
                enum:
                  - AUTH_UNAVAILABLE
                  - SERVICE_UNAVAILABLE
                description: |-
                  - AUTH_UNAVAILABLE: Hạ tầng xác thực tạm thời không khả dụng.
                  - SERVICE_UNAVAILABLE: Storage or the owning service is unavailable.
          examples:
            auth_unavailable:
              summary: AUTH_UNAVAILABLE — Hạ tầng xác thực tạm thời không khả dụng.
              value:
                statusCode: 503
                code: AUTH_UNAVAILABLE
            service_unavailable:
              summary: SERVICE_UNAVAILABLE — Storage hoặc service sở hữu chưa sẵn sàng.
              value:
                statusCode: 503
                code: SERVICE_UNAVAILABLE
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
    '410':
      x-apidog-name: Gone
      description: Tệp đã bị xóa hoặc không còn truy cập được.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [410]
              code:
                type: string
                enum:
                  - MEDIA_DELETED
          examples:
            media_deleted:
              summary: MEDIA_DELETED — Tệp đã bị xóa.
              value:
                statusCode: 410
                code: MEDIA_DELETED
delete:
  tags:
  - Operation
  x-apidog-folder: Media
  x-apidog-status: released
  operationId: deleteMediaMediaid
  security:
    - BearerAuth: []
  summary: Delete media
  description: |-
    tenant, landlord, admin. Xóa mềm Media và xóa object trên storage. Chỉ người upload hoặc admin được xóa.

    - `ownership_proof` của building đã `approved` và `contract_signed` của HĐ đã có hiệu lực là bằng chứng, không xóa được (`409 CANNOT_DELETE`).
    - Với `avatar`/`cover_photo` không cần xóa file cũ trước khi upload file mới: complete file mới tự thay file cũ.

    Lỗi nghiệp vụ: 403 FORBIDDEN · 404 RESOURCE_NOT_FOUND · 409 CANNOT_DELETE · 410 MEDIA_DELETED (đã xóa trước đó).
  parameters:
  - name: mediaId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '204':
      $ref: ../../openapi.yaml#/components/responses/NoContentResponse
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      x-apidog-name: Service Unavailable
      description: Hạ tầng xác thực, storage hoặc service sở hữu thực thể cha tạm thời không khả dụng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [503]
              code:
                type: string
                enum:
                  - AUTH_UNAVAILABLE
                  - SERVICE_UNAVAILABLE
                description: |-
                  - AUTH_UNAVAILABLE: Hạ tầng xác thực tạm thời không khả dụng.
                  - SERVICE_UNAVAILABLE: Storage or the owning service is unavailable.
          examples:
            auth_unavailable:
              summary: AUTH_UNAVAILABLE — Hạ tầng xác thực tạm thời không khả dụng.
              value:
                statusCode: 503
                code: AUTH_UNAVAILABLE
            service_unavailable:
              summary: SERVICE_UNAVAILABLE — Storage hoặc service sở hữu chưa sẵn sàng.
              value:
                statusCode: 503
                code: SERVICE_UNAVAILABLE
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - CANNOT_DELETE
                description: |-
                  - CANNOT_DELETE: File đang là bằng chứng (building đã duyệt / HĐ đã có hiệu lực), không được xóa.
          examples:
            cannot_delete:
              summary: CANNOT_DELETE — File đang là bằng chứng, không được xóa.
              value:
                statusCode: 409
                code: CANNOT_DELETE
    '410':
      x-apidog-name: Gone
      description: Media đã bị xóa trước đó.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [410]
              code:
                type: string
                enum:
                  - MEDIA_DELETED
          examples:
            media_deleted:
              summary: MEDIA_DELETED — Media đã bị xóa.
              value:
                statusCode: 410
                code: MEDIA_DELETED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
