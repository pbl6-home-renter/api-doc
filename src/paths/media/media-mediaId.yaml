get:
  tags:
  - Operation
  x-apidog-folder: Media
  x-apidog-status: released
  operationId: getMediaMediaid
  security:
    - BearerAuth: []
  summary: Get or stream media
  description: |-
    Stream nội dung một Media đã complete (không bọc JSON envelope). Dùng cho file **private**: `url` trả về từ complete-upload có dạng `/api/v1/media/{mediaId}`.

    - File public (`avatar`, `cover_photo`, `gallery_photo`) đã có URL R2 public, client nên dùng URL đó thay vì gọi endpoint này.
    - Cần Bearer token (gateway không mở public route này), nên trình duyệt không thể dùng trực tiếp trong `<img src>`; web phải tải về dạng blob rồi tạo object URL.
    - Quyền đọc: admin, người upload, và các vai trò theo `purpose` (xem bảng ở `POST /media/presign-upload`).
    - `Content-Disposition: inline; filename*=UTF-8''<fileName>`.

    Lỗi nghiệp vụ: 401 UNAUTHORIZED · 403 FORBIDDEN · 404 RESOURCE_NOT_FOUND (không tồn tại hoặc chưa complete) · 410 MEDIA_DELETED.
  parameters:
  - name: mediaId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc hoặc stream một tệp.'
      headers:
        Content-Disposition:
          description: Tên tệp tải xuống.
          schema:
            type: string
        Content-Type:
          description: MIME type của tệp.
          schema:
            type: string
            enum:
              - image/jpeg
              - image/png
              - image/webp
              - application/pdf
        Content-Length:
          description: Kích thước tệp tính bằng byte.
          schema:
            type: integer
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      x-apidog-name: Service Unavailable
      description: Hạ tầng xác thực, storage hoặc service sở hữu thực thể cha tạm thời không khả dụng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [503]
              code:
                type: string
                enum:
                  - AUTH_UNAVAILABLE
                  - SERVICE_UNAVAILABLE
                description: |-
                  - AUTH_UNAVAILABLE: Hạ tầng xác thực tạm thời không khả dụng.
                  - SERVICE_UNAVAILABLE: Storage (R2) chưa được cấu hình, hoặc service sở hữu thực thể cha chưa sẵn sàng (hiện tại `issue_report`, `message`).
          examples:
            auth_unavailable:
              summary: AUTH_UNAVAILABLE — Hạ tầng xác thực tạm thời không khả dụng.
              value:
                statusCode: 503
                code: AUTH_UNAVAILABLE
            service_unavailable:
              summary: SERVICE_UNAVAILABLE — Storage hoặc service sở hữu chưa sẵn sàng.
              value:
                statusCode: 503
                code: SERVICE_UNAVAILABLE
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
    '410':
      x-apidog-name: Gone
      description: Tệp đã bị xóa hoặc không còn truy cập được.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [410]
              code:
                type: string
                enum:
                  - MEDIA_DELETED
          examples:
            media_deleted:
              summary: MEDIA_DELETED — Tệp đã bị xóa.
              value:
                statusCode: 410
                code: MEDIA_DELETED
delete:
  tags:
  - Operation
  x-apidog-folder: Media
  x-apidog-status: released
  operationId: deleteMediaMediaid
  security:
    - BearerAuth: []
  summary: Delete media
  description: |-
    tenant, landlord, admin. Xóa mềm Media và xóa object trên storage. Chỉ người upload hoặc admin được xóa.

    - `ownership_proof` của building đã `approved` và `contract_signed` của HĐ đã có hiệu lực là bằng chứng, không xóa được (`409 CANNOT_DELETE`).
    - Với `avatar`/`cover_photo` không cần xóa file cũ trước khi upload file mới: complete file mới tự thay file cũ.

    Lỗi nghiệp vụ: 403 FORBIDDEN · 404 RESOURCE_NOT_FOUND · 409 CANNOT_DELETE · 410 MEDIA_DELETED (đã xóa trước đó).
  parameters:
  - name: mediaId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '204':
      $ref: ../../openapi.yaml#/components/responses/NoContentResponse
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      x-apidog-name: Service Unavailable
      description: Hạ tầng xác thực, storage hoặc service sở hữu thực thể cha tạm thời không khả dụng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [503]
              code:
                type: string
                enum:
                  - AUTH_UNAVAILABLE
                  - SERVICE_UNAVAILABLE
                description: |-
                  - AUTH_UNAVAILABLE: Hạ tầng xác thực tạm thời không khả dụng.
                  - SERVICE_UNAVAILABLE: Storage (R2) chưa được cấu hình, hoặc service sở hữu thực thể cha chưa sẵn sàng (hiện tại `issue_report`, `message`).
          examples:
            auth_unavailable:
              summary: AUTH_UNAVAILABLE — Hạ tầng xác thực tạm thời không khả dụng.
              value:
                statusCode: 503
                code: AUTH_UNAVAILABLE
            service_unavailable:
              summary: SERVICE_UNAVAILABLE — Storage hoặc service sở hữu chưa sẵn sàng.
              value:
                statusCode: 503
                code: SERVICE_UNAVAILABLE
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - CANNOT_DELETE
                description: |-
                  - CANNOT_DELETE: File đang là bằng chứng (building đã duyệt / HĐ đã có hiệu lực), không được xóa.
          examples:
            cannot_delete:
              summary: CANNOT_DELETE — File đang là bằng chứng, không được xóa.
              value:
                statusCode: 409
                code: CANNOT_DELETE
    '410':
      x-apidog-name: Gone
      description: Media đã bị xóa trước đó.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [410]
              code:
                type: string
                enum:
                  - MEDIA_DELETED
          examples:
            media_deleted:
              summary: MEDIA_DELETED — Media đã bị xóa.
              value:
                statusCode: 410
                code: MEDIA_DELETED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
