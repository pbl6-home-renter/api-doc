delete:
  tags:
  - Property
  x-apidog-folder: FavoriteRoom
  x-apidog-status: developing
  operationId: deleteMeFavoriteRoomsRoomid
  security:
    - BearerAuth: []
  summary: Remove favorite room
  description: 'Tenant active. Chỉ xóa bản ghi đã lưu của user hiện tại, kể cả phòng đã occupied/ẩn/xóa. Trả 204 khi đã xóa, 404 RESOURCE_NOT_FOUND nếu user chưa lưu phòng (bao gồm lần DELETE thứ hai). Không cần tenant profile.'
  parameters:
  - name: roomId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '204':
      $ref: ../../openapi.yaml#/components/responses/NoContentResponse
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
