get:
  tags:
  - Property
  x-apidog-folder: Room
  x-apidog-status: designing
  operationId: getRoomsRoomid
  summary: Get room details
  description: 'public, landlord, tenant, admin. Đọc một phòng. Lỗi nghiệp vụ: 404 NOT FOUND · 403 FORBIDDEN.'
  security: []
  parameters:
  - name: roomId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc một phòng.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOM_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoomDetailResponseDto
          example:
            statusCode: 200
            code: ROOM_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              buildingId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: P.201
              description: Phòng trọ hiện đại
              area: '18.5'
              rentPrice: 3500000
              status: available
              effectiveRatePolicySummary:
                electricity: flat
                water: flat
              buildingName: Ví dụ
              depositAmount: 0
              landlord:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                name: Ví dụ
                phone: '0901234567'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenOnlyError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
patch:
  tags:
  - Property
  x-apidog-folder: Room
  x-apidog-status: designing
  operationId: patchRoomsRoomid
  security:
    - BearerAuth: []
  summary: Update room
  description: |-
    landlord. Cập nhật một phần thông tin phòng.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant TEN as Tenancy
        participant DB as Tenancy DB
        participant OB as Outbox

        GW->>TEN: PATCH /rooms/{roomId} (access token, updates)
        TEN->>TEN: Xác thực role landlord
        TEN->>DB: [Transaction] SELECT room FOR UPDATE
        alt Không tìm thấy hoặc đã xóa
            TEN-->>GW: 404 RESOURCE_NOT_FOUND
        else Room thuộc landlord khác
            TEN-->>GW: 403 FORBIDDEN
        else Room thuộc landlord hiện tại
            TEN->>TEN: room.update(updates)
            TEN->>DB: [Transaction] UPDATE rooms
            TEN->>OB: [Transaction] INSERT room.updated
            TEN-->>GW: 200 ROOM_UPDATED {id, editable Room fields}
        end
    ```

    Lỗi nghiệp vụ: 404 NOT FOUND · 403 FORBIDDEN · 422 VALIDATION FAILED.
  parameters:
  - name: roomId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/RoomUpdateRequestDto
        example:
          name: P.201
          rentPrice: 3600000
          area: 19.0
          description: Phòng trọ hiện đại, tiện nghi đầy đủ
          amenities:
            aircon: true
            fridge: false
  responses:
    '200':
      description: 'Thành công: Cập nhật thông tin phòng.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOM_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoomUpdateResponseDto
          example:
            statusCode: 200
            code: ROOM_UPDATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: P.201
              rentPrice: 3600000
              floorNumber: 2
              description: Phòng trọ hiện đại, tiện nghi đầy đủ
              area: 19.0
              amenities:
                aircon: true
                fridge: false
              maxOccupancy: 3
              genderPolicy: any
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
delete:
  tags:
  - Property
  x-apidog-folder: Room
  x-apidog-status: designing
  operationId: deleteRoomsRoomid
  security:
    - BearerAuth: []
  summary: Delete room
  description: |-
    landlord. Xóa mềm phòng. Kiểm tra hợp đồng đang hiệu lực chưa được thực hiện vì domain Contract chưa tồn tại.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant TEN as Tenancy
        participant DB as Tenancy DB
        participant OB as Outbox

        GW->>TEN: DELETE /rooms/{roomId} (access token)
        TEN->>TEN: Xác thực role landlord
        TEN->>DB: [Transaction] SELECT room FOR UPDATE
        alt Không tìm thấy hoặc đã xóa
            TEN-->>GW: 404 RESOURCE_NOT_FOUND
        else Room thuộc landlord khác
            TEN-->>GW: 403 FORBIDDEN
        else Room thuộc landlord hiện tại
            TEN->>TEN: room.delete()
            TEN->>DB: [Transaction] UPDATE rooms SET is_deleted = true
            TEN->>OB: [Transaction] INSERT room.deleted
            TEN-->>GW: 204 No Content
        end
    ```

    Lỗi nghiệp vụ: 404 NOT FOUND · 403 FORBIDDEN.
  parameters:
  - name: roomId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '204':
      $ref: ../../openapi.yaml#/components/responses/NoContentResponse
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
