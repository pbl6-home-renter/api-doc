get:
  tags:
  - Property
  x-apidog-folder: Room
  x-apidog-status: released
  operationId: getRoomsRoomid
  summary: Get room details
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant C as RoomController
        participant Bus as CQRS QueryBus
        participant H as Application handler
        Client->>GW: GET /api/v1/rooms/{roomId}
        GW->>S: Proxy original HTTP request
        S->>C: Invoke getRoomsRoomid
        C->>Bus: Execute query for getRoomsRoomid
        Bus->>H: Dispatch query handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  security: []
  parameters:
  - name: roomId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc một phòng.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOM_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoomDetailResponseDto
          example:
            statusCode: 200
            code: ROOM_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              buildingId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: P.201
              description: Phòng trọ hiện đại
              area: '18.5'
              rentPrice: 3500000
              status: available
              effectiveRatePolicySummary:
                electricity: flat
                water: flat
              buildingName: Ví dụ
              depositAmount: 0
              landlord:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                name: Ví dụ
                phone: '0901234567'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenOnlyError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
patch:
  tags:
  - Property
  x-apidog-folder: Room
  x-apidog-status: released
  operationId: patchRoomsRoomid
  security:
    - BearerAuth: []
  summary: Update room
  description: |-
    Lỗi nghiệp vụ: 404 NOT FOUND · 403 FORBIDDEN · 422 VALIDATION FAILED.
    
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant Guard as JWT/access guards
        participant C as RoomController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: PATCH /api/v1/rooms/{roomId}
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke patchRoomsRoomid
        C->>Bus: Execute command for patchRoomsRoomid
        Bus->>H: Dispatch command handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  parameters:
  - name: roomId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/RoomUpdateRequestDto
        example:
          name: P.201
          rentPrice: 3600000
          area: 19.0
          description: Phòng trọ hiện đại, tiện nghi đầy đủ
          amenities:
            aircon: true
            fridge: false
  responses:
    '200':
      description: 'Thành công: Cập nhật thông tin phòng.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOM_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoomUpdateResponseDto
          example:
            statusCode: 200
            code: ROOM_UPDATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: P.201
              rentPrice: 3600000
              floorNumber: 2
              description: Phòng trọ hiện đại, tiện nghi đầy đủ
              area: 19.0
              amenities:
                aircon: true
                fridge: false
              maxOccupancy: 3
              genderPolicy: any
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
