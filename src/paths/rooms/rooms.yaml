get:
  tags:
  - Property
  x-apidog-folder: Room
  operationId: getRooms
  summary: Search public rooms
  description: |-
    public. Tìm phòng trên sàn công khai. Lỗi nghiệp vụ: 422 VALIDATION FAILED · 429 RATE LIMIT EXCEEDED.

    ### Sequence diagram — Search public rooms

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNq9Vl2L20YU_SsX9WVDbZwuSSFus-BY2o1Tr72R3G2zLJixNLamK42U0WgTN-SpD6WEQpdQQimFXUIISR-SNoVS66EPWvZ_6J_0zkheez8gL6H74JU0d2buPefcM_PIcCOPGk0jofdTyl1qMjIRJNzlgH8klRFPwxEV5XtMhGQuiwmX0AaSQDtgFJ9XvqIjaMBmNGIBvXIxdkPFtrY6sEEkfUCmFyNsFeFQsc9cCjadsESKS8IcFSYpJ9yd1pMy_GKUqaK2okROBHXuducTht7oYuyOirWpxxJwietXq7Xra2sbTdiwBtAgMWvsf9IQURQmn49EY-1uSsW0CWMWSCpqkERC1iASnnqJyYQ67FtaPvWiGowjERJZLrtRLVvM3nBwIyFoQCSLeJ15NdhjRfZdCFIQEAgTBCxk1byRoGQPtk_eFtlzCRMM_JWBX8yOOEzz1ym4xexlWoaW2-A-7SZcW70BK4N-f7jZ6t0b2tbdLy1n4FT8UO6VD70IN4v2qYB2zWmCxb04YohMnI4C5mJefv4XnyxtBLcoERguoz3KF4XZTRhg7m6RvUqB8UQi5vQ8WeBTEki_otaul4Ac_1RkT3CqX2Q_nE5drIxZtf10ivBwkKyY_RuDUHJNEHdZZicZh4f5kYvvRfYHZn0WXdjPD-HreiWw-mCRuVOu_8UC_PuK3ppK1FNF-jTCxTiOuGfYOBuWEAZuPoPYz4_ixvEB1sN98BRFkwUxTlXvtatXYaXT2251O-YQWbHvDbdadmvTGlg29tF85LbVMvWHWy1zTt-VizSfxyZGZTznqI_sKYOgyJ6xc4xXNW-TgHlKaWNGA6-sNMEWCElN48sE9Ro8DQIyCmiDohF8dP3GZyCL7HdN1QGrZvJJlB8yMAd9FAsD4nlM4U6CLRHFFHuNJjfHJEjoMn5mkb1BjRfZ9-lcYscH-Qz_lTmAHxWzv10Q-SF-G6VF9guyK1QP_HYppqursKJxaw06_d5wvdXpWuaHgmunEreyCPAIcpug2nzkXCW-5yP9Gj-tinLaTr2Srp7jMzmvKGRJUvlrIBfDyyXpiWb-j1K2IPjrLaFVJuHmf2LS5ZdAab7KGmGu1lzsM1_ULFvtR0RVuRmQfcI0u3Cn3-khyCzwGJ_gQBwLtAR0Jdc_eUuwtd4RTT6quzK-hvK9RjQeJ3QpdbMqepndsgLVgSidnxXBqB0YadQnPjubIgLdPXk7L3Iw6MKnV5PL9dtFOI8Qd6W9RK-G3vOSQEC4F6Af4xbZEyhmr3ip2_x1CZii3ldDWsnLyKq-farUhmI7NT4NDfPwnGNycYZUlsy0fI5CJH6K683euNgNmpUY9ovsRZUSnZtqQlLdI0tmv5TA_6nqhe07NdRFV4UAx8KZLr-JEgmCEXH3NH8Juh-2dCUHNwrxbIIVjlshVfm7K2jEAjeE6-hsnR7aWK_VHTqWvW3ZQ8u2-zYCRGCyfPwr8ZeH481vElx63h36t3LQi4Cs4gZ2v7_pDNetQfu2ZcLH2I-SlO2HFvR-aO44_Z6WY-ndS31TpgMP02L2Qip5IIvHB_rYdRWUz1SV2fPLs1rHuw_gtYWSEHNq45GBkqkPpjFtzF9MlsRRos3x_Wnq7bVy50JUeT8Q2JunSXPPqBkhxayZh5e4R7sGwhDSXaMJu4ZHxyQN5K7xGIPSWFl9dbszmlKktGaIKJ34RlN7c83A-9AO2kI5-Pg_GbC2sQ)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        participant Z as Redis cache
        C->>G: GET /api/v1/rooms<br/>Query: filter, sort, order, pageSize, pageNo, format
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        Note over C,S: Endpoint public, không yêu cầu Bearer token
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Kiểm tra query, header theo contract
        break query, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_QUERY_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>Z: Tra cache danh sách công khai theo query
        Z-->>S: Cache hit hoặc miss
        alt Cache hit
            S->>S: Dùng trang dữ liệu cache còn hiệu lực
        else Cache miss
            S->>D: Đọc rooms available JOIN buildings approved, chưa xóa#59; áp filter/sort/offset
            D-->>S: Dữ liệu trang và tổng số bản ghi
            S->>Z: Lưu cache TTL 60s
        end
        S->>S: Loại tài sản của landlord bị ẩn#59; tên hiển thị từ dữ liệu đồng bộ, không JOIN identity_db
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        alt format=json hoặc mặc định
            S-->>G: 200 ROOMS_FETCHED + data theo DTO
            G-->>C: Chuyển tiếp JSON và header
        else format xuất tệp được hỗ trợ
            S-->>G: 200 File stream + Content-Type/Content-Disposition
            G-->>C: Chuyển tiếp tệp#59; không JSON wrapper
        end
    ```
  security: []
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        province:
          type: string
        ward:
          type: string
        minPrice:
          type: integer
          minimum: 0
        maxPrice:
          type: integer
          minimum: 0
        genderPolicy:
          type: string
          enum:
          - any
          - male
          - female
  - name: sort
    in: query
    description: Một trường sắp xếp được endpoint hỗ trợ.
    schema:
      type: string
      default: rentPrice
  - name: order
    in: query
    schema:
      type: string
      enum:
      - asc
      - desc
      default: asc
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: format
    in: query
    description: json trả envelope; định dạng khác trả file stream.
    schema:
      type: string
      enum:
      - json
      - xlsx
      - csv
      - pdf
      default: json
  responses:
    '200':
      description: 'Thành công: Tìm phòng trên sàn công khai.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOMS_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/RoomPublicListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: ROOMS_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              buildingId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: P.201
              area: '18.5'
              rentPrice: 3500000
              genderPolicy: any
              address: 12 Nguyễn Trãi
              district: Quận 1
              province: Thành phố Hồ Chí Minh
              isFavorited: false
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
        text/csv:
          schema:
            type: string
            format: binary
        application/pdf:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
  - Property
  x-apidog-folder: Room
  operationId: postRooms
  security:
    - BearerAuth: []
  summary: Create room
  description: |-
    landlord. Tạo phòng trong một tòa nhà. Lỗi nghiệp vụ: 403 FORBIDDEN · 409 DUPLICATE ROOM · 422 BUILDING NOT APPROVED.

    ### Sequence diagram — Create room

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNq1VsFu20YQ_ZWBenFQGkrc5BC1DSCLisNYFhWKdprAgLAi1-TCJJdZLt0IRg5BD0FRFGjQQxEURW0YQdC0gJO0QFHpkAOD_Af_pLMkJUu2cmrjgyWRs7tv3nszs4c1h7u01qgl9EFKI4fqjHiChLsR4B9JJY_ScEhF-TsmQjKHxSSS0AKSQCtgFL-v3KVDqMMWH7KAXroYu6Fimz0DNoikX5PRxQhLRfSpOGAOBYt6LJFiSVhfhUkakcgZrSZl-MUoXUX1eCI9Qft3OtMFA3d4MdZQsczFLJg8t2Vr9caNjQb0zL4NdRKz-sGVuuA8TL4YivqNde6OGjBMWeCyyDNcDSISUg1UhD2K8dtewLnoFvRpQAQlxTqBR_UEHqKBS2OeMNkMeRpJDULy0HScNFZYNfBo5FLR4wFTv3DriElGy7Njn0u-RV1GDDcpwW6UYDfy8WkEDheCBkQyHq0yRLbP8sk3IUhBQKACELCQyXLdEHHtw877V_nkRIKHgT8z8PPxcQSj7GUKTj5-kZah5TF4TqsBV9euw4ptmoOtZvfewGrf2W737X4lPSJfALVDBdsbwe27Nm43ee7AMJ88w3_j15GHTzf74BDHp_OAmo5DE5Sa79MIpM_y8dtUg4QgNp6P_3YUxLeyBLoE3eUrsLLdbW7bt0zLuN_WlwGzGmAjIYjotxRYlEjknZ43F_iUBNKvrGitlgm9-yGffIdL_Xzy7Wzp2c79BrT8dIScI3YFPQahyitBkaWf_YVZSxbBw-zYwd_55LWjnZMMDrIj-Gq1KohVW9FQ7t8v919K6SfXrn8OSTpCkYE4kguQ-eR3cALCQjTB2ckpZme44HJ8VxQwxr0GLztePGTzzDa3-2a3PkTLa4oRNCYCp7icR_jWWfDSxVAlm5ONIfaz47j-7imSF_ngKu28qZ6VxsVqUKuVP04lFhgm5pxJ3K8kuHr5MqwY3Z1mx9AHxaI6TH9Wdhysm_q9uce32k29beGD9eYs5tJF85yXLkaTnURotcmPDIJ88hM7Z6apJCRgrqquPUYDt-QnQVuHRCvkZ4K69SgNAjIMaJ1iXy30KiXC3Z-yamXk8eyIgW6bqBkD4rpM2YIEPcFjKlQX-HKPBMlCwej55BTrOp88SadKv3uajfGjxDDlWWRH-KxkFZVVdf9L5C3hd20NVgremrZhdgc3m0ZnVkf_mS69rKHvnVkDLRw_16dk9jJShnmjLCuyf4oPrv5nbwhEfnZU7qavluzP51-lul-0iAcp4pmZP_sjVCU3fj46A2PMwIRUEpSQ1B-onB4rAHONFqLCoU72Z7nWqI7enD_nLANFg1-lsGCUZlGaST75VbF0ms44KPwwI4TEseAH1C2eqqmCLnn_ikzZUHwtwsPNTmJF-ZN5Y2wumEHwgM74Kd9gPjDNF_dG2qWyX-SlOACiZZX3GazcNK11Q9fb3f_DEdUMYkXkcYhYkcXHaUHmEwWq7BTYOo9n_d-d07tiBFOcF2AZchxa-navY7SadntgmebWx4CPZGJVj08d5NBXCGM4wB6tGvULopbFnGHPTUha1PecZeaS-kBFrm8bHd3obgy6pj1o9nqWudPWsaV9zEpdb28YXYUvSrDVYydaeGtjzrz0p1dcPs4qurhLzA28yoMWxraQM0mtcirqki9s2TK3tgz7w_VdCB28f1WR1OXYdLFSBPQ1XN1RmWCtTp6xYio2lOmDIXH253OoisnhIV6FYGVW2pe0wm8ncA0HjNG121a32Rn029ZO2xq0Lcu0UF8C3vxFdqrQGl47lKkGLauNBtPhU1DdpBwF2M6Lu1uHO8WUbyzeKeuH6sNwH02vEcs1w6uGTBOtnJCqBSybxjWtFlIREubixf5wt4YvQ7pba8BuzaV7JA3kbu0RBqWxmlfVjb_WkCKlWk3w1PNrjWLAaDW8jN5HXOXLR_8CYz6M-w)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        participant I as identity-service
        C->>G: POST /api/v1/rooms<br/>Body: buildingId, name, roomType, floorNumber, area<br/>rentPrice, depositAmount, maxOccupancy, genderPolicy, amenities<br/>photoMediaIds
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc building và kiểm tra tên phòng trùng trong tòa nhà
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>I: Đọc metadata/quyền photoMediaIds nếu có
        I-->>S: Kết quả kiểm tra ảnh phòng
        S->>S: Actor sở hữu building#59; building approved#59; room chưa trùng và photoMediaIds hợp lệ
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (DUPLICATE_ROOM)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (BUILDING_NOT_APPROVED / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Tạo room gắn building với thông tin đúng RoomCreateRequestDto
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 201 ROOM_CREATED + data theo DTO<br/>Location: /api/v1/rooms/{roomId}
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/RoomCreateRequestDto
        example:
          buildingId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          name: P.201
          floorNumber: 2
          area: '18.5'
          amenities:
            aircon: true
          maxOccupancy: 3
          genderPolicy: any
          rentPrice: 3500000
          depositAmount: 3500000
  responses:
    '201':
      description: 'Thành công: Tạo phòng trong một tòa nhà.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - ROOM_CREATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoomCreateResponseDto
          example:
            statusCode: 201
            code: ROOM_CREATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              buildingId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: P.201
              status: available
              rentPrice: 3500000
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/rooms/{roomId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - DUPLICATE_ROOM
                description: |-
                  - DUPLICATE_ROOM: Tên phòng đã tồn tại trong tòa nhà.
          examples:
            duplicate_room:
              summary: DUPLICATE_ROOM — Tên phòng đã tồn tại trong tòa nhà.
              value:
                statusCode: 409
                code: DUPLICATE_ROOM
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - BUILDING_NOT_APPROVED
                  - VALIDATION_FAILED
                description: |-
                  - BUILDING_NOT_APPROVED: Tòa nhà chưa được duyệt.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            building_not_approved:
              summary: BUILDING_NOT_APPROVED — Tòa nhà chưa được duyệt.
              value:
                statusCode: 422
                code: BUILDING_NOT_APPROVED
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
