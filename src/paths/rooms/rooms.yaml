get:
  tags:
  - Property
  x-apidog-folder: Room
  operationId: getRooms
  summary: Search public rooms
  description: 'public. Tìm phòng trên sàn công khai. Lỗi nghiệp vụ: 422 VALIDATION FAILED · 429 RATE LIMIT EXCEEDED.'
  security: []
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        province:
          type: string
        ward:
          type: string
        minPrice:
          type: integer
          minimum: 0
        maxPrice:
          type: integer
          minimum: 0
        genderPolicy:
          type: string
          enum:
          - any
          - male
          - female
  - name: sort
    in: query
    description: Một trường sắp xếp được endpoint hỗ trợ.
    schema:
      type: string
      default: rentPrice
  - name: order
    in: query
    schema:
      type: string
      enum:
      - asc
      - desc
      default: asc
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: format
    in: query
    description: json trả envelope; định dạng khác trả file stream.
    schema:
      type: string
      enum:
      - json
      - xlsx
      - csv
      - pdf
      default: json
  responses:
    '200':
      description: 'Thành công: Tìm phòng trên sàn công khai.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOMS_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/RoomPublicListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: ROOMS_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              buildingId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: P.201
              area: '18.5'
              rentPrice: 3500000
              genderPolicy: any
              address: 12 Nguyễn Trãi
              district: Quận 1
              province: Thành phố Hồ Chí Minh
              isFavorited: false
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
        text/csv:
          schema:
            type: string
            format: binary
        application/pdf:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
  - Property
  x-apidog-folder: Room
  operationId: postRooms
  security:
    - BearerAuth: []
  summary: Create room
  description: 'landlord. Tạo phòng trong một tòa nhà. Lỗi nghiệp vụ: 403 FORBIDDEN · 409 DUPLICATE ROOM · 422 BUILDING
    NOT APPROVED.'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/RoomCreateRequestDto
        example:
          buildingId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          name: P.201
          floorNumber: 2
          area: '18.5'
          amenities:
            aircon: true
          maxOccupancy: 3
          genderPolicy: any
          rentPrice: 3500000
          depositAmount: 3500000
  responses:
    '201':
      description: 'Thành công: Tạo phòng trong một tòa nhà.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - ROOM_CREATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoomCreateResponseDto
          example:
            statusCode: 201
            code: ROOM_CREATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              buildingId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: P.201
              status: available
              rentPrice: 3500000
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/rooms/{roomId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      $ref: ../../openapi.yaml#/components/responses/ConflictError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
