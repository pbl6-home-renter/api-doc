get:
  tags:
  - Property
  x-apidog-folder: Room
  x-apidog-status: released
  operationId: getRooms
  summary: Search public rooms
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant C as RoomController
        participant Bus as CQRS QueryBus
        participant H as Application handler
        Client->>GW: GET /api/v1/rooms
        GW->>S: Proxy original HTTP request
        S->>C: Invoke getRooms
        C->>Bus: Execute query for getRooms
        Bus->>H: Dispatch query handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  security: []
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        province:
          type: string
        ward:
          type: string
        minPrice:
          type: integer
          minimum: 0
        maxPrice:
          type: integer
          minimum: 0
        genderPolicy:
          type: string
          enum:
          - any
          - male
          - female
  - name: sort
    in: query
    description: Một trường sắp xếp được endpoint hỗ trợ.
    schema:
      type: string
      default: rentPrice
  - name: order
    in: query
    schema:
      type: string
      enum:
      - asc
      - desc
      default: asc
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: format
    in: query
    description: json trả envelope; định dạng khác trả file stream.
    schema:
      type: string
      enum:
      - json
      - xlsx
      - csv
      - pdf
      default: json
  responses:
    '200':
      description: 'Thành công: Tìm phòng trên sàn công khai.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOMS_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/RoomPublicListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: ROOMS_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              buildingId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: P.201
              area: '18.5'
              rentPrice: 3500000
              genderPolicy: any
              address: 12 Nguyễn Trãi
              district: Quận 1
              province: Thành phố Hồ Chí Minh
              isFavorited: false
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
        text/csv:
          schema:
            type: string
            format: binary
        application/pdf:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
  - Property
  x-apidog-folder: Room
  x-apidog-status: released
  operationId: postRooms
  security:
    - BearerAuth: []
  summary: Create room
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant Guard as JWT/access guards
        participant C as RoomController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: POST /api/v1/rooms
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke postRooms
        C->>Bus: Execute command for postRooms
        Bus->>H: Dispatch command handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/RoomCreateRequestDto
        example:
          buildingId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          name: P.201
          floorNumber: 2
          area: '18.5'
          amenities:
            aircon: true
          maxOccupancy: 3
          genderPolicy: any
          rentPrice: 3500000
          depositAmount: 3500000
  responses:
    '201':
      description: 'Thành công: Tạo phòng trong một tòa nhà.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - ROOM_CREATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoomCreateResponseDto
          example:
            statusCode: 201
            code: ROOM_CREATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              buildingId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: P.201
              status: available
              rentPrice: 3500000
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/rooms/{roomId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - DUPLICATE_ROOM
                description: |-
                  - DUPLICATE_ROOM: Tên phòng đã tồn tại trong tòa nhà.
          examples:
            duplicate_room:
              summary: DUPLICATE_ROOM — Tên phòng đã tồn tại trong tòa nhà.
              value:
                statusCode: 409
                code: DUPLICATE_ROOM
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - BUILDING_NOT_APPROVED
                  - VALIDATION_FAILED
                description: |-
                  - BUILDING_NOT_APPROVED: Tòa nhà chưa được duyệt.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            building_not_approved:
              summary: BUILDING_NOT_APPROVED — Tòa nhà chưa được duyệt.
              value:
                statusCode: 422
                code: BUILDING_NOT_APPROVED
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
