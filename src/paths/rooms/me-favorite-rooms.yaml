get:
  tags:
  - Property
  x-apidog-folder: FavoriteRoom
  x-apidog-status: developing
  operationId: getMeFavoriteRooms
  security:
    - BearerAuth: []
  summary: List favorite rooms
  description: >-
    Tenant active. Trả phòng đã lưu còn available thuộc tòa approved chưa xóa.
    Phòng occupied hoặc không còn public được ẩn nhưng bản ghi lưu vẫn giữ để bỏ lưu hoặc hiển thị lại khi phòng public.
    Tenant mới không cần hồ sơ phụ; chưa có phòng phù hợp trả 200 với data rỗng.
    Mặc định sắp xếp rentPrice tăng dần, roomId là tie-breaker. Chỉ hỗ trợ format=json.
  parameters:
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - $ref: ./rooms.yaml#/get/parameters/0
  - $ref: ./rooms.yaml#/get/parameters/1
  - $ref: ./rooms.yaml#/get/parameters/2
  - name: format
    in: query
    description: Chỉ hỗ trợ JSON envelope.
    schema:
      type: string
      enum:
      - json
      default: json
  responses:
    '200':
      description: 'Thành công: Liệt kê phòng đã lưu.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOMS_FAVORITE_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/FavoriteRoomListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: ROOMS_FAVORITE_FETCHED
            data:
            - roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: P.201
              rentPrice: 3500000
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
  - Property
  x-apidog-folder: FavoriteRoom
  x-apidog-status: developing
  operationId: postMeFavoriteRooms
  security:
    - BearerAuth: []
  summary: Add favorite room
  description: 'Tenant active. Chỉ lưu phòng available của tòa approved chưa xóa. ID tenant lấy từ token. 404 RESOURCE_NOT_FOUND nếu phòng không public; 409 ALREADY_FAVORITED nếu đã lưu. Unique theo tenantId/roomId, không cần tenant profile.'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/FavoriteRoomToggleRequestDto
        example:
          roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
  responses:
    '201':
      description: 'Thành công: Lưu một phòng.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - ROOM_FAVORITED
              data:
                $ref: ../../openapi.yaml#/components/schemas/FavoriteRoomToggleResponseDto
          example:
            statusCode: 201
            code: ROOM_FAVORITED
            data:
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomName: P.201
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/me/favorite-rooms/{roomId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - ALREADY_FAVORITED
                description: |-
                  - ALREADY_FAVORITED: Phòng đã được lưu.
          examples:
            already_favorited:
              summary: ALREADY_FAVORITED — Phòng đã được lưu.
              value:
                statusCode: 409
                code: ALREADY_FAVORITED
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
