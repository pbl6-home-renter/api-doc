  summary: Add favorite room
  description: |-
    tenant. Lưu một phòng. Lỗi nghiệp vụ: 404 NOT FOUND · 409 ALREADY FAVORITED.

    ### Sequence diagram — Add favorite room

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNrFVt1r21YU_1cO3ovDZJxm7UO9reBYaurWsVJJSZcSMNdXN9Ylkq6rD28m9KHsoYwxWNjDGGOQEErZF2m3wZj90AeF_h_6T3aurpzYifu0wvKQRLrnXJ3z-_3Ox2GFCpdVGpWYPUlZSJnOySAiwV4I-EPSRIRp0GeReh6SKOGUD0mYQAtIDC2fM_y_-oj1oQ6bos99tnLddkPaNrfasEES9jkZX7ewpIXNohGnDCw24HESLTGzpVnCQhLScS1W5tetdGm1JeJkEDH7YWfm0HP7yrZVu3NnowFbpu1AnQx5fXSjHrD6PhmJiCesFgkRxJ_0o_qddeGOGyCf267y3VC-G_nkLAQqooj5JOEirHFXgwOeT78MIIkIRJgp-DzgifLrR4wcwM7bV_n0NIEBGv7IwcsnJyGMs19SoPnkZapM1WfwO60G3Fy7DVXHNHubze5uzzIebhu2Y5cQs3AxqB0W8f0x3H_k4HXTFxT6-fQH_DV5HQ7w7QMbKKEemw-oSSmLEVJxwEJIPJ5P3qQaxARjE_nkbypDfJOoQJdEt3oDqtvd5rZzz7Tajw19WWBWAxwEBCP6OQUexglywa6SCB4jfuKVlFs1ldD5t_n0a3T18ulXF66XN9sNaHnpGDHH2GXoQ4ikjONEw1yyvzDrhIfwRXZC8TmfvqbaFcpglB3DZ7VSeDVHwqDut9X9SyH94NbtjyFOx0gyEJqICJJ8-itQn_AARXD55RSza7vgCjwrCgXtXsMgO1n8yINL2dy3zW69j6rTJCIuw6s9hu4ixFO6oKXrppI2mk1g6GUnw_r5EYIXeuBK7gYzPkuOC2-Q3lIfZwn0U0yMXlJslxTcXF2Faru70-y09V7hVIfZYynH3rqp7869vmc0dcPCF-vNC5uV6-K5St0QRXYaotSm33Hw8-n3_IqYZpQQn7uyuvY5812FT4yyDohW0M8j5tbD1PdJ32d1hv2r4EtRhLcf8dIzHIjsmIPumMgZB-K6XMqC-FuRGDJsJyz-dJ_48ULB6Pn0DOs6nz5PZ0yfH2UT_KNimOEcZcf4TqGKzMq6_ykcLMF3bQ2qBW5Np212e3eb7c5FHf1nuHRVQ9_QsocVep_rUrOW1ytanpT4y1LS6g69pjCfz7pM8KBoDE9SjOJC8tlvgSy0yYvxPGQPrp3i_wh8OEix9WFCkcBjmc9JACOOz1ha2A9_Hy6T402oWoZtblsto9c1nd5dc7urv0d5bXnZHzJatENfjIkX8lF1Tr23rwj4b1-lssikXZgdL0u21EQkfHYBmDqh2Z-IGob2TGZe5D8HxrKMP4LqXdNab-u60X0fiZajiM8gPz9CYp-lhS6ey6BUw8AOenIxBtw5AWDU_6gUT-e0tCxynF3NjoXtYBd1vYMjwnk_0r6aAeIpqTqjCKMngxzCCLt1qWd0GwqO3TcmaVHpcwUwl9f_UJvrxka7K-MIY9QX9p6FUwdzE1dLtFoIUSvreUXmiYvEQreZVWNB08KNLXNzs-28u7QLSqW6lUlXYJcVI5wstobeHZkIhPgNXoxBuRj5fp_Qg_kUyhqhIsDdB6phMW1Q9CtaoaxTuIUTpd11DKvb7PRsw9oxrJ5hWaaFNBIYzG-IMyLWcM-wTHPzUkXwIeAMIKr7YwcvtrWOoMVgb7x7q6sfKuCezraI5QTippGksaYGpOyZy4ZxRasELAoId3F_Ptyr4GHA9ioN2Ku4bJ-kfrJXeYpG6VCOq3KxrjSwvTGtEol04FUaxXzRKri2Psa41OHTfwE9yk_d)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: POST /api/v1/me/favorite-rooms<br/>Body: roomId
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc roomId và kiểm tra favorite_rooms của actor
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Phòng tồn tại#59; actor chưa lưu phòng này
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (ALREADY_FAVORITED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Tạo favorite_rooms (actor, roomId) với ràng buộc không trùng
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 201 ROOM_FAVORITED + data theo DTO<br/>Location: /api/v1/me/favorite-rooms/{roomId}
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/FavoriteRoomToggleRequestDto
        example:
          roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
  responses:
    '201':
      description: 'Thành công: Lưu một phòng.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - ROOM_FAVORITED
              data:
                $ref: ../../openapi.yaml#/components/schemas/FavoriteRoomToggleResponseDto
          example:
            statusCode: 201
            code: ROOM_FAVORITED
            data:
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomName: P.201
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/me/favorite-rooms/{roomId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - ALREADY_FAVORITED
                description: |-
                  - ALREADY_FAVORITED: Phòng đã được lưu.
          examples:
            already_favorited:
              summary: ALREADY_FAVORITED — Phòng đã được lưu.
              value:
                statusCode: 409
                code: ALREADY_FAVORITED
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
