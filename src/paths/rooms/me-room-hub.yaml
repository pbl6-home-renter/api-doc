get:
  tags: [Property]
  x-apidog-folder: Room
  x-apidog-status: designing
  operationId: getMeRoomHub
  security: [{ BearerAuth: [] }]
  summary: List the current tenant's rooms
  description: |-
    Returns one entry per active contract for which the caller is the named tenant or a current linked member,
    using the same membership rule as GET /me/contracts. A member whose left date is today or earlier (UTC)
    no longer has member access. Soft-deleted contracts, rooms and buildings are excluded. Results are ordered
    by contract start date descending and contract ID ascending. An empty result returns 200 with an empty array.
    Rent is the contract rent. Only available room, building and contract data is returned.

    ```mermaid
    sequenceDiagram
      actor Tenant
      participant Gateway
      participant Tenancy
      participant DB as Tenancy database
      Tenant->>Gateway: GET /me/room-hub
      Gateway->>Tenancy: Forward authenticated request
      Tenancy->>DB: Query active contracts with tenant access
      DB-->>Tenancy: Authorized rooms and pagination
      Tenancy-->>Tenant: ROOM_HUB_FETCHED
    ```
  parameters:
    - name: pageNo
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    - name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    '200':
      description: Authorized active contracts and rooms, possibly empty.
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, code, data, pagination]
            properties:
              statusCode: { type: integer, enum: [200] }
              code: { type: string, enum: [ROOM_HUB_FETCHED] }
              data:
                type: array
                items: { $ref: '../../openapi.yaml#/components/schemas/MyRoomHubResponseDto' }
              pagination:
                type: object
                required: [type, pageNo, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
                properties:
                  type: { type: string, enum: [offset] }
                  pageNo: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1, maximum: 100 }
                  totalItems: { type: integer, minimum: 0 }
                  totalPages: { type: integer, minimum: 0 }
                  hasNextPage: { type: boolean }
                  hasPreviousPage: { type: boolean }
    '401': { $ref: '../../openapi.yaml#/components/responses/UnauthorizedError' }
    '403': { $ref: '../../openapi.yaml#/components/responses/ForbiddenError' }
    '422': { $ref: '../../openapi.yaml#/components/responses/ValidationError' }
    '503': { $ref: '../../openapi.yaml#/components/responses/AuthUnavailableError' }
    '500': { $ref: '../../openapi.yaml#/components/responses/InternalServerError' }
