post:
  tags:
  - Billing
  x-apidog-folder: Payment
  operationId: postPaymentsCreateIntent
  summary: Tạo ý định thanh toán
  description: 'tenant. Tạo ý định thanh toán. Lỗi nghiệp vụ: 409 IDEMPOTENCY KEY REUSED · 409 INVOICE NOT PAYABLE
    · 403 FORBIDDEN.'
  parameters:
  - name: Idempotency-Key
    in: header
    required: true
    description: UUID chống xử lý trùng, lưu ít nhất 24 giờ.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/PaymentCreateIntentRequestDto
        example:
          invoiceId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          method: vietqr
  responses:
    '201':
      description: 'Thành công: Tạo ý định thanh toán.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - PAYMENT_INTENT_CREATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/PaymentCreateIntentResponseDto
          example:
            statusCode: 201
            code: PAYMENT_INTENT_CREATED
            data:
              paymentId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              invoiceCode: INV-202609-8F2K
              method: vietqr
              amount: 4220000
              qrContent: 000201010212...
              bankCode: Ví dụ
              accountNumber: Ví dụ
              accountHolderName: Ví dụ
              paymentMemo: Ví dụ
              qrCodeUrl: https://example.com/resource
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/payments
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      $ref: ../../openapi.yaml#/components/responses/ConflictError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
