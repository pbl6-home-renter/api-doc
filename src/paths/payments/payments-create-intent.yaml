  summary: Create payment intent
  description: |-
    tenant. Tạo ý định thanh toán. Lỗi nghiệp vụ: 409 IDEMPOTENCY KEY REUSED · 409 INVOICE NOT PAYABLE · 403 FORBIDDEN.

    ### Sequence diagram — Create payment intent

    Luồng theo kiến trúc microservice: payment-service sở hữu nghiệp vụ và payment_db.

