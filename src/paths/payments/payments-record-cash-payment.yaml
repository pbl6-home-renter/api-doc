post:
  tags:
  - Billing
  x-apidog-folder: Payment
  operationId: postPaymentsRecordCashPayment
  security:
    - BearerAuth: []
  summary: Record cash payment
  description: |-
    landlord. Ghi nhận thanh toán tiền mặt. Lỗi nghiệp vụ: 409 IDEMPOTENCY KEY REUSED · 409 INVOICE NOT PAYABLE · 422 AMOUNT INVALID · 403 FORBIDDEN.

    ### Sequence diagram — Record cash payment

    Luồng theo kiến trúc microservice: payment-service sở hữu nghiệp vụ và payment_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as payment-service
        participant D as PostgreSQL payment_db
        participant T as tenancy-service
        participant TD as PostgreSQL tenancy_db
        participant I as identity-service
        participant Q as RabbitMQ
        participant O as Outbox worker (payment)
        C->>G: POST /api/v1/payments/record-cash-payment<br/>Body: invoiceId, amount, paymentDate, payerName, transactionId<br/>receiptMediaId, note<br/>Header: Idempotency-Key
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance payment-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Tra/giữ Idempotency-Key theo actor, endpoint và fingerprint payload
        D-->>S: Trạng thái khóa và kết quả đã lưu
        break Cùng key đã hoàn tất với cùng payload
            S-->>G: Trả nguyên status, code, data và header của kết quả đã lưu
            G-->>C: Kết quả cũ#59; không lặp side effect
        end
        break Key đã dùng với payload khác
            S-->>G: 409 IDEMPOTENCY_KEY_REUSED
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over S,D: Lưu Idempotency-Key ít nhất 24 giờ#59; khóa/unique constraint ngăn side effect trùng<br/>Key đang xử lý: giữ nguyên khóa và trạng thái để retry, không bắt đầu thao tác lần hai
        S->>D: Đọc trạng thái xử lý Idempotency-Key và payment liên quan
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>T: Đọc invoice, quyền actor, số tiền còn lại và trạng thái mới nhất (service token)
        T-->>S: Dữ liệu quyết định từ tenancy-service
        opt Có receiptMediaId
            S->>I: Kiểm tra metadata và quyền bằng chứng thanh toán
            I-->>S: Kết quả kiểm tra receipt
        end
        S->>S: Actor là landlord sở hữu invoice#59; invoice payable#59; amount hợp lệ
        Note over S,D: Không gọi Payment Provider#59; hoạt động khi tenant không đăng nhập<br/>Nếu đồng bộ chưa xong, giữ khóa xử lý để retry đối soát, không ghi payment lần hai
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (INVOICE_NOT_PAYABLE)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (AMOUNT_INVALID / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Ghi payment success tiền mặt và công việc đồng bộ hóa đơn cùng transaction
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        O->>D: Đọc công việc đồng bộ payment đã commit
        D-->>O: Payment event với khóa chống lặp
        O->>Q: Publish kết quả ghi nhận tiền mặt (correlationId)
        Q-->>O: Publisher confirm
        O->>D: Đánh dấu/xóa công việc đã gửi
        Q-->>T: Deliver payment result (at-least-once)
        T->>TD: Áp dụng payment đúng một lần vào billing read model và tổng thu trong transaction
        TD-->>T: Dữ liệu đã commit
        T-->>Q: ACK
        S->>T: Đọc tổng hóa đơn đã đối soát cho response (service token)
        T-->>S: invoiceStatus, paidAmount, remainingAmount, paymentState
        S->>D: Lưu kết quả response cuối cùng theo Idempotency-Key
        D-->>S: Kết quả retry đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 201 PAYMENT_CASH_RECORDED + data theo DTO<br/>Location: /api/v1/payments
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: Idempotency-Key
    in: header
    required: true
    description: UUID chống xử lý trùng, lưu ít nhất 24 giờ.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/PaymentRecordCashRequestDto
        example:
          invoiceId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          amount: 4220000
          transactionId: CASH-20260923
          receiptMediaId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          paymentDate: '2026-09-29T08:30:00Z'
          payerName: Lê Văn C
  responses:
    '201':
      description: 'Thành công: Ghi nhận thanh toán tiền mặt.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - PAYMENT_CASH_RECORDED
              data:
                $ref: ../../openapi.yaml#/components/schemas/PaymentRecordCashResponseDto
          example:
            statusCode: 201
            code: PAYMENT_CASH_RECORDED
            data:
              paymentId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              invoiceId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              paymentStatus: success
              amount: 4220000
              invoiceStatus: issued
              paidAmount: 4220000
              remainingAmount: 0
              paymentState: paid
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/payments
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - IDEMPOTENCY_KEY_REUSED
                  - INVOICE_NOT_PAYABLE
                description: |-
                  - IDEMPOTENCY_KEY_REUSED: Idempotency-Key đã dùng cho yêu cầu khác.
                  - INVOICE_NOT_PAYABLE: Hóa đơn không ở trạng thái có thể thanh toán.
          examples:
            idempotency_key_reused:
              summary: IDEMPOTENCY_KEY_REUSED — Idempotency-Key đã dùng cho yêu cầu khác.
              value:
                statusCode: 409
                code: IDEMPOTENCY_KEY_REUSED
            invoice_not_payable:
              summary: INVOICE_NOT_PAYABLE — Hóa đơn không ở trạng thái có thể thanh toán.
              value:
                statusCode: 409
                code: INVOICE_NOT_PAYABLE
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - AMOUNT_INVALID
                  - VALIDATION_FAILED
                description: |-
                  - AMOUNT_INVALID: Số tiền không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            amount_invalid:
              summary: AMOUNT_INVALID — Số tiền không hợp lệ.
              value:
                statusCode: 422
                code: AMOUNT_INVALID
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
