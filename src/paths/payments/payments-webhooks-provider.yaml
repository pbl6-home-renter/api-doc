  x-apidog-folder: Payment
  operationId: postPaymentsWebhooksProvider
  summary: Handle payment provider webhook
  security: []
  description: |-
    system. Nhận callback đã ký từ provider. Lỗi nghiệp vụ: 401 INVALID SIGNATURE · 409 DUPLICATE WEBHOOK · 422 WEBHOOK INVALID.

    ### Sequence diagram — Handle payment provider webhook

    Luồng theo kiến trúc microservice: payment-service sở hữu nghiệp vụ và payment_db.

