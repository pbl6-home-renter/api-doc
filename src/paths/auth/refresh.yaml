post:
  tags: [Auth]
  x-apidog-folder: Auth
  operationId: refreshSession
  summary: Refresh token
  description: |-
    Dành cho tenant, landlord và admin. Không nhận request body hoặc bearer token; chỉ đọc cookie refreshToken. Token cũ bị vô hiệu ngay khi dùng; token mới được trả trong data của response và đặt lại trong cookie, đồng thời giữ nguyên mốc hết hạn 30 ngày tính từ lần đăng nhập. Nếu token đã bị xoay, hết hạn hoặc session đã bị thu hồi, client xóa phiên cục bộ và đăng nhập lại.

    ### Sequence diagram — Refresh token

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        C->>G: POST /api/v1/auth/refresh<br/>Cookie: refreshToken#59; không body, không Bearer
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        Note over C,S: Phiên xác định bằng cookie refreshToken, không xác thực bằng access token
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Kiểm tra header theo contract
        break header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Tra hash cookie refreshToken và phiên liên quan
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Kiểm tra token tồn tại, chưa hết hạn, chưa xoay và session chưa bị thu hồi
        Note over S,D: Token đã xoay không được dùng lại#59; phát hiện tái sử dụng thì thu hồi nhóm phiên<br/>401: client xóa phiên cục bộ và đăng nhập lại
        break Thông tin đăng nhập/cookie/currentPassword không xác thực được hoặc phiên đã thu hồi
            S-->>G: 401 (INVALID_REFRESH_TOKEN / SESSION_REVOKED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Vô hiệu token cũ và lưu hash token mới nguyên tử, giữ mốc hết hạn 30 ngày từ lần đăng nhập
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        S->>S: Ký access token mới
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 SESSION_REFRESHED + data theo DTO<br/>Set-Cookie refreshToken mới cùng thuộc tính bảo mật<br/>data có accessToken và refreshToken theo contract
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  security:
    - RefreshCookie: []
  responses:
    '200':
      description: Phiên làm việc được làm mới thành công
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode:
                type: integer
                enum: [200]
              code:
                type: string
                enum: [SESSION_REFRESHED]
              data:
                $ref: '../../openapi.yaml#/components/schemas/AuthRefreshResponseDto'
          example:
            statusCode: 200
            code: SESSION_REFRESHED
            data:
              accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              refreshToken: rt_opaque_token_example
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      x-apidog-name: Unauthorized
      description: Cookie refreshToken không hợp lệ hoặc phiên đã bị thu hồi.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [401]
              code:
                type: string
                enum:
                  - INVALID_REFRESH_TOKEN
                  - SESSION_REVOKED
                description: |-
                  - INVALID_REFRESH_TOKEN: Thiếu cookie, token sai hoặc đã hết hạn.
                  - SESSION_REVOKED: Phiên hoặc cả nhóm refresh token đã bị thu hồi.
          examples:
            invalid_refresh_token:
              summary: INVALID_REFRESH_TOKEN — Thiếu cookie, token sai hoặc đã hết hạn.
              value:
                statusCode: 401
                code: INVALID_REFRESH_TOKEN
            session_revoked:
              summary: SESSION_REVOKED — Phiên hoặc cả nhóm refresh token đã bị thu hồi.
              value:
                statusCode: 401
                code: SESSION_REVOKED
    '429':
      $ref: '../../openapi.yaml#/components/responses/TooManyRequestsError'
    '500':
      $ref: '../../openapi.yaml#/components/responses/InternalServerError'
