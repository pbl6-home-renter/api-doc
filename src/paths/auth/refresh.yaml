post:
  tags:
  - Auth
  x-apidog-folder: Auth
  x-apidog-status: designing
  operationId: refreshSession
  security: []
  summary: Refresh token
  description: |-
    Public, xác thực bằng refresh token trong body. Xoay vòng refresh token và cấp access token mới; token cũ bị vô hiệu ngay khi dùng.

    **Lưu ý**

    - Chưa triển khai (P4-04).
    - Refresh token rotation: dùng lại token đã revoke thì revoke cả family (`401 TOKEN_REUSED`).
    - `status` đọc lại từ DB khi ký token mới, nên trạng thái khóa/mở khóa được cập nhật sau lần refresh.
    - Đang cân nhắc: refresh token gửi trong body JSON (khớp login/register hiện tại) hay HttpOnly cookie như `api-conventions.md` §4 và P4-04.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant ID as Identity
        participant DB as Identity DB

        GW->>ID: POST /auth/refresh {refreshToken}
        ID->>DB: Tìm refresh_tokens theo tokenHash
        alt Không tồn tại / hết hạn
            ID-->>GW: 401 INVALID_REFRESH_TOKEN
        else Token đã bị revoke (dùng lại token cũ)
            ID->>DB: Revoke toàn bộ token cùng family
            ID-->>GW: 401 TOKEN_REUSED
        end
        ID->>DB: Tìm user chưa bị xóa của token
        alt User đã bị xóa
            ID-->>GW: 401 INVALID_REFRESH_TOKEN
        end
        ID->>DB: [Transaction] Revoke token cũ + insert token mới (cùng family)
        ID->>ID: Ký access token RS256 mới {sub, role, status} (status đọc lại từ DB)
        ID-->>GW: 200 {accessToken, refreshToken}
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/AuthRefreshRequestDto
        example:
          refreshToken: m7Qp2vN8rT4xK9sL3wY6cB1hF5jD0uE_gAqZkRoUiVs
  responses:
    '200':
      description: Làm mới phiên thành công
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - SESSION_REFRESHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/AuthRefreshResponseDto
          example:
            statusCode: 200
            code: SESSION_REFRESHED
            data:
              accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
              refreshToken: Xk3Lp9Qw2Er7Ty5Ui1Op8As4Df6Gh0Jk_zXcVbNmQwE
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - INVALID_JSON
                - INVALID_REQUEST_BODY
                - BAD_REQUEST
          examples:
            error_1:
              summary: INVALID_JSON
              value:
                statusCode: 400
                code: INVALID_JSON
            error_2:
              summary: INVALID_REQUEST_BODY
              value:
                statusCode: 400
                code: INVALID_REQUEST_BODY
            error_3:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
    '401':
      description: Refresh token không hợp lệ hoặc đã bị dùng lại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 401
              code:
                type: string
                enum:
                - INVALID_REFRESH_TOKEN
                - TOKEN_REUSED
          examples:
            error_1:
              summary: INVALID_REFRESH_TOKEN
              value:
                statusCode: 401
                code: INVALID_REFRESH_TOKEN
            error_2:
              summary: TOKEN_REUSED
              value:
                statusCode: 401
                code: TOKEN_REUSED
    '422':
      description: Vi phạm ràng buộc dữ liệu; trả mã của lỗi đầu tiên.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - REFRESH_TOKEN_REQUIRED
                - REFRESH_TOKEN_MUST_BE_STRING
                - REFRESH_TOKEN_NOT_EMPTY
                - UNEXPECTED_FIELD
                - VALIDATION_FAILED
          examples:
            error_1:
              summary: REFRESH_TOKEN_REQUIRED
              value:
                statusCode: 422
                code: REFRESH_TOKEN_REQUIRED
            error_2:
              summary: REFRESH_TOKEN_MUST_BE_STRING
              value:
                statusCode: 422
                code: REFRESH_TOKEN_MUST_BE_STRING
            error_3:
              summary: REFRESH_TOKEN_NOT_EMPTY
              value:
                statusCode: 422
                code: REFRESH_TOKEN_NOT_EMPTY
            error_4:
              summary: UNEXPECTED_FIELD
              value:
                statusCode: 422
                code: UNEXPECTED_FIELD
            error_5:
              summary: VALIDATION_FAILED
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
