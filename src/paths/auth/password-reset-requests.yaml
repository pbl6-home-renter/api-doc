post:
  tags: [Auth]
  x-apidog-folder: Auth
  operationId: requestPasswordReset
  summary: Password reset request
  description: >-
    Public. Tiếp nhận yêu cầu gửi email bất đồng bộ. Cùng một response trung tính
    được trả dù email có tài khoản hay không, để không lộ sự tồn tại của tài khoản.
    Client không cần polling; người dùng kiểm tra hộp thư để tiếp tục đặt lại mật khẩu.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/AuthRequestPasswordResetRequestDto'
        example:
          email: lan@example.com
  responses:
    '202':
      description: Đã tiếp nhận yêu cầu đặt lại mật khẩu
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode:
                type: integer
                enum: [202]
              code:
                type: string
                enum: [PASSWORD_RESET_REQUESTED]
              data:
                $ref: '../../openapi.yaml#/components/schemas/AuthRequestPasswordResetResponseDto'
          example:
            statusCode: 202
            code: PASSWORD_RESET_REQUESTED
            data:
              accepted: true
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Email yêu cầu đặt lại mật khẩu không hợp lệ; không tiết lộ email có tài khoản hay không.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - EMAIL_REQUIRED
                  - INVALID_EMAIL
                  - UNEXPECTED_FIELD
                  - VALIDATION_FAILED
                description: |-
                  - EMAIL_REQUIRED: Thiếu email hoặc email là null.
                  - INVALID_EMAIL: Email sai kiểu, định dạng hoặc độ dài.
                  - UNEXPECTED_FIELD: Body chứa trường không được khai báo.
                  - VALIDATION_FAILED: Lỗi validation khác chưa có mã cụ thể ở trên.
          examples:
            email_required:
              summary: EMAIL_REQUIRED — Thiếu email hoặc email là null.
              value:
                statusCode: 422
                code: EMAIL_REQUIRED
            invalid_email:
              summary: INVALID_EMAIL — Email sai kiểu, định dạng hoặc độ dài.
              value:
                statusCode: 422
                code: INVALID_EMAIL
            unexpected_field:
              summary: UNEXPECTED_FIELD — Body chứa trường không được khai báo.
              value:
                statusCode: 422
                code: UNEXPECTED_FIELD
            validation_failed:
              summary: VALIDATION_FAILED — Lỗi validation khác chưa có mã cụ thể ở trên.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: '../../openapi.yaml#/components/responses/TooManyRequestsError'
    '500':
      $ref: '../../openapi.yaml#/components/responses/InternalServerError'
