post:
  tags:
  - Auth
  x-apidog-folder: Auth
  operationId: requestPasswordReset
  summary: Password reset request
  description: Public. Tiếp nhận yêu cầu đặt lại mật khẩu; luôn trả accepted=true kể cả email không tồn tại hoặc
    tài khoản bị khóa.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/AuthRequestPasswordResetRequestDto
        example:
          email: lan@example.com
  responses:
    '202':
      description: Đã tiếp nhận yêu cầu đặt lại mật khẩu
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 202
              code:
                type: string
                enum:
                - PASSWORD_RESET_REQUESTED
              data:
                $ref: ../../openapi.yaml#/components/schemas/AuthRequestPasswordResetResponseDto
          example:
            statusCode: 202
            code: PASSWORD_RESET_REQUESTED
            data:
              accepted: true
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - INVALID_JSON
                - INVALID_REQUEST_BODY
                - BAD_REQUEST
          examples:
            error_1:
              summary: INVALID_JSON
              value:
                statusCode: 400
                code: INVALID_JSON
            error_2:
              summary: INVALID_REQUEST_BODY
              value:
                statusCode: 400
                code: INVALID_REQUEST_BODY
            error_3:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
    '422':
      description: Vi phạm ràng buộc dữ liệu; trả mã của lỗi đầu tiên.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - EMAIL_REQUIRED
                - INVALID_EMAIL
                - UNEXPECTED_FIELD
                - VALIDATION_FAILED
          examples:
            error_1:
              summary: EMAIL_REQUIRED
              value:
                statusCode: 422
                code: EMAIL_REQUIRED
            error_2:
              summary: INVALID_EMAIL
              value:
                statusCode: 422
                code: INVALID_EMAIL
            error_3:
              summary: UNEXPECTED_FIELD
              value:
                statusCode: 422
                code: UNEXPECTED_FIELD
            error_4:
              summary: VALIDATION_FAILED
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
