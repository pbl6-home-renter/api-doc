post:
  tags: [Auth]
  x-apidog-folder: Auth
  operationId: requestPasswordReset
  summary: Password reset request
  description: |-
    Public. Tiếp nhận yêu cầu gửi email bất đồng bộ. Cùng một response trung tính được trả dù email có tài khoản hay không, để không lộ sự tồn tại của tài khoản. Client không cần polling; người dùng kiểm tra hộp thư để tiếp tục đặt lại mật khẩu.

    ### Sequence diagram — Password reset request

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        participant W as Worker gửi email
        participant E as Email delivery
        C->>G: POST /api/v1/auth/password-reset-requests<br/>Body: email
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        Note over C,S: Endpoint public, không yêu cầu Bearer token
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (EMAIL_REQUIRED / INVALID_EMAIL / UNEXPECTED_FIELD / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Tra người dùng theo email đã chuẩn hóa
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Không tiết lộ email có tài khoản hay không
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (EMAIL_REQUIRED / INVALID_EMAIL / UNEXPECTED_FIELD / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        alt Email có tài khoản
            S->>S: Sinh reset token một lần, có hạn sử dụng
            S->>D: Lưu hash token và công việc gửi email bền vững
            D-->>S: Đã tiếp nhận công việc
        else Email không có tài khoản
            S->>S: Giữ cùng phản hồi trung tính
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 202 PASSWORD_RESET_REQUESTED + data theo DTO<br/>data.accepted = true trong cả hai trường hợp
        G-->>C: Chuyển tiếp status, body và header theo contract
        opt Có công việc gửi email
            Note over W,E: Xử lý bất đồng bộ sau khi tiếp nhận#59; client không cần polling
            W->>D: Lấy công việc gửi email
            D-->>W: Reset link chứa token một lần
            W->>E: Gửi email đặt lại mật khẩu
        end
    ```
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/AuthRequestPasswordResetRequestDto'
        example:
          email: lan@example.com
  responses:
    '202':
      description: Đã tiếp nhận yêu cầu đặt lại mật khẩu
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode:
                type: integer
                enum: [202]
              code:
                type: string
                enum: [PASSWORD_RESET_REQUESTED]
              data:
                $ref: '../../openapi.yaml#/components/schemas/AuthRequestPasswordResetResponseDto'
          example:
            statusCode: 202
            code: PASSWORD_RESET_REQUESTED
            data:
              accepted: true
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Email yêu cầu đặt lại mật khẩu không hợp lệ; không tiết lộ email có tài khoản hay không.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - EMAIL_REQUIRED
                  - INVALID_EMAIL
                  - UNEXPECTED_FIELD
                  - VALIDATION_FAILED
                description: |-
                  - EMAIL_REQUIRED: Thiếu email hoặc email là null.
                  - INVALID_EMAIL: Email sai kiểu, định dạng hoặc độ dài.
                  - UNEXPECTED_FIELD: Body chứa trường không được khai báo.
                  - VALIDATION_FAILED: Lỗi validation khác chưa có mã cụ thể ở trên.
          examples:
            email_required:
              summary: EMAIL_REQUIRED — Thiếu email hoặc email là null.
              value:
                statusCode: 422
                code: EMAIL_REQUIRED
            invalid_email:
              summary: INVALID_EMAIL — Email sai kiểu, định dạng hoặc độ dài.
              value:
                statusCode: 422
                code: INVALID_EMAIL
            unexpected_field:
              summary: UNEXPECTED_FIELD — Body chứa trường không được khai báo.
              value:
                statusCode: 422
                code: UNEXPECTED_FIELD
            validation_failed:
              summary: VALIDATION_FAILED — Lỗi validation khác chưa có mã cụ thể ở trên.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: '../../openapi.yaml#/components/responses/TooManyRequestsError'
    '500':
      $ref: '../../openapi.yaml#/components/responses/InternalServerError'
