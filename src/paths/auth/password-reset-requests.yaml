post:
  tags: [Auth]
  x-apidog-folder: Auth
  operationId: requestPasswordReset
  summary: Password reset request
  description: >-
    Public. Tiếp nhận yêu cầu gửi email bất đồng bộ. Cùng một response trung tính
    được trả dù email có tài khoản hay không, để không lộ sự tồn tại của tài khoản.
    Client không cần polling; người dùng kiểm tra hộp thư để tiếp tục đặt lại mật khẩu.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/AuthRequestPasswordResetRequestDto'
        example:
          email: lan@example.com
  responses:
    '202':
      description: Đã tiếp nhận yêu cầu đặt lại mật khẩu
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode:
                type: integer
                enum: [202]
              code:
                type: string
                enum: [PASSWORD_RESET_REQUESTED]
              data:
                $ref: '../../openapi.yaml#/components/schemas/AuthRequestPasswordResetResponseDto'
          example:
            statusCode: 202
            code: PASSWORD_RESET_REQUESTED
            data:
              accepted: true
    '400':
      $ref: '../../openapi.yaml#/components/responses/BadRequestError'
    '422':
      $ref: '../../openapi.yaml#/components/responses/ValidationError'
    '429':
      $ref: '../../openapi.yaml#/components/responses/TooManyRequestsError'
    '500':
      $ref: '../../openapi.yaml#/components/responses/InternalServerError'
