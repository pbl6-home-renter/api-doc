post:
  tags:
  - Auth
  x-apidog-folder: Auth
  operationId: resetPassword
  summary: Reset password
  description: Public. Dùng token đặt lại mật khẩu một lần, còn thời hạn. Token đã dùng hoặc hết hạn trả
    409.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/AuthResetPasswordRequestDto
        example:
          token: sR7pQx9Nm2Vk4...
          newPassword: NewP@ssw0rd123
  responses:
    '204':
      $ref: ../../openapi.yaml#/components/responses/NoContentResponse
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '409':
      $ref: ../../openapi.yaml#/components/responses/ConflictError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
