    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        C->>G: POST /api/v1/auth/password-resets<br/>Body: token, newPassword
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        Note over C,S: Endpoint public, không yêu cầu Bearer token
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (TOKEN_REQUIRED / INVALID_TOKEN / NEW_PASSWORD_REQUIRED / INVALID_NEW_PASSWORD / UNEXPECTED_FIELD / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Tra hash reset token và tài khoản liên quan
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Kiểm tra token chưa dùng và chưa hết hạn
        Note over S,D: Khóa hoặc cập nhật có điều kiện để hai request đồng thời không dùng được cùng token
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (TOKEN_USED / TOKEN_EXPIRED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (TOKEN_REQUIRED / INVALID_TOKEN / NEW_PASSWORD_REQUIRED / INVALID_NEW_PASSWORD / UNEXPECTED_FIELD / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Hash newPassword#59; không lưu mật khẩu thô
        S->>D: BEGIN transaction
        S->>D: Cập nhật password hash và đánh dấu reset token đã dùng trong cùng transaction
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 204 No Content#59; không JSON body
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/AuthResetPasswordRequestDto
        example:
          token: sR7pQx9Nm2Vk4...
          newPassword: NewP@ssw0rd123
  responses:
    '204':
      $ref: ../../openapi.yaml#/components/responses/NoContentResponse
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '409':
      x-apidog-name: Conflict
      description: Token đặt lại mật khẩu đã được dùng hoặc hết hạn.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - TOKEN_USED
                  - TOKEN_EXPIRED
                description: |-
                  - TOKEN_USED: Token đặt lại mật khẩu đã được sử dụng.
                  - TOKEN_EXPIRED: Token đặt lại mật khẩu đã hết hạn.
          examples:
            token_used:
              summary: TOKEN_USED — Token đặt lại mật khẩu đã được sử dụng.
              value:
                statusCode: 409
                code: TOKEN_USED
            token_expired:
              summary: TOKEN_EXPIRED — Token đặt lại mật khẩu đã hết hạn.
              value:
                statusCode: 409
                code: TOKEN_EXPIRED
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu đặt lại mật khẩu vi phạm ràng buộc trường.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - TOKEN_REQUIRED
                  - INVALID_TOKEN
                  - NEW_PASSWORD_REQUIRED
                  - INVALID_NEW_PASSWORD
                  - UNEXPECTED_FIELD
                  - VALIDATION_FAILED
                description: |-
                  - TOKEN_REQUIRED: Thiếu token hoặc token là null.
                  - INVALID_TOKEN: Token không phải chuỗi hoặc rỗng.
                  - NEW_PASSWORD_REQUIRED: Thiếu newPassword hoặc newPassword là null.
                  - INVALID_NEW_PASSWORD: NewPassword không phải chuỗi hoặc rỗng.
                  - UNEXPECTED_FIELD: Body chứa trường không được khai báo.
                  - VALIDATION_FAILED: Lỗi validation khác chưa có mã cụ thể ở trên.
          examples:
            token_required:
              summary: TOKEN_REQUIRED — Thiếu token hoặc token là null.
              value:
                statusCode: 422
                code: TOKEN_REQUIRED
            invalid_token:
              summary: INVALID_TOKEN — Token không phải chuỗi hoặc rỗng.
              value:
                statusCode: 422
                code: INVALID_TOKEN
            new_password_required:
              summary: NEW_PASSWORD_REQUIRED — Thiếu newPassword hoặc newPassword là null.
              value:
                statusCode: 422
                code: NEW_PASSWORD_REQUIRED
            invalid_new_password:
              summary: INVALID_NEW_PASSWORD — NewPassword không phải chuỗi hoặc rỗng.
              value:
                statusCode: 422
                code: INVALID_NEW_PASSWORD
            unexpected_field:
              summary: UNEXPECTED_FIELD — Body chứa trường không được khai báo.
              value:
                statusCode: 422
                code: UNEXPECTED_FIELD
            validation_failed:
              summary: VALIDATION_FAILED — Lỗi validation khác chưa có mã cụ thể ở trên.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
