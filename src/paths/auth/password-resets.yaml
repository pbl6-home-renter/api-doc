  operationId: resetPassword
  summary: Reset password
  description: |-
    Public. Dùng token đặt lại mật khẩu một lần, còn thời hạn. Token đã dùng hoặc hết hạn trả 409.

    ### Sequence diagram — Reset password

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

