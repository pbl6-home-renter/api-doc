post:
  tags:
  - Auth
  x-apidog-folder: Auth
  x-apidog-status: released
  operationId: resetPassword
  summary: Reset password
  description: |-
    Public. Đặt lại mật khẩu bằng token một lần. Token không tồn tại trả 422 INVALID_TOKEN; đã dùng trả 409 TOKEN_USED; hết hạn trả 409 TOKEN_EXPIRED.

    **Lưu ý**

    - Token sống 15 phút, chỉ dùng 1 lần.
    - Reset thành công thì revoke toàn bộ refresh token; access token đang có vẫn dùng được tới khi hết hạn (tối đa 15 phút).

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant ID as Identity
        participant DB as Identity DB

        GW->>ID: POST /auth/password-resets {token, newPassword}
        ID->>ID: Hash token (SHA-256)
        ID->>DB: Tìm password_reset_tokens theo tokenHash
        alt Token không tồn tại
            ID-->>GW: 422 INVALID_TOKEN
        else Token đã dùng / hết hạn
            ID-->>GW: 409 TOKEN_USED / TOKEN_EXPIRED
        end
        ID->>DB: [Transaction] Update users.password (bcrypt)<br/>+ đánh dấu token đã dùng<br/>+ revoke toàn bộ refresh_tokens của user
        ID-->>GW: 204
    ```
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/AuthResetPasswordRequestDto
        example:
          token: sR7pQx9Nm2Vk4...
          newPassword: NewP@ssw0rd123
  responses:
    '204':
      $ref: ../../openapi.yaml#/components/responses/NoContentResponse
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - INVALID_JSON
                - INVALID_REQUEST_BODY
                - BAD_REQUEST
          examples:
            error_1:
              summary: INVALID_JSON
              value:
                statusCode: 400
                code: INVALID_JSON
            error_2:
              summary: INVALID_REQUEST_BODY
              value:
                statusCode: 400
                code: INVALID_REQUEST_BODY
            error_3:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
    '409':
      description: Xung đột dữ liệu hoặc trạng thái.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 409
              code:
                type: string
                enum:
                - TOKEN_USED
                - TOKEN_EXPIRED
          examples:
            error_1:
              summary: TOKEN_USED
              value:
                statusCode: 409
                code: TOKEN_USED
            error_2:
              summary: TOKEN_EXPIRED
              value:
                statusCode: 409
                code: TOKEN_EXPIRED
    '422':
      description: Vi phạm ràng buộc dữ liệu; trả mã của lỗi đầu tiên.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - TOKEN_REQUIRED
                - INVALID_TOKEN
                - NEW_PASSWORD_REQUIRED
                - INVALID_NEW_PASSWORD
                - UNEXPECTED_FIELD
                - VALIDATION_FAILED
          examples:
            error_1:
              summary: TOKEN_REQUIRED
              value:
                statusCode: 422
                code: TOKEN_REQUIRED
            error_2:
              summary: INVALID_TOKEN
              value:
                statusCode: 422
                code: INVALID_TOKEN
            error_3:
              summary: NEW_PASSWORD_REQUIRED
              value:
                statusCode: 422
                code: NEW_PASSWORD_REQUIRED
            error_4:
              summary: INVALID_NEW_PASSWORD
              value:
                statusCode: 422
                code: INVALID_NEW_PASSWORD
            error_5:
              summary: UNEXPECTED_FIELD
              value:
                statusCode: 422
                code: UNEXPECTED_FIELD
            error_6:
              summary: VALIDATION_FAILED
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
