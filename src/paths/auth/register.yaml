post:
  tags: [Auth]
  x-apidog-folder: Auth
  operationId: registerAccount
  summary: Register
  description: |-
    Public. Tạo tài khoản tenant hoặc landlord; admin không được tự đăng ký. Thành công tạo phiên refresh và đặt cookie HttpOnly, Secure, SameSite=Lax, Path=/api/v1/auth. Cookie chứa token opaque, không trả trong JSON.

    ### Sequence diagram — Đăng ký tài khoản

    Luồng theo kiến trúc microservice (§5.7–5.8): identity-service xử lý đăng ký trong identity_db;
    sự kiện user.registered được ghi cùng transaction qua outbox và đồng bộ bất đồng bộ sang tenancy-service.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant I as identity-service
        participant D as PostgreSQL identity_db
        participant O as Outbox worker (identity)
        participant Q as RabbitMQ
        participant T as tenancy-service
        participant TD as PostgreSQL tenancy_db

        C->>G: POST /api/v1/auth/register (email, phone, password, name, role)
        G->>G: Gắn correlation-id, kiểm tra rate limit theo IP
        break Vượt giới hạn yêu cầu
            G-->>C: 429 Too Many Requests
        end
        Note over C,I: Endpoint public, không yêu cầu Bearer token
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>I: Chuyển tiếp request + correlation-id + X-Service-Token
        I->>I: Kiểm tra JSON, body và header
        break JSON, body hoặc header không hợp lệ
            I-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        I->>I: Validate trường, chỉ cho role tenant hoặc landlord<br/>Trim email, phone, name#59; chuyển email về chữ thường#59; không trim password
        break Thiếu trường, sai kiểu hoặc giá trị, role admin, trường ngoài DTO
            I-->>G: 422 (code validation tương ứng)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        I->>D: Kiểm tra email và phone, gồm tài khoản khóa hoặc xóa mềm
        D-->>I: Kết quả kiểm tra định danh
        break Email hoặc phone đã tồn tại
            I-->>G: 409 (DUPLICATE_EMAIL / DUPLICATE_PHONE)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over I: Nếu cả hai định danh trùng, ưu tiên DUPLICATE_EMAIL
        I->>I: Hash password#59; sinh refresh token opaque và hash token
        I->>D: BEGIN transaction
        I->>D: INSERT users (role đã validate, status active, password hash)
        Note over I,D: Unique constraint bảo vệ đăng ký đồng thời:<br/>nếu trùng định danh, ROLLBACK và trả 409
        I->>D: INSERT refresh_tokens (chỉ lưu hash)
        I->>D: INSERT outbox (user.registered)
        Note over I,D: Event gồm eventId, userId, displayName = name,<br/>occurredAt, schemaVersion, correlationId
        I->>D: COMMIT
        D-->>I: Tài khoản, phiên refresh và outbox đã được lưu
        I-->>G: 201 USER_REGISTERED + data tài khoản<br/>Location: /api/v1/me#59; Set-Cookie: refresh token opaque<br/>HttpOnly#59; Secure#59; SameSite=Lax#59; Path=/api/v1/auth
        G-->>C: Chuyển tiếp JSON, Location và Set-Cookie<br/>Không có refresh token trong JSON

        Note over O,TD: Đồng bộ bất đồng bộ#59; phản hồi 201 không chờ RabbitMQ hoặc tenancy-service
        O->>D: Đọc event chưa gửi trong outbox
        D-->>O: user.registered
        O->>Q: Publish user.registered (kèm correlationId)
        Q-->>O: Xác nhận publish thành công
        O->>D: Xóa bản ghi outbox đã gửi
        Q-->>T: Deliver user.registered (at-least-once)
        T->>TD: UPSERT dữ liệu hiển thị (userId, displayName) theo userId
        TD-->>T: Đã đồng bộ#59; xử lý được event trùng
        T-->>Q: ACK
        Note over O,Q: Broker lỗi: giữ event trong outbox để gửi lại<br/>Consumer lỗi: retry 1s / 4s / 16s, sau đó đưa vào DLQ
    ```
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/AuthRegisterRequestDto'
        example:
          email: lan@example.com
          phone: '0901234567'
          password: P@ssw0rd123
          name: Lê Văn An
          role: tenant
  responses:
    '201':
      description: Đăng ký tài khoản thành công
      headers:
        Location:
          description: Đường dẫn đến hồ sơ của tài khoản vừa tạo
          schema:
            type: string
            example: /api/v1/me
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode:
                type: integer
                enum: [201]
              code:
                type: string
                enum: [USER_REGISTERED]
              data:
                $ref: '../../openapi.yaml#/components/schemas/AuthRegisterResponseDto'
          example:
            statusCode: 201
            code: USER_REGISTERED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              email: lan@example.com
              phone: '0901234567'
              name: Lê Văn An
              role: tenant
              status: active
    '400':
      x-apidog-name: Bad Request
      description: >-
        Yêu cầu đăng ký không thể xử lý do JSON sai cú pháp, thiếu body,
        body không phải JSON object hoặc header đầu vào sai định dạng.
        Khi body là JSON object, lỗi thiếu trường, sai kiểu/giá trị từng trường,
        trường không được khai báo hoặc role không được phép trả HTTP 422.
        Email hoặc số điện thoại đã được sử dụng trả HTTP 409.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [400]
              code:
                type: string
                enum:
                  - INVALID_JSON
                  - INVALID_REQUEST_BODY
                  - INVALID_HEADER
                  - BAD_REQUEST
                description: |-
                  Mỗi response trả một code tương ứng với lỗi được phát hiện.
                  - INVALID_JSON: body có nội dung nhưng JSON sai cú pháp, ví dụ thiếu dấu đóng ngoặc hoặc có dấu phẩy thừa.
                  - INVALID_REQUEST_BODY: không gửi body, body rỗng hoặc JSON cấp gốc là null, array, string, number hay boolean thay vì object. Object rỗng ({}) trả HTTP 422 với mã thiếu trường tương ứng.
                  - INVALID_HEADER: header đầu vào sai định dạng; endpoint public, không yêu cầu Authorization.
                  - BAD_REQUEST: yêu cầu không hợp lệ khác chưa có code cụ thể ở trên; không dùng thay các lỗi HTTP 409 hoặc 422.
                example: INVALID_JSON
          examples:
            invalidJson:
              summary: INVALID_JSON — JSON sai cú pháp
              value:
                statusCode: 400
                code: INVALID_JSON
            invalidRequestBody:
              summary: INVALID_REQUEST_BODY — Thiếu body hoặc body không phải object
              value:
                statusCode: 400
                code: INVALID_REQUEST_BODY
            invalidHeader:
              summary: INVALID_HEADER — Header đầu vào sai định dạng
              value:
                statusCode: 400
                code: INVALID_HEADER
            badRequest:
              summary: BAD_REQUEST — Yêu cầu không hợp lệ khác
              value:
                statusCode: 400
                code: BAD_REQUEST
    '409':
      description: >-
        Email hoặc số điện thoại đã được sử dụng, kể cả bởi tài khoản bị khóa
        hoặc đã xóa mềm nhưng vẫn giữ định danh trong database.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum: [DUPLICATE_EMAIL, DUPLICATE_PHONE]
                description: >-
                  DUPLICATE_EMAIL khi email đã tồn tại (email được trim và chuyển về chữ thường).
                  DUPLICATE_PHONE khi số điện thoại đã tồn tại sau khi trim.
                  Nếu cả hai cùng trùng, trả DUPLICATE_EMAIL.
          examples:
            duplicateEmail:
              summary: DUPLICATE_EMAIL — Email đã được sử dụng
              value:
                statusCode: 409
                code: DUPLICATE_EMAIL
            duplicatePhone:
              summary: DUPLICATE_PHONE — Số điện thoại đã được sử dụng
              value:
                statusCode: 409
                code: DUPLICATE_PHONE
    '422':
      description: Dữ liệu đăng ký không hợp lệ hoặc role không được phép tự đăng ký
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - EMAIL_REQUIRED
                  - PHONE_REQUIRED
                  - PASSWORD_REQUIRED
                  - NAME_REQUIRED
                  - ROLE_REQUIRED
                  - INVALID_EMAIL
                  - INVALID_PHONE
                  - INVALID_PASSWORD
                  - INVALID_NAME
                  - INVALID_ROLE
                  - ROLE_NOT_ALLOWED
                  - UNEXPECTED_FIELD
                  - VALIDATION_FAILED
                description: |-
                  Mỗi response trả một code tương ứng với lỗi được phát hiện.
                  - EMAIL_REQUIRED, PHONE_REQUIRED, PASSWORD_REQUIRED, NAME_REQUIRED, ROLE_REQUIRED: trường tương ứng bị thiếu hoặc có giá trị null.
                  - INVALID_EMAIL: email không phải chuỗi, sai định dạng hoặc không dài từ 5 đến 254 ký tự sau khi trim.
                  - INVALID_PHONE: phone không phải chuỗi hoặc không khớp 0 + 9 chữ số hay +84 + 9 chữ số sau khi trim.
                  - INVALID_PASSWORD: password không phải chuỗi hoặc là chuỗi rỗng; không trim mật khẩu.
                  - INVALID_NAME: name không phải chuỗi, rỗng sau khi trim hoặc vượt quá 254 ký tự.
                  - INVALID_ROLE: role không phải chuỗi hoặc không thuộc tenant, landlord, admin (bao gồm chuỗi rỗng).
                  - ROLE_NOT_ALLOWED: role là admin; chỉ tenant và landlord được tự đăng ký.
                  - UNEXPECTED_FIELD: body chứa trường ngoài email, phone, password, name, role.
                  - VALIDATION_FAILED: lỗi validation khác chưa có code cụ thể ở trên.
          examples:
            emailRequired:
              summary: EMAIL_REQUIRED — Thiếu email hoặc email là null
              value:
                statusCode: 422
                code: EMAIL_REQUIRED
            phoneRequired:
              summary: PHONE_REQUIRED — Thiếu phone hoặc phone là null
              value:
                statusCode: 422
                code: PHONE_REQUIRED
            passwordRequired:
              summary: PASSWORD_REQUIRED — Thiếu password hoặc password là null
              value:
                statusCode: 422
                code: PASSWORD_REQUIRED
            nameRequired:
              summary: NAME_REQUIRED — Thiếu name hoặc name là null
              value:
                statusCode: 422
                code: NAME_REQUIRED
            roleRequired:
              summary: ROLE_REQUIRED — Thiếu role hoặc role là null
              value:
                statusCode: 422
                code: ROLE_REQUIRED
            invalidEmail:
              summary: INVALID_EMAIL — Email sai kiểu, định dạng hoặc độ dài
              value:
                statusCode: 422
                code: INVALID_EMAIL
            invalidPhone:
              summary: INVALID_PHONE — Số điện thoại sai kiểu hoặc định dạng Việt Nam
              value:
                statusCode: 422
                code: INVALID_PHONE
            invalidPassword:
              summary: INVALID_PASSWORD — Mật khẩu sai kiểu hoặc rỗng
              value:
                statusCode: 422
                code: INVALID_PASSWORD
            invalidName:
              summary: INVALID_NAME — Họ tên sai kiểu, rỗng hoặc quá dài
              value:
                statusCode: 422
                code: INVALID_NAME
            invalidRole:
              summary: INVALID_ROLE — Role sai kiểu hoặc không tồn tại
              value:
                statusCode: 422
                code: INVALID_ROLE
            roleNotAllowed:
              summary: ROLE_NOT_ALLOWED — Không cho phép tự đăng ký admin
              value:
                statusCode: 422
                code: ROLE_NOT_ALLOWED
            unexpectedField:
              summary: UNEXPECTED_FIELD — Body chứa trường không được khai báo
              value:
                statusCode: 422
                code: UNEXPECTED_FIELD
            validationFailed:
              summary: VALIDATION_FAILED — Lỗi validation khác chưa có code cụ thể
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: '../../openapi.yaml#/components/responses/TooManyRequestsError'
    '500':
      $ref: '../../openapi.yaml#/components/responses/InternalServerError'
