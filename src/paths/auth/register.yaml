post:
  tags:
  - Auth
  x-apidog-folder: Auth
  x-apidog-status: released
  operationId: registerAccount
  summary: Register
  description: |-
    Public. Tạo tài khoản tenant hoặc landlord và phiên đăng nhập. Trả accessToken, refreshToken và user trong JSON; không đặt cookie. Location: /api/v1/me.

    **Lưu ý**

    - Chỉ `tenant`/`landlord` được tự đăng ký; admin được seed sẵn. Role không đổi được sau khi đăng ký.
    - `user.registered` được ghi outbox cùng transaction tạo user; relay publish sau khi commit.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant ID as Identity
        participant DB as Identity DB
        participant MQ as RabbitMQ
        participant TEN as Tenancy
        participant COM as Community

        GW->>ID: POST /auth/register {email, phone, password, name, role}
        ID->>DB: Kiểm tra email/phone đã được user chưa bị xóa sử dụng
        alt Trùng email hoặc phone
            ID-->>GW: 409 DUPLICATE_EMAIL / DUPLICATE_PHONE
        end
        ID->>DB: [Transaction] Insert users (password bcrypt, status=active)<br/>+ insert refresh_tokens (tokenHash)<br/>+ outbox user.registered
        ID->>ID: Ký access token RS256 {sub, role, status}
        ID-->>GW: 201 USER_REGISTERED {accessToken, refreshToken, user}
        ID-)MQ: user.registered {userId, name, email, phone, role, status}
        MQ-)TEN: Upsert user snapshot
        MQ-)COM: Tạo profile chat/notification
    ```
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/AuthRegisterRequestDto
        example:
          email: lan@example.com
          phone: '0901234567'
          password: P@ssw0rd123
          name: Lê Văn An
          role: tenant
  responses:
    '201':
      description: Đăng ký tài khoản thành công
      headers:
        Location:
          description: Đường dẫn đến hồ sơ của tài khoản vừa tạo
          schema:
            type: string
            example: /api/v1/me
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - USER_REGISTERED
              data:
                $ref: ../../openapi.yaml#/components/schemas/AuthRegisterResponseDto
          example:
            statusCode: 201
            code: USER_REGISTERED
            data:
              accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              refreshToken: m7Qp2vN8rT4xK9sL3wY6cB1hF5jD0uE_gAqZkRoUiVs
              user:
                id: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
                name: Lê Văn An
                email: lan@example.com
                phone: '0901234567'
                role: tenant
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - INVALID_JSON
                - INVALID_REQUEST_BODY
                - BAD_REQUEST
          examples:
            error_1:
              summary: INVALID_JSON
              value:
                statusCode: 400
                code: INVALID_JSON
            error_2:
              summary: INVALID_REQUEST_BODY
              value:
                statusCode: 400
                code: INVALID_REQUEST_BODY
            error_3:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
    '409':
      description: Xung đột dữ liệu hoặc trạng thái.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 409
              code:
                type: string
                enum:
                - DUPLICATE_EMAIL
                - DUPLICATE_PHONE
          examples:
            error_1:
              summary: DUPLICATE_EMAIL
              value:
                statusCode: 409
                code: DUPLICATE_EMAIL
            error_2:
              summary: DUPLICATE_PHONE
              value:
                statusCode: 409
                code: DUPLICATE_PHONE
    '422':
      description: Vi phạm ràng buộc dữ liệu; trả mã của lỗi đầu tiên.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - PASSWORD_REQUIRED
                - PASSWORD_MUST_BE_STRING
                - PASSWORD_NOT_EMPTY
                - PASSWORD_INVALID_LENGTH
                - PASSWORD_INVALID_FORMAT
                - EMAIL_REQUIRED
                - EMAIL_MUST_BE_STRING
                - EMAIL_NOT_EMPTY
                - EMAIL_INVALID_LENGTH
                - EMAIL_INVALID_FORMAT
                - PHONE_REQUIRED
                - PHONE_MUST_BE_STRING
                - PHONE_NOT_EMPTY
                - PHONE_INVALID_FORMAT
                - NAME_REQUIRED
                - NAME_MUST_BE_STRING
                - NAME_NOT_EMPTY
                - NAME_INVALID_LENGTH
                - ROLE_REQUIRED
                - ROLE_INVALID
                - AUTH_REGISTER_ROLE_NOT_ALLOWED
                - UNEXPECTED_FIELD
                - VALIDATION_FAILED
          examples:
            error_1:
              summary: PASSWORD_REQUIRED
