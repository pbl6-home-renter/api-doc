post:
  tags: [Auth]
  x-apidog-folder: Auth
  operationId: registerAccount
  summary: Register
  description: >-
    Public. Tạo tài khoản tenant hoặc landlord; admin không được tự đăng ký.
    Thành công tạo phiên refresh và đặt cookie HttpOnly, Secure, SameSite=Lax,
    Path=/api/v1/auth. Cookie chứa token opaque, không trả trong JSON.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/AuthRegisterRequestDto'
        example:
          email: lan@example.com
          phone: '0901234567'
          password: P@ssw0rd123
          name: Lê Văn An
          role: tenant
  responses:
    '201':
      description: Đăng ký tài khoản thành công
      headers:
        Location:
          description: Đường dẫn đến hồ sơ của tài khoản vừa tạo
          schema:
            type: string
            example: /api/v1/me
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode:
                type: integer
                enum: [201]
              code:
                type: string
                enum: [USER_REGISTERED]
              data:
                $ref: '../../openapi.yaml#/components/schemas/AuthRegisterResponseDto'
          example:
            statusCode: 201
            code: USER_REGISTERED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              email: lan@example.com
              phone: '0901234567'
              name: Lê Văn An
              role: tenant
              status: active
    '400':
      $ref: '../../openapi.yaml#/components/responses/BadRequestError'
    '409':
      description: Email đã được sử dụng
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum: [DUPLICATE_EMAIL]
          example:
            statusCode: 409
            code: DUPLICATE_EMAIL
    '422':
      description: Dữ liệu đăng ký không hợp lệ hoặc role không được phép tự đăng ký
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum: [VALIDATION_FAILED, ROLE_NOT_ALLOWED]
                description: >-
                  VALIDATION_FAILED khi dữ liệu đăng ký không hợp lệ.
                  ROLE_NOT_ALLOWED khi role không phải tenant hoặc landlord.
          examples:
            validationFailed:
              summary: Dữ liệu đăng ký không hợp lệ
              value:
                statusCode: 422
                code: VALIDATION_FAILED
            roleNotAllowed:
              summary: Role không được phép tự đăng ký
              value:
                statusCode: 422
                code: ROLE_NOT_ALLOWED
    '429':
      $ref: '../../openapi.yaml#/components/responses/TooManyRequestsError'
    '500':
      $ref: '../../openapi.yaml#/components/responses/InternalServerError'
