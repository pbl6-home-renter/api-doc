post:
  tags: [Auth]
  x-apidog-folder: Auth
  operationId: registerAccount
  summary: Register
  description: |-
    Public. Tạo tài khoản tenant hoặc landlord; admin không được tự đăng ký.
    Thành công tạo phiên refresh và đặt cookie HttpOnly, Secure, SameSite=Lax,
    Path=/api/v1/auth. Cookie chứa token opaque, không trả trong JSON.

    Request: POST /auth/register, Content-Type: application/json,
    Accept: application/json. Không cần Authorization, cookie, path params hoặc query params.
    Chọn request body example có cùng tên với response example để thử từng tình huống.
    Các ví dụ lỗi cố ý chứa dữ liệu không hợp lệ; không dùng làm body đăng ký thành công.
    File reference/register-cases.postman.json cung cấp các case có đủ request headers,
    raw body và response tương ứng, bao gồm JSON sai cú pháp hoặc không gửi body.
    BAD_REQUEST, INVALID_HEADER, VALIDATION_FAILED, 429 và 500 cần điều kiện phía server
    hoặc mock được cấu hình tương ứng; body hợp lệ tự nó không gây ra các lỗi này.
  security: []
  parameters:
    - name: Accept
      in: header
      required: false
      description: Nhận response JSON; Content-Type application/json được xác định bởi request body.
      schema:
        type: string
        enum: [application/json]
      example: application/json
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/AuthRegisterRequestDto'
        examples:
          registeredTenant:
            summary: 201 USER_REGISTERED — Đăng ký tenant
            description: Email và số điện thoại phải chưa được sử dụng. Header Content-Type và Accept là application/json.
            value: &registerBody
              email: lan@example.com
              phone: '0901234567'
              password: P@ssw0rd123
              name: Lê Văn An
              role: tenant
          registeredLandlord:
            summary: 201 USER_REGISTERED — Đăng ký landlord
            description: Email và số điện thoại phải chưa được sử dụng.
            value:
              <<: *registerBody
              email: landlord@example.com
              phone: '0901234568'
              role: landlord
          invalidRequestBody:
            summary: 400 INVALID_REQUEST_BODY — JSON cấp gốc là array
            description: Body là [] thay vì object. Case không gửi body nằm trong collection đi kèm.
            value: []
          duplicateEmail:
            summary: 409 DUPLICATE_EMAIL — Email đã tồn tại
            description: Tạo trước tài khoản lan@example.com; phone 0901234569 phải chưa được sử dụng.
            value:
              <<: *registerBody
              phone: '0901234569'
          duplicatePhone:
            summary: 409 DUPLICATE_PHONE — Số điện thoại đã tồn tại
            description: Tạo trước tài khoản có phone 0901234567; email new-phone-test@example.com phải chưa được sử dụng.
            value:
              <<: *registerBody
              email: new-phone-test@example.com
          emailRequired:
            summary: 422 EMAIL_REQUIRED — Thiếu email
            value:
              phone: '0901234567'
              password: P@ssw0rd123
              name: Lê Văn An
              role: tenant
          phoneRequired:
            summary: 422 PHONE_REQUIRED — Thiếu phone
            value:
              email: lan@example.com
              password: P@ssw0rd123
              name: Lê Văn An
              role: tenant
          passwordRequired:
            summary: 422 PASSWORD_REQUIRED — Thiếu password
            value:
              email: lan@example.com
              phone: '0901234567'
              name: Lê Văn An
              role: tenant
          nameRequired:
            summary: 422 NAME_REQUIRED — Thiếu name
            value:
              email: lan@example.com
              phone: '0901234567'
              password: P@ssw0rd123
              role: tenant
          roleRequired:
            summary: 422 ROLE_REQUIRED — Thiếu role
            value:
              email: lan@example.com
              phone: '0901234567'
              password: P@ssw0rd123
              name: Lê Văn An
          invalidEmail:
            summary: 422 INVALID_EMAIL — Email sai định dạng
            value:
              <<: *registerBody
              email: not-an-email
          invalidPhone:
            summary: 422 INVALID_PHONE — Phone sai định dạng
            value:
              <<: *registerBody
              phone: '12345'
          invalidPassword:
            summary: 422 INVALID_PASSWORD — Mật khẩu rỗng
            value:
              <<: *registerBody
              password: ''
          invalidName:
            summary: 422 INVALID_NAME — Họ tên rỗng sau khi trim
            value:
              <<: *registerBody
              name: ''
          invalidRole:
            summary: 422 INVALID_ROLE — Role không tồn tại
            value:
              <<: *registerBody
              role: owner
          roleNotAllowed:
            summary: 422 ROLE_NOT_ALLOWED — Tự đăng ký admin
            value:
              <<: *registerBody
              role: admin
          unexpectedField:
            summary: 422 UNEXPECTED_FIELD — Thừa trường isAdmin
            value:
              <<: *registerBody
              isAdmin: true
  responses:
    '201':
      description: Đăng ký tài khoản thành công
      headers:
        Set-Cookie:
          description: Cookie phiên refresh; token minh họa không dùng để xác thực thật.
          schema:
            type: string
          example: 'refreshToken=mock-register-refresh-token; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax'
        Location:
          description: Đường dẫn đến hồ sơ của tài khoản vừa tạo
          schema:
            type: string
            example: /api/v1/me
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode:
                type: integer
                enum: [201]
              code:
                type: string
                enum: [USER_REGISTERED]
              data:
                $ref: '../../openapi.yaml#/components/schemas/AuthRegisterResponseDto'
          example:
            statusCode: 201
            code: USER_REGISTERED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              email: lan@example.com
              phone: '0901234567'
              name: Lê Văn An
              role: tenant
              status: active
    '400':
      x-apidog-name: Bad Request
      description: >-
        Yêu cầu đăng ký không thể xử lý do JSON sai cú pháp, thiếu body,
        body không phải JSON object hoặc header đầu vào sai định dạng.
        Khi body là JSON object, lỗi thiếu trường, sai kiểu/giá trị từng trường,
        trường không được khai báo hoặc role không được phép trả HTTP 422.
        Email hoặc số điện thoại đã được sử dụng trả HTTP 409.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [400]
              code:
                type: string
                enum:
                  - INVALID_JSON
                  - INVALID_REQUEST_BODY
                  - INVALID_HEADER
                  - BAD_REQUEST
                description: |-
                  Mỗi response trả một code tương ứng với lỗi được phát hiện.
                  - INVALID_JSON: body có nội dung nhưng JSON sai cú pháp, ví dụ thiếu dấu đóng ngoặc hoặc có dấu phẩy thừa.
                  - INVALID_REQUEST_BODY: không gửi body, body rỗng hoặc JSON cấp gốc là null, array, string, number hay boolean thay vì object. Object rỗng ({}) trả HTTP 422 với mã thiếu trường tương ứng.
                  - INVALID_HEADER: header đầu vào sai định dạng; endpoint public, không yêu cầu Authorization.
                  - BAD_REQUEST: yêu cầu không hợp lệ khác chưa có code cụ thể ở trên; không dùng thay các lỗi HTTP 409 hoặc 422.
                example: INVALID_JSON
          examples:
            invalidJson:
              summary: INVALID_JSON — JSON sai cú pháp
              value:
                statusCode: 400
                code: INVALID_JSON
            invalidRequestBody:
              summary: INVALID_REQUEST_BODY — Thiếu body hoặc body không phải object
              value:
                statusCode: 400
                code: INVALID_REQUEST_BODY
            invalidHeader:
              summary: INVALID_HEADER — Header đầu vào sai định dạng
              value:
                statusCode: 400
                code: INVALID_HEADER
            badRequest:
              summary: BAD_REQUEST — Yêu cầu không hợp lệ khác
              value:
                statusCode: 400
                code: BAD_REQUEST
    '409':
      description: >-
        Email hoặc số điện thoại đã được sử dụng, kể cả bởi tài khoản bị khóa
        hoặc đã xóa mềm nhưng vẫn giữ định danh trong database.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum: [DUPLICATE_EMAIL, DUPLICATE_PHONE]
                description: >-
                  DUPLICATE_EMAIL khi email đã tồn tại (email được trim và chuyển về chữ thường).
                  DUPLICATE_PHONE khi số điện thoại đã tồn tại sau khi trim.
                  Nếu cả hai cùng trùng, trả DUPLICATE_EMAIL.
          examples:
            duplicateEmail:
              summary: DUPLICATE_EMAIL — Email đã được sử dụng
              value:
                statusCode: 409
                code: DUPLICATE_EMAIL
            duplicatePhone:
              summary: DUPLICATE_PHONE — Số điện thoại đã được sử dụng
              value:
                statusCode: 409
                code: DUPLICATE_PHONE
    '422':
      description: Dữ liệu đăng ký không hợp lệ hoặc role không được phép tự đăng ký
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - EMAIL_REQUIRED
                  - PHONE_REQUIRED
                  - PASSWORD_REQUIRED
                  - NAME_REQUIRED
                  - ROLE_REQUIRED
                  - INVALID_EMAIL
                  - INVALID_PHONE
                  - INVALID_PASSWORD
                  - INVALID_NAME
                  - INVALID_ROLE
                  - ROLE_NOT_ALLOWED
                  - UNEXPECTED_FIELD
                  - VALIDATION_FAILED
                description: |-
                  Mỗi response trả một code tương ứng với lỗi được phát hiện.
                  - EMAIL_REQUIRED, PHONE_REQUIRED, PASSWORD_REQUIRED, NAME_REQUIRED, ROLE_REQUIRED: trường tương ứng bị thiếu hoặc có giá trị null.
                  - INVALID_EMAIL: email không phải chuỗi, sai định dạng hoặc không dài từ 5 đến 254 ký tự sau khi trim.
                  - INVALID_PHONE: phone không phải chuỗi hoặc không khớp 0 + 9 chữ số hay +84 + 9 chữ số sau khi trim.
                  - INVALID_PASSWORD: password không phải chuỗi hoặc là chuỗi rỗng; không trim mật khẩu.
                  - INVALID_NAME: name không phải chuỗi, rỗng sau khi trim hoặc vượt quá 254 ký tự.
                  - INVALID_ROLE: role không phải chuỗi hoặc không thuộc tenant, landlord, admin (bao gồm chuỗi rỗng).
                  - ROLE_NOT_ALLOWED: role là admin; chỉ tenant và landlord được tự đăng ký.
                  - UNEXPECTED_FIELD: body chứa trường ngoài email, phone, password, name, role.
                  - VALIDATION_FAILED: lỗi validation khác chưa có code cụ thể ở trên.
          examples:
            emailRequired:
              summary: EMAIL_REQUIRED — Thiếu email hoặc email là null
              value:
                statusCode: 422
                code: EMAIL_REQUIRED
            phoneRequired:
              summary: PHONE_REQUIRED — Thiếu phone hoặc phone là null
              value:
                statusCode: 422
                code: PHONE_REQUIRED
            passwordRequired:
              summary: PASSWORD_REQUIRED — Thiếu password hoặc password là null
              value:
                statusCode: 422
                code: PASSWORD_REQUIRED
            nameRequired:
              summary: NAME_REQUIRED — Thiếu name hoặc name là null
              value:
                statusCode: 422
                code: NAME_REQUIRED
            roleRequired:
              summary: ROLE_REQUIRED — Thiếu role hoặc role là null
              value:
                statusCode: 422
                code: ROLE_REQUIRED
            invalidEmail:
              summary: INVALID_EMAIL — Email sai kiểu, định dạng hoặc độ dài
              value:
                statusCode: 422
                code: INVALID_EMAIL
            invalidPhone:
              summary: INVALID_PHONE — Số điện thoại sai kiểu hoặc định dạng Việt Nam
              value:
                statusCode: 422
                code: INVALID_PHONE
            invalidPassword:
              summary: INVALID_PASSWORD — Mật khẩu sai kiểu hoặc rỗng
              value:
                statusCode: 422
                code: INVALID_PASSWORD
            invalidName:
              summary: INVALID_NAME — Họ tên sai kiểu, rỗng hoặc quá dài
              value:
                statusCode: 422
                code: INVALID_NAME
            invalidRole:
              summary: INVALID_ROLE — Role sai kiểu hoặc không tồn tại
              value:
                statusCode: 422
                code: INVALID_ROLE
            roleNotAllowed:
              summary: ROLE_NOT_ALLOWED — Không cho phép tự đăng ký admin
              value:
                statusCode: 422
                code: ROLE_NOT_ALLOWED
            unexpectedField:
              summary: UNEXPECTED_FIELD — Body chứa trường không được khai báo
              value:
                statusCode: 422
                code: UNEXPECTED_FIELD
            validationFailed:
              summary: VALIDATION_FAILED — Lỗi validation khác chưa có code cụ thể
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: '../../openapi.yaml#/components/responses/TooManyRequestsError'
    '500':
      $ref: '../../openapi.yaml#/components/responses/InternalServerError'
