              value:
                statusCode: 422
                code: PASSWORD_NOT_EMPTY
            error_4:
              summary: PASSWORD_INVALID_LENGTH
              value:
                statusCode: 422
                code: PASSWORD_INVALID_LENGTH
            error_5:
              summary: PASSWORD_INVALID_FORMAT
              value:
                statusCode: 422
                code: PASSWORD_INVALID_FORMAT
            error_6:
              summary: EMAIL_REQUIRED
              value:
                statusCode: 422
