get:
  tags:
  - Auth
  x-apidog-folder: Auth
  x-apidog-status: released
  operationId: getJwks
  security: []
  summary: Get JWKS
  description: |-
    Public. Trả public key RS256 để API Gateway và các service verify access token.

    **Lưu ý**

    - Response là JWK Set chuẩn RFC 7517, **không** bọc `{statusCode, code, data}`, để `jose` (`createRemoteJWKSet`) đọc được `keys` ở cấp ngoài cùng.
    - API Gateway cache key; khi xoay key, giữ key cũ trong JWKS tới khi mọi access token ký bằng key cũ hết hạn.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant ID as Identity

        Note over GW: Lúc khởi động, khi cache hết hạn<br/>hoặc gặp kid lạ
        GW->>ID: GET /.well-known/jwks.json
        ID-->>GW: 200 {keys: [{kty, n, e, use: sig, alg: RS256, kid}]}
        GW->>GW: Cache public key để verify JWT
    ```
  responses:
    '200':
      description: Danh sách public key
      content:
        application/json:
          schema:
            $ref: ../../openapi.yaml#/components/schemas/AuthJwksResponseDto
          example:
            keys:
            - kty: RSA
              n: np-J6FU-Jan_SEoockjWWE8WG9AIqdV-5JAsEOY3w84f0Cp8z3h72vhUAj7BqnHpeMDVZFjIGzhtcMBKBaUvAP-SEP7kakhY9ohz8TQau8lg4Ee5QKwdOuogqk6x6P6KHkc_sZFjCRYDxYpy7cqk3c2kqd6x1kNqbevZAowLsq8UnHsOgb59UYHJUe0BkrRe7yZaHK2laTzslQOMQ-JhXZd848ZKxwrGSDM645zxdvyeK_fPakgS76tzesi9qQ5j7CMbukvsLUV6gjmj7onVrQk8qN61ulOHpTqqbTZQIUbThtAE8lygqK_RO5nvoz80QDxBzXwRBQEq5CuHtSsK6w
              e: AQAB
              use: sig
              alg: RS256
              kid: rentify-identity
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
