post:
  tags:
  - Auth
  x-apidog-folder: Auth
  x-apidog-status: released
  operationId: loginAccount
  summary: Login
  description: |-
    **Lưu ý**
    
    - User bị khóa **vẫn đăng nhập được**; access token mang claim `status` để Tenancy/Community chặn chức năng.
    - User đã xóa mềm được coi như không tồn tại, trả `401`.
    - Đang cân nhắc: refresh token hiện trả trong JSON, `api-conventions.md` §4 muốn dùng HttpOnly cookie.
    
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Identity-Service
        participant C as AuthController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: POST /api/v1/auth/login
        GW->>S: Proxy original HTTP request
        S->>C: Invoke loginAccount
        C->>Bus: Execute command for loginAccount
        Bus->>H: Dispatch command handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/AuthLoginRequestDto
        example:
          identifier: lan@example.com
          password: P@ssw0rd123
          rememberMe: true
  responses:
    '200':
      description: Đăng nhập thành công
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - SESSION_STARTED
              data:
                $ref: ../../openapi.yaml#/components/schemas/AuthLoginResponseDto
          example:
            statusCode: 200
            code: SESSION_STARTED
            data:
              accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              refreshToken: m7Qp2vN8rT4xK9sL3wY6cB1hF5jD0uE_gAqZkRoUiVs
              user:
                id: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
                name: Lê Văn An
                email: lan@example.com
                phone: '0901234567'
                role: tenant
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - INVALID_JSON
                - INVALID_REQUEST_BODY
                - BAD_REQUEST
          examples:
            error_1:
              summary: INVALID_JSON
              value:
                statusCode: 400
                code: INVALID_JSON
            error_2:
              summary: INVALID_REQUEST_BODY
              value:
                statusCode: 400
                code: INVALID_REQUEST_BODY
            error_3:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
    '401':
      description: Không xác thực được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 401
              code:
                type: string
                enum:
                - AUTH_LOGIN_INVALID_CREDENTIALS
          examples:
            error_1:
              summary: AUTH_LOGIN_INVALID_CREDENTIALS
              value:
                statusCode: 401
                code: AUTH_LOGIN_INVALID_CREDENTIALS
    '422':
      description: Vi phạm ràng buộc dữ liệu; trả mã của lỗi đầu tiên.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - IDENTIFIER_REQUIRED
                - IDENTIFIER_MUST_BE_STRING
                - IDENTIFIER_NOT_EMPTY
                - PASSWORD_REQUIRED
                - PASSWORD_MUST_BE_STRING
                - PASSWORD_NOT_EMPTY
                - REMEMBER_ME_REQUIRED
                - REMEMBER_ME_MUST_BE_BOOLEAN
                - UNEXPECTED_FIELD
                - VALIDATION_FAILED
          examples:
            error_1:
              summary: IDENTIFIER_REQUIRED
              value:
                statusCode: 422
                code: IDENTIFIER_REQUIRED
            error_2:
              summary: IDENTIFIER_MUST_BE_STRING
              value:
                statusCode: 422
                code: IDENTIFIER_MUST_BE_STRING
            error_3:
              summary: IDENTIFIER_NOT_EMPTY
              value:
                statusCode: 422
                code: IDENTIFIER_NOT_EMPTY
            error_4:
              summary: PASSWORD_REQUIRED
              value:
                statusCode: 422
                code: PASSWORD_REQUIRED
            error_5:
              summary: PASSWORD_MUST_BE_STRING
              value:
                statusCode: 422
                code: PASSWORD_MUST_BE_STRING
            error_6:
              summary: PASSWORD_NOT_EMPTY
              value:
                statusCode: 422
                code: PASSWORD_NOT_EMPTY
            error_7:
              summary: REMEMBER_ME_REQUIRED
              value:
                statusCode: 422
                code: REMEMBER_ME_REQUIRED
            error_8:
              summary: REMEMBER_ME_MUST_BE_BOOLEAN
              value:
                statusCode: 422
                code: REMEMBER_ME_MUST_BE_BOOLEAN
            error_9:
              summary: UNEXPECTED_FIELD
              value:
                statusCode: 422
                code: UNEXPECTED_FIELD
            error_10:
              summary: VALIDATION_FAILED
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
