post:
  tags: [Auth]
  x-apidog-folder: Auth
  operationId: loginAccount
  summary: Login
  description: |-
    Public. Đăng nhập bằng identifier và password. Access token có thời hạn 900 giây; refresh token opaque được trả trong data của response và đặt trong cookie HttpOnly, Secure, SameSite=Lax, Path=/api/v1/auth.

    ### Sequence diagram — Login

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

