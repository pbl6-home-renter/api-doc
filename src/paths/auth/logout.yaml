  tags: [Auth]
  x-apidog-folder: Auth
  operationId: logoutSession
  summary: Logout
  description: |-
    Dành cho tenant, landlord và admin. Không có request body. Thu hồi phiên refresh hiện tại được xác định qua cookie refreshToken và xóa cookie.

    ### Sequence diagram — Logout

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

