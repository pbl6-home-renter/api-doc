get:
  tags:
  - Chat
  x-apidog-folder: Conversation
  x-apidog-status: designing
  operationId: getConversationsConversationid
  security:
    - BearerAuth: []
  summary: Get conversation details
  description: |
    Xem chi tiết hội thoại của caller. Thành viên active và read-only được xem; user chưa từng là member nhận 403. Read-only chỉ được tải tin nhắn tới `leftSequence` qua API messages.

    ```mermaid
    sequenceDiagram
        participant C as Client
        participant COM as Community
        participant DB as Community DB
        C->>COM: GET /conversations/{conversationId}
        COM->>COM: Verify JWT and validate conversationId
        COM->>DB: Find conversation and caller membership
        DB-->>COM: Conversation and membership state
        alt Conversation does not exist
            COM-->>C: 404 NOT_FOUND
        else Caller is not a member
            COM-->>C: 403 FORBIDDEN
        else Caller is active or read-only member
            COM->>DB: Load member list and unread count within read boundary
            DB-->>COM: Conversation detail
            COM-->>C: 200 CONVERSATION_FETCHED
        end
    ```
  parameters:
  - name: conversationId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc chi tiết hội thoại.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONVERSATION_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ConversationDetailResponseDto
          example:
            statusCode: 200
            code: CONVERSATION_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              kind: group
              contextType: contract
              contextId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              title: Trao đổi hợp đồng thuê
              displayName: Trao đổi hợp đồng thuê
              avatarMediaId: null
              unreadCount: 2
              members:
              - conversationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                userId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                displayName: Bảo Dương
                participantType: user
                role: admin
                status: active
                joinedAt: '2026-11-02T09:00:00.000Z'
                lastReadSequence: 12
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError

patch:
  tags: [Chat]
  x-apidog-folder: Conversation
  x-apidog-status: designing
  operationId: updateConversation
  security: [{ BearerAuth: [] }]
  summary: Sửa tên hoặc ảnh nhóm
  description: |
    Chỉ admin đang active của group được đổi tên hoặc ảnh. Không hỗ trợ direct conversation. Gửi `null` để bỏ tên tùy chỉnh hoặc gỡ ảnh. Avatar phải được upload trước bằng Media purpose `conversation_avatar`, owner `conversation` và `ownerId=conversationId`; Community xác minh trạng thái, owner và purpose qua Identity trước khi cập nhật. Metadata và system message được ghi trong cùng transaction. Thay đổi metadata không gửi FCM.

    ```mermaid
    sequenceDiagram
      participant C as Client
      participant COM as Community
      participant ID as Identity Media
      participant DB as Community DB
      C->>COM: PATCH /conversations/{conversationId} {title?, avatarMediaId?}
      COM->>DB: Kiểm tra caller là active admin của group
      alt avatarMediaId được gửi khác null
        COM->>ID: GET /internal/media/conversation-avatar?mediaId&conversationId
        ID->>ID: Kiểm tra uploaded, owner conversation và purpose conversation_avatar
        ID-->>COM: valid
      end
      COM->>DB: Transaction: cập nhật metadata và thêm system message(s)
      DB-->>COM: Commit
      COM-->>C: 200 CONVERSATION_UPDATED
    ```
  parameters:
    - name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ConversationMetadataUpdateRequestDto
  responses:
    '200':
      description: Thông tin group được cập nhật.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [200] }
              code: { type: string, enum: [CONVERSATION_UPDATED] }
              data:
                $ref: ../../openapi.yaml#/components/schemas/ConversationMetadataUpdateResponseDto
    '400': { $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError }
    '401': { $ref: ../../openapi.yaml#/components/responses/UnauthorizedError }
    '403': { $ref: ../../openapi.yaml#/components/responses/ForbiddenError }
    '404': { $ref: ../../openapi.yaml#/components/responses/NotFoundError }
    '422':
      description: Request fields or avatar media are invalid.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [422] }
              code:
                type: string
                enum: [VALIDATION_FAILED, UNEXPECTED_FIELD, CONVERSATION_AVATAR_INVALID]
    '503':
      description: Identity Media tạm thời không khả dụng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [503] }
              code: { type: string, enum: [SERVICE_UNAVAILABLE] }
