parameters:
  - name: conversationId
    in: path
    required: true
    schema: { type: string, format: uuid }
get:
  tags: [Chat]
  operationId: listConversationMembers
  security: [{ BearerAuth: [] }]
  x-apidog-folder: ConversationMember
  x-apidog-status: designing
  summary: Xem thành viên hội thoại
  description: |
    Thành viên active hoặc read_only được xem danh sách member của conversation nếu còn quyền đọc. Member đã rời chỉ đọc được tới leftSequence khi lấy lịch sử message; response này trả membership hiện có để hiển thị trạng thái thành viên.

    ```mermaid
    sequenceDiagram
        participant C as Client
        participant COM as Community
        participant DB as Community DB
        C->>COM: GET /conversations/{conversationId}/members
        COM->>COM: Verify JWT and conversationId
        COM->>DB: Check conversation and caller membership
        DB-->>COM: Conversation and active/read_only access
        COM->>DB: Load non-deleted members ordered by joinedAt
        DB-->>COM: Member snapshots
        COM-->>C: 200 CONVERSATION_MEMBERS_FETCHED
    ```
  responses:
    '200':
      description: Thành viên hội thoại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [200] }
              code: { type: string, enum: [CONVERSATION_MEMBERS_FETCHED] }
              data:
                type: array
                items: { $ref: ../../openapi.yaml#/components/schemas/ConversationMember }
          example:
            statusCode: 200
            code: CONVERSATION_MEMBERS_FETCHED
            data: []
    '400': { $ref: ../../openapi.yaml#/components/responses/BadRequestPathError }
    '401': { $ref: ../../openapi.yaml#/components/responses/UnauthorizedError }
    '403': { $ref: ../../openapi.yaml#/components/responses/ForbiddenError }
    '404': { $ref: ../../openapi.yaml#/components/responses/NotFoundError }
    '503': { $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError }
post:
  tags: [Chat]
  operationId: addConversationMembers
  security: [{ BearerAuth: [] }]
  x-apidog-folder: ConversationMember
  x-apidog-status: designing
  summary: Thêm thành viên nhóm
  description: |
    Chỉ admin group được thêm member. Membership read_only được kích hoạt lại; member mới hoặc được kích hoạt lại xem toàn bộ lịch sử. Toàn bộ userIds phải hợp lệ và chưa active; nếu một user không hợp lệ hoặc đã active thì không thay đổi member nào. Thao tác ghi system message action=members_added trong cùng transaction. `payload` gồm `action`, `actorUserId`, snapshot `actorDisplayName` và `members` (mỗi phần tử có `userId`, `displayName`).

    ```mermaid
    sequenceDiagram
        participant C as Client
        participant COM as Community
        participant ID as Identity
        participant DB as Community DB
        C->>COM: POST /conversations/{conversationId}/members
        COM->>DB: Verify group and caller admin
        COM->>ID: Batch lookup names for userIds
        ID-->>COM: User IDs and display names
        COM->>DB: Begin transaction and lock conversation
        COM->>DB: Add/reactivate members and save members_added system message
        DB-->>COM: Commit member records and message atomically
        COM-->>C: 200 CONVERSATION_MEMBERS_ADDED with members
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [userIds]
          properties:
            userIds:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, format: uuid }
  responses:
    '200':
      description: Member được thêm hoặc kích hoạt lại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [200] }
              code: { type: string, enum: [CONVERSATION_MEMBERS_ADDED] }
              data:
                type: array
                items: { $ref: ../../openapi.yaml#/components/schemas/ConversationMember }
          example:
            statusCode: 200
            code: CONVERSATION_MEMBERS_ADDED
            data: []
    '400': { $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError }
    '401': { $ref: ../../openapi.yaml#/components/responses/UnauthorizedError }
    '403': { $ref: ../../openapi.yaml#/components/responses/ForbiddenError }
    '404': { $ref: ../../openapi.yaml#/components/responses/NotFoundError }
    '422': { $ref: ../../openapi.yaml#/components/responses/ValidationError }
    '503': { $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError }
