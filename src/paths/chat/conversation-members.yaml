parameters:
  - name: conversationId
    in: path
    required: true
    schema: { type: string, format: uuid }
get:
  tags: [Chat]
  operationId: listConversationMembers
  security: [{ BearerAuth: [] }]
  x-apidog-folder: ConversationMember
  x-apidog-status: released
  summary: Xem thành viên hội thoại
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as community-service
        participant Guard as JWT/access guards
        participant C as ConversationController
        participant Bus as CQRS QueryBus
        participant H as Application handler
        Client->>GW: GET /api/v1/conversations/{conversationId}/members
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke listConversationMembers
        C->>Bus: Execute query for listConversationMembers
        Bus->>H: Dispatch query handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  responses:
    '200':
      description: Thành viên hội thoại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [200] }
              code: { type: string, enum: [CONVERSATION_MEMBERS_FETCHED] }
              data:
                type: array
                items: { $ref: ../../openapi.yaml#/components/schemas/ConversationMember }
          example:
            statusCode: 200
            code: CONVERSATION_MEMBERS_FETCHED
            data: []
    '400': { $ref: ../../openapi.yaml#/components/responses/BadRequestPathError }
    '401': { $ref: ../../openapi.yaml#/components/responses/UnauthorizedError }
    '403': { $ref: ../../openapi.yaml#/components/responses/ForbiddenError }
    '404': { $ref: ../../openapi.yaml#/components/responses/NotFoundError }
    '503': { $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError }
post:
  tags: [Chat]
  operationId: addConversationMembers
  security: [{ BearerAuth: [] }]
  x-apidog-folder: ConversationMember
  x-apidog-status: released
  summary: Thêm thành viên nhóm
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as community-service
        participant Guard as JWT/access guards
        participant C as ConversationController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: POST /api/v1/conversations/{conversationId}/members
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke addConversationMembers
        C->>Bus: Execute command for addConversationMembers
        Bus->>H: Dispatch command handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [userIds]
          properties:
            userIds:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, format: uuid }
  responses:
    '200':
      description: Member được thêm hoặc kích hoạt lại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [200] }
              code: { type: string, enum: [CONVERSATION_MEMBERS_ADDED] }
              data:
                type: array
                items: { $ref: ../../openapi.yaml#/components/schemas/ConversationMember }
          example:
            statusCode: 200
            code: CONVERSATION_MEMBERS_ADDED
            data: []
    '400': { $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError }
    '401': { $ref: ../../openapi.yaml#/components/responses/UnauthorizedError }
    '403': { $ref: ../../openapi.yaml#/components/responses/ForbiddenError }
    '404': { $ref: ../../openapi.yaml#/components/responses/NotFoundError }
    '422': { $ref: ../../openapi.yaml#/components/responses/ValidationError }
    '503': { $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError }
