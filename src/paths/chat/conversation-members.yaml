parameters:
  - name: conversationId
    in: path
    required: true
    schema: { type: string, format: uuid }
get:
  tags: [Chat]
  operationId: listConversationMembers
  security: [{ BearerAuth: [] }]
  summary: Xem thành viên hội thoại
  description: Thành viên active và read_only có thể xem danh sách nếu còn quyền đọc.
  responses:
    '200':
      description: Danh sách thành viên.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: ../../openapi.yaml#/components/schemas/ConversationMember }
    '401': { $ref: ../../openapi.yaml#/components/responses/UnauthorizedError }
    '403': { $ref: ../../openapi.yaml#/components/responses/ForbiddenError }
post:
  tags: [Chat]
  operationId: addConversationMembers
  security: [{ BearerAuth: [] }]
  summary: Thêm thành viên nhóm
  description: Chỉ admin nhóm; membership cũ được kích hoạt lại và người được thêm xem toàn bộ lịch sử.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [userIds]
          properties:
            userIds:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, format: uuid }
  responses:
    '200': { description: Thành viên được thêm hoặc kích hoạt lại. }
    '401': { $ref: ../../openapi.yaml#/components/responses/UnauthorizedError }
    '403': { $ref: ../../openapi.yaml#/components/responses/ForbiddenError }
    '422': { $ref: ../../openapi.yaml#/components/responses/ValidationError }
