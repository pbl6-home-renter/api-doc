parameters:
  - name: conversationId
    in: path
    required: true
    schema: { type: string, format: uuid }
  - name: userId
    in: path
    required: true
    schema: { type: string, format: uuid }
delete:
  tags: [Chat]
  operationId: removeConversationMember
  security: [{ BearerAuth: [] }]
  x-apidog-folder: ConversationMember
  x-apidog-status: released
  summary: Xóa thành viên khỏi nhóm
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as community-service
        participant Guard as JWT/access guards
        participant C as ConversationController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: DELETE /api/v1/conversations/{conversationId}/members/{userId}
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke removeConversationMember
        C->>Bus: Execute command for removeConversationMember
        Bus->>H: Dispatch command handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  responses:
    '200':
      description: Thành viên đã bị kick; thay đổi và system message đã được lưu nguyên tử.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [200] }
              code: { type: string, enum: [CONVERSATION_MEMBER_REMOVED] }
              data: { type: object, nullable: true, enum: [null] }
          example: { statusCode: 200, code: CONVERSATION_MEMBER_REMOVED, data: null }
    '401': { $ref: ../../openapi.yaml#/components/responses/UnauthorizedError }
    '403': { $ref: ../../openapi.yaml#/components/responses/ForbiddenError }
    '404': { $ref: ../../openapi.yaml#/components/responses/NotFoundError }
    '409':
      description: Không thể loại bỏ user active cuối cùng khỏi group.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [409] }
              code: { type: string, enum: [GROUP_MUST_RETAIN_ACTIVE_MEMBER] }
          example: { statusCode: 409, code: GROUP_MUST_RETAIN_ACTIVE_MEMBER }
    '422': { $ref: ../../openapi.yaml#/components/responses/ValidationError }
