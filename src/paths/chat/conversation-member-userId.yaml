parameters:
  - name: conversationId
    in: path
    required: true
    schema: { type: string, format: uuid }
  - name: userId
    in: path
    required: true
    schema: { type: string, format: uuid }
delete:
  tags: [Chat]
  operationId: removeConversationMember
  security: [{ BearerAuth: [] }]
  x-apidog-folder: ConversationMember
  x-apidog-status: designing
  summary: Xóa thành viên khỏi nhóm
  description: |
    Chỉ admin active của group được kick thành viên user active khác mình. Membership không bị xóa; chuyển sang read_only và chỉ đọc tới `leftSequence`. Hệ thống ghi system message `member_kicked`. Nếu đây là admin cuối cùng, quyền admin chuyển cho user active còn lại có `joinedAt` sớm nhất; hệ thống ghi thêm `admin_transferred`. `leftSequence` bao gồm cả hai system message trong cùng transaction. Nếu không còn user active để duy trì nhóm, trả 409 và rollback toàn bộ thay đổi. Không gửi FCM.

    ```mermaid
    sequenceDiagram
        participant C as Client
        participant COM as Community
        participant DB as Community DB
        C->>COM: DELETE /conversations/{conversationId}/members/{userId}
        COM->>DB: Begin transaction and lock conversation/members
        COM->>COM: Verify caller is active group admin and target is active user member
        COM->>DB: Lock message sequence and resolve active admin successor when needed
        COM->>DB: Save member_kicked, optional admin_transferred, and read-only boundary atomically
        COM-->>C: 200 CONVERSATION_MEMBER_REMOVED
    ```
  responses:
    '200':
      description: Thành viên đã bị kick; thay đổi và system message đã được lưu nguyên tử.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [200] }
              code: { type: string, enum: [CONVERSATION_MEMBER_REMOVED] }
              data: { type: object, nullable: true, enum: [null] }
          example: { statusCode: 200, code: CONVERSATION_MEMBER_REMOVED, data: null }
    '401': { $ref: ../../openapi.yaml#/components/responses/UnauthorizedError }
    '403': { $ref: ../../openapi.yaml#/components/responses/ForbiddenError }
    '404': { $ref: ../../openapi.yaml#/components/responses/NotFoundError }
    '409':
      description: Không thể loại bỏ user active cuối cùng khỏi group.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [409] }
              code: { type: string, enum: [GROUP_MUST_RETAIN_ACTIVE_MEMBER] }
          example: { statusCode: 409, code: GROUP_MUST_RETAIN_ACTIVE_MEMBER }
    '422': { $ref: ../../openapi.yaml#/components/responses/ValidationError }
