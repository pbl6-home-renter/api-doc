get:
  tags:
  - Chat
  x-apidog-folder: Conversation
  x-apidog-status: designing
  operationId: getConversations
  security:
    - BearerAuth: []
  summary: List conversations
  description: 'tenant, landlord. Liệt kê các hội thoại của người gọi. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 VALIDATION
    FAILED.'
  parameters:
  - name: contextType
    in: query
    required: false
    schema: { type: string, enum: [contract, building] }
    description: Khi dùng cùng contextId, tra cứu hội thoại context đã được tạo bởi event nguồn.
  - name: contextId
    in: query
    required: false
    schema: { type: string, format: uuid }
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  responses:
    '200':
      description: 'Thành công: Liệt kê các hội thoại của người gọi.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONVERSATIONS_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/ConversationListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: CONVERSATIONS_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              kind: group
              contextType: contract
              contextId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              title: Trao đổi hợp đồng thuê
              avatarMediaId: null
              unreadCount: 2
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError

post:
  tags: [Chat]
  operationId: createConversation
  security: [{ BearerAuth: [] }]
  summary: Tạo chat trực tiếp hoặc nhóm
  description: |
    Chat trực tiếp dùng lại hội thoại duy nhất của cặp user; chat nhóm tạo mới và caller trở thành admin. Tạo group chưa gắn ảnh đại diện; sau khi tạo, client upload ảnh theo conversationId rồi cập nhật qua PATCH /conversations/{conversationId}.

    ```mermaid
    sequenceDiagram
        participant C as Client
        participant COM as Community
        participant ID as Identity
        participant DB as Community DB
        C->>COM: POST /conversations
        COM->>COM: Verify JWT and validate request
        opt Có recipient/memberUserIds
            COM->>ID: GET /internal/users?ids=... (X-Service-Token)
            ID-->>COM: Users with id and isDeleted
        end
        COM->>DB: Transaction: create/reopen conversation and save members
        DB-->>COM: Conversation and membership records
        COM-->>C: 201 CONVERSATION_CREATED or CONVERSATION_REOPENED
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [direct, group] }
            recipientUserId: { type: string, format: uuid, description: Bắt buộc với direct. }
            memberUserIds:
              type: array
              maxItems: 100
              uniqueItems: true
              items: { type: string, format: uuid }
              description: Thành viên ban đầu của group; không cần gồm caller.
            title: { type: string, maxLength: 255 }
        examples:
          direct:
            summary: Mở chat trực tiếp
            value:
              kind: direct
              recipientUserId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
          group:
            summary: Tạo nhóm chat
            value:
              kind: group
              memberUserIds: [3fa85f64-5717-4562-b3fc-2c963f66afa6]
              title: Nhóm trao đổi
  responses:
    '201':
      description: Hội thoại được tạo hoặc chat direct hiện có được mở lại.
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [201] }
              code: { type: string, enum: [CONVERSATION_CREATED, CONVERSATION_REOPENED] }
              data: { $ref: ../../openapi.yaml#/components/schemas/ConversationDetailResponseDto }
    '400': { $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError }
    '401': { $ref: ../../openapi.yaml#/components/responses/UnauthorizedError }
    '422': { $ref: ../../openapi.yaml#/components/responses/ValidationError }
    '503': { description: Identity service unavailable; no conversation was created. }
    '500': { $ref: ../../openapi.yaml#/components/responses/InternalServerError }
