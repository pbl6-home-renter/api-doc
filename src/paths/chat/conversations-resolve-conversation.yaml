post:
  tags:
  - Chat
  x-apidog-folder: Conversation
  operationId: postConversationsResolveConversation
  security:
    - BearerAuth: []
  summary: Resolve conversation
  description: 'tenant, landlord. Lấy hội thoại của phòng hoặc tòa nhà. Lỗi nghiệp vụ: 422 EXACTLY ONE CONTEXT REQUIRED
    · 403 FORBIDDEN · 404 CONTEXT NOT FOUND.'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ConversationResolveRequestDto
        example:
          contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
  responses:
    '200':
      description: 'Thành công: Lấy hội thoại của phòng hoặc tòa nhà.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONVERSATION_RESOLVED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ConversationResolveResponseDto
          example:
            statusCode: 200
            code: CONVERSATION_RESOLVED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              type: room
              contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      x-apidog-name: Not Found
      description: Không tìm thấy tài nguyên được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [404]
              code:
                type: string
                enum:
                  - CONTEXT_NOT_FOUND
                description: |-
                  - CONTEXT_NOT_FOUND: Không tìm thấy tài nguyên ngữ cảnh.
          examples:
            context_not_found:
              summary: CONTEXT_NOT_FOUND — Không tìm thấy tài nguyên ngữ cảnh.
              value:
                statusCode: 404
                code: CONTEXT_NOT_FOUND
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - EXACTLY_ONE_CONTEXT_REQUIRED
                  - VALIDATION_FAILED
                description: |-
                  - EXACTLY_ONE_CONTEXT_REQUIRED: Phải chọn đúng một ngữ cảnh hội thoại.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            exactly_one_context_required:
              summary: EXACTLY_ONE_CONTEXT_REQUIRED — Phải chọn đúng một ngữ cảnh hội thoại.
              value:
                statusCode: 422
                code: EXACTLY_ONE_CONTEXT_REQUIRED
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
