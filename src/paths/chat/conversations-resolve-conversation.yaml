    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as community-service
        participant D as PostgreSQL community_db
        participant T as tenancy-service
        C->>G: POST /api/v1/conversations/resolve-conversation<br/>Body: contractId, buildingId
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance community-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Tra hội thoại theo contractId hoặc buildingId đã validate
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>T: Đọc phòng/hợp đồng và quyền actor theo ngữ cảnh
        T-->>S: Kết quả tồn tại và quyền (service token, correlation-id)
        break Context/phòng không tồn tại theo service sở hữu#59; không phải thiếu conversation đang cần resolve
            S-->>G: 404 (CONTEXT_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Exactly one contractId/buildingId#59; context tồn tại và actor có quyền
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (EXACTLY_ONE_CONTEXT_REQUIRED / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        alt Đã có conversation theo context
            S->>S: Dùng conversation hiện có
        else Chưa có conversation
            S->>D: Tạo conversation và membership theo context#59; ràng buộc không trùng
            D-->>S: Conversation được resolve
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 CONVERSATION_RESOLVED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ConversationResolveRequestDto
        example:
          contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
  responses:
    '200':
      description: 'Thành công: Lấy hội thoại của phòng hoặc tòa nhà.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONVERSATION_RESOLVED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ConversationResolveResponseDto
          example:
            statusCode: 200
            code: CONVERSATION_RESOLVED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              type: room
              contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      x-apidog-name: Not Found
      description: Không tìm thấy tài nguyên được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [404]
              code:
                type: string
                enum:
                  - CONTEXT_NOT_FOUND
                description: |-
                  - CONTEXT_NOT_FOUND: Không tìm thấy tài nguyên ngữ cảnh.
          examples:
            context_not_found:
              summary: CONTEXT_NOT_FOUND — Không tìm thấy tài nguyên ngữ cảnh.
              value:
                statusCode: 404
                code: CONTEXT_NOT_FOUND
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - EXACTLY_ONE_CONTEXT_REQUIRED
                  - VALIDATION_FAILED
                description: |-
                  - EXACTLY_ONE_CONTEXT_REQUIRED: Phải chọn đúng một ngữ cảnh hội thoại.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            exactly_one_context_required:
              summary: EXACTLY_ONE_CONTEXT_REQUIRED — Phải chọn đúng một ngữ cảnh hội thoại.
              value:
                statusCode: 422
                code: EXACTLY_ONE_CONTEXT_REQUIRED
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
