post:
  tags:
  - Chat
  x-apidog-folder: Message
  operationId: postMessagesMarkRead
  security:
    - BearerAuth: []
  summary: Mark messages as read
  description: |-
    tenant, landlord. Đánh dấu đã đọc một hội thoại. Lỗi nghiệp vụ: 403 FORBIDDEN · 404 MESSAGE NOT FOUND · 422 READ CURSOR INVALID · điều kiện migration cho con trỏ.

    ### Sequence diagram — Mark messages as read

    Luồng theo kiến trúc microservice: community-service sở hữu nghiệp vụ và community_db.

