get:
  tags:
  - Chat
  x-apidog-folder: Conversation
  x-apidog-status: released
  operationId: getConversationsUnreadSummary
  security:
  - BearerAuth: []
  summary: Get total unread messages
  description: |-
    **Quy tắc unread chung** (giống `unreadCount` của `GET /conversations`, `GET /conversations/{conversationId}`, response `POST /messages/mark-read` và Socket `conversation:read-updated`): đếm message chưa xóa có `type` thuộc `text`, `image`, `bot`; `sequence > lastReadSequence` của member; người gửi khác chính member đó. Message `system` vẫn có trong lịch sử nhưng không bao giờ được đếm. Member `read_only` chỉ đếm tới `leftSequence`.
    
    Route tĩnh `/conversations/unread-summary` được khai báo trước `/conversations/{conversationId}`; `conversationId` luôn là UUID nên `unread-summary` không bị hiểu là ID.
    
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as community-service
        participant Guard as JWT/access guards
        participant C as ConversationController
        participant Bus as CQRS QueryBus
        participant H as Application handler
        Client->>GW: GET /api/v1/conversations/unread-summary
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke getConversationsUnreadSummary
        C->>Bus: Execute query for getConversationsUnreadSummary
        Bus->>H: Dispatch query handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  responses:
    '200':
      description: 'Thành công: Tổng số tin nhắn chưa đọc của người gọi.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONVERSATION_UNREAD_SUMMARY_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ConversationUnreadSummaryResponseDto
          example:
            statusCode: 200
            code: CONVERSATION_UNREAD_SUMMARY_FETCHED
            data:
              totalUnreadCount: 12
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      description: '`UNEXPECTED_FIELD` khi gửi tham số query; endpoint không nhận tham số.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [422] }
              code: { type: string, enum: [UNEXPECTED_FIELD] }
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
