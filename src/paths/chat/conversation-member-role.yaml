parameters:
  - name: conversationId
    in: path
    required: true
    schema: { type: string, format: uuid }
  - name: userId
    in: path
    required: true
    schema: { type: string, format: uuid }
put:
  tags: [Chat]
  operationId: updateConversationMemberRole
  security: [{ BearerAuth: [] }]
  x-apidog-folder: ConversationMember
  x-apidog-status: released
  summary: Đổi vai trò thành viên
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as community-service
        participant Guard as JWT/access guards
        participant C as ConversationController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: PUT /api/v1/conversations/{conversationId}/members/{userId}/role
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke updateConversationMemberRole
        C->>Bus: Execute command for updateConversationMemberRole
        Bus->>H: Dispatch command handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [role]
          properties:
            role: { type: string, enum: [admin, member] }
  responses:
    '200':
      description: Vai trò đã được cập nhật; nếu có thay đổi, system message được lưu cùng transaction.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [200] }
              code: { type: string, enum: [CONVERSATION_MEMBER_ROLE_UPDATED] }
              data: { type: object, nullable: true, enum: [null] }
          example: { statusCode: 200, code: CONVERSATION_MEMBER_ROLE_UPDATED, data: null }
    '401': { $ref: ../../openapi.yaml#/components/responses/UnauthorizedError }
    '403': { $ref: ../../openapi.yaml#/components/responses/ForbiddenError }
    '404': { $ref: ../../openapi.yaml#/components/responses/NotFoundError }
    '409':
      description: Không thể hạ vai trò của admin cuối cùng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [409] }
              code: { type: string, enum: [LAST_ADMIN_CANNOT_BE_DEMOTED] }
          example: { statusCode: 409, code: LAST_ADMIN_CANNOT_BE_DEMOTED }
    '422': { $ref: ../../openapi.yaml#/components/responses/ValidationError }
