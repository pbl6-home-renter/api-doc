parameters:
  - name: conversationId
    in: path
    required: true
    schema: { type: string, format: uuid }
  - name: userId
    in: path
    required: true
    schema: { type: string, format: uuid }
put:
  tags: [Chat]
  operationId: updateConversationMemberRole
  security: [{ BearerAuth: [] }]
  x-apidog-folder: ConversationMember
  x-apidog-status: designing
  summary: Đổi vai trò thành viên
  description: |
    Chỉ admin active của group được đổi vai trò user active khác trong nhóm giữa `admin` và `member`; không áp dụng với direct conversation. Không thể hạ admin cuối cùng. Thay đổi role và system message `member_role_changed` được ghi cùng transaction. Payload lưu `actorUserId`, snapshot `actorDisplayName`, snapshot member và `oldRole`/`newRole`. Nếu role đích đã đúng như hiện tại, trả thành công nhưng không tạo message trùng. Không gửi FCM.

    ```mermaid
    sequenceDiagram
        participant C as Client
        participant COM as Community
        participant DB as Community DB
        C->>COM: PUT /conversations/{conversationId}/members/{userId}/role
        COM->>DB: Begin transaction and lock conversation/members
        COM->>COM: Verify caller is active group admin and target is active user member
        COM->>DB: Check last-admin constraint
        COM->>DB: Update role and append member_role_changed system message atomically
        COM-->>C: 200 CONVERSATION_MEMBER_ROLE_UPDATED
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [role]
          properties:
            role: { type: string, enum: [admin, member] }
  responses:
    '200':
      description: Vai trò đã được cập nhật; nếu có thay đổi, system message được lưu cùng transaction.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [200] }
              code: { type: string, enum: [CONVERSATION_MEMBER_ROLE_UPDATED] }
              data: { type: object, nullable: true, enum: [null] }
          example: { statusCode: 200, code: CONVERSATION_MEMBER_ROLE_UPDATED, data: null }
    '401': { $ref: ../../openapi.yaml#/components/responses/UnauthorizedError }
    '403': { $ref: ../../openapi.yaml#/components/responses/ForbiddenError }
    '404': { $ref: ../../openapi.yaml#/components/responses/NotFoundError }
    '409':
      description: Không thể hạ vai trò của admin cuối cùng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [409] }
              code: { type: string, enum: [LAST_ADMIN_CANNOT_BE_DEMOTED] }
          example: { statusCode: 409, code: LAST_ADMIN_CANNOT_BE_DEMOTED }
    '422': { $ref: ../../openapi.yaml#/components/responses/ValidationError }
