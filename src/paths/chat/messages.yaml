get:
  tags:
  - Chat
  x-apidog-folder: Message
  x-apidog-status: released
  operationId: getMessages
  security:
    - BearerAuth: []
  summary: List messages
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as community-service
        participant Guard as JWT/access guards
        participant C as MessageController
        participant Bus as CQRS QueryBus
        participant H as Application handler
        Client->>GW: GET /api/v1/messages
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke getMessages
        C->>Bus: Execute query for getMessages
        Bus->>H: Dispatch query handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  parameters:
  - name: conversationId
    in: query
    required: true
    schema: { type: string, format: uuid }
  - name: cursor
    in: query
    description: Cursor opaque từ trang trước; bỏ qua ở trang đầu.
    schema:
      type: string
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 30
  - name: maxSequence
    in: query
    required: false
    description: |-
      (Chat v2, tùy chọn) Chỉ trả tin có `sequence <= maxSequence` — dùng để mở một tin tìm được hoặc tin gốc của trích dẫn.
      Trang tiếp theo dùng `cursor` như bình thường (có thể gửi lại `maxSequence`, kết quả không đổi). Không vượt `leftSequence` của thành viên `read_only`.
    schema:
      type: string
      pattern: '^[1-9]\d{0,17}$'
      example: '42'
  - name: afterSequence
    in: query
    required: false
    description: |-
      (Chat v2, tùy chọn) Chỉ trả tin có `sequence > afterSequence`, **sắp `sequence` tăng dần** — dùng để tải tin mới hơn khi đang xem một tin cũ (mở bằng `maxSequence`).
      FE gọi lại với `afterSequence` = sequence lớn nhất đã tải cho tới khi `hasNextPage=false` (đã tới tin mới nhất). Cursor của trang tăng dần chỉ dùng được với request có `afterSequence`. Vẫn áp giới hạn `leftSequence` của thành viên `read_only`.
    schema:
      type: string
      pattern: '^(0|[1-9]\d{0,17})$'
      example: '42'
  responses:
    '200':
      description: 'Thành công: Liệt kê tin nhắn trong một hội thoại.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - MESSAGES_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/MessageListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageSize
                - nextCursor
                - hasNextPage
                properties:
                  type:
                    type: string
                    enum:
                    - cursor
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  nextCursor:
                    type: string
                    nullable: true
                  hasNextPage:
                    type: boolean
          example:
            statusCode: 200
            code: MESSAGES_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              conversationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              senderUserId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              senderName: Nguyễn Văn A
              senderType: user
              sequence: '42'
              clientMessageId: a95a1d13-f91c-4c71-9c61-24b498d0fd0e
              type: text
              content: Dạ em gửi ảnh vòi xịt ạ
              mediaId: null
              payload: null
              replyTo:
                id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                sequence: '41'
                senderName: Trần Thị B
                type: image
                contentPreview: Vòi xịt nhà tắm bị rỉ
                isUnavailable: false
              createdAt: '2026-09-23T11:30:00.000Z'
            pagination:
              type: cursor
              pageSize: 30
              nextCursor: null
              hasNextPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      x-apidog-name: Not Found
      description: Không tìm thấy tài nguyên được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [404]
              code:
                type: string
                enum:
                  - CONVERSATION_NOT_FOUND
                description: |-
                  - CONVERSATION_NOT_FOUND: Không tìm thấy hội thoại.
          examples:
            conversation_not_found:
              summary: CONVERSATION_NOT_FOUND — Không tìm thấy hội thoại.
              value:
                statusCode: 404
                code: CONVERSATION_NOT_FOUND
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - INVALID_CURSOR
                  - VALIDATION_FAILED
                description: |-
                  - INVALID_CURSOR: Con trỏ phân trang không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            invalid_cursor:
              summary: INVALID_CURSOR — Con trỏ phân trang không hợp lệ.
              value:
                statusCode: 422
                code: INVALID_CURSOR
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
  - Chat
  x-apidog-folder: Message
  x-apidog-status: released
  operationId: postMessages
  security:
    - BearerAuth: []
  summary: Send message
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as community-service
        participant Guard as JWT/access guards
        participant C as MessageController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: POST /api/v1/messages
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke postMessages
        C->>Bus: Execute command for postMessages
        Bus->>H: Dispatch command handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/MessageSendRequestDto
        example:
          conversationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          clientMessageId: a95a1d13-f91c-4c71-9c61-24b498d0fd0e
          type: text
          content: Dạ thợ mấy giờ qua kiểm được ạ
          mediaId: null
          replyToMessageId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
  responses:
    '201':
      description: 'Thành công: Gửi tin nhắn.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - MESSAGE_SENT
              data:
                $ref: ../../openapi.yaml#/components/schemas/MessageSendResponseDto
          example:
            statusCode: 201
            code: MESSAGE_SENT
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              conversationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              senderName: Nguyễn Văn A
              type: text
              content: Dạ thợ mấy giờ qua kiểm được ạ
              mediaId: null
              sequence: '43'
              clientMessageId: a95a1d13-f91c-4c71-9c61-24b498d0fd0e
              replyTo:
                id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                sequence: '41'
                senderName: Trần Thị B
                type: image
                contentPreview: Vòi xịt nhà tắm bị rỉ
                isUnavailable: false
              createdAt: '2026-09-23T11:38:00.000Z'
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/messages
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - MESSAGE_CONTENT_INVALID
                  - MESSAGE_REPLY_TARGET_INVALID
                  - VALIDATION_FAILED
                description: |-
                  - MESSAGE_CONTENT_INVALID: Nội dung tin nhắn không hợp lệ.
                  - MESSAGE_REPLY_TARGET_INVALID: Tin được trả lời không tồn tại, khác hội thoại, đã xóa hoặc là tin system.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            message_content_invalid:
              summary: MESSAGE_CONTENT_INVALID — Nội dung tin nhắn không hợp lệ.
              value:
                statusCode: 422
                code: MESSAGE_CONTENT_INVALID
            message_reply_target_invalid:
              summary: MESSAGE_REPLY_TARGET_INVALID — Tin được trả lời không hợp lệ.
              value:
                statusCode: 422
                code: MESSAGE_REPLY_TARGET_INVALID
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
