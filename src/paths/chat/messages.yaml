get:
  tags:
  - Chat
  x-apidog-folder: Message
  operationId: getMessages
  security:
    - BearerAuth: []
  summary: List messages
  description: |-
    tenant, landlord. Liệt kê tin nhắn trong một hội thoại. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 INVALID CURSOR · 404 CONVERSATION NOT FOUND.

    ### Sequence diagram — List messages

    Luồng theo kiến trúc microservice: community-service sở hữu nghiệp vụ và community_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as community-service
        participant D as PostgreSQL community_db
        C->>G: GET /api/v1/messages<br/>Query: filter, cursor, pageSize
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance community-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra query, header theo contract
        break query, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_QUERY_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc conversation/membership và messages theo cursor/pageSize
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (CONVERSATION_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor là thành viên#59; conversation tồn tại#59; cursor đúng hội thoại
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (INVALID_CURSOR / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Dựng trang tin nhắn theo cursor#59; không dùng offset pagination
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 MESSAGES_FETCHED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        conversationId:
          type: string
          format: uuid
  - name: cursor
    in: query
    description: Cursor opaque từ trang trước; bỏ qua ở trang đầu.
    schema:
      type: string
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 30
  responses:
    '200':
      description: 'Thành công: Liệt kê tin nhắn trong một hội thoại.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - MESSAGES_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/MessageListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageSize
                - nextCursor
                - hasNextPage
                properties:
                  type:
                    type: string
                    enum:
                    - cursor
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  nextCursor:
                    type: string
                    nullable: true
                  hasNextPage:
                    type: boolean
          example:
            statusCode: 200
            code: MESSAGES_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              conversationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              senderId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              type: text
              content: Dạ em gửi ảnh vòi xịt ạ
              createdAt: '2026-09-23T11:30:00.000Z'
            pagination:
              type: cursor
              pageSize: 30
              nextCursor: null
              hasNextPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      x-apidog-name: Not Found
      description: Không tìm thấy tài nguyên được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [404]
              code:
                type: string
                enum:
                  - CONVERSATION_NOT_FOUND
                description: |-
                  - CONVERSATION_NOT_FOUND: Không tìm thấy hội thoại.
          examples:
            conversation_not_found:
              summary: CONVERSATION_NOT_FOUND — Không tìm thấy hội thoại.
              value:
                statusCode: 404
                code: CONVERSATION_NOT_FOUND
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - INVALID_CURSOR
                  - VALIDATION_FAILED
                description: |-
                  - INVALID_CURSOR: Con trỏ phân trang không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            invalid_cursor:
              summary: INVALID_CURSOR — Con trỏ phân trang không hợp lệ.
              value:
                statusCode: 422
                code: INVALID_CURSOR
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
  - Chat
  x-apidog-folder: Message
  operationId: postMessages
  security:
    - BearerAuth: []
  summary: Send message
  description: |-
    tenant, landlord. Gửi tin nhắn. Lỗi nghiệp vụ: 403 FORBIDDEN · 409 CONVERSATION ARCHIVED · 422 MESSAGE CONTENT INVALID.

    ### Sequence diagram — Send message

    Luồng theo kiến trúc microservice: community-service sở hữu nghiệp vụ và community_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as community-service
        participant D as PostgreSQL community_db
        participant I as identity-service
        participant Z as Redis / Socket.io adapter
        C->>G: POST /api/v1/messages<br/>Body: conversationId, type, content, mediaId, mentions
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance community-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc conversation, membership và trạng thái archive
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        opt Có mediaId
            S->>I: Đọc metadata và quyền sử dụng tệp đính kèm
            I-->>S: Kết quả kiểm tra media
        end
        S->>S: Actor là thành viên#59; conversation chưa archived<br/>Validate type/content/mediaId và mentions theo DTO
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (CONVERSATION_ARCHIVED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (MESSAGE_CONTENT_INVALID / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Lưu message, senderId từ actor và message_mentions trong transaction
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 201 MESSAGE_SENT + data theo DTO<br/>Location: /api/v1/messages
        G-->>C: Chuyển tiếp status, body và header theo contract
        S->>Z: Phát message.posted sau commit, khóa theo messageId
        Z-->>C: Socket.io tới thành viên online có quyền
        Note over S,Z: Realtime best-effort#59; client có thể đọc lại message đã lưu qua GET /messages
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/MessageSendRequestDto
        example:
          conversationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          type: text
          content: Dạ thợ mấy giờ qua kiểm được ạ
          mediaId: null
  responses:
    '201':
      description: 'Thành công: Gửi tin nhắn.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - MESSAGE_SENT
              data:
                $ref: ../../openapi.yaml#/components/schemas/MessageSendResponseDto
          example:
            statusCode: 201
            code: MESSAGE_SENT
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              conversationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              type: text
              content: Dạ thợ mấy giờ qua kiểm được ạ
              createdAt: '2026-09-23T11:38:00.000Z'
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/messages
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - CONVERSATION_ARCHIVED
                description: |-
                  - CONVERSATION_ARCHIVED: Hội thoại đã được lưu trữ.
          examples:
            conversation_archived:
              summary: CONVERSATION_ARCHIVED — Hội thoại đã được lưu trữ.
              value:
                statusCode: 409
                code: CONVERSATION_ARCHIVED
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - MESSAGE_CONTENT_INVALID
                  - VALIDATION_FAILED
                description: |-
                  - MESSAGE_CONTENT_INVALID: Nội dung tin nhắn không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            message_content_invalid:
              summary: MESSAGE_CONTENT_INVALID — Nội dung tin nhắn không hợp lệ.
              value:
                statusCode: 422
                code: MESSAGE_CONTENT_INVALID
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
