get:
  tags:
  - Chat
  x-apidog-folder: Message
  operationId: getMessages
  security:
    - BearerAuth: []
  summary: List messages
  description: |-
    tenant, landlord. Liệt kê tin nhắn trong một hội thoại. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 INVALID CURSOR · 404 CONVERSATION NOT FOUND.

    ### Sequence diagram — List messages

    Luồng theo kiến trúc microservice: community-service sở hữu nghiệp vụ và community_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNq1Vk1v20YQ_SsD9iKjEuS4ziFqa4ARaVm1Ldkk7TSBAWFFrsSF-eUlqVYNcih6KIqiQI0ciqAoYCEIgn7BMVqgqHjIgUb-B_9JZ0nKkmL11FQHiuTO7M68efOGjyXTt6jUkEJ6FlPPpAojQ07cEw_wR-LI92K3T3nxHBAeMZMFxIugCSSEpsMo3lce0D7UYd_vM4eu3bZtCVv5oA0tEtHPyPi2hSYsdMpHzKSg0SELI77CTBdmpu-6sceicS0sHG7bKcLuwA-jIaf64d7cpWf1C-tmbWur1YCWakCdBKw-ulN3aRiSIQ0_6vP61mFM-bgBA-ZElFfBjHno43-ABjr7ojyyVW6STS89PINz6pCI-V6NWVU4ZVnylQsRJ8AxbXCYy6LCr88pOYXjN6-y5HkEQzT8kYGdTScejNNfYjCz6cu4MC2OwXOaDdjcuAcVo9vt7cudhz1NPTxSdUMv8aaetRTUMeVsMIZPHhi4XfLChH6WPMPL9Mob4ttdHUxi2nQxINk0EQKI_FPqQWSzbPo6rkJIMDY_m_5lihBfR0WgK6JbvwOVo458ZOx0tfYjVVkVmNYAAwHBiH6OgXlhRJBztysKNiVOZJcM0GpFStffZ8m36GxnyTc3zvO99QY07XiMqGP0IvgAuGB1GFUxm_RPzDtiHnyeTkx8zpIrs_pW0WCUXsCntZKHNUMAUeyvF_uvBPW9u_c-hDAeY5mBmJHPIcqSX8F0CHORBvOTY8yubYHl41reN2h3BcN0snzI7pw4Z4KFVYGGRXFbm6Kr7-GKucSkZTNRMDOdQmCnk6B-fY6geTZYomrDedn0EtTN9XWotDvH8l5b6SGjtIe9A1mT91VD1bCnZys7qqzkL-7Lyox6a7dJ8HYBAiTLcw8pkzxl4GTJD-wtUsyAJQ6zRJcMGHWsItMQ6emSal5ExqlV92LHIX2H1imKUo56ATTufs5KT2_opxcMFKOLyDMglsVEcYlzwP2AokLQ8OMBccIl4itZcon9mSVfx7N6XZ-nU_wrYpjxn6cX-K4fY9GRQlz0708rMd3YgEqOm2y0u53ettzeu-mH_wyXUnTCd6bgwojyMKcvypcQ6tBmQU7jmZqVrMn1q74sX0qtAH8x_TLT07zTz2IM54bB6W-u6Jvpi_Eidru3VvEeK-ANY9QyzIz7uCwSm7gwYviMnYIC93uwioubUGl2O8eqphfIdbpGb7t71FHeIdfkvEcdxAhV4QJbY8Qw0JxPi4AKcj0V1-mEFYs5hjNm4DHPMBuB14StAKQ0475Db0AtVsz0D0QWQ_9SoJNjtADYKlQ-gMp2V7vfVhS18y6AKOcPm5UFoxF5XpoYhC14gBRCeRMa95IIt8BnKFchifOmWphs1pw6_9IGMwFpHml6VwjI_9YXBZPFeMPISsn17Hw2L_RAXsqyElb6N179wSCkkRjtzMsrX2zZ8VGOfKQD6FVsuT1xKnh51YXqN0RpnT4xT_PjQpRkQRrTfvOK5AON4XeRJ0aoKPgajiAumukuym27g9rakfd6uqoh1XuqpiEyZzGB4eL30QzGDXTZV3Vdbql6b1s1mjuqAu8DyiUpEkOxm03B1fDhpIzisAp93xrn4rBqoEhVyaXcJczCz8HHJxIuuvREasCJZNEBiZ3oRHqCRnEghLr8TpQa2M-0KnE_HtpSI1fWqoTfYI98v1x88g_y6NiU)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as community-service
        participant D as PostgreSQL community_db
        C->>G: GET /api/v1/messages<br/>Query: filter, cursor, pageSize
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance community-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra query, header theo contract
        break query, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_QUERY_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc conversation/membership và messages theo cursor/pageSize
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (CONVERSATION_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor là thành viên#59; conversation tồn tại#59; cursor đúng hội thoại
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (INVALID_CURSOR / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Dựng trang tin nhắn theo cursor#59; không dùng offset pagination
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 MESSAGES_FETCHED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        conversationId:
          type: string
          format: uuid
  - name: cursor
    in: query
    description: Cursor opaque từ trang trước; bỏ qua ở trang đầu.
    schema:
      type: string
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 30
  responses:
    '200':
      description: 'Thành công: Liệt kê tin nhắn trong một hội thoại.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - MESSAGES_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/MessageListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageSize
                - nextCursor
                - hasNextPage
                properties:
                  type:
                    type: string
                    enum:
                    - cursor
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  nextCursor:
                    type: string
                    nullable: true
                  hasNextPage:
                    type: boolean
          example:
            statusCode: 200
            code: MESSAGES_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              conversationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              senderId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              type: text
              content: Dạ em gửi ảnh vòi xịt ạ
              createdAt: '2026-09-23T11:30:00.000Z'
            pagination:
              type: cursor
              pageSize: 30
              nextCursor: null
              hasNextPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      x-apidog-name: Not Found
      description: Không tìm thấy tài nguyên được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [404]
              code:
                type: string
                enum:
                  - CONVERSATION_NOT_FOUND
                description: |-
                  - CONVERSATION_NOT_FOUND: Không tìm thấy hội thoại.
          examples:
            conversation_not_found:
              summary: CONVERSATION_NOT_FOUND — Không tìm thấy hội thoại.
              value:
                statusCode: 404
                code: CONVERSATION_NOT_FOUND
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - INVALID_CURSOR
                  - VALIDATION_FAILED
                description: |-
                  - INVALID_CURSOR: Con trỏ phân trang không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            invalid_cursor:
              summary: INVALID_CURSOR — Con trỏ phân trang không hợp lệ.
              value:
                statusCode: 422
                code: INVALID_CURSOR
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
