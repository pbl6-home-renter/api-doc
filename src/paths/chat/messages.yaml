    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as community-service
        participant D as PostgreSQL community_db
        participant I as identity-service
        participant Z as Redis / Socket.io adapter
        C->>G: POST /api/v1/messages<br/>Body: conversationId, type, content, mediaId, mentions
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance community-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc conversation, membership và trạng thái archive
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        opt Có mediaId
            S->>I: Đọc metadata và quyền sử dụng tệp đính kèm
            I-->>S: Kết quả kiểm tra media
        end
        S->>S: Actor là thành viên#59; conversation chưa archived<br/>Validate type/content/mediaId và mentions theo DTO
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (CONVERSATION_ARCHIVED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (MESSAGE_CONTENT_INVALID / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Lưu message, senderId từ actor và message_mentions trong transaction
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 201 MESSAGE_SENT + data theo DTO<br/>Location: /api/v1/messages
        G-->>C: Chuyển tiếp status, body và header theo contract
        S->>Z: Phát message.posted sau commit, khóa theo messageId
        Z-->>C: Socket.io tới thành viên online có quyền
        Note over S,Z: Realtime best-effort#59; client có thể đọc lại message đã lưu qua GET /messages
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/MessageSendRequestDto
        example:
          conversationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          type: text
          content: Dạ thợ mấy giờ qua kiểm được ạ
          mediaId: null
  responses:
    '201':
      description: 'Thành công: Gửi tin nhắn.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - MESSAGE_SENT
              data:
                $ref: ../../openapi.yaml#/components/schemas/MessageSendResponseDto
          example:
            statusCode: 201
            code: MESSAGE_SENT
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              conversationId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              type: text
              content: Dạ thợ mấy giờ qua kiểm được ạ
              createdAt: '2026-09-23T11:38:00.000Z'
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/messages
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - CONVERSATION_ARCHIVED
                description: |-
                  - CONVERSATION_ARCHIVED: Hội thoại đã được lưu trữ.
          examples:
            conversation_archived:
              summary: CONVERSATION_ARCHIVED — Hội thoại đã được lưu trữ.
              value:
                statusCode: 409
                code: CONVERSATION_ARCHIVED
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - MESSAGE_CONTENT_INVALID
                  - VALIDATION_FAILED
