parameters:
  - name: conversationId
    in: path
    required: true
    schema: { type: string, format: uuid }
post:
  tags: [Chat]
  x-apidog-status: designing
  operationId: sendBotReminder
  security: [{ BearerAuth: [] }]
  summary: Gửi bot reminder theo mẫu
  description: |-
    Landlord chủ động gửi trong hội thoại có context hợp đồng. Người gửi phải là thành viên active và có quyền sở hữu resource theo Tenancy; ID hợp đồng của resource phải khớp context. Chỉ nhận hóa đơn `issued` hoặc hợp đồng `active`; thông báo hóa đơn không khẳng định trạng thái thanh toán. OCR chưa được hỗ trợ. `clientMessageId` dùng lại cho cùng yêu cầu sẽ trả tin đã lưu; dùng lại với nội dung khác bị từ chối. Khi Tenancy lỗi không tạo tin mới. Lưu history trước Socket và push theo cài đặt chat; không có scheduler.

    ```mermaid
    sequenceDiagram
      actor Landlord
      participant C as Community
      participant T as Tenancy
      Landlord->>C: POST /conversations/{id}/bot-reminders
      C->>C: Kiểm tra role và thành viên active
      C->>T: GET /api/v1/invoices/{id} hoặc /api/v1/contracts/{id} (Bearer)
      T-->>C: Resource đã kiểm tra quyền sở hữu
      C->>C: Kiểm tra context, lưu snapshot và idempotency
      C-->>Landlord: Socket và push theo preference
      C-->>Landlord: 201 BOT_REMINDER_SENT
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required: [templateType, resourceId, clientMessageId]
          properties:
            templateType:
              type: string
              enum: [invoice, contract_expiring]
              description: Mẫu nội dung cần đăng.
            resourceId:
              type: string
              format: uuid
              description: ID invoice hoặc contract tương ứng với templateType.
            clientMessageId:
              type: string
              format: uuid
              description: Idempotency key để retry không tạo bot message trùng.
        example:
          templateType: invoice
          resourceId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          clientMessageId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
  responses:
    '201':
      description: Bot message được lưu và gửi.
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [201] }
              code: { type: string, enum: [BOT_REMINDER_SENT] }
              data: { $ref: ../../openapi.yaml#/components/schemas/MessageSendResponseDto }
    '401': { $ref: ../../openapi.yaml#/components/responses/UnauthorizedError }
    '403': { $ref: ../../openapi.yaml#/components/responses/ForbiddenError }
    '404': { $ref: ../../openapi.yaml#/components/responses/NotFoundError }
    '422': { $ref: ../../openapi.yaml#/components/responses/ValidationError }
    '500': { $ref: ../../openapi.yaml#/components/responses/InternalServerError }
    '503':
      description: SERVICE_UNAVAILABLE — Tenancy không thể đáp ứng, không tạo tin mới.
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [503] }
              code: { type: string, enum: [SERVICE_UNAVAILABLE] }
