  description: |-
    Chỉ admin; yêu cầu access token. Sửa name và phone theo UserUpdateRequestDto; không thay đổi role hoặc status.

    ### Sequence diagram — Update user

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNrFV1trG0cU_isH9UWmUhW7TiFqG5C1iq3Y3pVWknPBIEa7Y-3g3R11L0pEyEPJQymhUBNKKSUQE0zoJTghhVKJkgcZ_w_9k56ZWckrS-5LA_WDLO2cM-fyfeeyjzIWt2mmmAnpVzH1Laox0g2It-8D_pE44n7sdWigfvdIEDGL9YgfQRlICGWXUfyevUM7UIBd3mEuXVmU3RSypVoVNklEH5DBooQpJBo06DOLgkm7LIyCJWINIcZstMmiQT5U8otimhCr8TDqBrRR35lptO3OorAhhI046vCH8IAHhzSA7FRhSSx1IW6STodFu_XFY10cR9QnvvUvDuqXPUw0Zg6W8zdvbhahVmqWt6BAeqzQXy3EeF9YeCT-Ve3HX3SCws0Nbg-K4BOP5qDncD-xtanUNyfDUx8sHgTUJRHjfp7ZOThkk9ETD6KAQIB4gMs8Fim9TkDJIeydv5mMXkbQRcGfGTiT4bEPg_GvMViT4atYiSozaKdchPW1G5BtGkZ7t6Tfa5uVeqvSaDaS5FHfnnNqjwbsYAC37zTxutGJBZ3J6Cf8GL71u_h0uwEWsRyadqhkWTTEtPJD6kPksMnwfZyDkKBvfDL80xIuvo-Uo0u8u7YK2ZZeajW3DLN6v6Itc8wsQhMTgh79EgPzwwjhoAtUA4cSN3ISZpp5FdHZ95PRU9R1JqNvZ7oXVzeKUHbiASYdnRe-9yAQ1RZGOQxm_AeGHTEfHo6PLfw9Gb21cpcwg_74BdzNJ_WRb4o8qPsb6v6lOf3o-o3PIYwHiDIQK-IBRJPRb2C5hHnIggvLilBgczyT9Yxyb6E7Pp43sn3Bm9sNQy90kHvIOhI5OZEXGwsncihewn2UseYodZWCwNAaD5G74-Ne4ewIE-k7YAsgu1NwE8DlHSDuEGQ5jaATY5DWBd6NBI71a9cgW9X3SjtVrS2VCjD9mXCzvWFo91KPsc628MMs7VaaFTN1sFUpafLBRmmmvLJIscv49pCKL30k5OgZA3cy-pFdotwUN-IyW9TgAaOurdIXIvk9kpMcYQG1C37suqTj0gLFXixBVTji7Ucs0fS7fPyCgdY0EFgGxLaZ4A5xawHvUWw8NPzygLhhQkudo03eRwAa0yaj2IsF_roHPrr_OkquPjuS7cCC7mT0mkn76gA59hQ49g7ZKE7RhxibhJ-GXRPPXTz9Jp4S7uxoPMR_KsopxMH4BT5TgCLBhMHnfncJtGtrkJXIlJpVQ2_fKlV3ZvX8nwHRVCl_Z8mKkM3OhxCjJkpGyyvU0lElARzKBvRVjFZmlTX-3RP1PDwZpFOyvXCK3xG6JHsYPcdj4e-xB32Gv7GCJSzLmL4OWbPSMFpmudLWjWb7ltHStQ9I0JLsGy62H2J7zJfoz4CcjH5gEHCXTrOAnS-KwyXRJqCnZZNbrPE7TBv69rUIXSYglY1lIX8K2VuGuVHVtIr-ISJNZh6b5hy9wQIbnlrohCNA7kEfe6porK-IUOtxhj0yJLEstdQ0tS948T9Qd6OyWdWFH36IzReLf-60nC5ssS_-SWFeMGY5dwx1GtHleUEBGbW22q9oWLeE8t7rgsdJYYrCeuJBKiOXP_gAXeXIh3x-8I7hC4t8gV4iQWmcTSwTJWbEvxW96oIyOpy0QgaZuQJVHepSSM8hw3uaRGdaGAVlo1WRJ2eggwRQFHTESJtFqpJFZqsOJ6I1ROZG9nos8p3zy1Yp9Pdy1dmzp2uVQU_FNfVMZK5e2liGwEXLzHyG5RTMZzUsOCVk8SzF1seGqiz-iTqAQU379gNcTNZ118rH4WQiA7kLZTz-QyKOoRZuOL46P9DEbs0f1MEfYzNj0gsRvtZx6jkEpn8kaZKeIko7lMwOOukynKZSSXwbeh-5wnh4__ATHtbN0)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        participant O as Outbox worker (identity)
        participant Q as RabbitMQ
        participant N as tenancy-service
        participant ND as PostgreSQL tenancy_db
        C->>G: PATCH /api/v1/users/{userId}<br/>Body: name, phone
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, path, header theo contract
        break JSON/body, path, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        Note over S: PATCH chỉ cập nhật field được gửi#59; field bị omit giữ nguyên
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc user cần sửa
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor là admin#59; không đổi role hoặc status
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Cập nhật name và phone được gửi
        S->>D: INSERT outbox (user.updated) cùng transaction
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 USER_UPDATED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
        Note over O,ND: Xử lý bất đồng bộ sau commit#59; HTTP không chờ consumer hoàn tất
        O->>D: Đọc công việc chưa gửi trong outbox
        D-->>O: user.updated
        Note over O,Q: Event có eventId, occurredAt, schemaVersion, correlationId
        O->>Q: Publish user.updated
        Q-->>O: Publisher confirm
        O->>D: Xóa/đánh dấu bản ghi đã gửi
        Q-->>N: Deliver user.updated (at-least-once)
        N->>ND: UPSERT dữ liệu hiển thị theo userId#59; chỉ áp dụng phiên bản mới hơn
        ND-->>N: Dữ liệu đã commit
        N-->>Q: ACK
        Note over O,Q: Broker lỗi: giữ outbox để gửi lại#59; consumer lỗi: retry 1s / 4s / 16s rồi DLQ
    ```
  parameters:
  - name: userId
    in: path
    required: true
    description: UUID của người dùng.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/UserUpdateRequestDto
        example:
          name: Nguyễn Văn An
          phone: '0901234567'
  responses:
    '200':
      description: User updated
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserUpdateResponseDto
          example:
            statusCode: 200
            code: USER_UPDATED
            data:
              userId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Nguyễn Văn An
              phone: '0901234567'
              status: active
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
delete:
