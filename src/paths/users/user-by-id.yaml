get:
  tags:
  - User
  x-apidog-folder: User
  operationId: getUserById
  security:
    - BearerAuth: []
  summary: Get user
  description: |-
    Chỉ admin; yêu cầu access token. Đọc hồ sơ và tổng quan vận hành của một người dùng.

    ### Sequence diagram — Get user

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        participant T as tenancy-service
        C->>G: GET /api/v1/users/{userId}
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra path, header theo contract
        break path, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc user theo userId
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor là admin#59; chỉ công bố hồ sơ theo DTO
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>T: Đọc tổng quan vận hành của user (service token, correlation-id)
        T-->>S: Tổng hợp tài sản/hợp đồng theo contract
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 USER_FETCHED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: userId
    in: path
    required: true
    description: UUID của người dùng.
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: User fetched
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserDetailResponseDto
          example:
            statusCode: 200
            code: USER_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Lê Văn An
              phone: '0901234567'
              email: lan@example.com
              role: tenant
              status: active
              identityVerified: false
              buildingCount: 0
              activeContractCount: 1
              createdAt: '2026-09-01T08:00:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
patch:
  tags:
  - User
  x-apidog-folder: User
  operationId: updateUserById
  security:
    - BearerAuth: []
  summary: Update user
  description: |-
    Chỉ admin; yêu cầu access token. Sửa name và phone theo UserUpdateRequestDto; không thay đổi role hoặc status.

    ### Sequence diagram — Update user

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        participant O as Outbox worker (identity)
        participant Q as RabbitMQ
        participant N as tenancy-service
        participant ND as PostgreSQL tenancy_db
        C->>G: PATCH /api/v1/users/{userId}<br/>Body: name, phone
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, path, header theo contract
        break JSON/body, path, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        Note over S: PATCH chỉ cập nhật field được gửi#59; field bị omit giữ nguyên
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc user cần sửa
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor là admin#59; không đổi role hoặc status
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Cập nhật name và phone được gửi
        S->>D: INSERT outbox (user.updated) cùng transaction
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 USER_UPDATED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
        Note over O,ND: Xử lý bất đồng bộ sau commit#59; HTTP không chờ consumer hoàn tất
        O->>D: Đọc công việc chưa gửi trong outbox
        D-->>O: user.updated
        Note over O,Q: Event có eventId, occurredAt, schemaVersion, correlationId
        O->>Q: Publish user.updated
        Q-->>O: Publisher confirm
        O->>D: Xóa/đánh dấu bản ghi đã gửi
        Q-->>N: Deliver user.updated (at-least-once)
        N->>ND: UPSERT dữ liệu hiển thị theo userId#59; chỉ áp dụng phiên bản mới hơn
        ND-->>N: Dữ liệu đã commit
        N-->>Q: ACK
        Note over O,Q: Broker lỗi: giữ outbox để gửi lại#59; consumer lỗi: retry 1s / 4s / 16s rồi DLQ
    ```
  parameters:
  - name: userId
    in: path
    required: true
    description: UUID của người dùng.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/UserUpdateRequestDto
        example:
          name: Nguyễn Văn An
          phone: '0901234567'
  responses:
    '200':
      description: User updated
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserUpdateResponseDto
          example:
            statusCode: 200
            code: USER_UPDATED
            data:
              userId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Nguyễn Văn An
              phone: '0901234567'
              status: active
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
delete:
  tags:
  - User
  x-apidog-folder: User
  operationId: deleteUserById
  security:
    - BearerAuth: []
  summary: Delete user
  description: |-
    Chỉ admin; yêu cầu access token. Xóa mềm người dùng và các bản ghi con vận hành. Giữ chứng từ tài chính, pháp lý và audit.

    ### Sequence diagram — Delete user

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        participant O as Outbox worker (identity)
        participant Q as RabbitMQ
        participant N as tenancy-service
        participant ND as PostgreSQL tenancy_db
        C->>G: DELETE /api/v1/users/{userId}
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra path, header theo contract
        break path, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc user, trạng thái xóa và bản ghi con do identity sở hữu
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor là admin#59; không xóa lại user đã xóa mềm
        Note over S,D: Giữ chứng từ tài chính, pháp lý và audit#59; bản ghi ở service khác xử lý qua event, không JOIN/DELETE xuyên database
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (USER_ALREADY_DELETED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Xóa mềm user, thu hồi phiên và xóa mềm bản ghi con vận hành trong identity_db
        S->>D: Lưu công việc đồng bộ bền vững cùng transaction
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 204 No Content#59; không JSON body
        G-->>C: Chuyển tiếp status, body và header theo contract
        Note over O,ND: Xử lý bất đồng bộ sau commit#59; HTTP không chờ consumer hoàn tất
        O->>D: Đọc công việc chưa gửi trong outbox
        D-->>O: Công việc đồng bộ vòng đời user
        Note over O,Q: Event có eventId, occurredAt, schemaVersion, correlationId
        O->>Q: Publish Công việc đồng bộ vòng đời user
        Q-->>O: Publisher confirm
        O->>D: Xóa/đánh dấu bản ghi đã gửi
        Q-->>N: Deliver Công việc đồng bộ vòng đời user (at-least-once)
        N->>ND: Đồng bộ xóa mềm các bản ghi vận hành của user, giữ chứng từ tài chính/pháp lý
        ND-->>N: Dữ liệu đã commit
        N-->>Q: ACK
        Note over O,Q: Broker lỗi: giữ outbox để gửi lại#59; consumer lỗi: retry 1s / 4s / 16s rồi DLQ
    ```
  parameters:
  - name: userId
    in: path
    required: true
    description: UUID của người dùng.
    schema:
      type: string
      format: uuid
  responses:
    '204':
      $ref: ../../openapi.yaml#/components/responses/NoContentResponse
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Người dùng đã bị xóa mềm.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - USER_ALREADY_DELETED
                description: |-
                  - USER_ALREADY_DELETED: Tài khoản đã được xóa mềm trước đó.
          examples:
            user_already_deleted:
              summary: USER_ALREADY_DELETED — Tài khoản đã được xóa mềm trước đó.
              value:
                statusCode: 409
                code: USER_ALREADY_DELETED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
