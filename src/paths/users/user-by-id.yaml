  summary: Get user
  description: |-
    Chỉ admin; yêu cầu access token. Đọc hồ sơ và tổng quan vận hành của một người dùng.

    ### Sequence diagram — Get user

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNqtVl1r40YU_SsX9cWhNs5usw_rwoLXUhI3iZ2V5Gy7BMx4NLGGSCOvNHJrQh5KH0ophYallNKXmLAs_WI3tFCwHvbBIf9D_6R3NHY-bPdt_SBbmjNzzz333GudGDTymFEzEvYyZYIyk5N-TMJDAfghqYxEGvZYrO8HJJac8gEREhpAEmgEnOHv0nPWgyrsRT0esLVl7JbC1vebsEUk-5KMlhG2QjgsHnLKwGZ9nsh4BcxRMO5hTC5HlUTjl2Gmgu1HiezHzHm2e7Oj6_WWwa4CSyaIoAtHNipPnmzVYMtyoUoGvDp8UE0RkFRP1FfTO9WwrRksn7wVQKM4ZgGRPBIV7pXhmOfZNyHImECMyUPAQy71vl7MyDEcXL_LswsJfQT-ysHPJ2MBo-nvKdB88ibVUB0G4zRqsPHwMZTcdru7V2990bWtZx3LcZ2Z6kx490gdsJgfjeCz5y4el72m0MuzX_AyuRR9fLrjACXUZ3cJ1SllCSoSHTMB0uf55H1ahoQgtyif_EsVxfdSE13Bbv0BlDqtesfdbtvNF5a5iphdAxcFQUa_pcBFIlF7tlRX8BkJpD-zgV3RGV39mGff414_z7672Xt7tFODhp-OUHQkr7gPIFbWTmQZk5n-g2lLLuCr6ZjifZ5d0vJCzWA4PYfPKzMzVlylgz7f0eev1PSjR48_hSQdYZWBUBnFIPPsD6AB4SG64Daytg54Ea4VzYO4S-hPx_eD7Nz6ZkCkX1ZieAxP9RnujAQu0Hs-uodS1aLTCQz86XhQvTpDyYQPnipZ_7ZmzkzSjfV1KDVbB_Xdptndr7vbeLHre5Zr2djV84Vtq24WD57Wzbnt1pYNsKj-AI1yIdAu2SsOQZ79zBcMoRI2dV1_oIU8OkktlMaYFa2KmWdvsYXy7Nt07sbjwo0vU4xyI_P0z1AVd_J6dFehnaVV_H3OQfRT7DckHEe4rPiOQxhyvMdyYhP-NVgl2QaUbMtpd-yG1W213e5mu9MyP5QemGq9MFGAXiReyEXhL216WqSBpjsrToHkeqwVM932inyvzqYT_IqjgN1oplfo9G8UDtl9rZIvJLijx6qkP4HSZtt-2jRNq_WhcnVvao-d8BPSepkSAUPUHXdOz9G32GVviHZGaT4bivG02LozSu7MLa4-D8NfDHRqieJT1Q9UV7xSfljuqFaEkzoaYjynjNbcVcxBYJfzotdrSsygR-ix6k-R4D6Mj9W5foeDKQpxwkNJqLmpJF7DwRMrdz7CNmu2sKla9d2uY9kHlt21bLttq4yhf_evca74Q9zSQWh303Ib25YJH4NHJFko9__Jj7NRpkkZepE3KqbaqhlilI2QxSHhHr4FnBwauBiyQ6MGh4bHjkgayEPjFEHpACPPXw-MGjYHKxtxlPZ9o3ZEggTv8O_0RRTNFk__A_8lFPk)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        participant T as tenancy-service
        C->>G: GET /api/v1/users/{userId}
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra path, header theo contract
        break path, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc user theo userId
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor là admin#59; chỉ công bố hồ sơ theo DTO
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>T: Đọc tổng quan vận hành của user (service token, correlation-id)
        T-->>S: Tổng hợp tài sản/hợp đồng theo contract
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 USER_FETCHED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: userId
    in: path
    required: true
    description: UUID của người dùng.
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: User fetched
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserDetailResponseDto
          example:
            statusCode: 200
            code: USER_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Lê Văn An
              phone: '0901234567'
              email: lan@example.com
              role: tenant
              status: active
              identityVerified: false
              buildingCount: 0
              activeContractCount: 1
              createdAt: '2026-09-01T08:00:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
patch:
  tags:
  - User
  x-apidog-folder: User
  operationId: updateUserById
