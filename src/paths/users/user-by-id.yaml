get:
  tags:
  - User
  x-apidog-folder: User
  x-apidog-status: released
  operationId: getUserById
  security:
  - BearerAuth: []
  summary: Get user
  description: |-
    Chỉ admin. Lấy chi tiết tài khoản, thông tin khóa, payoutAccount đã mask và số lượng tòa nhà/hợp đồng.

    **Lưu ý**

    - `buildingCount`, `activeContractCount` lấy từ Tenancy qua HTTP nội bộ; Tenancy lỗi hoặc timeout thì trả `null`.
    - Chưa triển khai: code đang trả cố định `0`; Tenancy cần build `GET /internal/users/{userId}/stats`.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant ID as Identity
        participant DB as Identity DB
        participant TEN as Tenancy

        GW->>ID: GET /users/{userId}
        ID->>DB: Đọc users + landlord_profiles theo userId
        alt Không tìm thấy
            ID-->>GW: 404 USER_NOT_FOUND
        end
        ID->>TEN: GET /internal/users/{userId}/stats (service token, timeout 3s)
        alt Tenancy trả kết quả
            TEN-->>ID: 200 {buildingCount, activeContractCount}
        else Tenancy lỗi / timeout
            ID->>ID: buildingCount = null, activeContractCount = null
        end
        ID-->>GW: 200 USER_DETAIL_FETCHED {..., lockReason, lockedAt, payoutAccount, buildingCount, activeContractCount}
    ```
  parameters:
  - name: userId
    in: path
    required: true
    description: UUID của người dùng.
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: User fetched
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_DETAIL_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserDetailResponseDto
          example:
            statusCode: 200
            code: USER_DETAIL_FETCHED
            data:
              id: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
              name: Lê Văn An
              phone: '0901234567'
              email: lan@example.com
              role: tenant
              status: active
              buildingCount: 0
              activeContractCount: 1
              lockReason: null
              lockedAt: null
              payoutAccount: null
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - BAD_REQUEST
          examples:
            error_1:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
    '401':
      description: Không xác thực được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 401
              code:
                type: string
                enum:
                - UNAUTHORIZED
          examples:
            error_1:
              summary: UNAUTHORIZED
              value:
                statusCode: 401
                code: UNAUTHORIZED
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      description: Không tìm thấy người dùng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - USER_NOT_FOUND
          examples:
            error_1:
              summary: USER_NOT_FOUND
              value:
                statusCode: 404
                code: USER_NOT_FOUND
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
patch:
  tags:
  - User
  x-apidog-folder: User
  x-apidog-status: released
  operationId: updateUserById
  security:
  - BearerAuth: []
  summary: Update user
  description: |-
    Chỉ admin. Cập nhật ít nhất một trong name hoặc phone; null được bỏ qua.

    **Lưu ý**

    - Không đổi được `email`, `role`, `status` qua API này; khóa/mở khóa dùng API lock/unlock.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant ID as Identity
        participant DB as Identity DB
        participant MQ as RabbitMQ
        participant TEN as Tenancy
        participant COM as Community

        GW->>ID: PATCH /users/{userId} {name?, phone?}
        ID->>DB: Đọc user, kiểm tra phone trùng
        alt Không tìm thấy
            ID-->>GW: 404 USER_NOT_FOUND
        else Trùng phone
            ID-->>GW: 409 DUPLICATE_PHONE
        end
        ID->>DB: [Transaction] Update users (name, phone)<br/>+ outbox user.updated
        ID-->>GW: 200 USER_UPDATED {userId, name, phone, email, status}
        ID-)MQ: user.updated {userId, name, phone}
        MQ-)TEN: Cập nhật user snapshot
        MQ-)COM: Cập nhật user snapshot
    ```
  parameters:
  - name: userId
    in: path
    required: true
    description: UUID của người dùng.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/UserUpdateRequestDto
        example:
          name: Nguyễn Văn An
          phone: '0901234567'
  responses:
    '200':
      description: User updated
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserUpdateResponseDto
          example:
            statusCode: 200
            code: USER_UPDATED
            data:
              userId: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
              name: Nguyễn Văn An
              phone: '0901234567'
              status: active
              email: lan@example.com
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - INVALID_JSON
                - INVALID_REQUEST_BODY
                - BAD_REQUEST
          examples:
            error_1:
              summary: INVALID_JSON
              value:
                statusCode: 400
                code: INVALID_JSON
            error_2:
              summary: INVALID_REQUEST_BODY
              value:
                statusCode: 400
                code: INVALID_REQUEST_BODY
            error_3:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
    '401':
      description: Không xác thực được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 401
              code:
                type: string
                enum:
                - UNAUTHORIZED
          examples:
            error_1:
              summary: UNAUTHORIZED
              value:
                statusCode: 401
                code: UNAUTHORIZED
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      description: Không tìm thấy người dùng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - USER_NOT_FOUND
          examples:
            error_1:
              summary: USER_NOT_FOUND
              value:
                statusCode: 404
                code: USER_NOT_FOUND
    '409':
      description: Xung đột dữ liệu hoặc trạng thái.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 409
              code:
                type: string
                enum:
                - DUPLICATE_PHONE
          examples:
            error_1:
              summary: DUPLICATE_PHONE
              value:
                statusCode: 409
                code: DUPLICATE_PHONE
    '422':
      description: Vi phạm ràng buộc dữ liệu; trả mã của lỗi đầu tiên.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - NAME_REQUIRED
                - NAME_MUST_BE_STRING
                - NAME_NOT_EMPTY
                - NAME_INVALID_LENGTH
                - PHONE_REQUIRED
                - PHONE_MUST_BE_STRING
                - PHONE_NOT_EMPTY
                - PHONE_INVALID_FORMAT
                - USER_UPDATE_PAYLOAD_REQUIRED
                - VALIDATION_FAILED
          examples:
            error_1:
              summary: NAME_REQUIRED
              value:
                statusCode: 422
                code: NAME_REQUIRED
            error_2:
              summary: NAME_MUST_BE_STRING
              value:
                statusCode: 422
                code: NAME_MUST_BE_STRING
            error_3:
              summary: NAME_NOT_EMPTY
              value:
                statusCode: 422
                code: NAME_NOT_EMPTY
            error_4:
              summary: NAME_INVALID_LENGTH
              value:
                statusCode: 422
                code: NAME_INVALID_LENGTH
            error_5:
              summary: PHONE_REQUIRED
              value:
                statusCode: 422
                code: PHONE_REQUIRED
            error_6:
              summary: PHONE_MUST_BE_STRING
              value:
                statusCode: 422
                code: PHONE_MUST_BE_STRING
            error_7:
              summary: PHONE_NOT_EMPTY
              value:
                statusCode: 422
                code: PHONE_NOT_EMPTY
            error_8:
              summary: PHONE_INVALID_FORMAT
              value:
                statusCode: 422
                code: PHONE_INVALID_FORMAT
            error_9:
              summary: USER_UPDATE_PAYLOAD_REQUIRED
              value:
                statusCode: 422
                code: USER_UPDATE_PAYLOAD_REQUIRED
            error_10:
              summary: VALIDATION_FAILED
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
delete:
  tags:
  - User
  x-apidog-folder: User
  x-apidog-status: released
  operationId: deleteUserById
  security:
  - BearerAuth: []
  summary: Delete user
  description: |-
    Chỉ admin. Xóa mềm tài khoản; không thể tự xóa. Thành công trả 204, không có body.

    **Lưu ý**

    - Xóa mềm (`is_deleted = true`); user đã xóa không đăng nhập được.
    - Không xóa được user còn HĐ hiệu lực. Không hỏi được Tenancy thì từ chối xóa (`503`, fail-closed).
    - Chưa triển khai: kiểm tra qua Tenancy, mã `409 USER_DELETE_HAS_ACTIVE_CONTRACT`, `503 SERVICE_UNAVAILABLE`.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant ID as Identity
        participant DB as Identity DB
        participant MQ as RabbitMQ
        participant TEN as Tenancy
        participant COM as Community

        GW->>ID: DELETE /users/{userId} + Authorization (admin)
        alt Admin tự xóa chính mình
            ID-->>GW: 400 USER_DELETE_CANNOT_SELF
        end
        ID->>DB: Đọc user
        alt Không tìm thấy
            ID-->>GW: 404 USER_NOT_FOUND
        else Đã bị xóa
            ID-->>GW: 409 USER_DELETE_ALREADY_DELETED
        end
        ID->>TEN: GET /internal/users/{userId}/stats (service token, timeout 3s)
        alt Tenancy lỗi / timeout (fail-closed)
            ID-->>GW: 503 SERVICE_UNAVAILABLE
        end
        TEN-->>ID: 200 {buildingCount, activeContractCount}
        alt activeContractCount > 0
            ID-->>GW: 409 USER_DELETE_HAS_ACTIVE_CONTRACT
        end
        ID->>DB: [Transaction] Soft delete users (is_deleted=true) + landlord_profiles<br/>+ revoke toàn bộ refresh_tokens<br/>+ outbox user.deleted
        ID-->>GW: 204
        ID-)MQ: user.deleted {userId, role}
        MQ-)TEN: Ẩn user, không cho gán vào HĐ mới
        MQ-)COM: Ngắt socket, xóa push devices
    ```
  parameters:
  - name: userId
    in: path
    required: true
    description: UUID của người dùng.
    schema:
      type: string
      format: uuid
  responses:
    '204':
      $ref: ../../openapi.yaml#/components/responses/NoContentResponse
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - BAD_REQUEST
                - USER_DELETE_CANNOT_SELF
          examples:
            error_1:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
            error_2:
              summary: USER_DELETE_CANNOT_SELF
              value:
                statusCode: 400
                code: USER_DELETE_CANNOT_SELF
    '401':
      description: Không xác thực được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 401
              code:
                type: string
                enum:
                - UNAUTHORIZED
          examples:
            error_1:
              summary: UNAUTHORIZED
              value:
                statusCode: 401
                code: UNAUTHORIZED
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      description: Không tìm thấy người dùng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - USER_NOT_FOUND
          examples:
            error_1:
              summary: USER_NOT_FOUND
              value:
                statusCode: 404
                code: USER_NOT_FOUND
    '409':
      description: Xung đột dữ liệu hoặc trạng thái.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 409
              code:
                type: string
                enum:
                - USER_DELETE_ALREADY_DELETED
          examples:
            error_1:
              summary: USER_DELETE_ALREADY_DELETED
              value:
                statusCode: 409
                code: USER_DELETE_ALREADY_DELETED
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
