get:
  tags:
  - User
  x-apidog-folder: User
  operationId: getUserById
  security:
  - BearerAuth: []
  summary: Get user
  description: Chỉ admin. Lấy chi tiết tài khoản, thông tin khóa, payoutAccount đã mask và số lượng tòa nhà/hợp
    đồng.
  parameters:
  - name: userId
    in: path
    required: true
    description: UUID của người dùng.
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: User fetched
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_DETAIL_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserDetailResponseDto
          example:
            statusCode: 200
            code: USER_DETAIL_FETCHED
            data:
              id: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
              name: Lê Văn An
              phone: '0901234567'
              email: lan@example.com
              role: tenant
              status: active
              buildingCount: 0
              activeContractCount: 1
              lockReason: null
              lockedAt: null
              payoutAccount: null
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - BAD_REQUEST
          examples:
            error_1:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
    '401':
      description: Không xác thực được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 401
              code:
                type: string
                enum:
                - UNAUTHORIZED
          examples:
            error_1:
              summary: UNAUTHORIZED
              value:
                statusCode: 401
                code: UNAUTHORIZED
    '403':
      description: Không có quyền truy cập.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 403
              code:
                type: string
                enum:
                - FORBIDDEN
          examples:
            error_1:
              summary: FORBIDDEN
              value:
                statusCode: 403
                code: FORBIDDEN
    '404':
      description: Không tìm thấy người dùng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - USER_NOT_FOUND
          examples:
            error_1:
              summary: USER_NOT_FOUND
              value:
                statusCode: 404
                code: USER_NOT_FOUND
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
patch:
  tags:
  - User
  x-apidog-folder: User
  operationId: updateUserById
  security:
  - BearerAuth: []
  summary: Update user
  description: Chỉ admin. Cập nhật ít nhất một trong name hoặc phone; null được bỏ qua.
  parameters:
  - name: userId
    in: path
    required: true
    description: UUID của người dùng.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/UserUpdateRequestDto
        example:
          name: Nguyễn Văn An
          phone: '0901234567'
  responses:
    '200':
      description: User updated
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserUpdateResponseDto
          example:
            statusCode: 200
            code: USER_UPDATED
            data:
              userId: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
              name: Nguyễn Văn An
              phone: '0901234567'
              status: active
              email: lan@example.com
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - INVALID_JSON
                - INVALID_REQUEST_BODY
                - BAD_REQUEST
          examples:
            error_1:
              summary: INVALID_JSON
              value:
                statusCode: 400
                code: INVALID_JSON
            error_2:
              summary: INVALID_REQUEST_BODY
              value:
                statusCode: 400
                code: INVALID_REQUEST_BODY
            error_3:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
    '401':
      description: Không xác thực được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 401
              code:
                type: string
                enum:
                - UNAUTHORIZED
          examples:
            error_1:
              summary: UNAUTHORIZED
              value:
                statusCode: 401
                code: UNAUTHORIZED
    '403':
      description: Không có quyền truy cập.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 403
              code:
                type: string
                enum:
                - FORBIDDEN
          examples:
            error_1:
              summary: FORBIDDEN
              value:
                statusCode: 403
                code: FORBIDDEN
    '404':
      description: Không tìm thấy người dùng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - USER_NOT_FOUND
          examples:
            error_1:
              summary: USER_NOT_FOUND
              value:
                statusCode: 404
                code: USER_NOT_FOUND
    '409':
      description: Xung đột dữ liệu hoặc trạng thái.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 409
              code:
                type: string
                enum:
                - DUPLICATE_PHONE
          examples:
            error_1:
              summary: DUPLICATE_PHONE
              value:
                statusCode: 409
                code: DUPLICATE_PHONE
    '422':
      description: Vi phạm ràng buộc dữ liệu; trả mã của lỗi đầu tiên.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - NAME_REQUIRED
                - NAME_MUST_BE_STRING
                - NAME_NOT_EMPTY
                - NAME_INVALID_LENGTH
                - PHONE_REQUIRED
                - PHONE_MUST_BE_STRING
                - PHONE_NOT_EMPTY
                - PHONE_INVALID_FORMAT
                - USER_UPDATE_PAYLOAD_REQUIRED
                - VALIDATION_FAILED
          examples:
            error_1:
              summary: NAME_REQUIRED
              value:
                statusCode: 422
                code: NAME_REQUIRED
            error_2:
              summary: NAME_MUST_BE_STRING
              value:
                statusCode: 422
                code: NAME_MUST_BE_STRING
            error_3:
              summary: NAME_NOT_EMPTY
              value:
                statusCode: 422
                code: NAME_NOT_EMPTY
            error_4:
              summary: NAME_INVALID_LENGTH
              value:
                statusCode: 422
                code: NAME_INVALID_LENGTH
            error_5:
              summary: PHONE_REQUIRED
              value:
                statusCode: 422
                code: PHONE_REQUIRED
            error_6:
              summary: PHONE_MUST_BE_STRING
              value:
                statusCode: 422
                code: PHONE_MUST_BE_STRING
            error_7:
              summary: PHONE_NOT_EMPTY
              value:
                statusCode: 422
                code: PHONE_NOT_EMPTY
            error_8:
              summary: PHONE_INVALID_FORMAT
              value:
                statusCode: 422
                code: PHONE_INVALID_FORMAT
            error_9:
              summary: USER_UPDATE_PAYLOAD_REQUIRED
              value:
                statusCode: 422
                code: USER_UPDATE_PAYLOAD_REQUIRED
            error_10:
              summary: VALIDATION_FAILED
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
