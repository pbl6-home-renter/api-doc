post:
  tags:
  - User
  x-apidog-folder: User
  x-apidog-status: released
  operationId: lockUser
  security:
  - BearerAuth: []
  summary: Lock user
  description: |-
    **Lưu ý**

    - User bị khóa **vẫn đăng nhập được**. Các service chặn chức năng dựa vào claim `status` trong access token (tự verify); token cấp trước khi khóa còn mang `status=active` tối đa 15 phút.
    - Admin tự khóa trả `400 USER_LOCK_CANNOT_SELF` trước khi mở transaction. User không tồn tại/đã xóa trả `404 USER_NOT_FOUND`; đã khóa trả `409 USER_LOCK_ALREADY_LOCKED`; chưa xác thực email (`pending_verification`) trả `409 EMAIL_NOT_VERIFIED`. Các nhánh lỗi không lưu thay đổi hoặc phát account notice.
    - Theo P9-D83/P9-06, Identity ghi `user.locked` và `notification.requested` type `system` tới chính user trong cùng transaction khóa tài khoản.
    - Tenancy nhận `user.locked` qua `tenancy.identity-lifecycle`, dedup bằng inbox. Với landlord, một transaction tạm ngưng contract active, lưu lock cycle/grace deadline và ghi notification outbox tới landlord cùng tenant/member đang hoạt động đã link. Khóa tenant không tạm ngưng contract của landlord.
    - Duplicate lock không tạo cycle hoặc notice trùng; cycle mới giữ các contract còn suspended từ cycle trước. Scheduled job trong Tenancy tìm deadline bền vững sau restart. Khôi phục/chấm dứt contract thuộc P9-07; P9-06 không hoàn cọc hoặc thay đổi contract chat.
    - Tenancy uses the constant `LANDLORD_LOCK_GRACE_PERIOD_MS = 604800000` (7 days). Each cycle persists `graceDeadline = lockedAt + gracePeriodMs` using Identity's lock timestamp.
    - P9-07 scans at startup and every 60 seconds, taking up to 100 due pending or legacy elapsed cycles. Each cycle is rechecked under the landlord/cycle lock. Identity evidence is read through authenticated `GET /internal/users/{userId}/lock-period?lockedAt=...`.
    - Identity stores lock-period history and serializes evidence reads with account lock/unlock writes. An unlock strictly before the deadline moves the cycle to `decision_pending` and requests landlord choices. The event may arrive after the deadline. Unlock exactly at or after the deadline permits expiry processing.
    - The service-token protected internal GET returns `{ lockedAt, unlockedAt, latestLockedAt, observedAt, state }` inside the normal response envelope. Timestamps are ISO 8601 UTC; state is `locked`, `unlocked` or `unknown`. Unknown historical periods retain null unlockedAt; the current account status alone is not unlock evidence.
    - A confirmed expiry terminates only suspended contracts belonging to the current cycle and requests system notices in the same transaction. Rooms remain occupied and members retain their residence until explicit checkout. Missing evidence or an unavailable Identity preserves the cycle for reconciliation. A newer Identity lock defers processing until its lock event is received.
    - Legacy elapsed cycles use the same evidence checks. An active account without historical proof is insufficient to determine its unlock time. Unresolved cycles rotate through the scan using updatedAt so they cannot starve later deadlines.
    - Khóa không revoke refresh token.

    **Payload notification P9-06**

    `notification.requested.payload` có `sourceService`, `recipientUserIds` và object `notification` gồm `type`, `title`, `body`, `data`. Đây là payload event; response HTTP của API lock vẫn là `UserLockResponseDto`.

    - Account notice từ Identity: `sourceService: identity`, `recipientUserIds: [userId]`, `notification.type: system`; `notification.data` gồm `{ messageKey: user.locked, userId, status: locked, eventType: user.locked, lockedAt }`, trong đó `lockedAt` là ISO 8601 UTC.
    - Account notice khi khóa giữ `notification.title: USER_ACCOUNT_LOCKED_TITLE` và `notification.body: USER_ACCOUNT_LOCKED_BODY` như mã backend; Web dịch theo `data.messageKey`.
    - Contract notice từ Tenancy: `sourceService: tenancy`, `notification.type: system`; `notification.data` gồm `{ landlordId, lockCycleId, contractIds, graceDeadline }`. Các ID là UUID, `contractIds` là mảng UUID, `graceDeadline` là ISO 8601 UTC. `lockCycleId` dùng ID envelope của event `user.locked` được xử lý.
    - Contract suspension notice dùng `notification.title: CONTRACT_SUSPENDED_TITLE` và `notification.body: CONTRACT_SUSPENDED_BODY` để FE dịch thông báo hợp đồng tạm ngưng do tài khoản chủ trọ bị khóa.
    - P9-07 adds `CONTRACT_LOCK_DECISION_REQUIRED_TITLE/BODY`, `CONTRACT_RESTORED_TITLE/BODY` and `CONTRACT_TERMINATED_TITLE/BODY`. Resolution data also includes `action` as `decision_required`, `restore` or `terminate`.
    - Mỗi contract notice có một recipient. Landlord nhận danh sách contract vừa bị suspend của mình; tenant chính và ContractMember đang hoạt động, đã link chỉ nhận contract IDs liên quan đến họ. Người chưa link không có recipient ID. Contract đã suspended được giữ tham chiếu trong cycle mới nhưng không bị suspend hoặc gửi lại notice tạm ngưng.
    - Community lưu snapshot vào inbox notification, trả `type: system` và `data` qua `GET /notifications`, đồng thời gửi Socket sau commit và push theo preference. Không đưa phone vào notification payload.

    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Identity-Service
        participant Guard as JWT/access guards
        participant C as UserAdminController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        participant DB as Identity DB
        participant MQ as RabbitMQ
        participant TEN as Tenancy
        participant TDB as Tenancy DB
        participant COM as Community
        Client->>GW: POST /api/v1/users/{userId}/lock
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke lockUser
        C->>Bus: Execute command for lockUser
        Bus->>H: Dispatch command handler
        H->>H: Kiểm tra adminId != userId trước transaction
        break Admin tự khóa
            H-->>Bus: 400 USER_LOCK_CANNOT_SELF
        end
        H->>DB: [Transaction] Đọc user FOR UPDATE
        break User không tồn tại / đã khóa / chưa xác thực email
            H-->>Bus: 404 USER_NOT_FOUND / 409 USER_LOCK_ALREADY_LOCKED / 409 EMAIL_NOT_VERIFIED
        end
        H->>DB: Cùng transaction: status=locked, lockReason, lockedAt<br/>+ outbox user.locked + notification.requested
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
        S-)MQ: user.locked {userId, role, status, lockReason, lockedAt}
        MQ-)TEN: user.locked (tenancy.identity-lifecycle)
        alt role=landlord
            TEN->>TEN: [Transaction] Inbox dedup + khóa landlord/cycle/contracts<br/>+ active → suspended + lưu cycle/deadline + notification outbox
            TEN-)MQ: notification.requested {sourceService: tenancy, recipientUserIds, notification: {type: system, data}}
        else role=tenant
            TEN->>TEN: [Transaction] Inbox dedup + xóa tenant lookup; giữ contract
        end
        S-)MQ: notification.requested {sourceService: identity, recipientUserIds: [userId], notification: {type: system, data}}
        MQ-)COM: notification.requested (community.notification)
        COM->>COM: [Transaction] Inbox dedup + lưu notice từng recipient
        COM->>COM: Sau commit: Socket sync / FCM theo preference
        opt P9-07 deadline scan, including after restart
            TEN->>S: Service-token GET lock-period for the matching lockedAt
            S->>DB: Serialize evidence read with lock/unlock writes
            S-->>TEN: Historical unlock time, latest lock and observation time
            alt Exact evidence is available and cycle is still current
                TEN->>TDB: Transaction: lock landlord/cycle/contracts and recheck deadline
                TEN->>TDB: Early unlock → decision_pending; otherwise terminate suspended contracts<br/>save decisions, cycle and notification outbox; commit
                TEN-)MQ: notification.requested, room and members unchanged
            else Evidence is unavailable, unknown or a newer lock exists
                TEN->>TDB: Retain cycle and contracts for reconciliation
            end
        end
        TEN->>S: GET /internal/users/{userId}/lock-period?lockedAt=... (service token)
        Note over TEN: Transaction rechecks cycle and proof<br/>early unlock → decision_pending; expiry → terminate and notify<br/>room remains occupied until checkout
    ```
  parameters:
  - name: userId
    in: path
    required: true
    description: UUID của người dùng.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/UserLockRequestDto
        example:
          lockReason: Spam listing
  responses:
    '200':
      description: User locked
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_ACCOUNT_LOCKED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserLockResponseDto
          example:
            statusCode: 200
            code: USER_ACCOUNT_LOCKED
            data:
              userId: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
              status: locked
              lockReason: Spam listing
              lockedAt: '2026-09-23T11:55:00.000Z'
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - INVALID_JSON
                - INVALID_REQUEST_BODY
                - BAD_REQUEST
                - USER_LOCK_CANNOT_SELF
          examples:
            error_1:
              summary: INVALID_JSON
              value:
                statusCode: 400
                code: INVALID_JSON
            error_2:
              summary: INVALID_REQUEST_BODY
              value:
                statusCode: 400
                code: INVALID_REQUEST_BODY
            error_3:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
            error_4:
              summary: USER_LOCK_CANNOT_SELF
              value:
                statusCode: 400
                code: USER_LOCK_CANNOT_SELF
    '401':
      description: Không xác thực được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 401
              code:
                type: string
                enum:
                - UNAUTHORIZED
          examples:
            error_1:
              summary: UNAUTHORIZED
              value:
                statusCode: 401
                code: UNAUTHORIZED
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      description: Không tìm thấy người dùng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - USER_NOT_FOUND
          examples:
            error_1:
              summary: USER_NOT_FOUND
              value:
                statusCode: 404
                code: USER_NOT_FOUND
    '409':
      description: Tài khoản đã bị khóa hoặc chưa xác thực email nên chưa thể khóa.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 409
              code:
                type: string
                enum:
                - USER_LOCK_ALREADY_LOCKED
                - EMAIL_NOT_VERIFIED
          examples:
            error_1:
              summary: USER_LOCK_ALREADY_LOCKED
              value:
                statusCode: 409
                code: USER_LOCK_ALREADY_LOCKED
            email_not_verified:
              summary: EMAIL_NOT_VERIFIED — Tài khoản chưa xác thực email.
              value:
                statusCode: 409
                code: EMAIL_NOT_VERIFIED
    '422':
      description: Vi phạm ràng buộc dữ liệu; trả mã của lỗi đầu tiên.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - LOCK_REASON_REQUIRED
                - LOCK_REASON_MUST_BE_STRING
                - LOCK_REASON_NOT_EMPTY
                - LOCK_REASON_INVALID_LENGTH
                - VALIDATION_FAILED
          examples:
            error_1:
              summary: LOCK_REASON_REQUIRED
              value:
                statusCode: 422
                code: LOCK_REASON_REQUIRED
            error_2:
              summary: LOCK_REASON_MUST_BE_STRING
              value:
                statusCode: 422
                code: LOCK_REASON_MUST_BE_STRING
            error_3:
              summary: LOCK_REASON_NOT_EMPTY
              value:
                statusCode: 422
                code: LOCK_REASON_NOT_EMPTY
            error_4:
              summary: LOCK_REASON_INVALID_LENGTH
              value:
                statusCode: 422
                code: LOCK_REASON_INVALID_LENGTH
            error_5:
              summary: VALIDATION_FAILED
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
