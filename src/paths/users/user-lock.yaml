post:
  tags:
  - User
  x-apidog-folder: User
  x-apidog-status: released
  operationId: lockUser
  security:
  - BearerAuth: []
  summary: Lock user
  description: |-
    Chỉ admin. Khóa tài khoản; không thể tự khóa. User bị khóa vẫn đăng nhập được nhưng bị chặn một số chức năng.

    **Lưu ý**

    - User bị khóa **vẫn đăng nhập được**. Các service chặn chức năng dựa vào claim `status` trong access token (tự verify); token cấp trước khi khóa còn mang `status=active` tối đa 15 phút.
    - Event `user.locked` chỉ để Tenancy đổi dữ liệu của mình (ẩn BĐS, tạm ngưng HĐ của landlord).
    - Đang cân nhắc (thuộc Tenancy): landlord bị khóa quá grace period thì hủy HĐ và hoàn cọc.
    - Chưa triển khai: publish `user.locked`; code hiện vẫn revoke refresh token khi khóa, cần bỏ.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant ID as Identity
        participant DB as Identity DB
        participant MQ as RabbitMQ
        participant TEN as Tenancy
        participant COM as Community

        GW->>ID: POST /users/{userId}/lock {lockReason} + Authorization (admin)
        alt Admin tự khóa chính mình
            ID-->>GW: 400 USER_LOCK_CANNOT_SELF
        end
        ID->>DB: Đọc user
        alt Không tìm thấy
            ID-->>GW: 404 USER_NOT_FOUND
        else Đã bị khóa
            ID-->>GW: 409 USER_LOCK_ALREADY_LOCKED
        end
        ID->>DB: [Transaction] Update users (status=locked, lockReason, lockedAt)<br/>+ outbox user.locked
        Note over ID: Không revoke refresh token:<br/>user bị khóa vẫn đăng nhập được
        ID-->>GW: 200 USER_ACCOUNT_LOCKED {userId, status, lockReason, lockedAt}
        ID-)MQ: user.locked {userId, role, status, lockReason, lockedAt}
        MQ-)TEN: Nếu role=landlord: ẩn BĐS khỏi tìm kiếm, tạm ngưng HĐ
        MQ-)COM: Xử lý dữ liệu liên quan (nếu có)
        Note over TEN,COM: Chặn thao tác của user bị khóa dựa vào claim status trong JWT,<br/>không dựa vào event này
    ```
  parameters:
  - name: userId
    in: path
    required: true
    description: UUID của người dùng.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/UserLockRequestDto
        example:
          lockReason: Spam listing
  responses:
    '200':
      description: User locked
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_ACCOUNT_LOCKED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserLockResponseDto
          example:
            statusCode: 200
            code: USER_ACCOUNT_LOCKED
            data:
              userId: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
              status: locked
              lockReason: Spam listing
              lockedAt: '2026-09-23T11:55:00.000Z'
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - INVALID_JSON
                - INVALID_REQUEST_BODY
                - BAD_REQUEST
                - USER_LOCK_CANNOT_SELF
          examples:
            error_1:
              summary: INVALID_JSON
              value:
                statusCode: 400
                code: INVALID_JSON
            error_2:
              summary: INVALID_REQUEST_BODY
              value:
                statusCode: 400
                code: INVALID_REQUEST_BODY
            error_3:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
            error_4:
              summary: USER_LOCK_CANNOT_SELF
              value:
                statusCode: 400
                code: USER_LOCK_CANNOT_SELF
    '401':
      description: Không xác thực được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 401
              code:
                type: string
                enum:
                - UNAUTHORIZED
          examples:
            error_1:
              summary: UNAUTHORIZED
              value:
                statusCode: 401
                code: UNAUTHORIZED
    '403':
      description: Không có quyền truy cập.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 403
              code:
                type: string
                enum:
                - FORBIDDEN
          examples:
            error_1:
              summary: FORBIDDEN
              value:
                statusCode: 403
                code: FORBIDDEN
    '404':
      description: Không tìm thấy người dùng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - USER_NOT_FOUND
          examples:
            error_1:
              summary: USER_NOT_FOUND
              value:
                statusCode: 404
                code: USER_NOT_FOUND
    '409':
      description: Xung đột dữ liệu hoặc trạng thái.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 409
              code:
                type: string
                enum:
                - USER_LOCK_ALREADY_LOCKED
          examples:
            error_1:
              summary: USER_LOCK_ALREADY_LOCKED
              value:
                statusCode: 409
                code: USER_LOCK_ALREADY_LOCKED
    '422':
      description: Vi phạm ràng buộc dữ liệu; trả mã của lỗi đầu tiên.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - LOCK_REASON_REQUIRED
                - LOCK_REASON_MUST_BE_STRING
                - LOCK_REASON_NOT_EMPTY
                - LOCK_REASON_INVALID_LENGTH
                - VALIDATION_FAILED
          examples:
            error_1:
              summary: LOCK_REASON_REQUIRED
              value:
                statusCode: 422
                code: LOCK_REASON_REQUIRED
            error_2:
              summary: LOCK_REASON_MUST_BE_STRING
              value:
                statusCode: 422
                code: LOCK_REASON_MUST_BE_STRING
            error_3:
              summary: LOCK_REASON_NOT_EMPTY
              value:
                statusCode: 422
                code: LOCK_REASON_NOT_EMPTY
            error_4:
              summary: LOCK_REASON_INVALID_LENGTH
              value:
                statusCode: 422
                code: LOCK_REASON_INVALID_LENGTH
            error_5:
              summary: VALIDATION_FAILED
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
