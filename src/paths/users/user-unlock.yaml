post:
  tags:
  - User
  x-apidog-folder: User
  x-apidog-status: released
  operationId: unlockUser
  security:
  - BearerAuth: []
  summary: Unlock user
  description: |-
    **Lưu ý**

    - Token cấp trước khi mở khóa còn mang `status=locked` tối đa 15 phút.
    - Identity ghi `user.unlocked` và `notification.requested` type `system` tới chính user trong cùng transaction. Payload `user.unlocked` bổ sung `role`, `phone` để Tenancy khôi phục tenant lookup; phone không đi sang Community.
    - Account notice có `sourceService: identity`, `recipientUserIds: [userId]` và object `notification` gồm `type: system`, `title`, `body`, `data`. `notification.data` gồm `{ userId, status: active, eventType: user.unlocked, lockedAt: null }`. Community lưu snapshot này và trả qua `GET /notifications`; response HTTP của API unlock vẫn là `UserUnlockResponseDto`.
    - Account notice khi mở khóa dùng `notification.title: USER_ACCOUNT_UNLOCKED_TITLE` và `notification.body: USER_ACCOUNT_UNLOCKED_BODY`. Đây là key để FE dịch theo ngôn ngữ hiển thị.
    - Tenancy dùng snapshot `role`, `phone` của tenant để khôi phục lookup và liên kết theo rule hiện có. Payload unlock cũ chỉ có `userId`, `status` vẫn được inbox dedup/ack; khi thiếu snapshot, P9-06 không khôi phục lookup qua event đó.
    - P9-07 adds the original lock timestamp as `user.unlocked.payload.lockedAt`; the envelope `occurredAt` is the unlock time persisted by Identity in the same transaction. The HTTP response and account-notice snapshot still return `lockedAt: null`.
    - For a matching landlord cycle, unlock strictly before its deadline moves it to `decision_pending`, keeping contracts suspended. One landlord notice lists the contracts requiring choices through `PUT /contracts/{contractId}/lock-cycles/{lockCycleId}/decision`. Empty cycles complete without a choice notice. Duplicate unlocks create no additional notice.
    - Unlock at the deadline is expiry. An unlock for an older lock cannot change a newer cycle. A new-format unlock received before its lock is retried through the inbox transaction. Legacy events without lock evidence are acknowledged and due cycles are reconciled through Identity's internal lock-period endpoint.
    - Decision-required notices use `CONTRACT_LOCK_DECISION_REQUIRED_TITLE/BODY`. Account restoration notices use `USER_ACCOUNT_UNLOCKED_TITLE/BODY`. Cycle decisions and their notification outbox share a local transaction.

    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Identity-Service
        participant Guard as JWT/access guards
        participant C as UserAdminController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        participant DB as Identity DB
        participant MQ as RabbitMQ
        participant TEN as Tenancy
        participant COM as Community
        Client->>GW: POST /api/v1/users/{userId}/unlock
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke unlockUser
        C->>Bus: Execute command for unlockUser
        Bus->>H: Dispatch command handler
        H->>DB: [Transaction] Đọc user FOR UPDATE
        break User không tồn tại / chưa bị khóa
            H-->>Bus: 404 USER_NOT_FOUND / 409 USER_UNLOCK_NOT_LOCKED
        end
        H->>DB: Cùng transaction: status=active, lockReason=null, lockedAt=null<br/>+ outbox user.unlocked + notification.requested
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
        S-)MQ: user.unlocked {userId, status, role, phone, lockedAt}; occurredAt=unlock time
        MQ-)TEN: user.unlocked (tenancy.identity-lifecycle)
        TEN->>TEN: Transaction inbox dedup; tenant lookup preserved<br/>landlord matching early unlock → decision_pending and notification outbox
        TEN-)MQ: notification.requested {system, decision_required, lockCycleId, contractIds}
        S-)MQ: notification.requested {sourceService: identity, recipientUserIds: [userId], notification: {type: system, data}}
        MQ-)COM: notification.requested (community.notification)
        COM->>COM: [Transaction] Inbox dedup + lưu account notice
        COM->>COM: Sau commit: Socket sync / FCM theo preference
    ```
  parameters:
  - name: userId
    in: path
    required: true
    description: UUID của người dùng.
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: User unlocked
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_ACCOUNT_UNLOCKED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserUnlockResponseDto
          example:
            statusCode: 200
            code: USER_ACCOUNT_UNLOCKED
            data:
              userId: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
              status: active
              lockedAt: null
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - BAD_REQUEST
          examples:
            error_1:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
    '401':
      description: Không xác thực được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 401
              code:
                type: string
                enum:
                - UNAUTHORIZED
          examples:
            error_1:
              summary: UNAUTHORIZED
              value:
                statusCode: 401
                code: UNAUTHORIZED
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      description: Không tìm thấy người dùng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - USER_NOT_FOUND
          examples:
            error_1:
              summary: USER_NOT_FOUND
              value:
                statusCode: 404
                code: USER_NOT_FOUND
    '409':
      description: Xung đột dữ liệu hoặc trạng thái.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 409
              code:
                type: string
                enum:
                - USER_UNLOCK_NOT_LOCKED
          examples:
            error_1:
              summary: USER_UNLOCK_NOT_LOCKED
              value:
                statusCode: 409
                code: USER_UNLOCK_NOT_LOCKED
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
