get:
  tags:
  - User
  x-apidog-folder: User
  operationId: getUsersAdmin
  security:
  - BearerAuth: []
  summary: List users
  description: Chỉ admin. Danh sách JSON và phân trang offset. Lọc bằng role, status ở query cấp ngoài; q tìm theo
    tên/email/điện thoại. Không hỗ trợ filter object hoặc format xuất tệp.
  parameters:
  - name: sort
    in: query
    description: Một trường sắp xếp; mặc định createdAt.
    schema:
      type: string
      enum:
      - createdAt
      - name
      - role
      - status
      default: createdAt
  - name: order
    in: query
    description: Chiều sắp xếp; mặc định desc.
    schema:
      type: string
      enum:
      - asc
      - desc
      default: desc
  - name: pageNo
    in: query
    description: Số trang offset, bắt đầu từ 1.
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: pageSize
    in: query
    description: Số bản ghi mỗi trang.
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: role
    in: query
    required: false
    description: Lọc theo vai trò.
    schema:
      type: string
      enum:
      - landlord
      - tenant
      - admin
  - name: status
    in: query
    required: false
    description: Lọc theo trạng thái.
    schema:
      type: string
      enum:
      - active
      - locked
  - name: q
    in: query
    required: false
    description: Tìm theo tên, email hoặc số điện thoại.
    schema:
      type: string
  responses:
    '200':
      description: Danh sách người dùng hoặc tệp xuất theo format.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_LIST_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/UserListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                  pageSize:
                    type: integer
                  totalItems:
                    type: integer
                  totalPages:
                    type: integer
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: USER_LIST_FETCHED
            data:
            - id: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
              name: Lê Văn An
              phone: '0901234567'
              email: lan@example.com
              role: tenant
              status: active
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - BAD_REQUEST
          examples:
            error_1:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
    '401':
      description: Không xác thực được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 401
              code:
                type: string
                enum:
                - UNAUTHORIZED
          examples:
            error_1:
              summary: UNAUTHORIZED
              value:
                statusCode: 401
                code: UNAUTHORIZED
    '403':
      description: Không có quyền truy cập.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 403
              code:
                type: string
                enum:
                - FORBIDDEN
          examples:
            error_1:
              summary: FORBIDDEN
              value:
                statusCode: 403
                code: FORBIDDEN
    '422':
      description: Vi phạm ràng buộc dữ liệu; trả mã của lỗi đầu tiên.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - UNEXPECTED_FIELD
                - VALIDATION_FAILED
                - pageNo must not be less than 1
                - pageNo must be an integer number
                - pageSize must not be less than 1
                - pageSize must not be greater than 100
                - pageSize must be an integer number
                - sort must be a string
                - 'sort must be one of: createdAt, name, role, status'
                - order must be either asc or desc
                - 'role must be one of the following values: landlord, tenant, admin'
                - 'status must be one of the following values: active, locked'
                - q must be a string
          examples:
            error_1:
              summary: UNEXPECTED_FIELD
              value:
                statusCode: 422
                code: UNEXPECTED_FIELD
            error_2:
              summary: VALIDATION_FAILED
              value:
                statusCode: 422
                code: VALIDATION_FAILED
            error_3:
              summary: pageNo must not be less than 1
              value:
                statusCode: 422
                code: pageNo must not be less than 1
            error_4:
              summary: pageNo must be an integer number
              value:
                statusCode: 422
                code: pageNo must be an integer number
            error_5:
              summary: pageSize must not be less than 1
              value:
                statusCode: 422
                code: pageSize must not be less than 1
            error_6:
              summary: pageSize must not be greater than 100
              value:
                statusCode: 422
                code: pageSize must not be greater than 100
            error_7:
              summary: pageSize must be an integer number
              value:
                statusCode: 422
                code: pageSize must be an integer number
            error_8:
              summary: sort must be a string
              value:
                statusCode: 422
                code: sort must be a string
            error_9:
              summary: 'sort must be one of: createdAt, name, role, status'
              value:
                statusCode: 422
                code: 'sort must be one of: createdAt, name, role, status'
            error_10:
              summary: order must be either asc or desc
              value:
                statusCode: 422
                code: order must be either asc or desc
            error_11:
              summary: 'role must be one of the following values: landlord, tenant, admin'
              value:
                statusCode: 422
                code: 'role must be one of the following values: landlord, tenant, admin'
            error_12:
              summary: 'status must be one of the following values: active, locked'
              value:
                statusCode: 422
                code: 'status must be one of the following values: active, locked'
            error_13:
              summary: q must be a string
              value:
                statusCode: 422
                code: q must be a string
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
