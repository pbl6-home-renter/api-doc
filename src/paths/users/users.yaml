get:
  tags:
  - User
  x-apidog-folder: User
  operationId: listUsers
  security:
    - BearerAuth: []
  summary: List users
  description: |-
    Chỉ admin; yêu cầu access token. Lọc theo role, status và phân trang offset. format khác json trả file stream không có JSON wrapper.

    ### Sequence diagram — List users

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

