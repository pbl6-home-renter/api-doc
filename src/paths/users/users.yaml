    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        C->>G: GET /api/v1/users<br/>Query: filter, sort, order, pageNo, pageSize, format
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra query, header theo contract
        break query, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_QUERY_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc users theo filter role, status, sort và phân trang offset
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Actor là admin#59; không xuất password hash hoặc dữ liệu phiên
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        alt format=json hoặc mặc định
            S-->>G: 200 USERS_FETCHED + data theo DTO
            G-->>C: Chuyển tiếp JSON và header
        else format xuất tệp được hỗ trợ
            S-->>G: 200 File stream + Content-Type/Content-Disposition
            G-->>C: Chuyển tiếp tệp#59; không JSON wrapper
        end
    ```
  parameters:
  - name: filter
    in: query
    description: Lọc theo role hoặc status.
    style: deepObject
    explode: true
    schema:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
          - tenant
          - landlord
          - admin
        status:
          type: string
          enum:
          - active
          - locked
  - name: sort
    in: query
    description: Một trường sắp xếp; mặc định createdAt.
    schema:
      type: string
      enum:
      - createdAt
      - name
      - role
      - status
      default: createdAt
  - name: order
    in: query
    description: Chiều sắp xếp; mặc định desc.
    schema:
      type: string
      enum:
      - asc
      - desc
      default: desc
  - name: pageNo
    in: query
    description: Số trang offset, bắt đầu từ 1.
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: pageSize
    in: query
    description: Số bản ghi mỗi trang.
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: format
    in: query
    description: json trả envelope và phân trang; xlsx, csv, pdf trả file stream.
    schema:
      type: string
      enum:
      - json
      - xlsx
      - csv
      - pdf
      default: json
  responses:
    '200':
      description: Danh sách người dùng hoặc tệp xuất theo format.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USERS_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/UserListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                  pageSize:
                    type: integer
                  totalItems:
                    type: integer
                  totalPages:
                    type: integer
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: USERS_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Lê Văn An
              phone: '0901234567'
              email: lan@example.com
              role: tenant
              status: active
              createdAt: '2026-09-01T08:00:00.000Z'
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
        text/csv:
          schema:
            type: string
            format: binary
        application/pdf:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
