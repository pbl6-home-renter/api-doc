get:
  tags:
  - User
  x-apidog-folder: User
  x-apidog-status: released
  operationId: getCurrentUser
  summary: Get current user
  description: |-
    Lấy hồ sơ người dùng hiện tại. Yêu cầu Bearer access token.

    **Lưu ý**

    - `payoutAccount.accountNumber` luôn bị che (`**xxxxx`).

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant ID as Identity
        participant DB as Identity DB

        GW->>ID: GET /me + x-user-id
        ID->>DB: Đọc users + landlord_profiles theo userId
        ID->>ID: Che accountNumber thành "**xxxxx"
        ID-->>GW: 200 CURRENT_USER_PROFILE_FETCHED {id, name, email, phone, role, status, payoutAccount}
    ```
  security:
  - BearerAuth: []
  responses:
    '200':
      description: Current user fetched
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CURRENT_USER_PROFILE_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserCurrentResponseDto
          example:
            statusCode: 200
            code: CURRENT_USER_PROFILE_FETCHED
            data:
              id: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
              name: Lê Văn An
              email: lan@example.com
              phone: '0901234567'
              role: tenant
              status: active
              payoutAccount: null
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - BAD_REQUEST
          examples:
            error_1:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
    '401':
      description: Không xác thực được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 401
              code:
                type: string
                enum:
                - UNAUTHORIZED
          examples:
            error_1:
              summary: UNAUTHORIZED
              value:
                statusCode: 401
                code: UNAUTHORIZED
    '403':
      description: Không có quyền truy cập.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 403
              code:
                type: string
                enum:
                - FORBIDDEN
          examples:
            error_1:
              summary: FORBIDDEN
              value:
                statusCode: 403
                code: FORBIDDEN
    '404':
      description: Không tìm thấy người dùng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - USER_NOT_FOUND
          examples:
            error_1:
              summary: USER_NOT_FOUND
              value:
                statusCode: 404
                code: USER_NOT_FOUND
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
patch:
  tags:
  - User
  x-apidog-folder: User
  x-apidog-status: released
  operationId: updateCurrentUser
  security:
  - BearerAuth: []
  summary: Update current user
  description: |-
    Cập nhật hồ sơ hiện tại. Bắt buộc name, phone, payoutAccount (có thể null). Chỉ landlord được gửi object payoutAccount. Số tài khoản trả về được mask; phone đổi từ +84 sang 0.

    **Lưu ý**

    - Ngữ nghĩa thay toàn bộ: bắt buộc gửi `name`, `phone`, `payoutAccount`; gửi `payoutAccount: null` để xóa.
    - Chỉ landlord được có `payoutAccount`.
    - Chưa triển khai: publish `user.updated`, `landlord.payout_account_updated`. Event payout là tùy chọn, có thể bỏ nếu chấp nhận cache của Payment cũ tối đa 5 phút.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant ID as Identity
        participant DB as Identity DB
        participant MQ as RabbitMQ
        participant TEN as Tenancy
        participant COM as Community
        participant PAY as Payment

        GW->>ID: PATCH /me {name, phone, payoutAccount} + x-user-id, x-user-role
        alt payoutAccount khác null nhưng role không phải landlord
            ID-->>GW: 422 USER_UPDATE_PAYOUT_NOT_ALLOWED
        end
        ID->>DB: Kiểm tra phone trùng với user khác
        alt Trùng phone
            ID-->>GW: 409 DUPLICATE_PHONE
        end
        ID->>DB: [Transaction] Update users (name, phone)<br/>+ upsert landlord_profiles (bankCode, accountNumber, accountName)<br/>+ outbox user.updated (nếu name/phone đổi)<br/>+ outbox landlord.payout_account_updated (nếu payoutAccount đổi)
        ID-->>GW: 200 CURRENT_USER_PROFILE_UPDATED {id, name, phone, payoutAccount}
        opt name/phone đổi
            ID-)MQ: user.updated {userId, name, phone}
            MQ-)TEN: Cập nhật user snapshot
            MQ-)COM: Cập nhật user snapshot
        end
        opt payoutAccount đổi
            ID-)MQ: landlord.payout_account_updated {userId}
            MQ-)PAY: Xóa cache payout của landlord
        end
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/UserCurrentUpdateRequestDto
        example:
          name: Lê Văn An
          phone: '0901234567'
          payoutAccount:
            bankCode: '970415'
            accountNumber: '102876543210'
            accountName: LE VAN AN
  responses:
    '200':
      description: Profile updated
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CURRENT_USER_PROFILE_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserCurrentUpdateResponseDto
          example:
            statusCode: 200
            code: CURRENT_USER_PROFILE_UPDATED
            data:
              id: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
              name: Lê Văn An
              phone: '0901234567'
              payoutAccount:
                bankCode: '970415'
                accountNumber: '**43210'
                accountName: LE VAN AN
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - INVALID_JSON
                - INVALID_REQUEST_BODY
                - BAD_REQUEST
          examples:
            error_1:
              summary: INVALID_JSON
              value:
                statusCode: 400
                code: INVALID_JSON
            error_2:
              summary: INVALID_REQUEST_BODY
              value:
                statusCode: 400
                code: INVALID_REQUEST_BODY
            error_3:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
    '401':
      description: Không xác thực được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 401
              code:
                type: string
                enum:
                - UNAUTHORIZED
          examples:
            error_1:
              summary: UNAUTHORIZED
              value:
                statusCode: 401
                code: UNAUTHORIZED
    '403':
      description: Không có quyền truy cập.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 403
              code:
                type: string
                enum:
                - FORBIDDEN
          examples:
            error_1:
              summary: FORBIDDEN
              value:
                statusCode: 403
                code: FORBIDDEN
    '404':
      description: Không tìm thấy người dùng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - USER_NOT_FOUND
          examples:
