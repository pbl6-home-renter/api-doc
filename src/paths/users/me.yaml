                - NAME_NOT_EMPTY
                - NAME_INVALID_LENGTH
                - PHONE_REQUIRED
                - PHONE_MUST_BE_STRING
                - PHONE_NOT_EMPTY
                - PHONE_INVALID_FORMAT
                - PAYOUT_ACCOUNT_MUST_BE_OBJECT
                - BANK_CODE_REQUIRED
