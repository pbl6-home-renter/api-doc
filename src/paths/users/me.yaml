get:
  tags:
  - User
  x-apidog-folder: User
  operationId: getCurrentUser
  summary: Get current user
  description: |-
    **Request header bắt buộc:** `Authorization: Bearer <accessToken>`. Không có request body hoặc tham số. Yêu cầu access token của tenant, landlord hoặc admin. Trả hồ sơ của chính người gọi; tài khoản nhận tiền chỉ có ở landlord.

    ### Sequence diagram — Get current user

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNptVU2L20YY_isv6sVLbbwJySEuBFxL9brZ2Ikkb9qwYMajWWuwpFFGM5uakFMPJYRCSw-l9FITltAvkqWFgnXIwWH_h_5J35Hk_bQPxvI879fzPO_ohUVFwKyOlbFnmiWU2ZzMJIkPE8AP0UokOp4yWT2nRCpOeUoSBT0gGfQizvB34wmbQhseiimP2M5NbN9gu48G0CeKPSeLmwjXIDwmjzll4LIZz5TcAvMMjAdYk6tFK6vwN2G2gT0SmZpJ5j3eP4-YBNMK3Gvdv9_vQN_xoU1S3j6-1Y7rPP36qFi9S4AKKVlEFBdJiwdNmPMi_zYGJQlIHAUiHnNVxU0lI3M4OHtf5G8UzBD4K4ewWC0TWKz_0ECL1VtdQasyWKfXgTu370HDH40mD7vDryeu83jseL5Xc8iS4EpTB0zyowV8-cTHdPkJhWmR_4Jfq9Nkhv8-8IASGrLLDXUpZVkGSsxZAirkxeqDbkJGsDdRrP6jpsUPqmp0S3e7t6AxHnbH_t7IHTx17G2NuR3wkRDs6HcNPMkUQR_dUAlCRiIV1qK6rWqijz8U-WuMDYv81XnsRWqvA71QL5B0bN70noI0Rs1UE4dZ_4tjK57AN-slxeciP6XNa5rB8fo3-KpVW6vlGx6q_F6Vfyunn9y99xlkeoEqA6FKSFBF_ifQiPAYXXBRWeN0gwACgWflKiDuFGbr5dUiDy58gzQEDPOFDGNEgn_RKw6qz41CdL2CNFwv0_bHH5GmJITAyDS70MmrabyzuwuNwfCguz-wJ3tO13Zc3MfPu_bGUTs3tb1ObIoeeJOgE_KfOERF_jO_prWZxa4k-56Wk2cluxFJgkjIYJJKcYQXQFYNV1NTEofsVjnsVkWIXeTvcHuK_Du9MeK8NOIzjV2cM7z-Kza6rk4WV-jslXZR0kBNv5CdLY16b42T1n8jUaVopYopWQitcA2ERnkqoyGlSGV-giVoKM4HKKfB_cHoEj28dPUNBa67OEZlvCaSsG_4gQStwkvDdECKKJoSOjciJxnWR_9hsrP32JOI8ZqARmKWD1X9Z6dZN38XdRsMfccddvcnnuMeOO7Ecd2RizwQmF2-LTdS38aQMUInvbHrOkN_8oXj9_YcGz6FgChScW_7o80SbRcbF03prAlTESzKsbfZ0mpaMZMx4QG-IF4cWniIt6TVgUMrYEdER-rQeokgnWLlzZvD6iipWdOSQs9Cq3NEogyf8Fp-KkR9-PJ_juBfZg)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        C->>G: GET /api/v1/me
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra header theo contract
        break header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc users và landlord_profiles theo userId từ JWT
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Chỉ trả hồ sơ của chính actor#59; payoutAccount chỉ áp dụng cho landlord và che accountNumber
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 USER_CURRENT_FETCHED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  security:
  - BearerAuth: []
  responses:
    '200':
      description: Current user fetched
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_CURRENT_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserCurrentResponseDto
          example:
            statusCode: 200
            code: USER_CURRENT_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Lê Văn An
              email: lan@example.com
              phone: '0901234567'
              role: tenant
              status: active
              payoutAccount: null
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
patch:
  tags:
  - User
  x-apidog-folder: User
  operationId: updateCurrentUser
  security:
    - BearerAuth: []
  summary: Update current user
  description: |-
    Yêu cầu access token của tenant, landlord hoặc admin. Cập nhật name và phone; landlord có thể cập nhật payoutAccount khi không còn hóa đơn pending. Email và role không thay đổi.

    ### Sequence diagram — Update current user

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNrFV1trG0cU_isH9UWmUhWbpBC1DciSaiuxd-XVyrlgEKPdsTR4taPsxYkIeSh5KCUUakIpoQRijAm9BCekUCpR8qDg_6F_0jOXlVcXl0IL9YMs7Zw5c875vvPN2UcZh7s0U8yE9H5MfYdWGOkEpLfnA_6ROOJ-3GvTQP3ukyBiDusTP4IykBDKHqP4PXubtqEA27zNPLqyaLshbEv1GmyQiD4gg0ULS1g0aHDIHAoW7bAwCpaYNYQZc_FMFg3yobJfNKsIszoPo05AGztb0x0tt71obAvjiPrEd_7GpSmszDhq84fwgAcHNIBs4nZJxjvC3CLtNou2dxaXjX90pjGfh94xTaOcv3Fjowj1kl3ehALps8LhaqFHP28HhRvr3B0UwSc9moN-l_viHxnwOCo5Do_9SHnYUB42JsMzHxweBNQjEeN-nrk5OGCT0ZMeRAGBAIEDj_WY3tcOKDmA3fM3k9FJBB00_JFBdzI89mEw_jkGZzJ8FStTdQyeUy7C1bXrkLVNs7VdMu62rOpOs9qwG7p-1HdngtqlAdsfwM3bNrobnTrQnoye48fwrd_Bp7ca4BCnS9MBYW40xMryA-pD1GWT4fs4ByHB2Phk-LsjQnwfqUCXRHdlFbJNo9S0N02rdq9aWRaYVQQbC4IR_RQD88MIEaELnIQuJV7U1RS28iqjD99NRk9xb3cy-ma698J1owjlbjzAomPwIvY-BKItwyiHyYx_w7Qj5sPD8bGDvyejt05uDjM4HL-EO3ndSHlb1EH5byj_S2v60bXrn0EYDxBlIE7EA4gmo1_A8QjrIQsuTo4xu5oLLsc12fho9xY64-PZQ25d8OZmwzQKbaRiTlTExa6JuhS3cx9XnRkyLZoK3JzxEOk7Pu4XPhxh8fwuuAK8TgKoBlnuBrFbEOQsgnaMiTkXGDc0BFevXIFszdgtbdUqLbmpAMlPzcfWulm5m3q8WS1VqhY-WC9NbVYW2TMPXR9ZduIj10bPGHiT0Q9sjk0JJMRjrmivfUY9V9UnRF73SE7CzwLqFvzY80jbowWKeizxUhCh9yOmd_odPn7JoGKbiBkD4rpM0IJ49YD3KcoKDb_YJ16oGWdwPJMfYp0biYQoYmLvvu6Dj-G_jrTrD0ey0x3oTEavmTxfLSB9ngJHWZAacIYxxNj_fhrXinju4erXccKlD0fjIf5TWSZIBuOX-EzhhtwRB77wO0sQXFuDrESmZNdMo_VlqbY1bdV_DUhFdem3jrSD8PwYuiJ29IK8Y7LBUroolRXrdv6G4O_xH0nAlbwCN528zvNAStD9GIOZ9tb4157o6OGpFgzexwt2_A6fkQEI4n_Plql3ErQ9DdoR2sD8Qy40qI-ZMXSPnf6KgEd81-OBC9lEo6RMzktIqpC2TkJEkgSvAnbwydwpsxFJKcMd_kwKvmzVmURwiUhGaIKFSDBs8dFp4nG-Xao9wjwJQ8A9Krr9FLtdIOxLXs5614zu8mn6OcVhGdKrtKxGonkORJ5IEsl-yZzRVzNs3mWSR8c9dCAWY8kGQY9A6RJ6PJ5eN24KfkUPwf2TFIOWKRTekZVmfatWLtnVVn3TNKooPvXSXbNpt0rlstk07FbNaDUb1f-C9fN53ceLALl-5mAzS-r34RDx0CzCbX3OsLIhiaXMpJohle3_0Lbr1Y2aIeLwQ7xZkMwzq-W0qMku0aJ56YA0J3pKmFFcZ9zWjEbVsoGrwTArLshP4r6Qc3cFjxGAXxqRub1dsy-XC0kU7_xNvCDXOdy9JQqBDTV6zuQdXhTt4LWJc5A-UCuTw3tCorOq_7B5V3KSrydwDa_DmmFXLaO01cJUdqtWq2pZpoU0INBJj-sJkGu4BalntcpNy6oiFZt1hLRagY8B8yZzdboMVZx9ojjMqStbdPPl48FF5mbOwNTvCInwxn_q3heN_EzcHGI6FKxU2Uox2LTt-lSzkEEvhOsw7qGvLl6WUtRP9THmjPo7cs-hgMLRVdQ0CDguKMBT4JlFSIO_GPkOStehmJmEdlLxrYZaxB0nRvV1SzjiqesQJ7QQkZuR5Zp7ESL6qcdtj4XdJQfu6FC0BR6M-e6zoDeT4p3xO4LjFI5tcpo6jUUlscWw3RXrZKYpjwYyk3pMJJI-E7IkynuUhFGe4yCre9kQG_CUZl22RloChZwICnTF1CCRVhOlxEpJNU56Wv6xKRmOEjq2nnrDOE9GTaOSBDbfMgr-JBZVsVL51lJE1gMu3uSkqhT1CKN7WdDqicbcE1e_CjKhj94SUHxPhdUQBfqq-Fj9NIRAKlVlayeTy6Ap3lcuvmA_2stgxj26lynCXsal-yT2or3MYzRS5dRv3pliFMQ0lwl43OlminJgy2XwffAe53rx8V9ChOzc)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        participant T as tenancy-service
        participant O as Outbox worker (identity)
        participant Q as RabbitMQ
        participant N as tenancy-service
        participant ND as PostgreSQL tenancy_db
        C->>G: PATCH /api/v1/me<br/>Body: name, phone, payoutAccount
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        Note over S: PATCH chỉ cập nhật field được gửi#59; field bị omit giữ nguyên
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc hồ sơ hiện tại và kiểm tra phone chưa trùng
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        opt Có thay đổi payoutAccount
            S->>T: Đọc các invoice pending của landlord (service token, correlation-id)
            T-->>S: Có hoặc không có invoice pending
            S->>S: Chặn thay đổi nếu payoutAccount đang được sử dụng
        end
        S->>S: Email và role bất biến#59; payoutAccount chỉ cho landlord, gửi đủ thông tin tài khoản nhận tiền
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (DUPLICATE_PHONE / PAYOUT_ACCOUNT_IN_USE)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Cập nhật các field name, phone, payoutAccount được gửi theo DTO
        S->>D: INSERT outbox (user.updated) cùng transaction
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 USER_CURRENT_UPDATED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
        Note over O,ND: Xử lý bất đồng bộ sau commit#59; HTTP không chờ consumer hoàn tất
        O->>D: Đọc công việc chưa gửi trong outbox
        D-->>O: user.updated
        Note over O,Q: Event có eventId, occurredAt, schemaVersion, correlationId
        O->>Q: Publish user.updated
        Q-->>O: Publisher confirm
        O->>D: Xóa/đánh dấu bản ghi đã gửi
        Q-->>N: Deliver user.updated (at-least-once)
        N->>ND: UPSERT dữ liệu hiển thị theo userId#59; chỉ áp dụng phiên bản mới hơn
        ND-->>N: Dữ liệu đã commit
        N-->>Q: ACK
        Note over O,Q: Broker lỗi: giữ outbox để gửi lại#59; consumer lỗi: retry 1s / 4s / 16s rồi DLQ
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/UserCurrentUpdateRequestDto
        example:
          name: Lê Văn An
          phone: '0901234567'
          payoutAccount:
            bankCode: '970415'
            accountNumber: '102876543210'
            accountName: LE VAN AN
  responses:
    '200':
      description: Profile updated
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_CURRENT_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/UserCurrentUpdateResponseDto
          example:
            statusCode: 200
            code: USER_CURRENT_UPDATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Lê Văn An
              phone: '0901234567'
              payoutAccount:
                bankCode: '970415'
                accountNumber: '**43210'
                accountName: LE VAN AN
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '409':
      x-apidog-name: Conflict
      description: Số điện thoại trùng hoặc tài khoản nhận tiền đang được sử dụng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - DUPLICATE_PHONE
                  - PAYOUT_ACCOUNT_IN_USE
                description: |-
                  - DUPLICATE_PHONE: Số điện thoại đã được sử dụng.
                  - PAYOUT_ACCOUNT_IN_USE: Không thể đổi tài khoản nhận tiền khi còn hóa đơn pending.
          examples:
            duplicate_phone:
              summary: DUPLICATE_PHONE — Số điện thoại đã được sử dụng.
              value:
                statusCode: 409
                code: DUPLICATE_PHONE
            payout_account_in_use:
              summary: PAYOUT_ACCOUNT_IN_USE — Không thể đổi tài khoản nhận tiền khi còn hóa đơn pending.
              value:
                statusCode: 409
                code: PAYOUT_ACCOUNT_IN_USE
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
