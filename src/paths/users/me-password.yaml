put:
  tags:
  - User
  x-apidog-folder: User
  operationId: changeCurrentUserPassword
  security:
    - BearerAuth: []
  summary: Change password
  description: |-
    Yêu cầu access token của tenant, landlord hoặc admin. Đổi mật khẩu và thu hồi các phiên khác.

    ### Sequence diagram — Change password

    Luồng theo kiến trúc microservice: identity-service sở hữu nghiệp vụ và identity_db.

