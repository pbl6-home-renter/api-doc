    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as identity-service
        participant D as PostgreSQL identity_db
        C->>G: PUT /api/v1/me/password<br/>Body: currentPassword, newPassword, confirmPassword
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance identity-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (CURRENT_PASSWORD_REQUIRED / INVALID_CURRENT_PASSWORD / NEW_PASSWORD_REQUIRED / INVALID_NEW_PASSWORD / CONFIRM_PASSWORD_REQUIRED / INVALID_CONFIRM_PASSWORD / PASSWORD_MISMATCH / WEAK_PASSWORD / UNEXPECTED_FIELD / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc password hash và các phiên của actor
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Xác minh currentPassword#59; newPassword khớp confirmPassword và đạt quy tắc mật khẩu
        break Thông tin đăng nhập/cookie/currentPassword không xác thực được hoặc phiên đã thu hồi
            S-->>G: 401 (UNAUTHORIZED / INVALID_CREDENTIALS)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (CURRENT_PASSWORD_REQUIRED / INVALID_CURRENT_PASSWORD / NEW_PASSWORD_REQUIRED / INVALID_NEW_PASSWORD / CONFIRM_PASSWORD_REQUIRED / INVALID_CONFIRM_PASSWORD / PASSWORD_MISMATCH / WEAK_PASSWORD / UNEXPECTED_FIELD / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Hash newPassword
        S->>D: BEGIN transaction
        S->>D: Thay password hash và thu hồi các phiên khác, giữ phiên hiện tại
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 204 No Content#59; không JSON body
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/UserChangePasswordRequestDto
        example:
          currentPassword: OldP@ssw0rd
          newPassword: NewP@ssw0rd
          confirmPassword: NewP@ssw0rd
  responses:
    '204':
      $ref: ../../openapi.yaml#/components/responses/NoContentResponse
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      x-apidog-name: Unauthorized
      description: Thiếu xác thực hoặc mật khẩu hiện tại không đúng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [401]
              code:
                type: string
                enum:
                  - UNAUTHORIZED
                  - INVALID_CREDENTIALS
                description: |-
                  - UNAUTHORIZED: Access token thiếu, hết hạn hoặc không hợp lệ.
                  - INVALID_CREDENTIALS: Mật khẩu hiện tại không đúng.
          examples:
            unauthorized:
              summary: UNAUTHORIZED — Access token thiếu, hết hạn hoặc không hợp lệ.
              value:
                statusCode: 401
                code: UNAUTHORIZED
            invalid_credentials:
              summary: INVALID_CREDENTIALS — Mật khẩu hiện tại không đúng.
              value:
                statusCode: 401
                code: INVALID_CREDENTIALS
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu đổi mật khẩu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - CURRENT_PASSWORD_REQUIRED
                  - INVALID_CURRENT_PASSWORD
                  - NEW_PASSWORD_REQUIRED
                  - INVALID_NEW_PASSWORD
                  - CONFIRM_PASSWORD_REQUIRED
                  - INVALID_CONFIRM_PASSWORD
                  - PASSWORD_MISMATCH
                  - WEAK_PASSWORD
                  - UNEXPECTED_FIELD
                  - VALIDATION_FAILED
                description: |-
                  - CURRENT_PASSWORD_REQUIRED: Thiếu currentPassword hoặc currentPassword là null.
                  - INVALID_CURRENT_PASSWORD: CurrentPassword không phải chuỗi hoặc rỗng.
                  - NEW_PASSWORD_REQUIRED: Thiếu newPassword hoặc newPassword là null.
                  - INVALID_NEW_PASSWORD: NewPassword không phải chuỗi hoặc rỗng.
                  - CONFIRM_PASSWORD_REQUIRED: Thiếu confirmPassword hoặc confirmPassword là null.
                  - INVALID_CONFIRM_PASSWORD: ConfirmPassword không phải chuỗi hoặc rỗng.
                  - PASSWORD_MISMATCH: confirmPassword không trùng với newPassword.
                  - WEAK_PASSWORD: Mật khẩu mới không đáp ứng chính sách độ mạnh.
                  - UNEXPECTED_FIELD: Body chứa trường không được khai báo.
                  - VALIDATION_FAILED: Lỗi validation khác chưa có mã cụ thể.
          examples:
            current_password_required:
              summary: CURRENT_PASSWORD_REQUIRED — Thiếu currentPassword hoặc currentPassword là null.
              value:
                statusCode: 422
                code: CURRENT_PASSWORD_REQUIRED
            invalid_current_password:
              summary: INVALID_CURRENT_PASSWORD — CurrentPassword không phải chuỗi hoặc rỗng.
              value:
                statusCode: 422
                code: INVALID_CURRENT_PASSWORD
            new_password_required:
              summary: NEW_PASSWORD_REQUIRED — Thiếu newPassword hoặc newPassword là null.
              value:
                statusCode: 422
                code: NEW_PASSWORD_REQUIRED
            invalid_new_password:
              summary: INVALID_NEW_PASSWORD — NewPassword không phải chuỗi hoặc rỗng.
              value:
                statusCode: 422
                code: INVALID_NEW_PASSWORD
            confirm_password_required:
              summary: CONFIRM_PASSWORD_REQUIRED — Thiếu confirmPassword hoặc confirmPassword là null.
              value:
                statusCode: 422
                code: CONFIRM_PASSWORD_REQUIRED
            invalid_confirm_password:
              summary: INVALID_CONFIRM_PASSWORD — ConfirmPassword không phải chuỗi hoặc rỗng.
              value:
                statusCode: 422
                code: INVALID_CONFIRM_PASSWORD
            password_mismatch:
              summary: PASSWORD_MISMATCH — confirmPassword không trùng với newPassword.
              value:
                statusCode: 422
                code: PASSWORD_MISMATCH
            weak_password:
              summary: WEAK_PASSWORD — Mật khẩu mới không đáp ứng chính sách độ mạnh.
              value:
                statusCode: 422
                code: WEAK_PASSWORD
            unexpected_field:
              summary: UNEXPECTED_FIELD — Body chứa trường không được khai báo.
              value:
                statusCode: 422
                code: UNEXPECTED_FIELD
            validation_failed:
              summary: VALIDATION_FAILED — Lỗi validation khác chưa có mã cụ thể.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
