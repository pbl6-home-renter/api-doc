put:
  tags:
  - User
  x-apidog-folder: User
  x-apidog-status: released
  operationId: changeCurrentUserPassword
  security:
  - BearerAuth: []
  summary: Change password
  description: |-
    Đổi mật khẩu hiện tại; thu hồi refresh token. Thành công trả 204, không có body.

    **Lưu ý**

    - Revoke toàn bộ refresh token, kể cả phiên hiện tại: client nên đăng nhập lại sau khi đổi mật khẩu.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant ID as Identity
        participant DB as Identity DB

        GW->>ID: PUT /me/password {currentPassword, newPassword, confirmPassword} + Authorization
        ID->>DB: Đọc users theo userId
        ID->>ID: bcrypt compare currentPassword
        alt Sai mật khẩu hiện tại
            ID-->>GW: 401 USER_CHANGE_PASSWORD_INVALID_CURRENT
        end
        ID->>DB: [Transaction] Update users.password (bcrypt)<br/>+ revoke toàn bộ refresh_tokens của user
        ID-->>GW: 204
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/UserChangePasswordRequestDto
        example:
          currentPassword: OldP@ssw0rd
          newPassword: NewP@ssw0rd
          confirmPassword: NewP@ssw0rd
  responses:
    '204':
      $ref: ../../openapi.yaml#/components/responses/NoContentResponse
    '400':
      description: Yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 400
              code:
                type: string
                enum:
                - INVALID_JSON
                - INVALID_REQUEST_BODY
                - BAD_REQUEST
          examples:
            error_1:
              summary: INVALID_JSON
              value:
                statusCode: 400
                code: INVALID_JSON
            error_2:
              summary: INVALID_REQUEST_BODY
              value:
                statusCode: 400
                code: INVALID_REQUEST_BODY
            error_3:
              summary: BAD_REQUEST
              value:
                statusCode: 400
                code: BAD_REQUEST
    '401':
      description: Không xác thực được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 401
              code:
                type: string
                enum:
                - UNAUTHORIZED
                - USER_CHANGE_PASSWORD_INVALID_CURRENT
          examples:
            error_1:
              summary: UNAUTHORIZED
              value:
                statusCode: 401
                code: UNAUTHORIZED
            error_2:
              summary: USER_CHANGE_PASSWORD_INVALID_CURRENT
              value:
                statusCode: 401
                code: USER_CHANGE_PASSWORD_INVALID_CURRENT
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      description: Không có quyền truy cập.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 403
              code:
                type: string
                enum:
                - FORBIDDEN
          examples:
            error_1:
              summary: FORBIDDEN
              value:
                statusCode: 403
                code: FORBIDDEN
    '404':
      description: Không tìm thấy người dùng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - USER_NOT_FOUND
          examples:
            error_1:
              summary: USER_NOT_FOUND
              value:
                statusCode: 404
                code: USER_NOT_FOUND
    '422':
      description: Vi phạm ràng buộc dữ liệu; trả mã của lỗi đầu tiên.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - CURRENT_PASSWORD_REQUIRED
                - CURRENT_PASSWORD_MUST_BE_STRING
                - CURRENT_PASSWORD_NOT_EMPTY
                - NEW_PASSWORD_REQUIRED
                - NEW_PASSWORD_MUST_BE_STRING
                - NEW_PASSWORD_NOT_EMPTY
                - NEW_PASSWORD_INVALID_LENGTH
                - NEW_PASSWORD_INVALID_FORMAT
                - CONFIRM_PASSWORD_REQUIRED
                - CONFIRM_PASSWORD_MUST_BE_STRING
                - CONFIRM_PASSWORD_NOT_EMPTY
                - USER_CHANGE_PASSWORD_MISMATCH
                - UNEXPECTED_FIELD
                - VALIDATION_FAILED
          examples:
            error_1:
              summary: CURRENT_PASSWORD_REQUIRED
              value:
                statusCode: 422
                code: CURRENT_PASSWORD_REQUIRED
            error_2:
              summary: CURRENT_PASSWORD_MUST_BE_STRING
              value:
                statusCode: 422
                code: CURRENT_PASSWORD_MUST_BE_STRING
            error_3:
              summary: CURRENT_PASSWORD_NOT_EMPTY
              value:
                statusCode: 422
                code: CURRENT_PASSWORD_NOT_EMPTY
            error_4:
              summary: NEW_PASSWORD_REQUIRED
              value:
                statusCode: 422
                code: NEW_PASSWORD_REQUIRED
            error_5:
              summary: NEW_PASSWORD_MUST_BE_STRING
              value:
                statusCode: 422
                code: NEW_PASSWORD_MUST_BE_STRING
            error_6:
              summary: NEW_PASSWORD_NOT_EMPTY
              value:
                statusCode: 422
                code: NEW_PASSWORD_NOT_EMPTY
            error_7:
              summary: NEW_PASSWORD_INVALID_LENGTH
              value:
                statusCode: 422
                code: NEW_PASSWORD_INVALID_LENGTH
            error_8:
              summary: NEW_PASSWORD_INVALID_FORMAT
              value:
                statusCode: 422
                code: NEW_PASSWORD_INVALID_FORMAT
            error_9:
              summary: CONFIRM_PASSWORD_REQUIRED
              value:
                statusCode: 422
                code: CONFIRM_PASSWORD_REQUIRED
            error_10:
              summary: CONFIRM_PASSWORD_MUST_BE_STRING
              value:
                statusCode: 422
                code: CONFIRM_PASSWORD_MUST_BE_STRING
            error_11:
              summary: CONFIRM_PASSWORD_NOT_EMPTY
              value:
                statusCode: 422
                code: CONFIRM_PASSWORD_NOT_EMPTY
            error_12:
              summary: USER_CHANGE_PASSWORD_MISMATCH
              value:
                statusCode: 422
                code: USER_CHANGE_PASSWORD_MISMATCH
            error_13:
              summary: UNEXPECTED_FIELD
              value:
                statusCode: 422
                code: UNEXPECTED_FIELD
            error_14:
              summary: VALIDATION_FAILED
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
  servers:
  - url: /identity-service/api/v1
    description: Đường dẫn trực tiếp Identity-Service trên host đang chọn.
