get:
  tags:
  - User
  x-apidog-folder: User
  x-apidog-status: released
  operationId: getUsersDirectory
  security:
  - BearerAuth: []
  summary: Search user directory
  description: |-
    - Người gọi: chỉ `landlord`, `tenant` có `status=active`. Admin nhận 403 `FORBIDDEN`; tài khoản bị khóa nhận 403 `ACCOUNT_LOCKED`.
    - Kết quả: chỉ user `landlord`/`tenant`, `status=active`, chưa bị xóa; luôn loại chính người gọi.
    - `q` tùy chọn; bỏ trống hoặc chỉ có khoảng trắng thì trả danh sách phân trang. Khi có từ khóa, server trim rồi khớp một phần tên không phân biệt chữ hoa/thường và dấu tiếng Việt. Ký tự %, _ và backslash trong q được hiểu theo nghĩa đen.
    - Lọc, đếm `totalItems` và phân trang đều chạy trên DB trước khi cắt trang. Sắp xếp cố định theo `name` tăng dần rồi `id` tăng dần.
    - Mỗi phần tử chỉ có `id`, `name`, `avatarUrl` (URL công khai, `null` nếu chưa có avatar); không trả email, phone, role, status. Hai người trùng tên được trả thành hai phần tử khác `id`.
    - Không cần PostgreSQL extension: Identity chuẩn hóa dấu bằng hàm `translate()` sẵn có trên cả cột `name` và `q`. Truy vấn quét theo điều kiện role/status/is_deleted, không dùng index cho phần tìm tên.
    
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Identity-Service
        participant Guard as JWT/access guards
        participant C as UserDirectoryController
        participant Bus as CQRS QueryBus
        participant H as Application handler
        Client->>GW: GET /api/v1/users/directory
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke getUsersDirectory
        C->>Bus: Execute query for getUsersDirectory
        Bus->>H: Dispatch query handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  parameters:
  - name: q
    in: query
    required: false
    description: Từ khóa tên tùy chọn, 1–100 ký tự sau khi trim; để trống trả danh sách phân trang.
    schema:
      type: string
      minLength: 0
      maxLength: 100
    example: Nguyen
  - name: pageNo
    in: query
    description: Số trang offset, bắt đầu từ 1.
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: pageSize
    in: query
    description: Số bản ghi mỗi trang.
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  responses:
    '200':
      description: 'Thành công: Danh sách Landlord/Tenant đang hoạt động, lọc theo tên nếu có q.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - USER_DIRECTORY_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/UserDirectoryResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: USER_DIRECTORY_FETCHED
            data:
            - id: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
              name: Nguyễn Văn An
              avatarUrl: 'https://media.example.com/avatars/3fa85f64.jpg'
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      description: 'q dài hơn 100 ký tự hoặc không phải chuỗi; pageNo/pageSize ngoài giới hạn; UNEXPECTED_FIELD khi gửi tham số query không có trong contract.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [422] }
              code: { type: string, enum: [VALIDATION_FAILED, UNEXPECTED_FIELD] }
          example:
            statusCode: 422
            code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
