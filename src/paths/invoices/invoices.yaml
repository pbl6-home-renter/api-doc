    ### Sequence diagram — List invoices

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNq9VkFr3EYU_isP9bKhu6zjJodsG8NmJTsbO7uOtHaaYFhmpVlpamlGHkmbbEMOpYdSSqGmh1BKISaE0LSQhBQKq0MOMv4f-id9I2ltr72QQ0t9WEuaN2---d73vpknmi0cqrW0iB4klNtUZ8SVJNjjgH8kiQVPghGV5XtIZMxsFhIeQwdIBB2fUXyu3acjaMJdMWI-vXI5dkPFtre7sEFi-ohML0eYKsKicsJsCiZ1WRTLJWGWCospJ9yeNqIy_HKUrqK2RRS7klr3tuYThs6ojO001tY2WrBhDKBJQtacXG0yPhGYK_piJJtr9xIqpy0YMz-mso6pXWqxr2n51BN1GAsZkLhMtlEly2dvONhCSuqTmAneYE4d9lmefhtALAlI3Dr4LGDVvJGkZB92T97m6YsYXAz8lYGXz444TLPXCdj57FVShpbL4DqdFlxbvQG1Qb8_vNvuPRiaxr0dwxpYFeeUOwugdqlk4yncuT_AdOlLG0Z5-gv-zN5xF79uWmAT26PnAbVtZAE5FvuUQ-yxfPYhqUNEEJvIZ3_bCuKHuAS6BN3KVajt9No7g9t9s_vQ0JcBM1swQEIQ0e8JMB7FWBx6sargUeLHXqUBs1Fu6PinPP0Bp3p5-v3p1LPMVgs6XjJFzhG7gh6CVLqO4jruJfsLdx0zDo-zIxvf8_SdXb9QMphkz-HLRqXExkDRUOa3yvxLKf3k-o3PIUqmWGQgdiwkxHn6B9g-YQGK4GzlBHfXdcAROFZ0Dsa9Azc7Wlxk80w2B0qLdcWGQzGtR3Gq4DhiL-hoMUyVy85mEHrZUdg8PkTSuAeOqpl7VjSrIvXaygrUur3d9lZXH6KezAfD7bbZvmsMDBO7ej5y22jrxYdbbX0uvCuXJXCxACFK5QVHwaQ_M_Dz9Bm7IIk5scRnjuqRMaO-U-40QnEGpF4UkUnqNHni-2Tk0yZFWypYL4nG7IesmsldkT1noA_6yDwD4jhMFZf421KEFF2CRjfHxI8WZK_n6Rvszjz9LpnX6_gwm-G_EsNc_TJ7jt9GCRYdJSRV9_62lNPVVagVvLUH3X5vuN7ubp12w7-mSy874Ucb5r6FfFWY1N6jIodPuOML6VSSVMpGf_YZd4e4Z2cYoPP7UcFiaXVNMR5HtNKV3ijrcp6ZioT9wgIOElzlVNzZn4FqqdnL6UJVO0WnKgUiWC97T_D5BC0ulqKYdQoWm-lV1Tzn67K5UAspfHoKohyxs_eIBCn8RiXNXvMyKXcTdFG-TOyfQW29b97q6rrR-y8KUhk5KyKPAoUGVTl7YyMIT_EWwgSdotohTgsFw86PSFLo89wR4ZxR_X8qqiew68QEfcOqo7K2VAhwVBMrzK2laPdHxN5XIHmENcJ2wp47eYtOLAI80aDG1TmhinEFnVYqYVxHV-n20EJ67a2hZZi7hjk0TLNvIkEE3PMXATT66ki9-VWEqasKB8Vv5V6XCVktFtjtdzuGNVw3Bp3bhg6fAnoIKd0DHeDj7Nyx-r2iNUrrrKhBd6gQwWOU-cvCqLGQKF51XqtTMH2mNpq-WA5sHS9CgHcYSgLE1EHHRrdvDKYhbc5fdBaFIiq86eMwi-WLVq10X-B-JEkYnoLmjlbXAoqomYM3uid7GtIQ0D2tBXuaQ8ck8eM97SkGJaFy2uqqp7VimdC6JkXielqrsMa6hheph0JUg0__AS5TxBY)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: GET /api/v1/invoices<br/>Query: filter, pageSize, pageNo, format
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra query, header theo contract
        break query, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_QUERY_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc invoices thuộc tài sản landlord actor và billing_read_models#59; filter/offset
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Chỉ đọc hóa đơn trong tài sản của actor
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        alt format=json hoặc mặc định
            S-->>G: 200 INVOICES_FETCHED + data theo DTO
            G-->>C: Chuyển tiếp JSON và header
        else format xuất tệp được hỗ trợ
            S-->>G: 200 File stream + Content-Type/Content-Disposition
            G-->>C: Chuyển tiếp tệp#59; không JSON wrapper
        end
    ```
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        contractId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        buildingId:
          type: string
          format: uuid
        status:
          type: string
        period:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: format
    in: query
    description: json trả envelope; định dạng khác trả file stream.
    schema:
      type: string
      enum:
      - json
      - xlsx
      - csv
      - pdf
      default: json
  responses:
    '200':
      description: 'Thành công: Theo dõi hóa đơn và công nợ.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - INVOICES_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/InvoiceListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: INVOICES_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              code: INV-202609-8F2K
              contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              period: 2026-09
              totalAmount: 4610000
              invoiceStatus: issued
              issuedAt: '2026-09-30T20:15:00.000Z'
              roomName: Ví dụ
              tenantName: Ví dụ
              paidAmount: 0
              remainingAmount: 0
              dueDate: '2026-09-23T11:55:00.000Z'
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
        text/csv:
          schema:
            type: string
            format: binary
        application/pdf:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags: [Billing]
  x-apidog-folder: Invoice
  operationId: createSettlementInvoice
  security:
