get:
  tags:
  - Billing
  x-apidog-folder: Invoice
  operationId: getInvoices
  summary: Theo dõi hóa đơn và công nợ
  description: 'landlord. Theo dõi hóa đơn và công nợ. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 VALIDATION FAILED.'
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        contractId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        buildingId:
          type: string
          format: uuid
        status:
          type: string
        period:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: format
    in: query
    description: json trả envelope; định dạng khác trả file stream.
    schema:
      type: string
      enum:
      - json
      - xlsx
      - csv
      - pdf
      default: json
  responses:
    '200':
      description: 'Thành công: Theo dõi hóa đơn và công nợ.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - INVOICES_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/InvoiceListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: INVOICES_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              code: INV-202609-8F2K
              contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              period: 2026-09
              totalAmount: 4610000
              invoiceStatus: issued
              issuedAt: '2026-09-30T20:15:00.000Z'
              roomName: Ví dụ
              tenantName: Ví dụ
              paidAmount: 0
              remainingAmount: 0
              dueDate: '2026-09-23T11:55:00.000Z'
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
        text/csv:
          schema:
            type: string
            format: binary
        application/pdf:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
  - Billing
  x-apidog-folder: Invoice
  operationId: postInvoices
  summary: Tạo hóa đơn quyết toán trả phòng
  description: 'landlord. Tạo hóa đơn quyết toán trả phòng. Lỗi nghiệp vụ: 409 ACTIVE SETTLEMENT INVOICE EXISTS
    · 422 TOTAL NEGATIVE · 422 BREAKDOWN MISMATCH · 403 FORBIDDEN.'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/InvoiceCreateSettlementRequestDto
        example:
          contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          period: 2026-09
          otherFees:
          - name: Phí vệ sinh
            amount: 50000
          - name: Hư hỏng nội thất
            amount: -150000
          note: Thanh ly hợp đồng, prorate theo ngày ở thực tế
  responses:
    '201':
      description: 'Thành công: Tạo hóa đơn quyết toán trả phòng.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - SETTLEMENT_INVOICE_CREATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/InvoiceCreateSettlementResponseDto
          example:
            statusCode: 201
            code: SETTLEMENT_INVOICE_CREATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              code: INV-202609-8F2K
              contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              period: 2026-09
              rentAmount: 1750000
              breakdown:
              - type: electricity
                name: Điện EVN
                qtyKwh: 180
                amount: 720000
              otherFees:
              - name: Phí vệ sinh
                amount: 50000
              - name: Hư hỏng nội thất
                amount: -150000
              totalAmount: 2370000
              invoiceStatus: pending
              issuedAt: null
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/invoices/{invoiceId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      $ref: ../../openapi.yaml#/components/responses/ConflictError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
