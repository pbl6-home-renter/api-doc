mo7XG8JOh63q1PRdmW-TzxbbSwvlxevXrpcXFpfmyq35tl2es28szbeXlkibLI2Gvdl6wIEwCLHUpXOMpGXWzFQoFXrU6xHm4E-fx7sFfNiju4Uq7BYc2iahG-wWnmBQ2JdTRf6bqFDFlkNLBU-EnW6hmo4BpQL-4niA3TN7-OQfjuQB6Q)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: POST /api/v1/invoices<br/>Body: contractId, period, otherFees, note
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc contract, room, chỉ số chốt kỳ và rate_policies áp dụng
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor sở hữu contract#59; đủ chỉ số và chính sách giá#59; không trùng hóa đơn quyết toán
        Note over S,D: Client chỉ gửi contractId, period, otherFees, note#59; không được ấn định rentAmount/breakdown
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (ACTIVE_SETTLEMENT_INVOICE_EXISTS)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Tính rentAmount, điện/nước, otherFees và tổng#59; từ chối tổng âm
        break Kết quả tính toán/OCR hoặc bằng chứng không hợp lệ
            S-->>G: 422 (TOTAL_NEGATIVE / BREAKDOWN_MISMATCH / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Tạo invoice quyết toán pending, issuedAt = null, breakdown và code ổn định#59; số tiền do server tính
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 201 INVOICE_SETTLEMENT_CREATED + data theo DTO<br/>Location: /api/v1/invoices/3fa85f64-5717-4562-b3fc-2c963f66afa6
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/InvoiceCreateSettlementRequestDto'
        example:
          contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          period: '2026-09'
          otherFees:
            - name: Phí vệ sinh
              amount: 50000
            - name: Hư hỏng nội thất
              amount: -150000
          note: Thanh lý hợp đồng, prorate theo ngày ở thực tế
  responses:
    '201':
      description: Tạo hóa đơn quyết toán thành công
      headers:
        Location:
          description: Đường dẫn đến hóa đơn vừa tạo
          schema:
            type: string
            example: /api/v1/invoices/3fa85f64-5717-4562-b3fc-2c963f66afa6
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode:
                type: integer
                enum: [201]
              code:
                type: string
                enum: [INVOICE_SETTLEMENT_CREATED]
              data:
                $ref: '../../openapi.yaml#/components/schemas/InvoiceCreateSettlementResponseDto'
          example:
            statusCode: 201
            code: INVOICE_SETTLEMENT_CREATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              code: INV-202609-8F2K
              contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              period: '2026-09'
              rentAmount: 1750000
              breakdown:
                - type: electricity
                  name: Điện EVN
                  qtyKwh: 180
                  amount: 720000
              otherFees:
                - name: Phí vệ sinh
                  amount: 50000
                - name: Hư hỏng nội thất
                  amount: -150000
              totalAmount: 2370000
              invoiceStatus: pending
              issuedAt: null
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
    '403':
      $ref: '../../openapi.yaml#/components/responses/ForbiddenError'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFoundError'
    '409':
      x-apidog-name: Conflict
      description: Hóa đơn quyết toán đang hiệu lực đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - ACTIVE_SETTLEMENT_INVOICE_EXISTS
                description: |-
                  - ACTIVE_SETTLEMENT_INVOICE_EXISTS: Đã có hóa đơn quyết toán đang hiệu lực cho hợp đồng và kỳ này.
          examples:
            active_settlement_invoice_exists:
              summary: ACTIVE_SETTLEMENT_INVOICE_EXISTS — Đã có hóa đơn quyết toán đang hiệu lực cho hợp đồng và kỳ này.
              value:
                statusCode: 409
                code: ACTIVE_SETTLEMENT_INVOICE_EXISTS
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu quyết toán hoặc dữ liệu nguồn để tính hóa đơn không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - TOTAL_NEGATIVE
                  - BREAKDOWN_MISMATCH
                  - VALIDATION_FAILED
                description: |-
                  - TOTAL_NEGATIVE: Các khoản giảm trừ làm tổng hóa đơn âm.
                  - BREAKDOWN_MISMATCH: Chỉ số, chính sách giá hoặc khoản phí nguồn không khớp để lập bảng tính.
                  - VALIDATION_FAILED: Lỗi validation khác chưa có mã cụ thể.
          examples:
            total_negative:
              summary: TOTAL_NEGATIVE — Các khoản giảm trừ làm tổng hóa đơn âm.
              value:
                statusCode: 422
                code: TOTAL_NEGATIVE
            breakdown_mismatch:
              summary: BREAKDOWN_MISMATCH — Chỉ số, chính sách giá hoặc khoản phí nguồn không khớp để lập bảng tính.
              value:
                statusCode: 422
                code: BREAKDOWN_MISMATCH
            validation_failed:
              summary: VALIDATION_FAILED — Lỗi validation khác chưa có mã cụ thể.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: '../../openapi.yaml#/components/responses/TooManyRequestsError'
    '500':
      $ref: '../../openapi.yaml#/components/responses/InternalServerError'
