post:
  tags:
  - Billing
  x-apidog-folder: Invoice
  operationId: postInvoicesIssueInvoice
  summary: Batch issue invoices
  description: 'landlord. Phát hành nhiều hóa đơn theo lô. Lỗi nghiệp vụ: 422 INVOICE IDS REQUIRED · 422 INVOICE
    IDS TOO LARGE · 409 IDEMPOTENCY KEY REUSED · 403 FORBIDDEN.'
  parameters:
  - name: Idempotency-Key
    in: header
    required: true
    description: UUID chống xử lý trùng, lưu ít nhất 24 giờ.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/InvoiceIssueRequestDto
        example:
          invoiceIds:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
          sendNotification: true
  responses:
    '200':
      description: 'Thành công: Phát hành nhiều hóa đơn theo lô.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - INVOICES_ISSUE_REQUESTED
              data:
                $ref: ../../openapi.yaml#/components/schemas/InvoiceIssueResponseDto
          example:
            statusCode: 200
            code: INVOICES_ISSUE_REQUESTED
            data:
              requested: 2
              succeeded:
              - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                invoiceStatus: pending
                issuedAt: '2026-09-30T20:15:00.000Z'
                vietQrContent: INV-202609-8F2K
              failed:
              - invoiceId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                code: INVOICE_NOT_PENDING
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      $ref: ../../openapi.yaml#/components/responses/ConflictError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
