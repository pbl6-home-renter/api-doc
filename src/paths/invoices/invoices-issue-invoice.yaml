post:
  tags:
  - Billing
  x-apidog-folder: Invoice
  x-apidog-status: developing
  operationId: postInvoicesIssueInvoice
  security:
  - BearerAuth: []
  summary: Issue invoices in a batch
  description: "Landlord-only batch issue, 1–100 unique UUIDs. Required UUID Idempotency-Key. Each invoice has its own result. A completed batch with the same key and normalized invoice IDs replays the saved response; a different request with the same key returns 409 IDEMPOTENCY_KEY_REUSED. Concurrent requests with the same key are serialized. Recovery or exact response replay after the server stops mid-batch is not guaranteed.\n\nSequence diagram\n\n```mermaid\nsequenceDiagram\n    actor User\n    participant API as Tenancy-Service\n    User->>API: POST /invoices/issue-invoice\n    API->>API: Lock idempotency key and check completed response\n    API->>API: Issue each invoice in its own transaction; collect results\n    API->>API: Store completed response with key\n    API-->>User: 200 INVOICES_ISSUE_REQUESTED\n```"
  parameters:
  - name: Idempotency-Key
    in: header
    required: true
    description: UUID scoped to the authenticated landlord and operation; completed responses are retained for 24 hours.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/InvoiceIssueRequestDto
  responses:
    '200':
      description: INVOICES_ISSUE_REQUESTED
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - INVOICES_ISSUE_REQUESTED
              data:
                $ref: ../../openapi.yaml#/components/schemas/InvoiceIssueResponseDto
    '409':
      description: IDEMPOTENCY_KEY_REUSED
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 409
              code:
                type: string
                enum:
                - IDEMPOTENCY_KEY_REUSED
    '422':
      description: INVOICE_IDS_REQUIRED, INVOICE_IDS_TOO_LARGE, VALIDATION_FAILED
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - INVOICE_IDS_REQUIRED
                - INVOICE_IDS_TOO_LARGE
                - VALIDATION_FAILED
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
