  summary: Batch issue invoices
  description: |-
    landlord. Phát hành nhiều hóa đơn theo lô. Lỗi nghiệp vụ: 422 INVOICE IDS REQUIRED · 422 INVOICE IDS TOO LARGE · 409 IDEMPOTENCY KEY REUSED · 403 FORBIDDEN.

    ### Sequence diagram — Batch issue invoices

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

