post:
  tags:
  - Billing
  x-apidog-folder: Invoice
  operationId: postInvoicesInvoiceidCancelInvoice
  security:
    - BearerAuth: []
  summary: Cancel invoice
  description: 'landlord. Huỷ một hóa đơn sai. Lỗi nghiệp vụ: 409 INVOICE ALREADY PAID · 409 CAN''T DELETE · 403
    FORBIDDEN.'
  parameters:
  - name: invoiceId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/InvoiceCancelRequestDto
        example:
          reason: Wrong meter reading
  responses:
    '200':
      description: 'Thành công: Huỷ một hóa đơn sai.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - INVOICE_CANCELLED
              data:
                $ref: ../../openapi.yaml#/components/schemas/InvoiceCancelResponseDto
          example:
            statusCode: 200
            code: INVOICE_CANCELLED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              invoiceStatus: void
              cancelReason: Wrong meter reading
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - INVOICE_ALREADY_PAID
                  - CANNOT_DELETE
                description: |-
                  - INVOICE_ALREADY_PAID: Hóa đơn đã được thanh toán.
                  - CANNOT_DELETE: Tài nguyên chưa đủ điều kiện để xóa.
          examples:
            invoice_already_paid:
              summary: INVOICE_ALREADY_PAID — Hóa đơn đã được thanh toán.
              value:
                statusCode: 409
                code: INVOICE_ALREADY_PAID
            cannot_delete:
              summary: CANNOT_DELETE — Tài nguyên chưa đủ điều kiện để xóa.
              value:
                statusCode: 409
                code: CANNOT_DELETE
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
