post:
  tags:
  - Billing
  x-apidog-folder: Invoice
  x-apidog-status: developing
  operationId: postInvoicesInvoiceidCancelInvoice
  security:
  - BearerAuth: []
  summary: Void an invoice
  description: "Landlord-only void operation. Requires reason of 1–500 characters, stores voidReason, and emits invoice.voided. A voided invoice cannot be voided again.\n\nSequence diagram\n\n```mermaid\nsequenceDiagram\n    actor User\n    participant API as Tenancy-Service\n    User->>API: POST /invoices/{invoiceId}/cancel-invoice\n    API->>API: Lock invoice and verify ownership\n    API->>API: Void invoice and persist reason plus event\n    API-->>User: 200 INVOICE_CANCELLED\n```"
  parameters:
  - name: invoiceId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/InvoiceCancelRequestDto
  responses:
    '200':
      description: INVOICE_CANCELLED
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - INVOICE_CANCELLED
              data:
                $ref: ../../openapi.yaml#/components/schemas/InvoiceCancelResponseDto
    '404':
      description: INVOICE_NOT_FOUND
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - INVOICE_NOT_FOUND
    '409':
      description: INVOICE_ALREADY_VOIDED
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 409
              code:
                type: string
                enum:
                - INVOICE_ALREADY_VOIDED
    '422':
      description: VALIDATION_FAILED
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - VALIDATION_FAILED
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
