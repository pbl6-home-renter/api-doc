post:
  tags:
  - Billing
  x-apidog-folder: Invoice
  operationId: postInvoicesInvoiceidCancelInvoice
  summary: Cancel invoice
  description: 'landlord. Huỷ một hóa đơn sai. Lỗi nghiệp vụ: 409 INVOICE ALREADY PAID · 409 CAN''T DELETE · 403
    FORBIDDEN.'
  parameters:
  - name: invoiceId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/InvoiceCancelRequestDto
        example:
          reason: Wrong meter reading
  responses:
    '200':
      description: 'Thành công: Huỷ một hóa đơn sai.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - INVOICE_CANCELLED
              data:
                $ref: ../../openapi.yaml#/components/schemas/InvoiceCancelResponseDto
          example:
            statusCode: 200
            code: INVOICE_CANCELLED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              invoiceStatus: void
              cancelReason: Wrong meter reading
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      $ref: ../../openapi.yaml#/components/responses/ConflictError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
