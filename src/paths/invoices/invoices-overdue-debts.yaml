get:
  tags:
  - Billing
  x-apidog-folder: Invoice
  operationId: getOverdueDebts
  security:
    - BearerAuth: []
  summary: List overdue debts
  description: |-
    landlord. Danh sách các phòng nợ tiền quá hạn, mức độ quá hạn và lịch sử đôn đốc nợ. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 VALIDATION FAILED.

    ### Sequence diagram — List overdue debts

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: GET /api/v1/invoices/overdue-debts<br/>Query: buildingId, minDaysOverdue
        G->>G: Gắn correlation-id
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra query, header theo contract
        break query, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_QUERY_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc invoices chưa thu đủ, ngày hạn trả và lịch sử đôn đốc trong phạm vi actor
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Lọc buildingId/minDaysOverdue#59; tính số ngày quá hạn từ hạn trả và grace period
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (INVALID_MIN_DAYS_OVERDUE / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Tổng hợp công nợ và mức độ quá hạn theo response DTO
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 DEBTS_OVERDUE_FETCHED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: buildingId
    in: query
    required: false
    description: Lọc danh sách công nợ theo tòa nhà.
    schema:
      type: string
      format: uuid
  - name: minDaysOverdue
    in: query
    required: false
    description: "Số ngày quá hạn tối thiểu (VD: 3 ngày, 7 ngày)."
    schema:
      type: integer
      minimum: 1
      example: 3
  responses:
    "200":
      description: "Thành công: Lấy danh sách công nợ quá hạn."
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - DEBTS_OVERDUE_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/OverdueDebtListResponseDto
    "400":
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    "401":
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    "403":
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm quy tắc của endpoint.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - INVALID_MIN_DAYS_OVERDUE
                  - VALIDATION_FAILED
                description: |-
                  - INVALID_MIN_DAYS_OVERDUE: minDaysOverdue phải là số nguyên dương.
                  - VALIDATION_FAILED: Bộ lọc công nợ vi phạm ràng buộc khác.
          examples:
            invalid_min_days_overdue:
              summary: INVALID_MIN_DAYS_OVERDUE — minDaysOverdue phải là số nguyên dương.
              value:
                statusCode: 422
                code: INVALID_MIN_DAYS_OVERDUE
            validation_failed:
              summary: VALIDATION_FAILED — Bộ lọc công nợ vi phạm ràng buộc khác.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
