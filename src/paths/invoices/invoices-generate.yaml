post:
  tags:
  - Billing
  x-apidog-folder: Invoice
  x-apidog-status: developing
  operationId: postInvoicesGenerate
  security:
  - BearerAuth: []
  summary: Generate or recalculate pending invoices
  description: "Landlord generates or recalculates pending invoices by building and period. Existing issued invoices are skipped; recalculation preserves otherFees and note. A replacement after void links to the voided invoice. Missing inputs are reported in blocked; no meter event automatically generates invoices.\n\nSequence diagram\n\n```mermaid\nsequenceDiagram\n    actor User\n    participant API as Tenancy-Service\n    User->>API: POST /invoices/generate\n    API->>API: Verify building ownership and period\n    API->>API: Find active contracts and calculate each eligible invoice\n    API->>API: Save generated/recalculated invoices; collect blocked reasons\n    API-->>User: 200 INVOICES_GENERATED\n```"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/InvoiceGenerateRequestDto
  responses:
    '200':
      description: INVOICES_GENERATED
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - INVOICES_GENERATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/InvoiceGenerateResponseDto
    '404':
      description: BUILDING_NOT_FOUND
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - BUILDING_NOT_FOUND
    '422':
      description: VALIDATION_FAILED
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - VALIDATION_FAILED
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
