  summary: Get invoice details
  description: |-
    landlord, tenant. Đọc hóa đơn kèm tổng hợp thanh toán. Lỗi nghiệp vụ: 403 FORBIDDEN · 404 NOT FOUND.

    ### Sequence diagram — Get invoice details

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNqtVl1r40YU_SsX9cWhNs5usw_rwoLWUhJvEisrKdl2CZixNLGGSDNaaeStCXkofSilFLqUUkofuiEspV9kQwsF62EfHPZ_6J_0juSvJH5cP8iS58yde88598qnmid8qrW0lL7IKPeowcggIdERB_yQTAqeRX2aVM8xSSTzWEy4hDaQFNoho3hfe0b70IQ90WchXbuL3VJYfb8DW0TSl2R0F2ErhEOTIfMo2HTAUpmsgDkKJikn3Bs10gp-F2Uo1L5I5SChztPd2Yae36-w7cajR1st2DJdaJKYNYf3mowPBcZKm6fTu45_VoG3puBifMnBE0lCQyKZ4A3m1-GEFflXEciEQIKlQcgiJqt9_YSSEzh8_7bILyQMEPgLg6AYn3MYTf7IwCvGv2UVtDoGz2m3YOP-Q6i5ltXb07uf92zz6YHpuM6UU8r9G0kd0oQdj-DJMxfD5W886Bf5z3gZX_EB_rrjgEe8gC4npHtYJXIoTigHGbBi_C6rQ0owN1GM__NUiu9kleiK7NbvQe2gqx-425bdeW4aqxKzW-AiIZjR7xkwnkokn95WDQJKQhlMNbYbVUHX3xf5t7g1KPJv5lsXkZ0WtINshJxj7ir1GBLl21TWsZbJv1i1ZBy-mJx7-FzkV179lmQwnLyGzxpTpzVcRUMV36nir6T0owcPP4U0G6HIQDwpEpBF_id4IWERmmBxcobVdXzwBa6VnYG4KxhMzm8esrOwTUxkUFdk-BSjBhR3Co4L3g0b3UApsbzJGOJgch43r18hZTwAXyk2WEjmTCndWF-HWqd7qO92jN6-7m7jxdb3TNe0sWVnC9umbpQ_PNaNmevW7up_m_0YfXLB0S35DwzCIv-J3fKDKtiodP3Og2lvlSLgqAgZH_SwPr8X4RAKU8XWj8gkhruIkQyCZUkxJ89oVOwZRX6JnVbkX2cz056Upn2RYTZzOSZ_RcoE4zejZSZ37qzi_WsGfJBhW2JhicBlVdd5BEOGzyg79urf8SpqN6Bmm451YLfNXtdye5vWQdf4ULxhqXppthDpCgn3Q5H4kBb5r2rj5bz4srMkWuIfZACP-ZKDMsWC7ypkV-CAEkM0kFNHSdxlrmMyipRdX2Q4yFAQKAWZkrEYn2UfTPl9YnW6s33zyXqD4-tXkzF-JSKkc52qleVUZVLSvqTBKqI_gdqmZT_uGIbZ_RD83iJjV0GAY6uzsuFbKuuwT7wT1aQ8xXbE-YFz6f1bnE4iwikPNa5mp6plDadPoqz3AHut08XO6uq7Pce0D027Z9q2ZZfEDpZffrPS7pdbDq0OOmjTdNvbpgEfg08kqaaB4Vqz-be6VJyRMkvr0Bf-qGysVbNEq2sRTSLCfHzVnx5puBjRI60FR5pPj0kWyiPtDEFZjCfP_gNoLTQ_rWuJyAaB1jomYYpP-IZ9LsR08ex_P9oLew)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: GET /api/v1/invoices/{invoiceId}
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra path, header theo contract
        break path, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc invoice và billing_read_models tổng hợp thanh toán
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor là landlord sở hữu hoặc tenant có quyền đọc invoice
        Note over S,D: Tổng hợp payment qua read model trong tenancy_db#59; không JOIN payment_db
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 INVOICE_FETCHED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: invoiceId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc hóa đơn kèm tổng hợp thanh toán.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - INVOICE_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/InvoiceDetailResponseDto
          example:
            statusCode: 200
            code: INVOICE_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              code: INV-202609-8F2K
              period: 2026-09
              rentAmount: 3500000
              breakdown:
              - type: electricity
                name: Điện EVN
                amount: 720000
              otherFees: []
              totalAmount: 4220000
              invoiceStatus: pending
              issuedAt: null
              paidAmount: 0
              remainingAmount: 4220000
              contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomName: Ví dụ
              tenantName: Ví dụ
              services: []
              dueDate: '2026-09-23T11:55:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
patch:
  tags:
  - Billing
  x-apidog-folder: Invoice
  operationId: patchInvoicesInvoiceid
  security:
    - BearerAuth: []
  summary: Update pending invoice
  description: |-
    landlord. Sửa hóa đơn đang chờ. Lỗi nghiệp vụ: 409 INVOICE ALREADY ISSUED · 422 TOTAL AMOUNT INVALID · 403 FORBIDDEN.

    ### Sequence diagram — Update pending invoice

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNq1Vk1v20YQ_SsD9aKgEpS4ySFqG4AWaZuJLTok5TSBAWFFrsWFqaXCD7VCkEPQQ1AEBWoURVEUQWMYQdAPwwlSoKh0yEFG_gf_SWd3KZu25VNSH2SSOzs7M-_Nm31U8SKfVpqVhD7MKPeozkg_JoNtDvhHsjTi2aBHY_U-JHHKPDYkPIUWkARaIaP4XL1He9CAjajHQnrlou2qsNU2TVglKf2ajC9a2MLCofGIeRRs2mdJGi8wc4RZSjnh3rieKPOLVrqw2oyStB9T5-76fEPX7ynbVv3WrdUmbGpuaw0aZMgao2sNxkcReksaj4on03_8RS9u3FqO_HETojSg8QqlSQ14lBaHripHq_nkiIMXxTENScoiXmd-DXZZPv12AGlMIMa0IWQDlqp9vZiSXdh6_zqfHqTQR8NfGQT5ZJ_DePZHBl4-eZUpU3UMntNqwvWlm1B1Lau7obXvd23jbsdwXKeoN-X-maC2aMx2xnD7novupi896OXTX_Bn8ob38esdBzziBbQckOZh_ljfaJdySAOWT95lNUgIxhblk388EeK7VAW6ILqr16DaaWsdd82yzQeGvigwuwkuFgQj-j0DxpMUgaHnEYWAkjANCvztukro-Id8-gy3Bvn0u5Otp56dJrSCbIw1x9hF6EOIBaeTtIa5zP7GrFPG4ZvZvofv-fSNVzsHGYxmL-CresHCuivKoPw7yv_Ckn5y4-bnkGRjBBmIl0YxpPn0T_BCwgZIgtOTM8zO9MGPcE12Ddq9gf5s_-whd05pc9ux2o0e0q-G9E6DmqiLT_GAgKKTiKONd4ZRl20QEHqzCQyD2f6wcbyHheQB-ALH_hzbAm_pA4QPwZWjFHoZJumdwu0UcFy_ehWqZntLWzf1rtzUgPlrQc3usqXfL33GhlvDH1vbMFzDLi2sGZouPyxrJ5uvXGTYeXyHyMQDjnyc_sggzKc_s3OMm-NGQuaLFtxhNPRV-RLk_oDUJEdYTP0Gz8KQ9ELaoKh4ElSFI3rfY8VO3o9mLxjoroXAMiC-zwR3SLgZR0OKAkSTL3dImBS0bKNQQDRCAJy52ij2Yn8fDoFj-Idp4fp4T6qBB_18esjk-WoBOfYMIpQOqRNHGEOGGsHLsOvie4irT7M54Y73ZhP8p7KcQxzPXuA3BSgSTBz4nPcXQLu0BFWJjOaaVru7opnrJ-38wYDoqpW_96AQWtl3aazYiK26zyRRUWgw3kBt1OsKynKqRVa7UpQeZnj0SbvN_hqIJp-8HJfrdOfCKj4jnkVJMYYIl0US-wMYMXzHtpZYLaL_dajahmN17JbRbVtud8XqtPWPyFpNikmST38TtkfZvFySG_PSHe8RETLuZbyPgha8f02AJUlG_TmHfxI8IJnwdEiEq4OhOPbpgsoUrImjkJ5UV614s7dYYszjiSiTLFapcovK8xlUVyx72dR1o_0xqlLMTDbH53gPWfAkk2P2KT_HnyJ4v8QWjPpfleJBaTQvivym1DXLRFy1dRul6X7XdJzOx-mA82lgURGkyZGHtQxEpEMY4WwRA-YVEduGEcNZIQAUklO6VJSSu6SFXcvV1rvaBhLT7RZaiyL7f3b2srFqtkV4PMHZhNp4ZrVV1j1PTGKlcUJQpQgotgazt0QIIl6HFL-Faj4_68na2DDdy7VBwhy-f51dUOIa7l4XCQBHHWRyhjcF5cMe8XbLoRfd5EUDob5VLscjNsKVmmTbAdzAEWi2cZS1scyOYW8ZdtewbctGVAn0y3fdOS5LcosiV2cTUTB0-BRwOBE1lrAS8yvNYiDw2pNmeAmVE1rUbNGdoFKrDGg8IMzHm_2j7QouDuh2pQnbFZ_ukCxMtyuP0SgbirFYXPkrTdQ7WqvEUdYPKk05x2oVvFA_iKJi8fF_db6NoA)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: PATCH /api/v1/invoices/{invoiceId}<br/>Body: otherFees, note
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, path, header theo contract
        break JSON/body, path, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        Note over S: PATCH chỉ cập nhật field được gửi#59; field bị omit giữ nguyên
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc invoice và trạng thái phát hành
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor sở hữu invoice#59; invoice đang pending, chưa issued#59; tổng sau sửa hợp lệ
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (INVOICE_ALREADY_ISSUED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (TOTAL_AMOUNT_INVALID / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Cập nhật các field DTO và tổng hóa đơn đang chờ
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 INVOICE_UPDATED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: invoiceId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/InvoiceUpdateRequestDto
        example:
          otherFees:
          - name: Giảm trừ
            amount: -100000
          note: Adjustment approved
  responses:
    '200':
      description: 'Thành công: Sửa hóa đơn đang chờ.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - INVOICE_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/InvoiceUpdateResponseDto
          example:
            statusCode: 200
            code: INVOICE_UPDATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              otherFees:
              - name: Giảm trừ
                amount: -100000
              totalAmount: 4120000
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - INVOICE_ALREADY_ISSUED
                description: |-
                  - INVOICE_ALREADY_ISSUED: Hóa đơn đã được phát hành.
          examples:
            invoice_already_issued:
              summary: INVOICE_ALREADY_ISSUED — Hóa đơn đã được phát hành.
              value:
                statusCode: 409
                code: INVOICE_ALREADY_ISSUED
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - TOTAL_AMOUNT_INVALID
                  - VALIDATION_FAILED
                description: |-
                  - TOTAL_AMOUNT_INVALID: Tổng tiền không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            total_amount_invalid:
              summary: TOTAL_AMOUNT_INVALID — Tổng tiền không hợp lệ.
              value:
                statusCode: 422
                code: TOTAL_AMOUNT_INVALID
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
