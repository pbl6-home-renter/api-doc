get:
  tags:
  - Billing
  x-apidog-folder: Invoice
  x-apidog-status: developing
  operationId: getInvoicesInvoiceid
  security:
  - BearerAuth: []
  summary: Get invoice detail
  description: "Landlords can view their own invoices in any status. Tenants can view only issued invoices from a contract where they are the representative or a linked member who has not left. For tenants, missing, pending, void, foreign-contract and departed-member invoices all return 404 INVOICE_NOT_FOUND. Tenant detail omits voidReason; neither role receives QR/payment fields.\n\nSequence diagram\n\n```mermaid\nsequenceDiagram\n    actor User\n    participant API as Tenancy-Service\n    User->>API: GET /invoices/{invoiceId}\n    API->>API: Apply role-specific ownership and issued filter\n    API-->>User: 200 detail or 404 for hidden tenant invoice\n```"
  parameters:
  - name: invoiceId
    in: path
    required: true
    schema: &id001
      type: string
      format: uuid
  responses:
    '200':
      description: INVOICE_FETCHED
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - INVOICE_FETCHED
              data:
                anyOf:
                - $ref: ../../openapi.yaml#/components/schemas/InvoiceDetailResponseDto
                - $ref: ../../openapi.yaml#/components/schemas/InvoiceTenantDetailResponseDto
    '404':
      description: INVOICE_NOT_FOUND
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - INVOICE_NOT_FOUND
    '400': &id002
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401': &id003
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403': &id004
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '429': &id005
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500': &id006
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
    '503': &id007
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
patch:
  tags:
  - Billing
  x-apidog-folder: Invoice
  x-apidog-status: developing
  operationId: patchInvoicesInvoiceid
  security:
  - BearerAuth: []
  summary: Update pending invoice extras
  description: "Landlord-only update of a pending invoice. Omitted fields are unchanged; [] clears otherFees; note: null clears note. An empty object or otherFees: null returns 422 VALIDATION_FAILED. Fees: at most 20 rows, signed decimal input with at most two fractional digits.\n\nSequence diagram\n\n```mermaid\nsequenceDiagram\n    actor User\n    participant API as Tenancy-Service\n    User->>API: PATCH /invoices/{invoiceId}\n    API->>API: Lock invoice, check landlord and pending status\n    API->>API: Replace fees or note and recalculate total\n    API->>API: Save invoice and domain event\n    API-->>User: 200 INVOICE_UPDATED\n```"
  parameters:
  - name: invoiceId
    in: path
    required: true
    schema: *id001
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/InvoiceUpdateRequestDto
  responses:
    '200':
      description: INVOICE_UPDATED
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - INVOICE_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/InvoiceUpdateResponseDto
    '404':
      description: INVOICE_NOT_FOUND
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - INVOICE_NOT_FOUND
    '409':
      description: INVOICE_ALREADY_ISSUED
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 409
              code:
                type: string
                enum:
                - INVOICE_ALREADY_ISSUED
    '422':
      description: TOTAL_NEGATIVE, VALIDATION_FAILED
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - TOTAL_NEGATIVE
                - VALIDATION_FAILED
    '400': *id002
    '401': *id003
    '403': *id004
    '429': *id005
    '500': *id006
    '503': *id007
