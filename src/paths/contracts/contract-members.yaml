post:
  tags:
  - Contract
  x-apidog-folder: ContractMember
  x-apidog-status: released
  operationId: postContractMembers
  security:
    - BearerAuth: []
  summary: Add contract member
  description: |-
    Only contractId, tenantId?, tenantName, tenantPhone?, joinedAt are accepted; unknown fields return
    422 VALIDATION_FAILED. An explicit tenantId is used as supplied. The current add handler does
    not yet auto-link by phone. P9-02 will match a normalized tenantPhone exactly against Tenancy's
    local Identity-event projection only when tenantId is absent; no match leaves tenantId null for
    later reconciliation. This operation does not call Identity synchronously, and events sent to
    Community contain IDs/context rather than phone.
    Without tenantId, tenantName and tenantPhone are required (422 TENANT_IDENTITY_INVALID).
    joinedAt is an inclusive date in [startDate, endDate] (422 VALIDATION_FAILED).
    
    After locking the contract, reject an active member matching tenantId or tenantPhone
    (ignore null fields) with 409 MEMBER_ALREADY_EXISTS. Active means leftAt is null or after today
    in UTC, including scheduled future departures. Non-active contract: 409 CONTRACT_NOT_ACTIVE.
    Save the member and contract_member.added outbox event in one transaction. Return 201
    CONTRACT_MEMBER_ADDED and Location: /api/v1/contract-members/{contractMemberId}.
    
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant Guard as JWT/access guards
        participant C as ContractMemberController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: POST /api/v1/contract-members
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke postContractMembers
        C->>Bus: Execute command for postContractMembers
        Bus->>H: Dispatch command handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ContractMemberAddRequestDto
        example:
          contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          tenantName: Nguyễn Thị C
          tenantPhone: '0921234567'
          joinedAt: '2026-09-01'
  responses:
    '201':
      description: 'Thành công: Thêm một thành viên vào hợp đồng.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - CONTRACT_MEMBER_ADDED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractMemberAddResponseDto
          example:
            statusCode: 201
            code: CONTRACT_MEMBER_ADDED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              joinedAt: '2026-09-01'
              leftAt: null
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/contract-members/{contractMemberId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - CONTRACT_NOT_ACTIVE
                  - MEMBER_ALREADY_EXISTS
                description: |-
                  - MEMBER_ALREADY_EXISTS: Người này đã là thành viên của hợp đồng.
          examples:
            member_already_exists:
              summary: MEMBER_ALREADY_EXISTS — Người này đã là thành viên của hợp đồng.
              value:
                statusCode: 409
                code: MEMBER_ALREADY_EXISTS
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - TENANT_IDENTITY_INVALID
                  - VALIDATION_FAILED
                description: |-
                  - TENANT_IDENTITY_INVALID: Thông tin nhận diện người thuê không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            tenant_identity_invalid:
              summary: TENANT_IDENTITY_INVALID — Thông tin nhận diện người thuê không hợp lệ.
              value:
                statusCode: 422
                code: TENANT_IDENTITY_INVALID
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
get:
  tags:
  - Contract
  x-apidog-folder: ContractMember
  x-apidog-status: released
  operationId: getContractMembers
  security:
    - BearerAuth: []
  summary: List contract members
  description: |-
    Missing filter[contractId] returns 422 CONTRACT_ID_REQUIRED; unknown/deleted contract returns
    404 RESOURCE_NOT_FOUND; other users receive 403 FORBIDDEN. An active member has leftAt null
    or after today in UTC. Past and current-day departures do not grant access.
    
    Only format=json is supported (other formats: 422 VALIDATION_FAILED). Offset pagination,
    default pageNo=1, pageSize=20 (maximum 100), sort=joinedAt, order=asc, id ascending tie breaker.
    Items include id, contractId, tenantId, tenantName, tenantPhone, joinedAt, leftAt and derived
    status (active | left). No representative flag, identity card fields or temporary-absence status.
    
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant Guard as JWT/access guards
        participant C as ContractMemberController
        participant Bus as CQRS QueryBus
        participant H as Application handler
        Client->>GW: GET /api/v1/contract-members
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke getContractMembers
        C->>Bus: Execute query for getContractMembers
        Bus->>H: Dispatch query handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  parameters:
  - name: filter
    in: query
    required: true
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        contractId:
          type: string
          format: uuid
      required:
      - contractId
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: format
    in: query
    description: Only json is supported; other formats return 422 VALIDATION_FAILED.
    schema:
      type: string
      enum:
      - json
      default: json
  - name: sort
    in: query
    schema:
      type: string
      enum: [joinedAt]
      default: joinedAt
  - name: order
    in: query
    schema:
      type: string
      enum: [asc, desc]
      default: asc
  responses:
    '200':
      description: 'Thành công: Liệt kê thành viên hoặc xuất dữ liệu.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACT_MEMBERS_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/ContractMemberListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: CONTRACT_MEMBERS_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              tenantName: Trần Văn B
              joinedAt: '2026-09-01'
              leftAt: null
              tenantId: null
              tenantPhone: '0921234567'
              status: active
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - CONTRACT_ID_REQUIRED
                  - VALIDATION_FAILED
                description: |-
                  - CONTRACT_ID_REQUIRED: Thiếu mã hợp đồng.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            contract_id_required:
              summary: CONTRACT_ID_REQUIRED — Thiếu mã hợp đồng.
              value:
                statusCode: 422
                code: CONTRACT_ID_REQUIRED
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
