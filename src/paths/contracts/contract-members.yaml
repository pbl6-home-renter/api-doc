Ry3mF2ctEUe1bESQgC8aRyq1ikdDjzAHf9Y82q7gS49uV5qwXXHoDoldsV15jEZxIC_s_PdOpSnCmNYqoR8PR5WmumFrFfyF8MD385eP_wXXXPIC)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        participant I as identity-service
        C->>G: POST /api/v1/contract-members<br/>Body: contractId, tenantId, tenantName, tenantPhone, identityCardNumber<br/>dateOfBirth, gender, isRepresentative, joinedAt
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc contract, thành viên hiện có và sức chứa phòng
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        opt Có tenantId liên kết tài khoản
            S->>I: Đọc user/role tenant theo tenantId (service token)
            I-->>S: Danh tính tài khoản và trạng thái
        end
        Note over S,D: Cho phép thông tin người thuê chưa có tài khoản theo DTO#59; không bắt người thuê đăng nhập
        S->>S: Actor sở hữu contract#59; danh tính tenant hợp lệ#59; thành viên chưa tồn tại
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (MEMBER_ALREADY_EXISTS)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (TENANT_IDENTITY_INVALID / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Thêm contract_member với joinedAt/isRepresentative và thông tin tenant theo DTO
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 201 CONTRACT_MEMBER_ADDED + data theo DTO<br/>Location: /api/v1/contract-members/{contractMemberId}
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ContractMemberAddRequestDto
        example:
          contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          tenantName: Nguyễn Thị C
          tenantPhone: '0921234567'
          joinedAt: '2026-09-01'
  responses:
    '201':
      description: 'Thành công: Thêm một thành viên vào hợp đồng.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - CONTRACT_MEMBER_ADDED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractMemberAddResponseDto
          example:
            statusCode: 201
            code: CONTRACT_MEMBER_ADDED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              joinedAt: '2026-09-01'
              leftAt: null
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/contract-members/{contractMemberId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - MEMBER_ALREADY_EXISTS
                description: |-
                  - MEMBER_ALREADY_EXISTS: Người này đã là thành viên của hợp đồng.
          examples:
            member_already_exists:
              summary: MEMBER_ALREADY_EXISTS — Người này đã là thành viên của hợp đồng.
              value:
                statusCode: 409
                code: MEMBER_ALREADY_EXISTS
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - TENANT_IDENTITY_INVALID
                  - VALIDATION_FAILED
                description: |-
                  - TENANT_IDENTITY_INVALID: Thông tin nhận diện người thuê không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            tenant_identity_invalid:
              summary: TENANT_IDENTITY_INVALID — Thông tin nhận diện người thuê không hợp lệ.
              value:
                statusCode: 422
                code: TENANT_IDENTITY_INVALID
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
