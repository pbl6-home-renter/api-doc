post:
  tags:
  - Contract
  x-apidog-folder: ContractMember
  x-apidog-status: released
  operationId: postContractMembers
  security:
    - BearerAuth: []
  summary: Add contract member
  description: |-
    Landlord only. The contract must exist, belong to the JWT user, and be active.
    Only contractId, tenantId?, tenantName, tenantPhone?, joinedAt are accepted; unknown fields return
    422 VALIDATION_FAILED. tenantId is linked explicitly, with no Identity lookup or phone auto-linking.
    Without tenantId, tenantName and tenantPhone are required (422 TENANT_IDENTITY_INVALID).
    joinedAt is an inclusive date in [startDate, endDate] (422 VALIDATION_FAILED).

    After locking the contract, reject an active member matching tenantId or tenantPhone
    (ignore null fields) with 409 MEMBER_ALREADY_EXISTS. Active means leftAt is null or after today
    in UTC, including scheduled future departures. Non-active contract: 409 CONTRACT_NOT_ACTIVE.
    Save the member and contract_member.added outbox event in one transaction. Return 201
    CONTRACT_MEMBER_ADDED and Location: /api/v1/contract-members/{contractMemberId}.

    ```mermaid
    sequenceDiagram
        participant GW as API Gateway
        participant TEN as Tenancy
        participant DB as Tenancy DB
        GW->>TEN: POST /contract-members
        TEN->>TEN: Verify JWT, landlord role, active account and request
        TEN->>DB: BEGIN; lock contract FOR UPDATE (before locking member)
        TEN->>TEN: Require owner, active contract, valid dates/identity; check active duplicates
        alt Missing record / forbidden / business validation failure
            TEN->>DB: ROLLBACK
            TEN-->>GW: 404 / 403 / 409 / 422
        else Valid operation
            TEN->>DB: INSERT contract_members; INSERT contract_member.added into outbox
            TEN->>DB: COMMIT
            TEN-->>GW: 201 CONTRACT_MEMBER_ADDED + Location
        end
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ContractMemberAddRequestDto
        example:
          contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          tenantName: Nguyễn Thị C
          tenantPhone: '0921234567'
          joinedAt: '2026-09-01'
  responses:
    '201':
      description: 'Thành công: Thêm một thành viên vào hợp đồng.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - CONTRACT_MEMBER_ADDED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractMemberAddResponseDto
          example:
            statusCode: 201
            code: CONTRACT_MEMBER_ADDED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              joinedAt: '2026-09-01'
              leftAt: null
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/contract-members/{contractMemberId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - CONTRACT_NOT_ACTIVE
                  - MEMBER_ALREADY_EXISTS
                description: |-
                  - MEMBER_ALREADY_EXISTS: Người này đã là thành viên của hợp đồng.
          examples:
            member_already_exists:
              summary: MEMBER_ALREADY_EXISTS — Người này đã là thành viên của hợp đồng.
              value:
                statusCode: 409
                code: MEMBER_ALREADY_EXISTS
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - TENANT_IDENTITY_INVALID
                  - VALIDATION_FAILED
                description: |-
                  - TENANT_IDENTITY_INVALID: Thông tin nhận diện người thuê không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            tenant_identity_invalid:
              summary: TENANT_IDENTITY_INVALID — Thông tin nhận diện người thuê không hợp lệ.
              value:
                statusCode: 422
                code: TENANT_IDENTITY_INVALID
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
get:
  tags:
  - Contract
  x-apidog-folder: ContractMember
  x-apidog-status: released
  operationId: getContractMembers
  security:
    - BearerAuth: []
  summary: List contract members
  description: |-
    Landlord owning the contract, or tenant who is the contract representative or an active member.
    Missing filter[contractId] returns 422 CONTRACT_ID_REQUIRED; unknown/deleted contract returns
    404 RESOURCE_NOT_FOUND; other users receive 403 FORBIDDEN. An active member has leftAt null
    or after today in UTC. Past and current-day departures do not grant access.

    Only format=json is supported (other formats: 422 VALIDATION_FAILED). Offset pagination,
    default pageNo=1, pageSize=20 (maximum 100), sort=joinedAt, order=asc, id ascending tie breaker.
    Items include id, contractId, tenantId, tenantName, tenantPhone, joinedAt, leftAt and derived
    status (active | left). No representative flag, identity card fields or temporary-absence status.

    ```mermaid
    sequenceDiagram
        participant GW as API Gateway
        participant TEN as Tenancy
        participant DB as Tenancy DB
        GW->>TEN: GET /contract-members?filter[contractId]=UUID
        TEN->>TEN: Verify JWT, landlord/tenant role, active account and query
        TEN->>DB: Read non-deleted contract
        TEN->>DB: If tenant is not representative, read active contract members
        TEN->>TEN: Require owner or representative or active member
        alt Missing filter / unknown contract / unauthorized
            TEN-->>GW: 422 CONTRACT_ID_REQUIRED / 404 RESOURCE_NOT_FOUND / 403 FORBIDDEN
        else Authorized
            TEN->>DB: Count and page non-deleted members ORDER BY joined_at, id
            TEN-->>GW: 200 CONTRACT_MEMBERS_FETCHED + offset pagination
        end
    ```
  parameters:
  - name: filter
    in: query
    required: true
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        contractId:
          type: string
          format: uuid
      required:
      - contractId
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: format
    in: query
    description: Only json is supported; other formats return 422 VALIDATION_FAILED.
    schema:
      type: string
      enum:
      - json
      default: json
  - name: sort
    in: query
    schema:
      type: string
      enum: [joinedAt]
      default: joinedAt
  - name: order
    in: query
    schema:
      type: string
      enum: [asc, desc]
      default: asc
  responses:
    '200':
      description: 'Thành công: Liệt kê thành viên hoặc xuất dữ liệu.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACT_MEMBERS_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/ContractMemberListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: CONTRACT_MEMBERS_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              tenantName: Trần Văn B
              joinedAt: '2026-09-01'
              leftAt: null
              tenantId: null
              tenantPhone: '0921234567'
              status: active
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - CONTRACT_ID_REQUIRED
                  - VALIDATION_FAILED
                description: |-
                  - CONTRACT_ID_REQUIRED: Thiếu mã hợp đồng.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            contract_id_required:
              summary: CONTRACT_ID_REQUIRED — Thiếu mã hợp đồng.
              value:
                statusCode: 422
                code: CONTRACT_ID_REQUIRED
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
