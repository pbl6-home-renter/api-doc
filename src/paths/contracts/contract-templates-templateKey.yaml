get:
  tags:
  - Contract
  x-apidog-folder: ContractTemplate
  x-apidog-status: released
  operationId: getContractTemplatesTemplatekey
  security:
    - BearerAuth: []
  summary: Get contract template
  description: |-
    Mẫu không tồn tại, inactive hoặc đã xóa mềm đều trả 404 RESOURCE_NOT_FOUND.
    Response gồm templateKey, title, version và requiredVariables; không trả body HTML.
    Mẫu seed hiện tại là standard-room-lease-v1. landlordName là biến tùy chọn;
    tenantCccd chưa được điền tự động vì Contract hiện tại không có field này.
    
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant Guard as JWT/access guards
        participant C as ContractTemplateController
        participant Bus as CQRS QueryBus
        participant H as Application handler
        Client->>GW: GET /api/v1/contract-templates/{templateKey}
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke getContractTemplatesTemplatekey
        C->>Bus: Execute query for getContractTemplatesTemplatekey
        Bus->>H: Dispatch query handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  parameters:
  - name: templateKey
    in: path
    required: true
    schema:
      type: string
  responses:
    '200':
      description: 'Thành công: Đọc một mẫu.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACT_TEMPLATE_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractTemplateDetailResponseDto
          example:
            statusCode: 200
            code: CONTRACT_TEMPLATE_FETCHED
            data:
              templateKey: standard-room-lease-v1
              title: Hợp đồng thuê phòng trọ
              version: '1.0'
              requiredVariables:
              - tenantName
              - tenantPhone
              - roomName
              - buildingAddress
              - rentPrice
              - depositAmount
              - startDate
              - endDate
              - paymentDueDay
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
