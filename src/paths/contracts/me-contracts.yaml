get:
  tags:
  - Contract
  x-apidog-folder: Contract
  operationId: getMeContracts
  security:
    - BearerAuth: []
  summary: List my contracts
  description: 'tenant. Hợp đồng của tôi. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 VALIDATION FAILED.'
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        roomId:
          type: string
          format: uuid
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: format
    in: query
    description: json trả envelope; định dạng khác trả file stream.
    schema:
      type: string
      enum:
      - json
      - xlsx
      - csv
      - pdf
      default: json
  responses:
    '200':
      description: 'Thành công: Hợp đồng của tôi.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACTS_MY_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/ContractMyListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: CONTRACTS_MY_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: active
              rentPrice: 3500000
              depositAmount: 7000000
              contractCode: Ví dụ
              roomName: Ví dụ
              buildingName: Ví dụ
              startDate: '2026-09-23T11:55:00.000Z'
              endDate: '2026-09-23T11:55:00.000Z'
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
        text/csv:
          schema:
            type: string
            format: binary
        application/pdf:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
