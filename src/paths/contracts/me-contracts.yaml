get:
  tags:
  - Contract
  x-apidog-folder: Contract
  x-apidog-status: released
  operationId: getMeContracts
  security:
    - BearerAuth: []
  summary: List my contracts
  description: |-
    Returns contracts where the caller is the named tenant (contracts.tenant_id) or a member who has not left.
    A member has not left when is_deleted = false and left_at IS NULL or left_at is after today (UTC),
    matching the contract-member status definition. Leaving today or earlier does not grant member access.
    Soft-deleted contracts are excluded. Being both the named tenant and a member returns one item.
    Each item includes roomName, buildingName and contractCode (HD- followed by the first six ID characters).
    rentalType is not part of Contract. Money fields use the same numeric representation as GET /contracts.
    Supports filter[status], filter[roomId] and offset pagination. Defaults to startDate descending, then id ascending.
    sort only accepts startDate; order accepts asc or desc. Only format=json is supported.
    Invalid query values or unsupported fields return 422 VALIDATION_FAILED.
    An invalid filter[roomId] returns 422 INVALID_UUID, matching the existing project UUID validator.
    Other roles return 403 FORBIDDEN.
    Contracts returned here can also be opened through GET /contracts/{contractId} while access remains valid.
    The service does not currently apply rate limiting.
    
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant Guard as JWT/access guards
        participant C as ContractMyController
        participant Bus as CQRS QueryBus
        participant H as Application handler
        Client->>GW: GET /api/v1/me/contracts
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke getMeContracts
        C->>Bus: Execute query for getMeContracts
        Bus->>H: Dispatch query handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [draft, signed, active, suspended, expired, terminated]
        roomId:
          type: string
          format: uuid
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: sort
    in: query
    schema:
      type: string
      enum: [startDate]
      default: startDate
  - name: order
    in: query
    schema:
      type: string
      enum: [asc, desc]
      default: desc
  - name: format
    in: query
    description: Only JSON is supported. Other formats return 422 VALIDATION_FAILED.
    schema:
      type: string
      enum:
      - json
      default: json
  responses:
    '200':
      description: 'Thành công: Hợp đồng của tôi.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACTS_MY_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/ContractMyListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: CONTRACTS_MY_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: active
              rentPrice: 3500000
              depositAmount: 7000000
              contractCode: HD-3fa85f
              roomName: P.201
              buildingName: Building A
              startDate: '2026-09-01'
              endDate: '2027-08-31'
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      description: Invalid filters, pagination, sort, order, format or unsupported query fields.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum: [VALIDATION_FAILED, INVALID_UUID]
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
