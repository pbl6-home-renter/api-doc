get:
  tags:
  - Contract
  x-apidog-folder: Contract
  operationId: getContractsContractid
  security:
    - BearerAuth: []
  summary: Get contract details
  description: |-
    landlord, tenant. Đọc một hợp đồng. Lỗi nghiệp vụ: 403 FORBIDDEN · 404 NOT FOUND.

    ### Sequence diagram — Get contract details

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNqtVUFv2zYU_isP2sXBbDjt0kM9oIBqqYmXxE4lOd2KAAZNMRYRiVIpKpsR5DDsMAzDgBU9DMMOSxAUw7oNabYBA6xDDwr6P_RP9mjZiZP4WB9kUfxIvu9733s8MmjsM6NlpOxFxgRlFicjSaI9AfgjmYpFFg2ZrMYJkYpTnhChoA0khXbIGb7XnrEhNGE7HvKQrdzFrmusudOBdaLYl2R8F-FohMvkIacMHDbiqZJLYK6GKSaIoONGWsHvoiyN2olTNZLMfbo1XzDwhxW23Xj0aL0F67YHTZLw5uG9Jo2FkoSqtHk0f-34xxV8fQYvJ-cCaCwlC4nisWhwvw4HvMy_iQBXgERyEPKIq2rdUDJyALvv35b5mYIRAn_hEJSTUwHj4k0GtJz8llXQ6hg8p92CtfsPoeb1eoNts_vFwLGf9m3Xc2eqMuHfCGqXSb4_hs-eebhd_prCsMx_xsfkQozw66YLlNCALQZkUspSVDE-YAJUwMvJu6wOKcHY4nLyH9UhvlNVoEuiW70HtX7X7HsbPafz3LaWBea0wENBMKLfM-AiVSg_u503CBgJVTDLstOoCF3-WObf49KgzL-7Wnq9s9uCdpCNUXOMXYeegNTOTVUduRT_ImvFBXxVnFIcl_kFrd9KGRwWJ_B5Y-a1hqdlqPZ3q_2XSvrRg4efQpqNMcmA3oglqDL_A2hIeIQmuD45Q3YdH_wY56a1gbgLGBWnNw_ZvLZNQlRQ12L4DHcNGK6cOXAxazdQOlm0mEASFKdJ8_IlSiYC8HXGRtcpc2eSrq2uQq3T3TW3OtZgx_Q28OGY27ZnO1i084kN27SmHx6b1tx1K3fzf1v9BH1yJtAt-SsOYZn_xG_5QRO2qrz-QK-o1UHGcTTNBa1yVZwghUNevJkJZTUqpawyP8eqKvNvs7lBD6YGfZHhyVfSF39GOuGT1-NF1TbvzOL7CQcxyrAEkYSMcVpzOMVgOI4xxViXfyXLZFyDmmO7vb7Ttgfdnjd40ut3rQ-lEVI1p8YKUZOQCD-MpQ9pmf-qF55nOtl_Y7AzDabFpFC8f1AIPO3rORkEnyWgPfFqboYbWly-LCb4J-OQXelZzdzcayrPglbLBPkEak96zuOOZdndD6FDN8YOGh-iw906emZLQ0Bg-fFpEbZ01OGQ0ANdOCJFH2FNY694_xY7Rhxh54Wa0P1Mc1nBjiC1RR6g_ztddHvX3Bq4trNrOwPbcXoOsiUwWryS5tTu45J2r-s5ZhvTbHvtDduCj8EnilQlanm9eVNazhUbl8rSOgxjfzy1-bICN-pGxGREuI838NGegZMR2zNasGf4bJ9kodozjhGUJXjy_Go2WuhSVjdknI0Co7VPwhRHePE9x4qqJo__B5Ye5M0)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: GET /api/v1/contracts/{contractId}
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra path, header theo contract
        break path, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc contract, room và các thành viên
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor là landlord sở hữu phòng hoặc tenant có quyền trong hợp đồng
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 CONTRACT_FETCHED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: contractId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc một hợp đồng.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACT_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractDetailResponseDto
          example:
            statusCode: 200
            code: CONTRACT_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: active
              tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              tenantName: Trần Văn B
              tenantPhone: '0912345678'
              rentPrice: 3500000
              depositAmount: 7000000
              startDate: '2026-09-01'
              endDate: '2027-08-31'
              signedContractMediaId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
patch:
  tags:
  - Contract
  x-apidog-folder: Contract
  operationId: patchContractsContractid
  security:
    - BearerAuth: []
  summary: Update draft contract
  description: |-
    landlord. Sửa hợp đồng nháp. Lỗi nghiệp vụ: 409 CONTRACT NOT DRAFT · 403 FORBIDDEN · 422 VALIDATION FAILED.

    ### Sequence diagram — Update draft contract

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNrFVk1v20YQ_SsD9aKgFOS4ySFqa4AWaVuJLToU5TSBAWG1XFMLU0uGH26FIIegh6IICtTIoSiKojGMIOhH4KQtUFQ65CAj_4P_pLNcSmYs5dQU9UEmubOzM_PevNkHFRq4rNKoxOx-ygRlBideRIb7AvCPpEkg0mGfReo9JFHCKQ-JSKAJJIamzxk-V--wPtRhJ-hzn11ZtN2UtvpuCzZJwj4no0ULW1p0WHTEKQObeTxOoiVmHWmWMEEEHdViZb5oZUir3SBOvIh1bm_PNvTcvrJt1tbWNhuwqzvNLaiTkNePrtZpIJKI0CSuP5g9ttyHn_Sj-tp64I4a4LKYRjxMeCCUm03lZjMbnwmgQRQxn8jVGnc1OOTZ5MshoB-IMGnw-ZAnal8_YuQQ9t68zCanCXho-AOHQTY-ETCa_pICzcbPU2WqjsFzmg24tnoDqo5l9Xb09t2ebd7umh2nU1SbCfetoPZYxA9GcPOOg-4mzyj0s8n3-DN-JTz8eqsDlNABKwekU8pirG5wyAQkA56NX6caxARjC7LxX1SG-DpRgS6JbuUqVLttvetsWXbrnmksC8xugIMFwYh-ToGLOEFY2GU8YcCInwwK9O2aSuj822zyGLcOssnX860XnjsNaA7SEdYcY5ehhxBJRseJhrlM_8SsEy7gi-kJxfds8opqlyCDo-lT-KxWcLDmyDIo_x3lf2lJP7h-42OI0xGCDMiYIIIkm_wK1Cd8iCS4ODnF7FouuAGu5T2Ddq_Am568fcitC9rc7Fjteh-ppyG5k4Em6-IyPGDA0ElB0TKA79ogIaTTMYSD6UlYPz_GQooBuBJHb4ZtgXfuA6QPyZWzBPopJkkv4O4UcFxbWYFqq72nb7eMXr6pDrPXgpq9dcu4W_qM7baFP7a-YzqmXVrYMnUj_7CuzzdfWWTYZXxDZOKpQD5OnnDws8l3_BLjZrgRn7uyBQ84811Vvhi5PyRazhEeMbcuUt8nfZ_VGepdDqrCEb0f82Kn8ILpUw6GYyGwHIjrcskd4u9GQchQflj86QHx44KW7QDPDI4QgM5MaxR7sb9fhCAw_BdJ4fr8OFcDCl42ecHz89UCcuwxBCgduU6cYQwpaoQow27I7z6ufpXOCHd-PB3jP5XlDOJo-hS_KUCRYPLAH4W3BNrVVajmyOhOy2r3NvTW9ryd_zUghmrlb-icwnnjYT8naQwDmQY6RG4Wm42aQrGcZZHQYa5H91M8dd5p09-Gsr_Hz0blEt1aWMVnhLKoJlYjwGUZ_8kQjji-Y0fnMC1j_jWo2mbH6tpNs9e2nN6G1W0b75Gweq4jcTb5SdqepfL3NATZuE-El5NjXjs6_V2AG5GDZEm-BQ2iwGfzmqkVOv0DC4fRPZLJ5yUo1WNZ0h9BdcOy11uGYbbfR67FEOSzqp8fI7aP0nxuSgZESp5Qu0_mA8gtcQCj_luleFqatcsix6nZtNqOrTedHC7D1jec_yIFLKhk7hnFOuZEDuEIB4WcFs-J3BYGHIU_JmmuH6UbQimx_6Ef183NVlvGIWKk1Px6U6w2FzWrdBO6pFxKXZsFO7uh1F1bzWEjCd72a-3stJx3N3mOrP_mZbqgphru3pbpgEAt4_kcbkiW-31CD8uJoOC-eYmXhmAoFbQq8hGH3L-i5QQ7hes4xlptHEdtfbvXMe090-6Ztm3ZCCYBr3xbncGxilvmfOruIiimAR8CZkpU9jgfZveS5bgordPUmJXit2ywV7TKkEVDwl28nD_Yr-DikO1XGrBfcdkBSf1kv_IQjdK8xsWtvdJA5WJaJQpSb1Bp5MNIq-Cd-F4QFIsP_wGa4HjQ)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: PATCH /api/v1/contracts/{contractId}<br/>Body: description
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, path, header theo contract
        break JSON/body, path, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        Note over S: PATCH chỉ cập nhật field được gửi#59; field bị omit giữ nguyên
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc contract và status hiện tại
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor sở hữu hợp đồng#59; contract còn draft
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (CONTRACT_NOT_DRAFT)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Chỉ cập nhật description được gửi theo ContractUpdateRequestDto
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 CONTRACT_UPDATED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: contractId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ContractUpdateRequestDto
        example:
          description: Đóng tiền trước ngày 5 hàng tháng
  responses:
    '200':
      description: 'Thành công: Sửa hợp đồng nháp.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACT_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractUpdateResponseDto
          example:
            statusCode: 200
            code: CONTRACT_UPDATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: draft
              description: Đóng tiền trước ngày 5 hàng tháng
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - CONTRACT_NOT_DRAFT
                description: |-
                  - CONTRACT_NOT_DRAFT: Hợp đồng không ở trạng thái nháp.
          examples:
            contract_not_draft:
              summary: CONTRACT_NOT_DRAFT — Hợp đồng không ở trạng thái nháp.
              value:
                statusCode: 409
                code: CONTRACT_NOT_DRAFT
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
