get:
  tags:
  - Contract
  x-apidog-folder: Contract
  x-apidog-status: designing
  operationId: getContractsContractid
  security:
    - BearerAuth: []
  summary: Get contract details
  description: |-
    Landlord hoặc tenant, yêu cầu JWT hợp lệ và tài khoản không bị khóa.
    Landlord chỉ xem hợp đồng có landlordId = user.id.
    Tenant xem được khi tenantId = user.id hoặc là member chưa rời của hợp đồng:
    member có tenant_id = user.id, is_deleted = false và left_at IS NULL hoặc left_at > hôm nay (UTC).
    Member rời hôm nay hoặc trước đó không được cấp quyền qua membership.
    Quyền tenant dùng cùng phạm vi với GET /me/contracts và danh sách member.
    Người gọi không liên quan trả 403 FORBIDDEN. Hợp đồng không tồn tại hoặc đã xóa mềm trả 404 RESOURCE_NOT_FOUND.
    contractId không phải UUID trả 400 BAD_REQUEST theo ParseUUIDPipe.
    Response phản ánh entity hiện tại, gồm vehicleCount và description; chưa trả signedContractMediaId.
    Service chưa có rate limiter.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant TEN as Tenancy
        participant DB as Tenancy DB

        GW->>TEN: GET /api/v1/contracts/{contractId} + Bearer token
        TEN->>TEN: Verify JWT, landlord/tenant role, active account and UUID
        TEN->>DB: SELECT contract WHERE id = contractId AND is_deleted = false
        DB-->>TEN: Contract or null
        alt Missing or deleted contract
            TEN-->>GW: 404 RESOURCE_NOT_FOUND
        else Contract exists
            TEN->>TEN: Match landlordId for landlord or tenantId for tenant
            opt Tenant is not the named tenant
                TEN->>DB: EXISTS member WHERE contract_id and tenant_id match, not deleted, left_at IS NULL or after today (UTC)
                DB-->>TEN: Membership access
            end
            alt Caller is not the owner, named tenant or member who has not left
                TEN-->>GW: 403 FORBIDDEN
            else Authorized caller
                TEN->>TEN: Map ContractDetailResponseDto
                TEN-->>GW: 200 CONTRACT_FETCHED
            end
        end
    ```
  parameters:
  - name: contractId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc một hợp đồng.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACT_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractDetailResponseDto
          example:
            statusCode: 200
            code: CONTRACT_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: active
              tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              tenantName: Trần Văn B
              tenantPhone: '0912345678'
              rentPrice: 3500000
              depositAmount: 7000000
              startDate: '2026-09-01'
              endDate: '2027-08-31'
              vehicleCount: 1
              description: Đóng tiền trước ngày 5 hàng tháng
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
patch:
  tags:
  - Contract
  x-apidog-folder: Contract
  x-apidog-status: designing
  operationId: patchContractsContractid
  security:
    - BearerAuth: []
  summary: Update draft or active contract
  description: |-
    Landlord. Update a contract owned by user.id from the verified JWT.
    Draft contracts retain the existing description-only update flow; description is required and vehicleCount is rejected.
    Active contracts accept vehicleCount and/or description. An empty update is invalid.
    vehicleCount must be null or an integer between 0 and 2147483647. Omitted fields keep their existing value.
    description may be null to clear the note; otherwise it must contain 1-500 characters and not be whitespace-only.
    Vehicle-count changes are used when pending invoices are regenerated; issued invoice snapshots remain unchanged.
    Hợp đồng không tồn tại hoặc đã xóa mềm trả 404 RESOURCE_NOT_FOUND; khác chủ trả 403 FORBIDDEN;
    statuses other than draft/active return 409 CONTRACT_NOT_DRAFT. A draft vehicleCount update also returns this conflict.
    contractId không phải UUID trả 400 BAD_REQUEST.
    Field ngoài DTO trả 422 UNEXPECTED_FIELD; giá trị không hợp lệ trả 422 VALIDATION_FAILED.
    Contract và outbox contract.updated được lưu trong cùng transaction; relay publish sau commit.
    Service chưa có rate limiter.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant TEN as Tenancy
        participant DB as Tenancy DB
        participant RELAY as Outbox Relay
        participant MQ as RabbitMQ

        GW->>TEN: PATCH /api/v1/contracts/{contractId} + Bearer token
        TEN->>TEN: Verify JWT, landlord role, active account, UUID and body
        TEN->>DB: BEGIN
        TEN->>DB: SELECT contract WHERE id = contractId AND is_deleted = false FOR UPDATE
        DB-->>TEN: Contract or null
        TEN->>TEN: Check existence, ownership, draft/active state and allowed updates
        alt Missing contract, wrong owner, unsupported state or invalid update
            TEN->>DB: ROLLBACK
            TEN-->>GW: 404 / 403 / 409 / 422 with matching error code
        else Valid update
            TEN->>DB: UPDATE supplied description / active vehicle_count and updated_at
            TEN->>DB: INSERT outbox_messages (contract.updated)
            alt Storage operation fails
                TEN->>DB: ROLLBACK
                TEN-->>GW: Error response; neither change is committed
            else Commit succeeds
                TEN->>DB: COMMIT
                TEN-->>GW: 200 CONTRACT_UPDATED
                RELAY->>DB: Claim committed outbox event
                RELAY->>MQ: Publish contract.updated
                MQ-->>RELAY: Publisher confirm
                RELAY->>DB: Mark outbox PUBLISHED
            end
        end
    ```
  parameters:
  - name: contractId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ContractUpdateRequestDto
        example:
          description: Đóng tiền trước ngày 5 hàng tháng
  responses:
    '200':
      description: Contract updated successfully.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACT_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractUpdateResponseDto
          example:
            statusCode: 200
            code: CONTRACT_UPDATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: draft
              description: Đóng tiền trước ngày 5 hàng tháng
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - CONTRACT_NOT_DRAFT
                description: |-
                  - CONTRACT_NOT_DRAFT: Hợp đồng không ở trạng thái nháp.
          examples:
            contract_not_draft:
              summary: CONTRACT_NOT_DRAFT — Hợp đồng không ở trạng thái nháp.
              value:
                statusCode: 409
                code: CONTRACT_NOT_DRAFT
    '422':
      description: Invalid description/vehicleCount, an empty update, or fields outside the DTO.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum: [VALIDATION_FAILED, UNEXPECTED_FIELD]
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
