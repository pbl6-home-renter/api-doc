patch:
  tags:
  - Contract
  x-apidog-folder: ContractMember
  operationId: patchContractMembersContractmemberid
  security:
    - BearerAuth: []
  summary: Update contract member
  description: 'landlord. Cập nhật thành viên. Lỗi nghiệp vụ: 403 FORBIDDEN · 409 MEMBER LEFT · 422 VALIDATION FAILED.'
  parameters:
  - name: contractMemberId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ContractMemberUpdateRequestDto
        example:
          tenantPhone: '0921234567'
  responses:
    '200':
      description: 'Thành công: Cập nhật thành viên.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACT_MEMBER_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractMemberUpdateResponseDto
          example:
            statusCode: 200
            code: CONTRACT_MEMBER_UPDATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              tenantPhone: '0921234567'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      $ref: ../../openapi.yaml#/components/responses/ConflictError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
