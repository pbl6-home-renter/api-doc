put:
  tags:
  - Contract
  x-apidog-folder: Contract
  operationId: putContractsContractidApplyTemplate
  summary: Apply template to draft contract
  description: 'landlord. Áp mẫu vào hợp đồng nháp. Lỗi nghiệp vụ: 404 TEMPLATE NOT FOUND · 409 CONTRACT NOT DRAFT
    · 403 FORBIDDEN.'
  parameters:
  - name: contractId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ContractApplyTemplateRequestDto
        example:
          templateKey: standard_residential_v1
  responses:
    '200':
      description: 'Thành công: Áp mẫu vào hợp đồng nháp.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACT_TEMPLATE_APPLIED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractApplyTemplateResponseDto
          example:
            statusCode: 200
            code: CONTRACT_TEMPLATE_APPLIED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              templateKey: standard_residential_v1
              status: draft
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      $ref: ../../openapi.yaml#/components/responses/ConflictError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
