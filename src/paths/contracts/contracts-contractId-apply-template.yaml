put:
  tags:
  - Contract
  x-apidog-folder: Contract
  x-apidog-status: released
  operationId: putContractsContractidApplyTemplate
  security:
    - BearerAuth: []
  summary: Apply template to draft contract
  description: |-
    Landlord. Đặc tả áp mẫu vào hợp đồng nháp.

    **Trạng thái triển khai:** endpoint chưa được triển khai trong Tenancy-Service và đang tạm hoãn.
    Contract hiện chưa có cơ chế lưu liên kết mẫu; cần chốt cơ chế lưu trước khi triển khai handler.
    Nhãn released là trạng thái phát hành đặc tả; không xác nhận endpoint đã sẵn sàng chạy.
    Sequence diagram dưới đây mô tả luồng dự kiến, chưa phải hành vi của service hiện tại.

    Mẫu không có, inactive hoặc đã xóa trả 404 TEMPLATE_NOT_FOUND;
    hợp đồng không có hoặc đã xóa trả 404 CONTRACT_NOT_FOUND; khác chủ trả 403 FORBIDDEN;
    hợp đồng không còn draft trả 409 CONTRACT_NOT_DRAFT.
    Khi triển khai, lưu liên kết mẫu và append outbox trong cùng UoW; relay publish sau commit.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant TEN as Tenancy
        participant DB as Tenancy DB
        participant RELAY as Outbox Relay
        participant MQ as RabbitMQ

        Note over TEN,DB: Planned flow; template association persistence is not implemented
        GW->>TEN: PUT /api/v1/contracts/{contractId}/apply-template + Bearer token
        TEN->>TEN: Verify JWT, landlord role, active account, UUID and body
        TEN->>DB: BEGIN
        TEN->>DB: SELECT template WHERE template_key = templateKey<br/>AND is_active = true AND is_deleted = false
        DB-->>TEN: Active template or null
        alt Missing active template
            TEN->>DB: ROLLBACK
            TEN-->>GW: 404 TEMPLATE_NOT_FOUND
        else Template exists
            TEN->>DB: SELECT contract WHERE id = contractId AND is_deleted = false FOR UPDATE
            DB-->>TEN: Contract or null
            TEN->>TEN: Check existence, JWT ownership and draft status
            alt Missing contract, wrong owner or non-draft
                TEN->>DB: ROLLBACK
                TEN-->>GW: 404 CONTRACT_NOT_FOUND / 403 FORBIDDEN / 409 CONTRACT_NOT_DRAFT
            else Valid draft
                TEN->>DB: Persist template association using the agreed storage mechanism
                TEN->>DB: Append contract change to outbox_messages
                alt Persistence fails
                    TEN->>DB: ROLLBACK
                    TEN-->>GW: Error response; no partial contract change
                else Commit succeeds
                    TEN->>DB: COMMIT
                    TEN-->>GW: 200 CONTRACT_TEMPLATE_APPLIED
                    RELAY->>DB: Claim committed outbox event
                    RELAY->>MQ: Publish contract change
                    MQ-->>RELAY: Publisher confirm
                    RELAY->>DB: Mark outbox PUBLISHED
                end
            end
        end
    ```
  parameters:
  - name: contractId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ContractApplyTemplateRequestDto
        example:
          templateKey: standard-room-lease-v1
  responses:
    '200':
      description: 'Thành công: Áp mẫu vào hợp đồng nháp.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACT_TEMPLATE_APPLIED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractApplyTemplateResponseDto
          example:
            statusCode: 200
            code: CONTRACT_TEMPLATE_APPLIED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              templateKey: standard-room-lease-v1
              status: draft
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      x-apidog-name: Not Found
      description: Không tìm thấy tài nguyên được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [404]
              code:
                type: string
                enum:
                  - TEMPLATE_NOT_FOUND
                  - CONTRACT_NOT_FOUND
                description: |-
                  - TEMPLATE_NOT_FOUND: Không tìm thấy mẫu hợp đồng.
                  - CONTRACT_NOT_FOUND: Không tìm thấy hợp đồng cần áp mẫu.
          examples:
            template_not_found:
              summary: TEMPLATE_NOT_FOUND — Không tìm thấy mẫu hợp đồng.
              value:
                statusCode: 404
                code: TEMPLATE_NOT_FOUND
            contract_not_found:
              summary: CONTRACT_NOT_FOUND — Không tìm thấy hợp đồng cần áp mẫu.
              value:
                statusCode: 404
                code: CONTRACT_NOT_FOUND
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - CONTRACT_NOT_DRAFT
                description: |-
                  - CONTRACT_NOT_DRAFT: Hợp đồng không ở trạng thái nháp.
          examples:
            contract_not_draft:
              summary: CONTRACT_NOT_DRAFT — Hợp đồng không ở trạng thái nháp.
              value:
                statusCode: 409
                code: CONTRACT_NOT_DRAFT
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
