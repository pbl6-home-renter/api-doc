put:
  tags:
  - Contract
  x-apidog-folder: Contract
  operationId: putContractsContractidApplyTemplate
  security:
    - BearerAuth: []
  summary: Apply template to draft contract
  description: |-
    landlord. Áp mẫu vào hợp đồng nháp. Lỗi nghiệp vụ: 404 TEMPLATE NOT FOUND · 409 CONTRACT NOT DRAFT · 403 FORBIDDEN.

    ### Sequence diagram — Apply template to draft contract

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: PUT /api/v1/contracts/{contractId}/apply-template<br/>Body: templateKey
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, path, header theo contract
        break JSON/body, path, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc contract và template theo templateKey
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (TEMPLATE_NOT_FOUND / CONTRACT_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor sở hữu hợp đồng#59; contract còn draft và template tồn tại
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (CONTRACT_NOT_DRAFT)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Áp template vào contract draft
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 CONTRACT_TEMPLATE_APPLIED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: contractId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ContractApplyTemplateRequestDto
        example:
          templateKey: standard_residential_v1
  responses:
    '200':
      description: 'Thành công: Áp mẫu vào hợp đồng nháp.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACT_TEMPLATE_APPLIED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractApplyTemplateResponseDto
          example:
            statusCode: 200
            code: CONTRACT_TEMPLATE_APPLIED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              templateKey: standard_residential_v1
              status: draft
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      x-apidog-name: Not Found
      description: Không tìm thấy tài nguyên được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [404]
              code:
                type: string
                enum:
                  - TEMPLATE_NOT_FOUND
                  - CONTRACT_NOT_FOUND
                description: |-
                  - TEMPLATE_NOT_FOUND: Không tìm thấy mẫu hợp đồng.
                  - CONTRACT_NOT_FOUND: Không tìm thấy hợp đồng cần áp mẫu.
          examples:
            template_not_found:
              summary: TEMPLATE_NOT_FOUND — Không tìm thấy mẫu hợp đồng.
              value:
                statusCode: 404
                code: TEMPLATE_NOT_FOUND
            contract_not_found:
              summary: CONTRACT_NOT_FOUND — Không tìm thấy hợp đồng cần áp mẫu.
              value:
                statusCode: 404
                code: CONTRACT_NOT_FOUND
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - CONTRACT_NOT_DRAFT
                description: |-
                  - CONTRACT_NOT_DRAFT: Hợp đồng không ở trạng thái nháp.
          examples:
            contract_not_draft:
              summary: CONTRACT_NOT_DRAFT — Hợp đồng không ở trạng thái nháp.
              value:
                statusCode: 409
                code: CONTRACT_NOT_DRAFT
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
