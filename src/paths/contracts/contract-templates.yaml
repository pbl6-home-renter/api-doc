get:
  tags:
  - Contract
  x-apidog-folder: ContractTemplate
  operationId: getContractTemplates
  security:
    - BearerAuth: []
  summary: List contract templates
  description: |-
    landlord. Liệt kê mẫu khả dụng. Lỗi nghiệp vụ: 403 FORBIDDEN.

    ### Sequence diagram — List contract templates

