get:
  tags:
  - Contract
  x-apidog-folder: Contract
  x-apidog-status: developing
  operationId: getContractsTenantsContractmemberid
  security:
  - BearerAuth: []
  summary: Get landlord tenant details
  description: |-
    Chỉ role landlord; landlordId lấy từ JWT. Áp dụng ownership trước khi gom nhóm.
    Nguồn duy nhất contract_members JOIN contracts: cả hai chưa soft-delete,
    contract.activatedAt khác null và member.joinedAt <= hôm nay UTC (cùng quy tắc ngày của Tenancy).
    Không bổ sung dòng tenant đại diện từ contracts; luồng activate đã tạo member đại diện.
    Các member có cùng tenantId trong phạm vi landlord là một khách; tenantId null là từng khách riêng
    bằng contractMemberId. Không gom theo tên/phone, không tạo user hay lookup Identity.
    Một membership đang ở khi leftAt null hoặc > hôm nay UTC và contract giữ phòng:
    active, hoặc hợp đồng terminated từ saga cũ có lockTerminationCycleId và handoverCompletedOn null. P13-01 không tạo thêm hợp đồng chấm dứt do khóa tài khoản.
    leftAt = hôm nay đã rời. Không suy trạng thái từ endDate.
    Khách current nếu bất kỳ membership nào đang ở, còn lại history; hai scope loại trừ nhau.
    Tên hiển thị là snapshot khác rỗng đầu tiên theo joinedAt asc, member.id asc;
    thiếu tên trả null. ID đại diện là member đầu tiên cùng thứ tự, trên toàn bộ tập hợp lệ,
    không thay đổi theo bộ lọc hoặc trang. ID có thể đổi khi link account; detail vẫn nhận mọi member hợp lệ trong nhóm.
    Số hợp đồng đếm DISTINCT contractId; lịch sử không mất khi một khách còn thuê phòng khác.
    Không trả tenantId, email, profile Identity hoặc contact toàn cục. Danh sách không trả phone.
    Ví dụ: khách link rời A nhưng còn ở B xuất hiện một lần current với contractCount=2;
    B terminated chờ bàn giao vẫn current, sau bàn giao chuyển history nếu không còn membership current.
    Hai member chưa link trùng tên/phone vẫn là hai khách.
    Chi tiết trả snapshot phone theo từng membership, thiếu trả null.

    **Sequence diagram**

    ```mermaid
    sequenceDiagram
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service guards
        participant C as ContractTenantController
        participant H as CQRS QueryHandler
        participant DB as PostgreSQL
        Client->>GW: GET /api/v1/contracts/tenants/{contractMemberId}
        GW->>S: Proxy /contracts with bearer token
        S->>S: Verify JWT, active account, landlord role
        S->>C: Authenticated landlordId
        C->>H: Execute query
        H->>DB: Owned eligible memberships, group and project in SQL
        DB-->>H: Scoped result (or absent requested member)
        H-->>C: Read model (or RESOURCE_NOT_FOUND on detail)
        C-->>GW: Allowlisted DTO and standard envelope
        GW-->>Client: HTTP response
    ```
  parameters:
  - name: contractMemberId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: Thông tin khách thuê trong phạm vi landlord đang đăng nhập.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACT_TENANT_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractTenantDetailResponseDto
          example:
            statusCode: 200
            code: CONTRACT_TENANT_FETCHED
            data:
              contractMemberId: 10000000-0000-4000-8000-000000000002
              tenantName: Khách mẫu
              isLinked: true
              scope: current
              contractCount: 2
              memberships:
              - contractMemberId: 10000000-0000-4000-8000-000000000002
                contractId: 20000000-0000-4000-8000-000000000002
                roomId: 30000000-0000-4000-8000-000000000002
                contractStatus: terminated
                joinedAt: '2026-01-01'
                leftAt: '2026-08-01'
                isCurrent: false
                tenantName: Khách mẫu
                tenantPhone: '0900000000'
              - contractMemberId: 10000000-0000-4000-8000-000000000001
                contractId: 20000000-0000-4000-8000-000000000001
                roomId: 30000000-0000-4000-8000-000000000001
                contractStatus: active
                joinedAt: '2026-09-01'
                leftAt: null
                isCurrent: true
                tenantName: Khách mẫu
                tenantPhone: null
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '404':
      description: 'RESOURCE_NOT_FOUND: member không tồn tại/soft-delete/chưa hợp lệ hoặc contract chưa
        hợp lệ/khác chủ; cùng response 404. Kiểm tra ownership của ID yêu cầu trước khi mở rộng nhóm tenantId.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 404
              code:
                type: string
                enum:
                - RESOURCE_NOT_FOUND
          example:
            statusCode: 404
            code: RESOURCE_NOT_FOUND
