post:
  tags:
  - Contract
  x-apidog-folder: Contract
  operationId: postContractsContractidCompleteCheckout
  summary: Complete checkout
  description: 'landlord. Hoàn tất trả phòng. Lỗi nghiệp vụ: 409 CONTRACT NOT ACTIVE · 403 FORBIDDEN · 422 SETTLEMENT
    NOT READY.'
  parameters:
  - name: contractId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ContractCompleteCheckoutRequestDto
        example:
          completedOn: '2026-09-30'
  responses:
    '200':
      description: 'Thành công: Hoàn tất trả phòng.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACT_CHECKOUT_COMPLETED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractCompleteCheckoutResponseDto
          example:
            statusCode: 200
            code: CONTRACT_CHECKOUT_COMPLETED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: expired
              completedOn: '2026-09-30'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      $ref: ../../openapi.yaml#/components/responses/ConflictError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
