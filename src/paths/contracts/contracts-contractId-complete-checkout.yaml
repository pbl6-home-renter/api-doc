post:
  tags:
  - Contract
  x-apidog-folder: Contract
  x-apidog-status: released
  operationId: postContractsContractidCompleteCheckout
  security:
    - BearerAuth: []
  summary: Complete checkout
  description: |-
    The contract must be active, otherwise 409 CONTRACT_NOT_ACTIVE.
    completedOn is a YYYY-MM-DD date between the contract start date and today (UTC), inclusive.
    Invalid format or a date outside the contract start date to today range returns 422 VALIDATION_FAILED.
    completedOn must also be on or after joinedAt for every member who has not left;
    a violation returns 422 LEFT_DATE_INVALID, the same domain error used by leave-contract.
    Checkout may take place after the contract end date; the end-date restriction belongs to leave-contract only.
    The invoice period is completedOn sliced to YYYY-MM. At least one non-deleted invoice for that contract/period
    must be issued, and none may be pending; otherwise 409 SETTLEMENT_NOT_READY. Voided invoices do not satisfy readiness.
    In one transaction, lock the contract, check invoices, set remaining members' left_at to completedOn,
    terminate the contract, move the room from occupied to maintenance, and persist all corresponding outbox events.
    A member has not left when left_at IS NULL or after today (UTC). A future scheduled leave is replaced by completedOn;
    previous departures and soft-deleted members are preserved. A room already in maintenance stays there.
    The response echoes completedOn; no completed_on or terminated_at column is added to contracts.
    No deposit settlement, early termination fee or automatic checkout-date prorating is performed.
    Call POST /rooms/{roomId}/mark-ready after cleaning to make the room available again.
    Field outside the request DTO returns 422 UNEXPECTED_FIELD, matching existing project validation.
    The invoices table is supplied by P6-02g1. The service does not currently apply rate limiting.
    
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant Guard as JWT/access guards
        participant C as ContractController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: POST /api/v1/contracts/{contractId}/complete-checkout
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke postContractsContractidCompleteCheckout
        C->>Bus: Execute command for postContractsContractidCompleteCheckout
        Bus->>H: Dispatch command handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  parameters:
  - name: contractId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ContractCompleteCheckoutRequestDto
        example:
          completedOn: '2026-09-30'
  responses:
    '200':
      description: 'Thành công: Hoàn tất trả phòng.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACT_CHECKOUT_COMPLETED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractCompleteCheckoutResponseDto
          example:
            statusCode: 200
            code: CONTRACT_CHECKOUT_COMPLETED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: terminated
              completedOn: '2026-09-30'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - CONTRACT_NOT_ACTIVE
                  - SETTLEMENT_NOT_READY
                  - INVALID_ROOM_TRANSITION
                description: |-
                  - CONTRACT_NOT_ACTIVE: Hợp đồng không ở trạng thái đang hiệu lực.
                  - SETTLEMENT_NOT_READY: The checkout period has no issued invoice or still has a pending invoice.
                  - INVALID_ROOM_TRANSITION: The room is neither occupied nor in maintenance.
          examples:
            contract_not_active:
              summary: CONTRACT_NOT_ACTIVE — Hợp đồng không ở trạng thái đang hiệu lực.
              value:
                statusCode: 409
                code: CONTRACT_NOT_ACTIVE
            settlement_not_ready:
              summary: Checkout period is not ready
              value:
                statusCode: 409
                code: SETTLEMENT_NOT_READY
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - VALIDATION_FAILED
                  - LEFT_DATE_INVALID
                  - UNEXPECTED_FIELD
                description: |-
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
                  - LEFT_DATE_INVALID: completedOn is before joinedAt of a remaining member.
                  - UNEXPECTED_FIELD: The request contains fields outside the DTO.
          examples:
            left_date_invalid:
              summary: Checkout date is before a remaining member joined
              value:
                statusCode: 422
                code: LEFT_DATE_INVALID
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
