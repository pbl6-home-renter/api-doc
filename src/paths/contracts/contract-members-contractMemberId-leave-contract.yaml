  summary: Record contract member leave
  description: |-
    landlord. Ghi nhận thành viên rời đi. Lỗi nghiệp vụ: 403 FORBIDDEN · 409 MEMBER ALREADY LEFT · 422 LEFT DATE INVALID.

    ### Sequence diagram — Record contract member leave

