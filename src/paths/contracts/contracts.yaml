get:
  tags:
  - Contract
  x-apidog-folder: Contract
  operationId: getContracts
  security:
    - BearerAuth: []
  summary: List contracts
  description: |-
    landlord. Quản lý hợp đồng của tôi. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 VALIDATION FAILED.

    ### Sequence diagram — List contracts

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNq9Vs-L20YU_lce6sVLbZxsk0PcJqBY2o2TXXtXUjZNWDBjaWxNV5rRjqRN3JBD6SGUEmjIIZRS2GUJoWkhSVsoWIccFPJ_6D_pG0nen4YcUuqDbUlv3nzve9_7Rg81V3hU62gx3U0pd6nByESScJsDfkiaCJ6GIyqr64jIhLksIjyBLpAYugGj-L9xh46gDetixAK6dD52VcXqGz1YJQm9T6bnIywVYVO5x1wKFp2wOJELwmwVllBOuDttxVX4-ShDRW2IOJlIam-uzRcMvVEV221du7bagVXTgTaJWHvvYtsVPJHETeKvRrJ9bTOlctqBMQsSKpuYe0Jt9i2t_vVFE8ZChiSpsq3W2YrZaw6ukJIGJGGCt5jXhB1WZN-HgLlBYu0QsJDV60aSkh3Y-vCmyA4TmGDgLwz8YnbAYZq_SsEtZi_TKrTaBvfpduDS8hVoOIPBcF3v3x1a5uZt03bsmnTKvVOgtqhk4yncvONguuyFC6Mi-xm_Zm_5BO_essElrk9PAtJdl8ZIstihHBKfFbN3aRNigthEMfvHVRDfJRXQBeguXITG7b5-27kxsHr3TGMRMKsDDhKCiH5LgfE4we7Qs20Fn5Ig8WsRWK2qoPc_FdmPuNQvsh-Olh5ntjvQ9dMpco7YFfQIpBJ2nDSxlvxvrDphHB7kBy5eF9lbt3mmZbCX78PXrVqKLUfRUOW3q_wLKf3s8pUvIU6n2GRAFQkJSZH9Dm5AWIgiON45xep6HngCn5Wjg3FvYZIfnN7k1rFsdpUWm4oNj2Jan-LSWqwn23Y6TLXLzWcQ-flB1H7_FEnjPniqZ5Pjptk1qZcuXIBGr7-lr_WMIerJujvc0C193XRMC8d6_uSGqRvljeu6MRfe0nkJnG1AhFI55CiY7BmDoMieszOSmBNLAuapGRkzGnhVpTGKMyTNsolMUq_N0yAgo4C2KfpSyXpFNGZ_yuqVfCLyfQaGM0DmGRDPY6q5JNiQIqJoEzS-OiZBfEr2RpG9xuksssfpvF_vn-Yz_KkwzNUv8328N0qx6Sghqab314WcLi9Do-RNd3qD_nBF760dTcMn02VUk_DEPdICTqxfgcKe_4kQUZwvCQSEe4GQXqXKkrDK1dpiPI5pLSGjVbXgJAl1vTvltO-mCOpIx_kfoZqe2YvpqQZ2y6FUYnuiXCI7jMqLZ2qJFOVCbEtcllehK0Gd7MKtU8xLEdAjHNUTN_8LwSBh3yFhMn_Fq6R8kqJn8kXS_gIaKwPres8wzP5_QX9t26yMPAgVGtTg7LWLIHxFXQR76At1hbgsEgznPCZpqcYTB4J3zPb_qZ--wBkTe-gSdhN1tKZCgKN0WGllHUV7MCLujgLJY-wRDg9O2Ic36LsixPMLGlydCqoZS-irUmnjMnpIr4-G0dfXhrZpbZnW0LSsgYUEEZicPPfR1usD9Oo3MaauOxyW37VXnSdkGTfoDvqOpXcde7hiOt0bpgGfA1oGqcwCB_7j9Ny0B_3S4yunrLlBM6ghwQOU-ovSlx8r_ZbHcynn56rS7HAxshV88QF8Z6EkRExdHEo095YzjWh7fmGwOBJxaUUfh1luX45rLfwS931JougINPe0phZSRM08fIN7uK0hDSHd1jqwrXl0TNIg2dYeYVAaKWOtX-20TiJT2tSkSCe-1imdsKnhi9M9IeqHj_4FZMy-Qg)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: GET /api/v1/contracts<br/>Query: filter, pageSize, pageNo, format
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra query, header theo contract
        break query, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_QUERY_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc contracts thuộc phòng của landlord actor#59; filter/offset
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Chỉ đọc hợp đồng trong tài sản của actor
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        alt format=json hoặc mặc định
            S-->>G: 200 CONTRACTS_FETCHED + data theo DTO
            G-->>C: Chuyển tiếp JSON và header
        else format xuất tệp được hỗ trợ
            S-->>G: 200 File stream + Content-Type/Content-Disposition
            G-->>C: Chuyển tiếp tệp#59; không JSON wrapper
        end
    ```
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        roomId:
          type: string
          format: uuid
        buildingId:
          type: string
          format: uuid
        status:
          type: string
        tenantId:
          type: string
          format: uuid
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: format
    in: query
    description: json trả envelope; định dạng khác trả file stream.
    schema:
      type: string
      enum:
      - json
      - xlsx
      - csv
      - pdf
      default: json
  responses:
    '200':
      description: 'Thành công: Quản lý hợp đồng của tôi.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - CONTRACTS_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/ContractListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: CONTRACTS_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: draft
              rentPrice: 3500000
              depositAmount: 7000000
              contractCode: Ví dụ
              roomName: Ví dụ
              tenantName: Ví dụ
              tenantPhone: '0901234567'
              startDate: '2026-09-23T11:55:00.000Z'
              endDate: '2026-09-23T11:55:00.000Z'
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
        text/csv:
          schema:
            type: string
            format: binary
        application/pdf:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
  - Contract
  x-apidog-folder: Contract
  operationId: postContracts
  security:
    - BearerAuth: []
  summary: Create draft contract
  description: |-
    landlord. Tạo hợp đồng nháp. Lỗi nghiệp vụ: 409 ACTIVE CONTRACT EXISTS · 422 TENANT IDENTITY INVALID · 403 FORBIDDEN.

    ### Sequence diagram — Create draft contract

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNq1V89v1EYU_ldG28uiOlpI4cC2jbRZm2BIdoPXhB-KtJq1J-tR7Bljj1NWiAPigKoKqRGHqqqqEkUIQYsCbaWK3QOHjfg__J_0zYy96yTLqZRDsMfvzbz3fd97b_ZBzeM-qTVrKbmXEeYRk-JhgqNthuAfzgRnWTQgiX6PcSKoR2PMBGojnKJ2SAk812-RAWqgDT6gITl31nZN2rY2bbSGBfkOj85aONKiR5I96hHkkCFNRbLArCfNBGGYeaOlVJuftTKl1SZPxTAhvRvrpUPfH5y1taUt9SELKk5t2V5aWVlros1uz0UNHNPG3oWGx5lIsCfSbwZJY2WV-6MmSjiPbN9ACWyCQ3cUE0MfKeSqfurgaLa6GXBGlL9-b3se2Pkk5ikVrYhnTOjNNhOIxYBwRxG8mRkx8chAqYDwTQBSbUGYL58NtEcC6oWkrd0FieIQ1q-T0fxlCycUD0KS6vzWdH5r-fiIIY8nCQEjytkShXB2aT55HCFIFiXgikIaUaH9BgnBu2jr49t8cijQEAx_oSjIxwcMjaavM-Tl45eZNtXHwDntJrq4fBnV3W63v9Hq3Ok71o2bVs_tFWqBNE4EtUUSujNC1265sN3khYcG-eRn-DN-x4awer2HPOwFpBpQy_NICurgu4QhEdB8_CEDtDDExvPxP54M8YPQgS6I7vwFVL_Zad10r3Yd-65lLgrMaSIXAIGIXmWIMmACKua0HlFAcCiCQr3Okk7o-Md88gO4Bvnk-5nrfOdeE7WDbASYQ-wy9BgUABWZSi6D6d-QtaAM3Z8eePCeT955xinK0N70Obq9VNTQkith0Pv39P4LIf3i0uWvUZqNgGQEsuYJEvnkd-SFmEYggvnJGWRn-8jn8E3VPNi9Q8PpwclDrs9lc63X7TQGUCGGRMQnsHVAwL2ooCp1Z00lbd50jOJgehA3jvcBPBYgX3I3LPksOFbeSHpLfRwJNMggMW9Oca-g4OL586hud7Za67bZV04NVL4Wcuyvds07leWrVsu0HFhYbc1szp0Vz2nqYhDZIQOpTZ5RFOaTn-gpMZWU4JD6srp2KAl9jU8Kso6woeinCfEbLAtDWbUNAq1Y8aUpgt33aeHJhnz6nCLT7QJnFGHfp1IWONxMeEyg25H02x0cpicKxswnR1DX-eRJVjJ9vD8dw386hhLnZPoc1jSqwKys-1_ZcAG-y8uornBruXa307_SstdndfSf4TJ1DT31VL81IB4a-pQNDel3GCOpkWcQJ0iL7hFVDWXfg2-qWXkKtKeFYs0lTUIVhiLjXdUp7mUQ1qwGpn9EsvLGL4rC5jHMwOlfs04PW0xfs8JVSDZ25W6HrArUyoo9S0NWVCPhYdFAhKZ_tl29bCeqoVVQtMu4MVSEmL5Rf-fH6cwTXSnQOg5Og9nhgAjfgyLrGaYkg8sqexVX-wwbKpYprGXT1wDbx7fQu2S21ZNUwKA5JcoCJ12Cp_yP948fwzcG8L2JT1RAS_WcNJ_8Jmk8ymQof7JhdUd57EKK72dKsSBLoez9CiAaUQVFoALR86nQN8RcLYTrJ8SvKCmFMA_hntTsI0g6kTQrHNgwg4HHFnWar1D9StdZtU3T6nyOCihmLlWWBxHECoJ9lKkx_YSd5LsM3q8IG6J-r1M8rIz2RZHDkG61XXvL6re7HdeB5751255P6s-aBoAK3Wx85AGWgYw0Rnswm-SAeomlW8wp8JjiTPW1yqWkktwnOpFrdVodt28DA67t3ukXPR2a-f_Zo1atNbsjI2SplClnJ766kDU_pWY_wTsCJPZe81eWYFXCZR8TCZdfP7F5u7uxYbufbm6K_PDj22xhH1iXOSEG1UTVzUDea8NwgL3d6oFlK-ARXAdRnakBDOVxzlAaPESXYMjaHddyOq31fs9ytiynbzlO1wGuMRpW7_8l