post:
  tags:
  - Contract
  x-apidog-folder: Contract
  x-apidog-status: designing
  operationId: postContractsContractidGenerateDraftDocument
  security:
    - BearerAuth: []
  summary: Generate draft contract document
  description: |-
    **Trạng thái triển khai:** endpoint chưa được triển khai trong Tenancy-Service và đang tạm hoãn.
    Hiện mới có renderer PDF; chưa có handler lấy dữ liệu hệ thống, liên kết tài liệu với Contract
    hoặc adapter upload media. Identity-Service cũng chưa có internal endpoint upload/complete cho luồng này.
    This API remains in designing until its controller and handler are implemented.
    No implementation sequence is published because this endpoint is not implemented.
    Internal API sẽ được gọi trực tiếp từ Tenancy sang Identity bằng service token, không public qua gateway.
    
    Biến lấy từ Contract, Room, Building và BillingSetting; paymentDueDay lấy từ BillingSetting,
    không tự thêm vào Contract. landlordName lấy qua internal user lookup; nếu không có thì để trống và log warning.
    Renderer kiểm tra requiredVariables trước khi tạo PDF; thiếu hoặc rỗng trả 422 TEMPLATE_DATA_INVALID,
    số 0 vẫn hợp lệ. tenantCccd chưa được điền tự động; mẫu hiện tại để chỗ trống để đối chiếu khi ký.
    
    Chuẩn bị upload, PUT PDF lên R2 và complete upload đều nằm ngoài UoW transaction ghi Contract.
    Sau upload phải lock và kiểm tra lại hợp đồng còn draft, còn tồn tại và thuộc landlord trước khi lưu liên kết
    media cùng outbox. File upload xong nhưng transaction thất bại có thể chưa được gắn vào Contract;
    cơ chế xử lý file chưa gắn cần chốt cùng P6-04.
    
  parameters:
  - name: contractId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/ContractGenerateDraftRequestDto
        example:
          templateKey: standard-room-lease-v1
  responses:
    '201':
      description: 'Thành công: Sinh tài liệu nháp.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - CONTRACT_DRAFT_GENERATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/ContractGenerateDraftResponseDto
          example:
            statusCode: 201
            code: CONTRACT_DRAFT_GENERATED
            data:
              contractId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              mediaId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              purpose: contract_template
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/media/{mediaId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - CONTRACT_NOT_DRAFT
                description: |-
                  - CONTRACT_NOT_DRAFT: Hợp đồng không ở trạng thái nháp.
          examples:
            contract_not_draft:
              summary: CONTRACT_NOT_DRAFT — Hợp đồng không ở trạng thái nháp.
              value:
                statusCode: 409
                code: CONTRACT_NOT_DRAFT
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - TEMPLATE_DATA_INVALID
                  - VALIDATION_FAILED
                description: |-
                  - TEMPLATE_DATA_INVALID: Dữ liệu áp dụng mẫu hợp đồng không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            template_data_invalid:
              summary: TEMPLATE_DATA_INVALID — Dữ liệu áp dụng mẫu hợp đồng không hợp lệ.
              value:
                statusCode: 422
                code: TEMPLATE_DATA_INVALID
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
