    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: POST /api/v1/contracts/{contractId}/deposit-settlement<br/>Body: contractId, originalDeposit, deductions, refundAmount, paymentMethod<br/>refundPayoutAccount, note
        G->>G: Gắn correlation-id
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, path, header theo contract
        break JSON/body, path, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc contract, cọc gốc, công nợ và chứng cứ khấu trừ
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (CONTRACT_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor sở hữu hợp đồng#59; contractId body khớp path<br/>Đối chiếu originalDeposit và deductions#59; refundAmount = cọc gốc trừ khấu trừ<br/>Hoàn tiền chuyển khoản phải có refundPayoutAccount khi áp dụng
        Note over S,D: refundAmount dương: hoàn khách#59; âm: khách nộp thêm<br/>Endpoint ghi nhận quyết toán#59; không tự gọi provider để chuyển tiền
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (CONTRACT_ID_MISMATCH / REFUND_AMOUNT_MISMATCH / REFUND_PAYOUT_ACCOUNT_REQUIRED / SETTLEMENT_INVALID / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Ghi nhận quyết toán cọc, các khoản khấu trừ và phương thức hoàn/thu thêm theo DTO
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 201 SETTLEMENT_DEPOSIT_RECORDED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: contractId
    in: path
    required: true
    description: UUID của hợp đồng cần quyết toán cọc.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/DepositSettlementRequestDto
        example:
          contractId: a81d4284-5f6e-4b68-b762-d3369b12be12
          originalDeposit: 3500000
          deductions:
          - category: DAMAGE_COMPENSATION
            description: Vỡ cánh cửa tủ lạnh và hỏng ổ khóa phòng
            amount: 800000
          refundAmount: 2700000
          paymentMethod: BANK_TRANSFER
          refundPayoutAccount:
            bankCode: VCB
            accountNumber: "0123456789"
            accountHolderName: NGUYEN VAN B
          note: Đã kiểm tra phòng P201 và nghiệm thu xong
  responses:
    "201":
      description: "Thành công: Quyết toán tiền cọc hoàn tất."
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - SETTLEMENT_DEPOSIT_RECORDED
              data:
                $ref: ../../openapi.yaml#/components/schemas/DepositSettlementResponseDto
    "400":
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    "401":
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    "403":
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      x-apidog-name: Not Found
      description: Không tìm thấy tài nguyên được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [404]
              code:
                type: string
                enum:
                  - CONTRACT_NOT_FOUND
                description: |-
                  - CONTRACT_NOT_FOUND: Không tìm thấy hợp đồng.
          examples:
            contract_not_found:
              summary: CONTRACT_NOT_FOUND — Không tìm thấy hợp đồng.
              value:
                statusCode: 404
                code: CONTRACT_NOT_FOUND
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm quy tắc của endpoint.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - CONTRACT_ID_MISMATCH
                  - REFUND_AMOUNT_MISMATCH
                  - REFUND_PAYOUT_ACCOUNT_REQUIRED
                  - SETTLEMENT_INVALID
                  - VALIDATION_FAILED
                description: |-
                  - CONTRACT_ID_MISMATCH: contractId trong body khác contractId trên đường dẫn.
                  - REFUND_AMOUNT_MISMATCH: refundAmount không khớp tiền cọc gốc trừ tổng các khoản khấu trừ.
                  - REFUND_PAYOUT_ACCOUNT_REQUIRED: Hoàn cọc bằng chuyển khoản nhưng thiếu thông tin tài khoản nhận tiền.
                  - SETTLEMENT_INVALID: Hợp đồng hoặc dữ liệu quyết toán chưa đủ điều kiện để chốt.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc khác của DTO.
          examples:
            contract_id_mismatch:
              summary: CONTRACT_ID_MISMATCH — contractId trong body khác contractId trên đường dẫn.
              value:
                statusCode: 422
                code: CONTRACT_ID_MISMATCH
            refund_amount_mismatch:
              summary: REFUND_AMOUNT_MISMATCH — refundAmount không khớp tiền cọc gốc trừ tổng các khoản khấu trừ.
              value:
                statusCode: 422
                code: REFUND_AMOUNT_MISMATCH
            refund_payout_account_required:
              summary: REFUND_PAYOUT_ACCOUNT_REQUIRED — Hoàn cọc bằng chuyển khoản nhưng thiếu thông tin tài khoản nhận tiền.
              value:
                statusCode: 422
                code: REFUND_PAYOUT_ACCOUNT_REQUIRED
            settlement_invalid:
              summary: SETTLEMENT_INVALID — Hợp đồng hoặc dữ liệu quyết toán chưa đủ điều kiện để chốt.
              value:
                statusCode: 422
                code: SETTLEMENT_INVALID
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc khác của DTO.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    "500":
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
