get:
  tags:
    - Administrative Units
  x-apidog-folder: Administrative Units
  x-apidog-status: released
  operationId: getAdministrativeWards
  summary: List wards by province
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant C as AdministrativeUnitController
        participant App as AdministrativeUnitService
        participant Catalog as Local catalog
        Client->>GW: GET /api/v1/administrative-units/provinces/{provinceCode}/wards
        GW->>S: Proxy original HTTP request
        S->>C: Invoke getAdministrativeWards
        C->>App: listWardsByProvince(provinceCode)
        App->>App: Normalize and validate province code
        App->>Catalog: hasProvince(code)
        alt Province exists
            App->>Catalog: listWardsByProvince(code)
            Catalog-->>App: Ward records
            App-->>C: Ward records
        else Invalid code or unknown province
            App-->>C: INVALID_PROVINCE_CODE or PROVINCE_NOT_FOUND
        end
        C->>C: Map to response DTO
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  security: []
  parameters:
    - name: provinceCode
      in: path
      required: true
      description: One- or two-digit province code.
      schema:
        type: string
        pattern: '^\d{1,2}$'
      example: '01'
  responses:
    '200':
      description: Wards returned successfully.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode:
                type: integer
                enum: [200]
              code:
                type: string
                enum: [ADMINISTRATIVE_WARDS_FETCHED]
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/AdministrativeWardDto
    '404':
      description: Province code does not exist.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [404]
              code:
                type: string
                enum: [PROVINCE_NOT_FOUND]
    '422':
      description: Province code is invalid.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum: [INVALID_PROVINCE_CODE]
