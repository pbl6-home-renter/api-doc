get:
  tags:
    - Administrative Units
  x-apidog-folder: Administrative Units
  x-apidog-status: released
  operationId: getAdministrativeProvinces
  summary: List Vietnamese provinces
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant C as AdministrativeUnitController
        participant App as AdministrativeUnitService
        participant Catalog as Local catalog
        Client->>GW: GET /api/v1/administrative-units/provinces
        GW->>S: Proxy original HTTP request
        S->>C: Invoke getAdministrativeProvinces
        C->>App: listProvinces()
        App->>Catalog: listProvinces()
        Catalog-->>App: Province records
        App-->>C: Province records
        C->>C: Map to response DTO
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  security: []
  responses:
    '200':
      description: Provinces returned successfully.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode:
                type: integer
                enum: [200]
              code:
                type: string
                enum: [ADMINISTRATIVE_PROVINCES_FETCHED]
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/AdministrativeProvinceDto
