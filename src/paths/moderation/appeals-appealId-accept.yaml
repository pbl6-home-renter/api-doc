post:
  tags:
    - "Moderation"
  x-apidog-folder: "Moderation"
  x-apidog-status: "released"
  operationId: "acceptAppeal"
  security:
    - BearerAuth: []
  summary: "Accept appeal"
  description: "Chỉ admin. Trong **một transaction**: khiếu nại → `accepted`, mở khóa tài khoản (như `POST /users/{userId}/unlock`: ghi `user.unlocked`, đóng kỳ khóa, thông báo `user.unlocked`) và gửi email kết quả.\n\n- Nếu tài khoản đã được mở khóa trước đó (hoặc đang ở kỳ khóa khác), chỉ đóng khiếu nại, `unlocked = false`.\n- Ngược lại, admin mở khóa trực tiếp cũng tự đóng khiếu nại `pending` thành `accepted`.\n- Audit: `user.unlocked` với metadata `{ appealId }`."
  parameters:
    - name: "appealId"
      in: "path"
      required: true
      description: "UUID của khiếu nại."
      schema:
        type: "string"
        format: "uuid"
  responses:
    "200":
      description: "Thành công."
      content:
        "application/json":
          schema:
            type: "object"
            additionalProperties: false
            required:
              - "statusCode"
              - "code"
              - "data"
            properties:
              statusCode:
                type: "integer"
                enum:
                  - 200
              code:
                type: "string"
                enum:
                  - "APPEAL_ACCEPTED"
              data:
                $ref: "../../openapi.yaml#/components/schemas/AppealReviewResponseDto"
          example:
            statusCode: 200
            code: "APPEAL_ACCEPTED"
            data:
              id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
              status: "accepted"
              userId: "b13d28cf-b1c5-4e78-a54d-017637c47c30"
              unlocked: true
    "401":
      $ref: "../../openapi.yaml#/components/responses/UnauthorizedError"
    "403":
      $ref: "../../openapi.yaml#/components/responses/ForbiddenError"
    "404":
      description: "Không tìm thấy khiếu nại hoặc người dùng."
      content:
        "application/json":
          schema:
            type: "object"
            additionalProperties: false
            required:
              - "statusCode"
              - "code"
            properties:
              statusCode:
                type: "integer"
                enum:
                  - 404
              code:
                type: "string"
                enum:
                  - "APPEAL_NOT_FOUND"
                  - "USER_NOT_FOUND"
          examples:
            appeal_not_found:
              summary: "APPEAL_NOT_FOUND"
              value:
                statusCode: 404
                code: "APPEAL_NOT_FOUND"
            user_not_found:
              summary: "USER_NOT_FOUND"
              value:
                statusCode: 404
                code: "USER_NOT_FOUND"
    "409":
      description: "Khiếu nại đã được xử lý."
      content:
        "application/json":
          schema:
            type: "object"
            additionalProperties: false
            required:
              - "statusCode"
              - "code"
            properties:
              statusCode:
                type: "integer"
                enum:
                  - 409
              code:
                type: "string"
                enum:
                  - "APPEAL_NOT_PENDING"
          examples:
            appeal_not_pending:
              summary: "APPEAL_NOT_PENDING"
              value:
                statusCode: 409
                code: "APPEAL_NOT_PENDING"
    "500":
      $ref: "../../openapi.yaml#/components/responses/InternalServerError"
    "503":
      $ref: "../../openapi.yaml#/components/responses/AuthUnavailableError"
