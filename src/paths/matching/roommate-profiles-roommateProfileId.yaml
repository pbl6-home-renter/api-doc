get:
  tags:
  - Matching
  x-apidog-folder: RoommateProfile
  operationId: getRoommateProfilesRoommateprofileid
  security:
    - BearerAuth: []
  summary: Get roommate profile details
  description: |-
    tenant. Đọc một hồ sơ theo định danh. Lỗi nghiệp vụ: 404 NOT FOUND · 403 PROFILE NOT VISIBLE.

    ### Sequence diagram — Get roommate profile details

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: GET /api/v1/roommate-profiles/{roommateProfileId}
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra path, header theo contract
        break path, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc roommate_profile theo id
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Profile tồn tại và actor được xem theo visibility
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN / PROFILE_NOT_VISIBLE)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 ROOMMATE_PROFILE_FETCHED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: roommateProfileId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc một hồ sơ theo định danh.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOMMATE_PROFILE_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoommateProfileDetailResponseDto
          example:
            statusCode: 200
            code: ROOMMATE_PROFILE_FETCHED
            data:
              tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              bio: Hiền lành, sạch sẽ
              budgetMin: 2000000
              budgetMax: 3500000
              preferredArea: Hòa Khánh, Liên Chiểu
              isVisible: true
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              tenantName: Nguyễn Thu Hà
              gender: female
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      x-apidog-name: Forbidden
      description: Người gọi sai vai trò hoặc hồ sơ không công khai cho người gọi.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [403]
              code:
                type: string
                enum:
                  - FORBIDDEN
                  - PROFILE_NOT_VISIBLE
          examples:
            forbidden:
              summary: FORBIDDEN — Vai trò không được phép đọc hồ sơ tìm bạn ở.
              value:
                statusCode: 403
                code: FORBIDDEN
            profile_not_visible:
              summary: PROFILE_NOT_VISIBLE — Hồ sơ không được phép hiển thị cho người gọi.
              value:
                statusCode: 403
                code: PROFILE_NOT_VISIBLE
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
