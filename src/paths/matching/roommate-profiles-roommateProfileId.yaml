get:
  tags:
  - Matching
  x-apidog-folder: RoommateProfile
  x-apidog-status: designing
  operationId: getRoommateProfilesRoommateprofileid
  security:
    - BearerAuth: []
  summary: Get roommate profile details
  description: |
    Active tenant only. Public detail uses the same projection, Identity and discoverability conditions as search (P10-D88). A locked tenant's profile returns 404 ROOMMATE_PROFILE_NOT_FOUND after the lock lifecycle event removes their tenant_user_projections row. Missing, hidden or full-room profiles also return 404.
    This does not change isVisible. Unlock restores eligibility after projection processing, subject to the existing rules. The separate GET /me/roommate-profile keeps its current own-profile behavior and guards.
  parameters:
  - name: roommateProfileId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc một hồ sơ theo định danh.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOMMATE_PROFILE_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoommateProfileDetailResponseDto
          example:
            statusCode: 200
            code: ROOMMATE_PROFILE_FETCHED
            data:
              tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              bio: Hiền lành, sạch sẽ
              budgetMin: 2000000
              budgetMax: 3500000
              preferredArea: Hòa Khánh, Liên Chiểu
              isVisible: true
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              tenantName: Nguyễn Thu Hà
              gender: female
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      x-apidog-name: Forbidden
      description: Caller has the wrong role or their own account is locked.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [403]
              code:
                type: string
                enum:
                  - FORBIDDEN
                  - ACCOUNT_LOCKED
          examples:
            forbidden:
              summary: FORBIDDEN — Vai trò không được phép đọc hồ sơ tìm bạn ở.
              value:
                statusCode: 403
                code: FORBIDDEN
            account_locked:
              summary: ACCOUNT_LOCKED — Tài khoản đã bị khóa.
              value:
                statusCode: 403
                code: ACCOUNT_LOCKED
    '404':
      description: Profile missing or not discoverable, including a tenant unavailable in the lifecycle projection.
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [404] }
              code: { type: string, enum: [ROOMMATE_PROFILE_NOT_FOUND] }
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
