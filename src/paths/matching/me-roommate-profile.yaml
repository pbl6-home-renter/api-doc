get:
  tags:
  - Matching
  x-apidog-folder: RoommateProfile
  operationId: getMeRoommateProfile
  summary: Get my roommate profile
  description: 'tenant. Đọc profile của chính mình. Lỗi nghiệp vụ: 404 NOT FOUND.'
  responses:
    '200':
      description: 'Thành công: Đọc profile của chính mình.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOMMATE_PROFILE_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoommateProfileMyResponseDto
          example:
            statusCode: 200
            code: ROOMMATE_PROFILE_FETCHED
            data:
              tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              lifestyle:
                sleep: 23h-6h
              personality:
                introvert: true
              isVisible: true
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
put:
  tags:
  - Matching
  x-apidog-folder: RoommateProfile
  operationId: putMeRoommateProfile
  summary: Create or update my roommate profile
  description: 'tenant. Tạo hoặc cập nhật profile của chính mình. Lỗi nghiệp vụ: 422 BUDGET RANGE INVALID · 422
    VALIDATION FAILED.'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/RoommateProfileSaveRequestDto
        example:
          bio: Hiền lành, sạch sẽ
          lifestyle:
            sleep: 23h-6h
          personality:
            introvert: true
          budgetMin: 2000000
          budgetMax: 3500000
          preferredArea: Hòa Khánh, Liên Chiểu
          moveInOn: '2026-10-01'
          isVisible: true
  responses:
    '200':
      description: 'Thành công: Tạo hoặc cập nhật profile của chính mình.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOMMATE_PROFILE_SAVED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoommateProfileSaveResponseDto
          example:
            statusCode: 200
            code: ROOMMATE_PROFILE_SAVED
            data:
              tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              isVisible: true
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
