    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: GET /api/v1/me/roommate-profile
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra header theo contract
        break header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc roommate_profile WHERE tenantId = actor
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Chỉ đọc profile chính actor#59; không tự tạo trong GET
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 ROOMMATE_PROFILE_FETCHED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  responses:
    '200':
      description: 'Thành công: Đọc profile của chính mình.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOMMATE_PROFILE_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoommateProfileMyResponseDto
          example:
            statusCode: 200
            code: ROOMMATE_PROFILE_FETCHED
            data:
              tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              lifestyle:
                sleep: 23h-6h
              personality:
                introvert: true
              isVisible: true
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
put:
  tags:
  - Matching
  x-apidog-folder: RoommateProfile
  operationId: putMeRoommateProfile
  security:
    - BearerAuth: []
  summary: Create or update my roommate profile
  description: |-
    tenant. Tạo hoặc cập nhật profile của chính mình. Lỗi nghiệp vụ: 422 BUDGET RANGE INVALID · 422 VALIDATION FAILED.

    ### Sequence diagram — Create or update my roommate profile

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNq1VkGL20YU_isP9-KlMt5sk0PcdkG7Uhwnu_ZG1m6asGDGo7E8rDRSRiM3JuRQeiilFBp6KKEUsoQQmhY2oYWCfcjBIf9D_6RvJNlr7zqnNj7I0sx7M9973_fezKMKjTxWaVQS9iBlgjKLE1-S8FgA_kiqIpGGfSaL75hIxSmPiVCwCySB3YAzfK_eZX2ow37U5wHbuGzb1LbmQQuaRLGvyfiyhaMtukyOOGXgMJ8nSq4x62ozxQQRdFxLCvPLVpa2OogS5UvWvbM3d-h5_cJ2t7a93WzAwaELdRLz-uhKPWR1GUVhiPhqsYwGGMcXfVnf3om8cQN8JjwmDehzqYb3GMHXiNI0JopHwoBYsgGTknkHMhpxTOLSkKUj4VTlqy1GTckILpd6PlP7XCxeyUMDwmjEWqKjB3mUuwV8wBI1DvS6TCaRIAFXYwN4csQT3g_KFDSLsJrZ5EwAjXCfIAdY454BJzybfhuCkgQkBgkBD7kq_PoI5gSO3r_Ops8V-Gj4K4dhNjkVMJ69SoFmk5dpYVpsg_vsNuDq1nWoup1Ob99s3-s59p1Du-t2S_YxYSugjpjkgzHcuuvictMXFPrZ9Ck-Jm-Ej6O3u0AJHbJlQCalLEG2oxMmQA15NnmbGpAQxBZlk3-ohvhWFUDXoNu8AtXDtnno3uw4rfu2tQ6Y0wAXE4KIfk-Bi0ShTNhFfcGQkUANSzU6tSKgdz9l0x_QdZhNv1-4nq_cbcDuMB1jzhG7hh6D1BWWKANjmf2NUSsu4OHslOJ3Nn1DjQuUwWj2DL6qlTVRc3UaivW7xfprU_rJteufQ5KOkWQgVEUSVDb9A2hAeIgiON85xehaHngRzuU1jHZvwJ-drm5y-1w2t7qddr2P9WDojGA9IHCG7pHAWbqipcummjY6m0A8nJ3G9XdPMHliCJ7mzp_zWXKce4P21vo4U1gbGBg9p7hbUnB1cxOqrfaRudeyerlTHeafpRx7Ox3r3tLwTdu0bAcHdsyFzcZl8VykLkaRPRcotenPHIJs-gu_IKY5JViYnq6uAWeBV-QnQVmHWOyafo6lXxdpEBAs2jrD1przVVCEqz_hpafwo9kzDpbbQc44EM_jWhYkwA6DLUBxlnw5IEGyUjBWNj3Dus6m36Vzpt89mU3wr8Awz7OcPcOxIqvIrK7734S_Jr9bW1DN82a6rU67d8Ns7S3q6D-nyypq6EcKZb-FoYaOi6AouJb0y7mERS4LOvur8LZqRbaX4y1DO8lbwoMU91-IffZnqEts8mK8wtWi-c4NR2UDXLTinJvRnFKFjIiibc0B5_wiR8sk3F5JvIx0XCW2YgbDQICYr28wVDl7hU9NtfBTbLZinco_g-qNjrPTsiy7_X9kv-z3PLc8DTUanfQziiByDmIYYUMpKUC3OOLYIBKS5mJcOkm8cwY-IJ-dQ6tpuz3HbDftXlmFWH4fU1U7drPV1vBEgvLBqlmZdTHk6LzjkHGujbcLTpd1Vz086NqOW_Ccnwqq5W2sLLfb2d9vuR_WJergOQTvX5f5aUeoJDzfJXQN9N7TUaC8p095rqyGFkzQJ_RkGT-2hvev8ajB6wnHu9aiGjbwKJFa6dewEbbaru20zb0eIj6ynZ7tOB0HqSXgL9-55uRsoYvTQfCma_cOnM4NJKHXNY9sCz4F1Du5IO4PkYLnnkoTo2jX-sRadzRUjErIZEi4hxfNR8cVnAzZcaUBxxWPDUgaqOPKYzRKY11p5Q200lAyZUZFRqk_rDTybmdU8H53H-9pxeTjfwGQ0Pa6)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: PUT /api/v1/me/roommate-profile<br/>Body: gender, birthYear, occupation, preferredProvince, preferredDistrict<br/>preferredArea, budgetMin, budgetMax, moveInOn, bio<br/>lifestyle, personality, isVisible
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc profile hiện tại của actor nếu có
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: budgetMin không vượt budgetMax#59; validate toàn bộ profile theo DTO
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (BUDGET_RANGE_INVALID / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Tạo hoặc thay thế profile của actor (UPSERT theo tenantId)
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 ROOMMATE_PROFILE_SAVED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/RoommateProfileSaveRequestDto
        example:
          bio: Hiền lành, sạch sẽ
          lifestyle:
            nightOwl: false
          personality:
            introvert: true
          budgetMin: 2000000
          budgetMax: 3500000
          preferredArea: Hòa Khánh, Liên Chiểu
          moveInOn: '2026-10-01'
          isVisible: true
  responses:
    '200':
      description: 'Thành công: Tạo hoặc cập nhật profile của chính mình.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOMMATE_PROFILE_SAVED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoommateProfileSaveResponseDto
          example:
            statusCode: 200
            code: ROOMMATE_PROFILE_SAVED
            data:
              tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              isVisible: true
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - BUDGET_RANGE_INVALID
                  - VALIDATION_FAILED
                description: |-
                  - BUDGET_RANGE_INVALID: Khoảng ngân sách không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            budget_range_invalid:
              summary: BUDGET_RANGE_INVALID — Khoảng ngân sách không hợp lệ.
              value:
                statusCode: 422
                code: BUDGET_RANGE_INVALID
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
