get:
  tags:
  - Matching
  x-apidog-folder: RoommateProfile
  operationId: getMeRoommateProfile
  security:
    - BearerAuth: []
  summary: Get my roommate profile
  description: 'tenant. Đọc profile của chính mình. Lỗi nghiệp vụ: 404 NOT FOUND.'
  responses:
    '200':
      description: 'Thành công: Đọc profile của chính mình.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOMMATE_PROFILE_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoommateProfileMyResponseDto
          example:
            statusCode: 200
            code: ROOMMATE_PROFILE_FETCHED
            data:
              tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              lifestyle:
                sleep: 23h-6h
              personality:
                introvert: true
              isVisible: true
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
put:
  tags:
  - Matching
  x-apidog-folder: RoommateProfile
  operationId: putMeRoommateProfile
  security:
    - BearerAuth: []
  summary: Create or update my roommate profile
  description: 'tenant. Tạo hoặc cập nhật profile của chính mình. Lỗi nghiệp vụ: 422 BUDGET RANGE INVALID · 422
    VALIDATION FAILED.'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/RoommateProfileSaveRequestDto
        example:
          bio: Hiền lành, sạch sẽ
          lifestyle:
            nightOwl: false
          personality:
            introvert: true
          budgetMin: 2000000
          budgetMax: 3500000
          preferredArea: Hòa Khánh, Liên Chiểu
          moveInOn: '2026-10-01'
          isVisible: true
  responses:
    '200':
      description: 'Thành công: Tạo hoặc cập nhật profile của chính mình.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ROOMMATE_PROFILE_SAVED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RoommateProfileSaveResponseDto
          example:
            statusCode: 200
            code: ROOMMATE_PROFILE_SAVED
            data:
              tenantId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              isVisible: true
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - BUDGET_RANGE_INVALID
                  - VALIDATION_FAILED
                description: |-
                  - BUDGET_RANGE_INVALID: Khoảng ngân sách không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            budget_range_invalid:
              summary: BUDGET_RANGE_INVALID — Khoảng ngân sách không hợp lệ.
              value:
                statusCode: 422
                code: BUDGET_RANGE_INVALID
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
