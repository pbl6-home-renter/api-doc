get:
  tags: [Matching]
  x-apidog-folder: MatchRequest
  x-apidog-status: developing
  operationId: getMatchRequests
  security:
    - BearerAuth: []
  summary: List my match requests
  description: |
    Active tenant only. Returns requests involving the caller, newest first with ID as a tie breaker. No phone, AI data or conversation is disclosed. Existing limitation: missing active participant summaries still return 404 MATCH_REQUEST_PARTICIPANT_UNAVAILABLE; requests remain stored and can be listed again once active summaries are available after unlock.

    ```mermaid
    sequenceDiagram
      participant T as Tenant
      participant TEN as Tenancy
      participant ID as Identity
      participant DB as Tenancy DB
      T->>TEN: GET /match-requests
      TEN->>ID: GET /internal/users?ids=actor
      ID-->>TEN: Active caller summary
      TEN->>DB: Page by requester/target and optional filters
      DB-->>TEN: Caller-owned requests and total
      TEN->>ID: GET /internal/users?ids=other participants
      ID-->>TEN: Active requester and target summaries
      TEN-->>T: 200 MATCH_REQUESTS_FETCHED with summaries
    ```
  parameters:
    - name: filter
      in: query
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties: false
        properties:
          direction: { type: string, enum: [incoming, outgoing] }
          status: { type: string, enum: [pending, accepted, rejected, withdrawn] }
    - name: pageNo
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    - name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    '200':
      description: Caller-owned match requests.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data, pagination]
            properties:
              statusCode: { type: integer, enum: [200] }
              code: { type: string, enum: [MATCH_REQUESTS_FETCHED] }
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/MatchRequestListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required: [type, pageNo, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
                properties:
                  type: { type: string, enum: [offset] }
                  pageNo: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1, maximum: 100 }
                  totalItems: { type: integer, minimum: 0 }
                  totalPages: { type: integer, minimum: 0 }
                  hasNextPage: { type: boolean }
                  hasPreviousPage: { type: boolean }
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      description: One of the match request participants is no longer active.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [404] }
              code: { type: string, enum: [MATCH_REQUEST_PARTICIPANT_UNAVAILABLE] }
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
post:
  tags: [Matching]
  x-apidog-folder: MatchRequest
  x-apidog-status: developing
  operationId: postMatchRequests
  security:
    - BearerAuth: []
  summary: Send a match request
  description: |
    Active tenant only. The target must be a different active tenant with a currently discoverable profile. A UUID Idempotency-Key is required per new intent. Replaying the same key and target returns the current request with 201 and does not emit another notification, even after its status changes. A different key is allowed after rejection or withdrawal, while only one pending request is allowed per unordered pair. The requester comes from the access token; Tenancy keeps Identity validation, requires the target to exist in the lifecycle-owned `tenant_user_projections` projection in the current transaction, and checks profile discoverability. Identity cannot bypass projection eligibility. Tenancy emits `match_request.created` with `matchRequestId`, `actorUserId`, Identity `actorDisplayName`, and `recipientUserId`; Community forwards the actor to the Web notification and adds deep link `/roommates?matchRequestId=<id>`. The Web route currently shows a placeholder, and mobile navigation is not implemented. Deploy the Community consumer before the Tenancy producer.

    New requests to a locked/unavailable target return 409 MATCH_REQUEST_COUNTERPART_UNAVAILABLE, with no committed request or outbox event. A missing projection row is unavailable and is not proof of a lock; historical projection completeness must be verified before rollout. If the projection exists but Identity already reports a locked tenant, the same 409 applies. Other missing/inactive target accounts or missing/hidden/full profiles retain 404 ROOMMATE_PROFILE_NOT_FOUND. Idempotent replays return the existing request before rechecking target eligibility.
    Pending requests are never cancelled on lock. Once unlock is processed by the existing lifecycle consumer, those requests remain usable. Lifecycle projection updates are asynchronous and do not change token TTL.

    ```mermaid
    sequenceDiagram
      participant T as Tenant
      participant TEN as Tenancy
      participant ID as Identity
      participant DB as Tenancy DB
      participant MQ as RabbitMQ
      participant COM as Community
      T->>TEN: POST /match-requests + Idempotency-Key
      TEN->>ID: GET /internal/users?ids=requester
      ID-->>TEN: Active requester
      TEN->>DB: Transaction: insert or replay by request key and pending pair
      TEN->>ID: GET /internal/users?ids=target (new requests only)
      ID-->>TEN: Active target (locked tenant returns 409; other missing/inactive accounts return 404)
      TEN->>DB: New requests only: require target in tenant_user_projections (else rollback, 409)
      TEN->>DB: Lock discoverable target profile; append outbox
      DB-->>TEN: Committed pending request
      TEN-->>T: 201 MATCH_REQUEST_CREATED
      TEN-)MQ: match_request.created to target
      MQ-)COM: Inbox dedup + system notification
    ```
  parameters:
    - name: Idempotency-Key
      in: header
      required: true
      description: UUID unique per new request intent for this requester.
      schema: { type: string, format: uuid }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/MatchRequestCreateRequestDto
  responses:
    '201':
      description: Created or idempotent replay of the current request.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [201] }
              code: { type: string, enum: [MATCH_REQUEST_CREATED] }
              data:
                $ref: ../../openapi.yaml#/components/schemas/MatchRequestResponseDto
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      description: Target account/profile missing or profile hidden/full; a locked or projection-unavailable account returns 409.
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [404] }
              code: { type: string, enum: [ROOMMATE_PROFILE_NOT_FOUND] }
    '409':
      description: Pending pair exists, key reused for another target, or counterpart account unavailable (pending requests are preserved).
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [409] }
              code: { type: string, enum: [DUPLICATE_MATCH_REQUEST, IDEMPOTENCY_KEY_REUSED, MATCH_REQUEST_COUNTERPART_UNAVAILABLE] }
    '422':
      description: Invalid request or self matching.
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [422] }
              code: { type: string, enum: [SELF_MATCHING_NOT_ALLOWED, VALIDATION_FAILED, UNEXPECTED_FIELD] }
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
