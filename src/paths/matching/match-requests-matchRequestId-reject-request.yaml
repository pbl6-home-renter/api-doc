post:
  tags: [Matching]
  x-apidog-folder: MatchRequest
  x-apidog-status: developing
  operationId: postMatchRequestsMatchrequestidRejectRequest
  security:
    - BearerAuth: []
  summary: Reject a pending match request
  description: |
    Only the active recipient can reject. Repeating reject returns the current rejected request without another notification. Another terminal state returns 409 MATCH_REQUEST_NOT_PENDING.

    For an actual change from pending, Tenancy checks the other tenant in `tenant_user_projections` inside the existing transaction after verifying the actor and terminal-state/replay rules, before mutating the request. An unavailable counterpart returns 409 MATCH_REQUEST_COUNTERPART_UNAVAILABLE: the request stays pending and no notification/outbox event is created. After unlock is processed by the lifecycle consumer, retry the same pending request. Profile visibility and room capacity are not rechecked for existing requests. Replays of a completed action keep their existing behavior even if the counterpart later becomes unavailable.

    ```mermaid
    sequenceDiagram
      participant T as Recipient
      participant TEN as Tenancy
      participant DB as Tenancy DB
      participant MQ as RabbitMQ
      participant COM as Community
      T->>TEN: POST /match-requests/{id}/reject-request
      TEN->>DB: Transaction: lock request, verify actor and pending state
      TEN->>DB: Pending changes only: require requester in tenant_user_projections (else 409, no save/outbox)
      TEN->>DB: Save rejected + match_request.rejected outbox
      TEN-->>T: 200 MATCH_REQUEST_REJECTED
      TEN-)MQ: match_request.rejected to requester
      MQ-)COM: Inbox dedup + system notification
    ```
  parameters:
    - name: matchRequestId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    '200':
      description: Rejected request, including an idempotent repeat.
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [200] }
              code: { type: string, enum: [MATCH_REQUEST_REJECTED] }
              data:
                $ref: ../../openapi.yaml#/components/schemas/MatchRequestResponseDto
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      description: Request is no longer pending, or the counterpart is unavailable; blocked pending requests are preserved.
      content:
        application/json:
          schema:
            type: object
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [409] }
              code: { type: string, enum: [MATCH_REQUEST_NOT_PENDING, MATCH_REQUEST_COUNTERPART_UNAVAILABLE] }
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
