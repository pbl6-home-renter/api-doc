    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: GET /api/v1/rate-policies<br/>Query: filter, pageSize, pageNo
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra query, header theo contract
        break query, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_QUERY_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc rate_policies theo tài sản của actor và filter/offset
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Actor sở hữu phạm vi building/room được truy vấn
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 RATE_POLICIES_FETCHED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
        roomId:
          type: string
          format: uuid
        type:
          type: string
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  responses:
    '200':
      description: 'Thành công: Liệt kê chính sách đơn giá và phí định kỳ.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - RATE_POLICIES_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/RatePolicyListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: RATE_POLICIES_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              landlordId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              scope: room
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              type: electricity
              rateKind: tiered
              isActive: true
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
  - Billing
  x-apidog-folder: RatePolicy
  operationId: postRatePolicies
  security:
    - BearerAuth: []
  summary: Create rate policy
  description: |-
    landlord. Tạo một chính sách đơn giá hoặc phí. Lỗi nghiệp vụ: 409 ACTIVE POLICY EXISTS · 422 INVALID RATE KIND · 403 FORBIDDEN.

    ### Sequence diagram — Create rate policy

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNq1Vk1v20YQ_SsD9qKgEpS4ySFqG0AWGYexLDkk43zAgLAi1-LC5JLhhxohyCHoISiKAjV6KIqiQAQjCJoWcIIWKCIecqCR_8F_0tklJUu2cmrqg20uZ4Yz89682SeKHThUaSkxfZRSblOVkVFE_H0O-EPSJOCpP6RR-RySKGE2CwlPoAMkho7HKP5fu0eH0ISdYMg8eumi7Zawbe_qsEUS-g2ZXLQwhIVJozGzKRh0xOIkWmNmCrOEcsLtSSMuzS9aqcJqN4iTUUTNO925w8AZlradxo0bWy3Y7ZsWNEnImuMrzQgza4SBhzFo_NUwat7YDJxJC2I7CGkdoiDwdacOnPj4lEzkGbpsM-5I6zihYVyG3yrDbxWzEw52EEXUIwkLeINhgENWZN_6kERE-oPHfJaUfsOIkkPY-_CmyI4TGKHhrwzcYjblMMlfp2AXs1dpaVp-Br_TacHVjetQs_r9wU6792BgaHfuaqZlVihQ7qwktUcjdjCB2_csDJe9tGFYZL_gr9lbPsLTbRNsYrt0OaG2bdMYux4cUg6Jy4rZ-7QOMcHcgmL2jy1SfJ-Uia7J7vIVqN3tte9at_qG_lBT1yVmtMDChmBGv6fAeJwgXPQ8zuBS4iVuxQqjURZ0-mORfY-ubpF9t3A9i2y2oOOmE-w55i5SDyESTI8TRNHN_8aqE8bhcT618bnI3tr1c5DBOH8B9xsVNxuWaEMZ3yzjr23pZ9eufwlxOkGQgdhJEEFSZH-A7RHmIwnOvpxidboDToDv5Cyh3VsY5dPVj2yf0ea22e81h0jOuuiIQzG0S9E94PjWXuHSRVMBm53PIHTzadg8PcLmcRccgd1ojmeFsfQG4S34cZLAMMXC7DOIzQqCq5cvQ03v7bW7ujqQTk2YP1Z0HGz21QdLx7e0tqoZeLDZXthcukie89CFSLJjjlTLfmLgFdnP7ByZ5pAQjzliug4Y9ZyyPzHS2id1CT-LqNPkqeeRoUebFCVO4lVChNGPWOXJR0H-goFq9REzBsRxmKAF8XYjlAVUHBp_fUC8eGVg1CI7wbkusufpHOnTo3yGf8oc5n2O8hd4VnYVkRVz_xsfrenvxgbUZN_alt7vDW629e5ijv5zu9Ryhn6wpfnUhzED5AZyInuJ6Qn2S1mcCB6zMUX6vMNzD2uYVvHURtn25cKrGg-lNjxKMZEF6_M_fTFrs5eTj1F8LrqVwKLaCHWVGFVB7Pyvc2k9TmWfsZkrI7C9AkAUeHSR2lmkR6Jvz7BvUf4afwvI-ShF0eXr2P4F1G72jU1dVbXep0Ch0n02B-D0CDvxLJWr4rlIqpxOlKvpQnOdpVZj1u_KEo-X1su6zHFRtDuWvqcNdvtdvfNgoN3Xz3bFJy0CW4rzNDuxsZOuyDOEMTJKSOQrItzCgKHaxSSVk7W0FpdK-8gsLMSlbWmDbb2nopD8n_OxqW3pPZEbjwXZAr7y1sJ6A8nVQcVIqTdCM8Zyha_M-QppV-J0-js7uvXxiZL4eh_eVF3pBahvwRg13ayjd1ekDxy_weQCagmue0NiHy4njur24Q1uy8DHWwfUuNR5nIBLdUmzY7iGWq73LM3otbsDUzP2NGOgGUbfQEAJjJavb3NINnDDSyQqTnUMDZ9U-BxQgsmiGfKW1A1suVdb6-9d8729Hi7c7Uka18uVJHRp3fpT6opPI58wBy-1T_YVfOnTfaUF-4pDD0jqJfvKUzRKQ7Egqtuu0kqilNaVKEhHrtKSil5X8C75EK995cun_wI-_CLd)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: POST /api/v1/rate-policies<br/>Body: scope, roomId, name, type, rateKind<br/>steps
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc phạm vi áp dụng và policy active cùng loại
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Kiểm tra scope, rateKind, steps#59; không có policy active xung đột
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (ACTIVE_POLICY_EXISTS)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (INVALID_RATE_KIND / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Tạo rate_policy theo DTO với ràng buộc policy active
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 201 RATE_POLICY_CREATED + data theo DTO<br/>Location: /api/v1/rate-policies
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/RatePolicyCreateRequestDto
        example:
          scope: room
          roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          name: Điện EVN
          type: electricity
          rateKind: tiered
          steps:
          - from: 0
            to: 50
            price: 1806
  responses:
    '201':
      description: 'Thành công: Tạo một chính sách đơn giá hoặc phí.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - RATE_POLICY_CREATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RatePolicyCreateResponseDto
          example:
            statusCode: 201
            code: RATE_POLICY_CREATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              scope: room
              type: electricity
              rateKind: tiered
              isActive: true
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/rate-policies
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - ACTIVE_POLICY_EXISTS
                description: |-
                  - ACTIVE_POLICY_EXISTS: Đã có chính sách đang hiệu lực cho cùng phạm vi.
          examples:
            active_policy_exists:
              summary: ACTIVE_POLICY_EXISTS — Đã có chính sách đang hiệu lực cho cùng phạm vi.
              value:
                statusCode: 409
                code: ACTIVE_POLICY_EXISTS
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - INVALID_RATE_KIND
                  - VALIDATION_FAILED
                description: |-
                  - INVALID_RATE_KIND: Loại chính sách giá không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            invalid_rate_kind:
              summary: INVALID_RATE_KIND — Loại chính sách giá không hợp lệ.
              value:
                statusCode: 422
                code: INVALID_RATE_KIND
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
