patch:
  tags:
  - Billing
  x-apidog-folder: RatePolicy
  x-apidog-status: released
  operationId: patchRatePoliciesRatepolicyid
  security:
    - BearerAuth: []
  summary: Update rate policy
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant Guard as JWT/access guards
        participant C as RatePolicyController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: PATCH /api/v1/rate-policies/{ratePolicyId}
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke patchRatePoliciesRatepolicyid
        C->>Bus: Execute command for patchRatePoliciesRatepolicyid
        Bus->>H: Dispatch command handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  parameters:
  - name: ratePolicyId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/RatePolicyUpdateRequestDto
        example:
          isActive: true
          rates:
          - type: electricity
            name: Điện đồng giá
            rateKind: flat
            unitPrice: '4000'
            billingUnit: kwh
  responses:
    '200':
      description: 'Thành công: Cập nhật bộ đơn giá.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - RATE_POLICY_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RatePolicyUpdateResponseDto
          example:
            statusCode: 200
            code: RATE_POLICY_UPDATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              landlordId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              scope: room
              buildingId: null
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              rates:
              - type: electricity
                name: Điện đồng giá
                rateKind: flat
                unitPrice: '4000'
                billingUnit: kwh
              isActive: true
              createdAt: '2026-10-30T00:00:00Z'
              updatedAt: '2026-10-30T00:00:00Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu vi phạm quy tắc của bộ đơn giá.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [422] }
              code:
                type: string
                enum: [INVALID_RATE_KIND, TIER_CONFIG_INVALID, VALIDATION_FAILED]
          examples:
            invalid_rate_kind:
              value: { statusCode: 422, code: INVALID_RATE_KIND }
            tier_config_invalid:
              value: { statusCode: 422, code: TIER_CONFIG_INVALID }
            validation_failed:
              value: { statusCode: 422, code: VALIDATION_FAILED }
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
