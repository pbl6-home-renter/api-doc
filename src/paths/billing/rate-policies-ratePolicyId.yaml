patch:
  tags:
  - Billing
  x-apidog-folder: RatePolicy
  operationId: patchRatePoliciesRatepolicyid
  security:
    - BearerAuth: []
  summary: Update rate policy
  description: |-
    landlord. Đổi tên chính sách. Lỗi nghiệp vụ: 403 FORBIDDEN · 409 RATE POLICY LOCKED · 422 VALIDATION FAILED.

    ### Sequence diagram — Update rate policy

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

