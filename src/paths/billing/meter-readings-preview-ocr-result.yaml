post:
  tags:
  - Billing
  x-apidog-folder: MeterReading
  operationId: postMeterReadingsPreviewOcrResult
  security:
    - BearerAuth: []
  summary: Preview OCR meter reading result
  description: |-
    landlord. Xem trước kết quả chuẩn hoá OCR. Lỗi nghiệp vụ: 422 OCR RESULT INVALID · 422 EVIDENCE REQUIRED · 403 FORBIDDEN.

    ### Sequence diagram — Preview OCR meter reading result

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        participant I as identity-service
        participant M as MinIO / Object Storage
        C->>G: POST /api/v1/meter-readings/preview-ocr-result<br/>Body: roomId, mediaId, type
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc room và chỉ số trước để chuẩn hóa kết quả
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>I: Kiểm tra mediaId và lấy URL đọc bằng chứng
        I-->>S: Metadata/quyền/URL bằng chứng
        S->>S: Actor sở hữu phòng#59; mediaId là bằng chứng hợp lệ và OCR result đọc được
        Note over S,D: OCR chỉ xem trước#59; người dùng rà soát rồi tạo chỉ số đã xác nhận qua endpoint riêng
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>M: Đọc ảnh công tơ đã cấp quyền
        M-->>S: File ảnh
        S->>S: Chạy OCR, chuẩn hóa currentReading và đối chiếu previousReading
        S->>S: Trả requiresConfirmation = true#59; không INSERT meter_readings
        break Kết quả tính toán/OCR hoặc bằng chứng không hợp lệ
            S-->>G: 422 (OCR_RESULT_INVALID / EVIDENCE_REQUIRED / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 OCR_RESULT_PREVIEWED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/MeterReadingPreviewOcrRequestDto
        example:
          roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          mediaId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          type: electricity
  responses:
    '200':
      description: 'Thành công: Xem trước kết quả chuẩn hoá OCR.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - OCR_RESULT_PREVIEWED
              data:
                $ref: ../../openapi.yaml#/components/schemas/MeterReadingPreviewOcrResponseDto
          example:
            statusCode: 200
            code: OCR_RESULT_PREVIEWED
            data:
              type: electricity
              previousReading: '12680.5'
              currentReading: '12850.5'
              requiresConfirmation: true
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - OCR_RESULT_INVALID
                  - EVIDENCE_REQUIRED
                  - VALIDATION_FAILED
                description: |-
                  - OCR_RESULT_INVALID: Kết quả nhận dạng chỉ số không hợp lệ.
                  - EVIDENCE_REQUIRED: Thiếu bằng chứng bắt buộc.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            ocr_result_invalid:
              summary: OCR_RESULT_INVALID — Kết quả nhận dạng chỉ số không hợp lệ.
              value:
                statusCode: 422
                code: OCR_RESULT_INVALID
            evidence_required:
              summary: EVIDENCE_REQUIRED — Thiếu bằng chứng bắt buộc.
              value:
                statusCode: 422
                code: EVIDENCE_REQUIRED
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
