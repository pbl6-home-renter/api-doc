get:
  tags:
  - Billing
  x-apidog-folder: MeterReading
  operationId: getMeterReadings
  security:
    - BearerAuth: []
  summary: List meter readings
  description: 'landlord. Liệt kê chỉ số đồng hồ. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 VALIDATION FAILED.'
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        roomId:
          type: string
          format: uuid
        type:
          type: string
        period:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  responses:
    '200':
      description: 'Thành công: Liệt kê chỉ số đồng hồ.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - METER_READINGS_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/MeterReadingListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: METER_READINGS_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              type: electricity
              period: 2026-09
              previousReading: '1200'
              currentReading: '1380'
              readingDate: '2026-09-30'
              isBaseline: false
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
  - Billing
  x-apidog-folder: MeterReading
  operationId: postMeterReadings
  security:
    - BearerAuth: []
  summary: Create meter reading
  description: 'landlord. Tạo một chỉ số đã xác nhận. Lỗi nghiệp vụ: 409 DUPLICATE METER READING · 422 CURRENT READING
    INVALID · 422 EVIDENCE REQUIRED · 403 FORBIDDEN.'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/MeterReadingCreateRequestDto
        example:
          roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          type: electricity
          period: 2026-09
          previousReading: '12680.5'
          currentReading: '12850.5'
          readingDate: '2026-09-30'
          isBaseline: false
          evidenceMediaId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
  responses:
    '201':
      description: 'Thành công: Tạo một chỉ số đã xác nhận.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - METER_READING_CREATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/MeterReadingCreateResponseDto
          example:
            statusCode: 201
            code: METER_READING_CREATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              type: electricity
              period: 2026-09
              currentReading: '12850.5'
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/meter-readings
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - DUPLICATE_METER_READING
                description: |-
                  - DUPLICATE_METER_READING: Chỉ số cho phòng, loại đồng hồ và kỳ này đã tồn tại.
          examples:
            duplicate_meter_reading:
              summary: DUPLICATE_METER_READING — Chỉ số cho phòng, loại đồng hồ và kỳ này đã tồn tại.
              value:
                statusCode: 409
                code: DUPLICATE_METER_READING
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - CURRENT_READING_INVALID
                  - EVIDENCE_REQUIRED
                  - VALIDATION_FAILED
                description: |-
                  - CURRENT_READING_INVALID: Chỉ số đồng hồ hiện tại không hợp lệ.
                  - EVIDENCE_REQUIRED: Thiếu bằng chứng bắt buộc.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            current_reading_invalid:
              summary: CURRENT_READING_INVALID — Chỉ số đồng hồ hiện tại không hợp lệ.
              value:
                statusCode: 422
                code: CURRENT_READING_INVALID
            evidence_required:
              summary: EVIDENCE_REQUIRED — Thiếu bằng chứng bắt buộc.
              value:
                statusCode: 422
                code: EVIDENCE_REQUIRED
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
