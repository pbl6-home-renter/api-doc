get:
  tags:
  - Billing
  x-apidog-folder: MeterReading
  x-apidog-status: released
  operationId: getMeterReadings
  security:
  - BearerAuth: []
  summary: List meter readings
  description: |
    Landlord-only manual meter readings. Images are optional evidence. The first-period non-baseline reading uses the baseline in the same period. No OCR fields are accepted.

    **Sequence diagram**

    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant Guard as JWT/access guards
        participant C as MeterReadingController
        participant Bus as CQRS QueryBus
        participant H as Application handler
        Client->>GW: GET /api/v1/meter-readings
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke getMeterReadings
        C->>Bus: Execute query for getMeterReadings
        Bus->>H: Dispatch query handler
        H->>H: Filter landlord readings by room, type and period
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        roomId:
          type: string
          format: uuid
        type:
          type: string
        period:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  responses:
    '200':
      description: 'Thành công: Liệt kê chỉ số đồng hồ.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - METER_READINGS_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/MeterReadingListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: METER_READINGS_FETCHED
            data:
            - &id001
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              buildingId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              type: electricity
              period: 2026-09
              previousReading: '1200'
              currentReading: '1260'
              consumption: '60'
              isBaseline: false
              evidenceMediaIds: []
              evidenceMediaUrls: []
              createdAt: '2026-09-30T20:15:00Z'
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      description: BASELINE_REQUIRED, CURRENT_READING_INVALID, VALIDATION_FAILED
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - BASELINE_REQUIRED
                - CURRENT_READING_INVALID
                - VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
  - Billing
  x-apidog-folder: MeterReading
  x-apidog-status: released
  operationId: postMeterReadings
  security:
  - BearerAuth: []
  summary: Create meter reading
  description: |
    Landlord-only manual meter readings. Images are optional evidence. The first-period non-baseline reading uses the baseline in the same period. No OCR fields are accepted.

    **Sequence diagram**

    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant Guard as JWT/access guards
        participant C as MeterReadingController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: POST /api/v1/meter-readings
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke postMeterReadings
        C->>Bus: Execute command for postMeterReadings
        Bus->>H: Dispatch command handler
        H->>H: Validate manual value and same-period baseline
        H->>H: Persist reading; image evidence may be attached later
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/MeterReadingCreateRequestDto
        example:
          roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          type: electricity
          period: 2026-09
          currentReading: '1260'
          isBaseline: false
  responses:
    '201':
      description: 'Thành công: Tạo một chỉ số đã xác nhận.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - METER_READING_CREATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/MeterReadingCreateResponseDto
          example:
            statusCode: 201
            code: METER_READING_CREATED
            data: *id001
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/meter-readings
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      description: DUPLICATE_METER_READING, PERIOD_ALREADY_INVOICED
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 409
              code:
                type: string
                enum:
                - DUPLICATE_METER_READING
                - PERIOD_ALREADY_INVOICED
    '422':
      description: BASELINE_REQUIRED, CURRENT_READING_INVALID, VALIDATION_FAILED
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - BASELINE_REQUIRED
                - CURRENT_READING_INVALID
                - VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
