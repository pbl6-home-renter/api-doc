patch:
  tags:
  - Billing
  x-apidog-folder: BillingSetting
  x-apidog-status: released
  operationId: patchBillingSettingsBillingsettingid
  security:
    - BearerAuth: []
  summary: Update billing setting
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant Guard as JWT/access guards
        participant C as BillingSettingController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: PATCH /api/v1/billing-settings/{billingSettingId}
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke patchBillingSettingsBillingsettingid
        C->>Bus: Execute command for patchBillingSettingsBillingsettingid
        Bus->>H: Dispatch command handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  parameters:
  - name: billingSettingId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BillingSettingUpdateRequestDto
        example:
          paymentDueDay: 7
          remindDay: 10
          botEnabled: false
          isActive: true
  responses:
    '200':
      description: 'Thành công: Cập nhật cài đặt hóa đơn.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BILLING_SETTING_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BillingSettingUpdateResponseDto
          example:
            statusCode: 200
            code: BILLING_SETTING_UPDATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              landlordId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              scope: room
              buildingId: 52a85f64-5717-4562-b3fc-2c963f66afa6
              roomId: 61a85f64-5717-4562-b3fc-2c963f66afa6
              paymentDueDay: 7
              remindDay: 10
              botEnabled: false
              isActive: true
              createdAt: '2026-10-30T00:00:00Z'
              updatedAt: '2026-10-30T00:00:00Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
