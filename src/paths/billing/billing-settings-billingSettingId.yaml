patch:
  tags:
  - Billing
  x-apidog-folder: BillingSetting
  x-apidog-status: designing
  operationId: patchBillingSettingsBillingsettingid
  security:
    - BearerAuth: []
  summary: Update billing setting
  description: 'landlord. Cập nhật hoặc bật lại setting đã có theo billingSettingId; không gửi lại scope, buildingId hay roomId. Hai ngày được chọn độc lập trong khoảng 1–28; không sinh overdue. Lỗi: 403 FORBIDDEN · 422 VALIDATION_FAILED.'
  parameters:
  - name: billingSettingId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BillingSettingUpdateRequestDto
        example:
          paymentDueDay: 7
          remindDay: 10
          botEnabled: false
          isActive: true
  responses:
    '200':
      description: 'Thành công: Cập nhật cài đặt hóa đơn.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BILLING_SETTING_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BillingSettingUpdateResponseDto
          example:
            statusCode: 200
            code: BILLING_SETTING_UPDATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              landlordId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              scope: room
              buildingId: 52a85f64-5717-4562-b3fc-2c963f66afa6
              roomId: 61a85f64-5717-4562-b3fc-2c963f66afa6
              paymentDueDay: 7
              remindDay: 10
              botEnabled: false
              isActive: true
              createdAt: '2026-10-30T00:00:00Z'
              updatedAt: '2026-10-30T00:00:00Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - VALIDATION_FAILED
                description: |-
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
