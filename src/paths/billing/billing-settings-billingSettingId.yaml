patch:
  tags:
  - Billing
  x-apidog-folder: BillingSetting
  operationId: patchBillingSettingsBillingsettingid
  summary: Update billing setting
  description: 'landlord. Cập nhật cài đặt hóa đơn. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 DUE DAYS INVALID.'
  parameters:
  - name: billingSettingId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BillingSettingUpdateRequestDto
        example:
          dueDays: 7
          remindDays: 3
          botEnabled: false
  responses:
    '200':
      description: 'Thành công: Cập nhật cài đặt hóa đơn.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BILLING_SETTING_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BillingSettingUpdateResponseDto
          example:
            statusCode: 200
            code: BILLING_SETTING_UPDATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              dueDays: 7
              remindDays: 3
              botEnabled: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
