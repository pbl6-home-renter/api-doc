post:
  tags:
  - Billing
  x-apidog-folder: RatePolicy
  x-apidog-status: designing
  operationId: postRatePoliciesRatepolicyidDeactivatePolicy
  security:
    - BearerAuth: []
  summary: Deactivate rate policy
  description: 'landlord. Vô hiệu hoá chính sách. Lỗi nghiệp vụ: 403 FORBIDDEN · 409 POLICY NOT ACTIVE.'
  parameters:
  - name: ratePolicyId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Vô hiệu hoá chính sách.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - RATE_POLICY_DEACTIVATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RatePolicyDeactivateResponseDto
          example:
            statusCode: 200
            code: RATE_POLICY_DEACTIVATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              landlordId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              scope: room
              buildingId: null
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              rates:
              - type: electricity
                name: Điện đồng giá
                rateKind: flat
                unitPrice: '4000'
                billingUnit: kwh
              isActive: false
              createdAt: '2026-10-30T00:00:00Z'
              updatedAt: '2026-10-30T00:00:00Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - POLICY_NOT_ACTIVE
                description: |-
                  - POLICY_NOT_ACTIVE: Chính sách không ở trạng thái đang hiệu lực.
          examples:
            policy_not_active:
              summary: POLICY_NOT_ACTIVE — Chính sách không ở trạng thái đang hiệu lực.
              value:
                statusCode: 409
                code: POLICY_NOT_ACTIVE
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
