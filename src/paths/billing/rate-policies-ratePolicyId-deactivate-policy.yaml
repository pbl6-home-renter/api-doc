post:
  tags:
  - Billing
  x-apidog-folder: RatePolicy
  operationId: postRatePoliciesRatepolicyidDeactivatePolicy
  summary: Vô hiệu hoá chính sách
  description: 'landlord. Vô hiệu hoá chính sách. Lỗi nghiệp vụ: 403 FORBIDDEN · 409 POLICY NOT ACTIVE.'
  parameters:
  - name: ratePolicyId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Vô hiệu hoá chính sách.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - RATE_POLICY_DEACTIVATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RatePolicyDeactivateResponseDto
          example:
            statusCode: 200
            code: RATE_POLICY_DEACTIVATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              isActive: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '409':
      $ref: ../../openapi.yaml#/components/responses/ConflictError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
