post:
  tags:
  - Billing
  x-apidog-folder: MeterReading
  operationId: postBulkMeterReadings
  security:
    - BearerAuth: []
  summary: Bulk create meter readings
  description: |-
    landlord. Nhập và chốt chỉ số điện/nước hàng loạt cho nhiều phòng trong tòa nhà theo kỳ ghi số. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 VALIDATION FAILED · 409 DUPLICATE READING.

    ### Sequence diagram — Bulk create meter readings

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        participant I as identity-service
        C->>G: POST /api/v1/meter-readings/bulk<br/>Body: buildingId, recordedMonth, readingMethod, readings
        G->>G: Gắn correlation-id
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc building và các phòng/chỉ số theo recordedMonth
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor sở hữu building#59; readings và readingMethod đúng DTO#59; phòng thuộc building
        Note over S,D: Lỗi request trả HTTP lỗi đã khai báo#59; kết quả từng phòng nằm trong results<br/>Không tự phát hành invoice từ thao tác nhập chỉ số
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (DUPLICATE_READING)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (CURRENT_READING_INVALID / EVIDENCE_REQUIRED / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        loop Từng mục roomId/type trong readings
            S->>D: Đọc chỉ số trước và kiểm tra trùng phòng/loại/kỳ
            D-->>S: Chỉ số và trạng thái đã ghi
            S->>I: Kiểm tra evidenceMediaId đã upload và quyền sử dụng
            I-->>S: Kết quả kiểm tra bằng chứng
            alt Mục hợp lệ, chưa trùng
                S->>S: Tính usage và cảnh báo mức tiêu thụ bất thường
                S->>D: Lưu chỉ số đã xác nhận cho mục hợp lệ
                D-->>S: ReadingId và usage
                S->>S: Ghi results theo phòng với SUCCESS hoặc WARNING
            else Mục lỗi
                S->>S: Ghi results theo phòng với ERROR và note theo DTO
            end
        end
        S->>S: Tổng hợp totalRoomsRecorded, totalElectricityUsage, totalWaterUsage
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 201 METER_READINGS_BULK_RECORDED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BulkMeterReadingCreateRequestDto
        example:
          buildingId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
          recordedMonth: "2026-09"
          readingMethod: CAMERA_CAPTURE
          readings:
          - roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
            type: electricity
            previousReading: "1250.0"
            currentReading: "1380.0"
            evidenceMediaId: 48fae08f-e1a5-48b4-9c02-e2513470ff42
  responses:
    "201":
      description: "Thành công: Ghi chỉ số hàng loạt."
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - METER_READINGS_BULK_RECORDED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BulkMeterReadingResponseDto
    "400":
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    "401":
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    "403":
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    "404":
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm quy tắc của endpoint.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - CURRENT_READING_INVALID
                  - EVIDENCE_REQUIRED
                  - VALIDATION_FAILED
                description: |-
                  - CURRENT_READING_INVALID: Chỉ số hiện tại nhỏ hơn chỉ số trước đó trong ít nhất một bản ghi.
                  - EVIDENCE_REQUIRED: Thiếu ảnh chứng cứ của ít nhất một chỉ số cần chốt.
                  - VALIDATION_FAILED: Danh sách chỉ số hoặc kỳ ghi số vi phạm ràng buộc khác.
          examples:
            current_reading_invalid:
              summary: CURRENT_READING_INVALID — Chỉ số hiện tại nhỏ hơn chỉ số trước đó trong ít nhất một bản ghi.
              value:
                statusCode: 422
                code: CURRENT_READING_INVALID
            evidence_required:
              summary: EVIDENCE_REQUIRED — Thiếu ảnh chứng cứ của ít nhất một chỉ số cần chốt.
              value:
                statusCode: 422
                code: EVIDENCE_REQUIRED
            validation_failed:
              summary: VALIDATION_FAILED — Danh sách chỉ số hoặc kỳ ghi số vi phạm ràng buộc khác.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - DUPLICATE_READING
                description: |-
                  - DUPLICATE_READING: Chỉ số ghi hàng loạt bị trùng.
          examples:
            duplicate_reading:
              summary: DUPLICATE_READING — Chỉ số ghi hàng loạt bị trùng.
              value:
                statusCode: 409
                code: DUPLICATE_READING
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
