post:
  tags:
  - Billing
  x-apidog-folder: MeterReading
  x-apidog-status: released
  operationId: postBulkMeterReadings
  security:
  - BearerAuth: []
  summary: Bulk create meter readings
  description: |
    Landlord-only atomic bulk create, 1–200 readings. Missing baseline returns 422 BASELINE_REQUIRED and rolls back all rows. Successful results contain only SUCCESS. Attach image evidence later.

    **Sequence diagram**

    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant Guard as JWT/access guards
        participant C as MeterReadingController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: POST /api/v1/meter-readings/bulk
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke postBulkMeterReadings
        C->>Bus: Execute command for postBulkMeterReadings
        Bus->>H: Dispatch command handler
        H->>H: Validate every reading and required baseline
        H->>H: Persist all readings atomically or roll back the batch
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BulkMeterReadingCreateRequestDto
        example:
          buildingId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
          recordedMonth: 2026-09
          readings:
          - roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
            type: electricity
            currentReading: '1380.0'
  responses:
    '201':
      description: 'Thành công: Ghi chỉ số hàng loạt.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - METER_READINGS_BULK_RECORDED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BulkMeterReadingResponseDto
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '422':
      description: BASELINE_REQUIRED, CURRENT_READING_INVALID, VALIDATION_FAILED
      content:
        application/json:
          schema:
            type: object
            required:
            - statusCode
            - code
            properties:
              statusCode:
                type: integer
                enum:
                - 422
              code:
                type: string
                enum:
                - BASELINE_REQUIRED
                - CURRENT_READING_INVALID
                - VALIDATION_FAILED
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                - DUPLICATE_READING
                description: |-
                  - DUPLICATE_READING: Chỉ số ghi hàng loạt bị trùng.
          examples:
            duplicate_reading:
              summary: DUPLICATE_READING — Chỉ số ghi hàng loạt bị trùng.
              value:
                statusCode: 409
                code: DUPLICATE_READING
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
