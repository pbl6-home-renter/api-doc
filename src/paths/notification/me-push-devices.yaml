post:
  tags: [Notification]
  x-apidog-folder: PushDevice
  x-apidog-status: released
  operationId: postMePushDevices
  security:
    - BearerAuth: []
  summary: Register or refresh Android push device
  description: |-
    lastSeenAt, kích hoạt lại token đã thu hồi và trả cùng device ID. Token đang
    thuộc user khác được chuyển quyền sở hữu atomically; không tạo bản ghi trùng.
    
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as community-service
        participant Guard as JWT/access guards
        participant C as PushDeviceController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: POST /api/v1/me/push-devices
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke postMePushDevices
        C->>Bus: Execute command for postMePushDevices
        Bus->>H: Dispatch command handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/PushDeviceRegisterRequestDto
        example:
          platform: android
          token: fcm-token-example
  responses:
    '200':
      description: Device đã được đăng ký hoặc cập nhật.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [200] }
              code: { type: string, enum: [PUSH_DEVICE_REGISTERED] }
              data:
                $ref: ../../openapi.yaml#/components/schemas/PushDeviceRegisterResponseDto
          example:
            statusCode: 200
            code: PUSH_DEVICE_REGISTERED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              platform: android
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
