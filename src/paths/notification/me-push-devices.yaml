post:
  tags: [Notification]
  x-apidog-folder: PushDevice
  x-apidog-status: designing
  operationId: postMePushDevices
  security:
    - BearerAuth: []
  summary: Register or refresh Android push device
  description: >-
    Đăng ký FCM token Android của user đang đăng nhập. Gửi lại cùng token cập nhật
    lastSeenAt, kích hoạt lại token đã thu hồi và trả cùng device ID. Token đang
    thuộc user khác được chuyển quyền sở hữu atomically; không tạo bản ghi trùng.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/PushDeviceRegisterRequestDto
        example:
          platform: android
          token: fcm-token-example
  responses:
    '200':
      description: Device đã được đăng ký hoặc cập nhật.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, data]
            properties:
              statusCode: { type: integer, enum: [200] }
              code: { type: string, enum: [PUSH_DEVICE_REGISTERED] }
              data:
                $ref: ../../openapi.yaml#/components/schemas/PushDeviceRegisterResponseDto
          example:
            statusCode: 200
            code: PUSH_DEVICE_REGISTERED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              platform: android
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
