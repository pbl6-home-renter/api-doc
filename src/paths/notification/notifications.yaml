get:
  tags:
  - Notification
  x-apidog-folder: Notification
  x-apidog-status: released
  operationId: getNotifications
  security:
    - BearerAuth: []
  summary: List notifications
  description: |-
    Trả các business notification đã lưu cho người gọi. `type: system` gồm account lock/unlock và các thông báo nghiệp vụ hợp đồng; không phải message chat.
    `data` là snapshot từ producer: account notice có `{ messageKey, userId, status, eventType, lockedAt }`; contract suspension notice có `{ landlordId, lockCycleId, contractIds, graceDeadline }`.
    Account notice mới từ Identity dùng `data.messageKey: user.locked | user.unlocked` để Web dịch. `title`/`body` giữ mã `USER_ACCOUNT_LOCKED_TITLE/BODY` hoặc `USER_ACCOUNT_UNLOCKED_TITLE/BODY` làm nội dung dự phòng; bản ghi cũ thiếu `messageKey` không được ánh xạ ngược.
    Tài khoản bị khóa vẫn được đọc thông báo của chính mình tại endpoint này; hai endpoint mark-read cũng cho phép đánh dấu thông báo của chính mình. Các chức năng nghiệp vụ khác vẫn bị chặn. Kết nối Socket mới của tài khoản bị khóa chỉ vào room thông báo, không nhận chat.
    P13-01 stops new contract lock notifications. Previously stored notices remain readable as historical snapshots.
    Tắt push không ẩn notification khỏi danh sách; Socket sync được thực hiện độc lập với preference push.

    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as community-service
        participant Guard as JWT/access guards
        participant C as NotificationController
        participant Bus as CQRS QueryBus
        participant H as Application handler
        Client->>GW: GET /api/v1/notifications
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke getNotifications
        C->>Bus: Execute query for getNotifications
        Bus->>H: Dispatch query handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        unreadOnly:
          type: boolean
  - name: cursor
    in: query
    description: Cursor opaque từ trang trước; bỏ qua ở trang đầu.
    schema:
      type: string
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  responses:
    '200':
      description: 'Thành công: Liệt kê thông báo.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - NOTIFICATIONS_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/NotificationListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageSize
                - nextCursor
                - hasNextPage
                properties:
                  type:
                    type: string
                    enum:
                    - cursor
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  nextCursor:
                    type: string
                    nullable: true
                  hasNextPage:
                    type: boolean
          example:
            statusCode: 200
            code: NOTIFICATIONS_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              recipientUserId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              sourceService: tenancy
              eventId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              type: invoice
              title: Hóa đơn mới
              body: Bạn có một hóa đơn cần thanh toán.
              deepLink: /invoices/3fa85f64-5717-4562-b3fc-2c963f66afa6
              data:
                invoiceId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              createdAt: '2026-09-23T11:40:00.000Z'
              readAt: null
            pagination:
              type: cursor
              pageSize: 20
              nextCursor: null
              hasNextPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
