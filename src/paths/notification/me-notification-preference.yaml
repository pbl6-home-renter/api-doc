get:
  tags:
  - Notification
  x-apidog-folder: NotificationPreference
  operationId: getMeNotificationPreference
  security:
    - BearerAuth: []
  summary: Get notification preferences
  description: |-
    tenant, landlord, admin. Đọc tuỳ biến thông báo. Lỗi nghiệp vụ: 401 INVALID TOKEN.

    ### Sequence diagram — Get notification preferences

    Luồng theo kiến trúc microservice: community-service sở hữu nghiệp vụ và community_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as community-service
        participant D as PostgreSQL community_db
        C->>G: GET /api/v1/me/notification-preference
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance community-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra header theo contract
        break header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc notification_preferences WHERE userId = actor
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Trả tùy biến của chính actor theo DTO
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 NOTIFICATION_PREFERENCES_FETCHED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  responses:
    '200':
      description: 'Thành công: Đọc tuỳ biến thông báo.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - NOTIFICATION_PREFERENCES_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/NotificationPreferenceDetailResponseDto
          example:
            statusCode: 200
            code: NOTIFICATION_PREFERENCES_FETCHED
            data:
            - type: invoice
              enabled: true
            - type: chat
              enabled: true
            - type: issue
              enabled: true
            - type: match
              enabled: true
            - type: account
              enabled: true
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
put:
  tags:
  - Notification
  x-apidog-folder: NotificationPreference
  operationId: putMeNotificationPreference
  security:
    - BearerAuth: []
  summary: Update notification preferences
  description: |-
    tenant, landlord, admin. Thay toàn bộ tuỳ biến thông báo. Lỗi nghiệp vụ: 422 INVALID NOTIFICATION TYPE · 422 VALIDATION FAILED.

    ### Sequence diagram — Update notification preferences

    Luồng theo kiến trúc microservice: community-service sở hữu nghiệp vụ và community_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as community-service
        participant D as PostgreSQL community_db
        C->>G: PUT /api/v1/me/notification-preference<br/>Body: preferences
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance community-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc tùy biến hiện tại của actor
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Các notification type trong preferences hợp lệ#59; toàn bộ dữ liệu đúng DTO
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (INVALID_NOTIFICATION_TYPE / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Thay toàn bộ preferences của actor theo PUT
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 NOTIFICATION_PREFERENCES_UPDATED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/NotificationPreferenceUpdateRequestDto
        example:
          preferences:
          - type: invoice
            enabled: true
          - type: chat
            enabled: false
  responses:
    '200':
      description: 'Thành công: Thay toàn bộ tuỳ biến thông báo.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - NOTIFICATION_PREFERENCES_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/NotificationPreferenceUpdateResponseDto
          example:
            statusCode: 200
            code: NOTIFICATION_PREFERENCES_UPDATED
            data:
              updatedAt: '2026-09-23T11:45:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - INVALID_NOTIFICATION_TYPE
                  - VALIDATION_FAILED
                description: |-
                  - INVALID_NOTIFICATION_TYPE: Loại thông báo không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            invalid_notification_type:
              summary: INVALID_NOTIFICATION_TYPE — Loại thông báo không hợp lệ.
              value:
                statusCode: 422
                code: INVALID_NOTIFICATION_TYPE
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
