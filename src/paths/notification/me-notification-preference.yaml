  summary: Get notification preferences
  description: |-
    tenant, landlord, admin. Đọc tuỳ biến thông báo. Lỗi nghiệp vụ: 401 INVALID TOKEN.

    ### Sequence diagram — Get notification preferences

    Luồng theo kiến trúc microservice: community-service sở hữu nghiệp vụ và community_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNp1Vc-L20YU_lce6mWX2ngTkkNUGnAtrdfNxt5I2t02GMx4NLYGSzPOaLSpCTnlEEoptPRQSi9dQgj9RbK0UGodclDI_6H_pG8sO95duz4Ij-Z7b977vu-NnlhUhsyyrZQ9ypigzOFkrEjSF4A_kmkpsmTIVLWeEqU55VMiNLSApNCKOcP_O6dsCA24L4c8Zrub2LbBNo860CaaPSazTYRnED5TZ5wy8NiYp1ptgfkGRmWSZILrWT2tAjZxjsEdyVSPFfMfHK5DBuGwQrfqd--2bWi7ATTIlDfObjQS1hBS8xGnRHMp6lPFRkwZUqqQ9jKknL8WmFEpFldAHtZgwsv8WQJaEVDYJMQ84bqKGypGJnDy_k2Zv9AwRuDPHKJyfi5gVvyWAS3nr7IKWh2D57RsuHXzDuwEvd7gfrP75cBzHxy7fuAv2WUivFLUCVN8NIPPTwNMl7-kMCzzn_AxvxBjfHvPB0poxC4X1KSUpSloOWECdMTL-dusBinB2mQ5_4eaEt_qqtAt1e3dgJ3jbvM4OOh5nYeus60wz4YACcGKfs2Ai1QTJHNTP4gYiXW01NurVy29-67Mv8HgqMy__hC8zu3b0IqyGbKO1Zvip6CMh1Ndw26Kv7FvzQV8VZxTXJf5Ba1dEw3Oil_gi_rSdfXAEFHl96v8W0n96PadTyDNZigzEKqlAl3mvwONCU_QBuuTM-yuE0IocW8xJYi7gHFxfvWQe2vjIA0hw3wRwxgp8BW9YqHlvpGIFnOYRsX5tPHue6RJRBAancZrofwljbf29mCn0z1pHnacwYHbdFwPR_WzprOy1O6muNeJnaIJXgi0Qv4Dh7jMf-TXxDa9OJVk31K4PEWD9RSlcHrgeu6KmE8r-qoETr1iwynz1zg7Zf48W9lwsrDhowxL-EBv8UdiRJ2_nF3hMlAGpIt_ZzA0lQuj2yvjoeJPpGgpl6HXCXpVZFfisMozpNWvYQeHpjkQqDNfqG2DknE8JHRiFBIppsCmMOH7N2RhZI63nzCjg5L8tYvWW5RwG0nvdAPX6zYPB77rnbjewPW8nod9EBhfvgVXOt3EkG4v6Ox3Ws2g0-sOjjx3H-nqtlx_sO8GrQPXgY8hJJpca-H_VMOJ0Vlag6EMZwuvb_OXVbMSphLCQ_wIPOlbuJmwvmVD3wrZiGSx7ltPEZRN8eTV18GytcpYzVIyG0eWPSJxiiu8eR9Kudx8-h9Jv0-L)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as community-service
        participant D as PostgreSQL community_db
        C->>G: GET /api/v1/me/notification-preference
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance community-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra header theo contract
        break header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc notification_preferences WHERE userId = actor
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Trả tùy biến của chính actor theo DTO
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 NOTIFICATION_PREFERENCES_FETCHED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  responses:
    '200':
      description: 'Thành công: Đọc tuỳ biến thông báo.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - NOTIFICATION_PREFERENCES_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/NotificationPreferenceDetailResponseDto
          example:
            statusCode: 200
            code: NOTIFICATION_PREFERENCES_FETCHED
            data:
            - type: invoice
              enabled: true
            - type: chat
              enabled: true
            - type: issue
              enabled: true
            - type: match
              enabled: true
            - type: account
              enabled: true
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
put:
  tags:
  - Notification
  x-apidog-folder: NotificationPreference
  operationId: putMeNotificationPreference
  security:
    - BearerAuth: []
  summary: Update notification preferences
  description: |-
    tenant, landlord, admin. Thay toàn bộ tuỳ biến thông báo. Lỗi nghiệp vụ: 422 INVALID NOTIFICATION TYPE · 422 VALIDATION FAILED.

    ### Sequence diagram — Update notification preferences

    Luồng theo kiến trúc microservice: community-service sở hữu nghiệp vụ và community_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNq1Vs9rG0cU_lce24tNJeSY5BC1NcjSWlFiS8ru2qmDQYx2R9Lg_ZXZWaci5NRDKKVQ00MppWBjQugPsE0LpdIhhzX-P_Y_6ZudlbWy7FOpDpJ25r15733f997OG80OHKpVtYi-iqlv0wYjQ068Ax_wQ2IR-LHXp1w9h4QLZrOQ-ALqQCKou4zi_5UXtA8V2An6zKWry7ZNaVvrtqBJBH1NxssWhrQwKT9iNgWDDlkk-B1mpjSzA8-LfSbG5Ug5LNs1pF03iMSQU_P59tyl5_SVdb28sdGsQnfXggoJWeXoQcWjFT8QbMBsIljgl0NOB5RLUD7v88rGZuCMqzBfjNRBTXVQM52c-xiHc-oqd-aU4JCl0689EJwAx9LBZR4Tyq_PKTmEveuLdHomYIiGPzMYpZNTH8bJbzHY6eRDrExVGIxTr8LD9cewYnU6vZ1ae79n6M93ddMyc8yp7ywktUc5G4zh6QsLj5u-t6GfTn_Cr8mlP8TVZybYxB7RYkI1GyuLQASH1AcxYunkY1yCiGBuQTr525YpfhQq0TuyW3sAK7vt2q71pGO0XuqNuxIzqmAhIJjRrzEwPxIE0VxmFUaUuGKUq8Aoq5Kuvk-n36LzKJ1-c-M8P9usQn0UjxF1zF4mHwKXyo5ECatJ_sK6BfPhq-TUxud0emmXbpEGR8kJfFnOtVi2JBDqfFOdfyeonzx6_BlE8RhpBmKLgINIp7-D7RLmoQzmkWOsruWAE-Be1jtodwnD5HQxyLO5cJ6anXalj-IrSUQcikePKLoHPu7aC2paNpXE2ckEwlFyGlaujhE8fwSOZG84YzRnOfMG6S0Vci6gH2Nh9pxkM6fg4doarLTae7XtVqOXOVVg9pgLsrfZaewXlp_otYZu4MJm7cZmdVk-t6kLUWZnPopt-gMDN53-yG7JaUYJcZkj-2vAqOsofCIUtkdKGf2MU6fix65L-i6tUBxpGV-KIjz9mOWe_jBIThg0rA5yxoA4DpOyIG6XByHF-UKjLwbEjRZappFOz7Gz0-m7eMb01XEywR-VwwxnnpzgmkIVmZWd_4s_vAPf9XVYyXCrWa1Ou7dVa23fdNJ_hquheug7TCH5B6mWrugj08eDUBhMyvpDLmPl1ygrnIuV5kUdZuPgVYyRb2Se_OHJ5pq8Hy-wVJdNV5ywIMYhRSQCdCrMVVnAWSgLeKdoQk58NbqcQgI5xsjVwkBlGQynHuY0lvWcY8xhVl4IR9iveXWISRgw7L-IxBnXhVFdiHIPOzNdtztWa6tVVzxZ-10dJf5_MrepN1ttmaMfIT0I4cKuNSLjIlpFTAucqv7AN9-Cc72zs9Oy7ucb4T4D9_oih6QdYLsFRzhizBJ6b8ucwceoLItdBR64bp_Yh8VssdmuL0g26hneGvxs7NjJn6s4nLlU0CMcLa22pRvt2nbP1I093ejphtExkE0Cw-LtYcbHOros0NA19C3d0Nt13eztdpEJvQGfAo4Hogq_Ecx9ZOA7RcRRSY1C-Ta4a-xqJc2j3CPMwcvTmwMNNz16oFXhQHPogMSuONDeolEcysGU36q0quAxLWk8iIcjrZpNkpKGN5aXQZBvvv0XH7OHrw)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as community-service
        participant D as PostgreSQL community_db
        C->>G: PUT /api/v1/me/notification-preference<br/>Body: preferences
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance community-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc tùy biến hiện tại của actor
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Các notification type trong preferences hợp lệ#59; toàn bộ dữ liệu đúng DTO
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (INVALID_NOTIFICATION_TYPE / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Thay toàn bộ preferences của actor theo PUT
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 NOTIFICATION_PREFERENCES_UPDATED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/NotificationPreferenceUpdateRequestDto
        example:
          preferences:
          - type: invoice
            enabled: true
          - type: chat
            enabled: false
  responses:
    '200':
      description: 'Thành công: Thay toàn bộ tuỳ biến thông báo.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - NOTIFICATION_PREFERENCES_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/NotificationPreferenceUpdateResponseDto
          example:
            statusCode: 200
            code: NOTIFICATION_PREFERENCES_UPDATED
            data:
              updatedAt: '2026-09-23T11:45:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - INVALID_NOTIFICATION_TYPE
                  - VALIDATION_FAILED
                description: |-
                  - INVALID_NOTIFICATION_TYPE: Loại thông báo không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            invalid_notification_type:
              summary: INVALID_NOTIFICATION_TYPE — Loại thông báo không hợp lệ.
              value:
                statusCode: 422
                code: INVALID_NOTIFICATION_TYPE
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
