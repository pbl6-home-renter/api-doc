get:
  tags:
  - Notification
  x-apidog-folder: NotificationPreference
  x-apidog-status: released
  operationId: getMeNotificationPreference
  security:
    - BearerAuth: []
  summary: Get notification preferences
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as community-service
        participant Guard as JWT/access guards
        participant C as NotificationPreferenceController
        participant Bus as CQRS QueryBus
        participant H as Application handler
        Client->>GW: GET /api/v1/me/notification-preference
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke getMeNotificationPreference
        C->>Bus: Execute query for getMeNotificationPreference
        Bus->>H: Dispatch query handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  responses:
    '200':
      description: 'Thành công: Đọc tuỳ biến thông báo.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - NOTIFICATION_PREFERENCES_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/NotificationPreferenceDetailResponseDto
          example:
            statusCode: 200
            code: NOTIFICATION_PREFERENCES_FETCHED
            data:
            - type: invoice
              pushEnabled: true
            - type: chat
              pushEnabled: true
            - type: issue
              pushEnabled: true
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
put:
  tags:
  - Notification
  x-apidog-folder: NotificationPreference
  x-apidog-status: released
  operationId: putMeNotificationPreference
  security:
    - BearerAuth: []
  summary: Update notification preferences
  description: |-
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as community-service
        participant Guard as JWT/access guards
        participant C as NotificationPreferenceController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: PUT /api/v1/me/notification-preference
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke putMeNotificationPreference
        C->>Bus: Execute command for putMeNotificationPreference
        Bus->>H: Dispatch command handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/NotificationPreferenceUpdateRequestDto
        example:
          preferences:
          - type: invoice
            pushEnabled: true
          - type: chat
            pushEnabled: false
          - type: issue
            pushEnabled: true
  responses:
    '200':
      description: 'Thành công: Thay toàn bộ tuỳ biến thông báo.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - NOTIFICATION_PREFERENCES_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/NotificationPreferenceUpdateResponseDto
          example:
            statusCode: 200
            code: NOTIFICATION_PREFERENCES_UPDATED
            data:
              updatedAt: '2026-09-23T11:45:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - INVALID_NOTIFICATION_TYPE
                  - VALIDATION_FAILED
                description: |-
                  - INVALID_NOTIFICATION_TYPE: Loại thông báo không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            invalid_notification_type:
              summary: INVALID_NOTIFICATION_TYPE — Loại thông báo không hợp lệ.
              value:
                statusCode: 422
                code: INVALID_NOTIFICATION_TYPE
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
