post:
  tags:
  - Notification
  x-apidog-folder: Notification
  operationId: postNotificationsNotificationidMarkRead
  security:
    - BearerAuth: []
  summary: Mark notification as read
  description: 'tenant, landlord, admin. Đánh dấu đã đọc một thông báo. Lỗi nghiệp vụ: 403 FORBIDDEN · 404 NOT FOUND.'
  parameters:
  - name: notificationId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đánh dấu đã đọc một thông báo.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - NOTIFICATION_MARKED_READ
              data:
                $ref: ../../openapi.yaml#/components/schemas/NotificationMarkReadResponseDto
          example:
            statusCode: 200
            code: NOTIFICATION_MARKED_READ
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              readAt: '2026-09-23T11:40:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
