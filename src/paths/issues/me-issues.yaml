get:
  tags:
  - Operation
  x-apidog-folder: IssueReport
  operationId: getMeIssues
  security:
    - BearerAuth: []
  summary: List my issues
  description: |-
    tenant. Sự cố của tôi. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 VALIDATION FAILED.

    ### Sequence diagram — List my issues

