    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as community-service
        participant D as PostgreSQL community_db
        participant T as tenancy-service
        C->>G: GET /api/v1/issues/{issueId}
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance community-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra path, header theo contract
        break path, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc issue_report theo issueId và roomId
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>T: Đọc phòng/hợp đồng và quyền actor theo ngữ cảnh
        T-->>S: Kết quả tồn tại và quyền (service token, correlation-id)
        S->>S: Actor là tenant/landlord có quyền trên sự cố
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 ISSUE_FETCHED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: issueId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc chi tiết sự cố.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ISSUE_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/IssueReportDetailResponseDto
          example:
            statusCode: 200
            code: ISSUE_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              reporterId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              title: Vòi xịt bồn cầu bị rò rỉ
              description: Nước rò rỉ liên tục
              status: in_progress
              note: null
              closedAt: null
              issuePhotoMediaIds:
              - 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomName: Ví dụ
              buildingName: Ví dụ
              reporterName: Ví dụ
              category: ELECTRICAL
              urgency: MEDIUM
              createdAt: '2026-09-23T11:55:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
patch:
  tags:
  - Operation
  x-apidog-folder: IssueReport
  operationId: patchIssuesIssueid
  security:
    - BearerAuth: []
  summary: Update issue status
  description: |-
    landlord. Cập nhật tiến trình sự cố. Lỗi nghiệp vụ: 404 NOT FOUND · 403 FORBIDDEN · 409 INVALID ISSUE TRANSITION.

    ### Sequence diagram — Update issue status

    Luồng theo kiến trúc microservice: community-service sở hữu nghiệp vụ và community_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNrFV99r21YU_lcO3ovLbNxm3UO9reDYaqImsVNJTtcSMNfSjXSJfKVKV1lN6UPZQxllsNCHMcagIZTSrSHtOhizGX1w6P_h_2TnXkmOEjtjsI7lwbF8zz2_vu879-pByQ4cWqqXYnovodymLUbciAy2OeAfSUTAk0GfRulzSCLBbBYSLqAJJIamzyh-L9-mfajBRtBnPr00b7sibRubOqwQQb8iw3kLQ1qYNNpjNgWDuiwW0QIzU5rZwWCQcCaG1TjdMG_XknabQSzciJq31k-39Jz-vLUlrQXlhNt_41OXVszBeudCN6vXr6_UYbNhNVehRkJW27tSY3Gc0Lj2QP3XnYef96Pa9eXAGdYhFkQkcQUdxszl1LGCCkQ0JCxqYs7yexz4iWABbweCFp83qMOI7sRp3JU07sp0dMyxxiiiPpFWVeZUYJdNx18PQEQEImw7-GzARLqvH1GyC1vvX0_HhwJcNPyRgTcdHXAYTn5OwJ6OXiSpaRoG4zTrcHXpGpStTqe30Wjf6Rnara5mWmaGN-XOmaS2aMR2hnDztoXuxs9t6E_HP-DH6A138dc1E2xie7SYUMO2aYxIBLuUg_DYdPQuqUBMMLdgOvrdlim-E2miC7K7fAXK3Xaja612DP2u1lqUmFEHCxuCGb1MgHEEAjk_zyjwKPGFlzHQqKYlnXw3HT_Bzd50_M1s86lvsw5NLxli1zF7mXyIwKGqJKLCm_yGdQvG4f7kwMbn6fiNXTkHGuxNnsGX1UwHVUs2IvVvpv4XNvWjT699BnEyRJiB2CKIQEzHv4DtEzZAGpxGTrA63QEnwDWlW7R7A-7k4GyQtVPi3DQ77VofOVtBKQivIvviUAzgUXQScLSxz3Dqog0SRHsygtCbHIS1k31sJPfAkUi6OboZ4soHSB-SLccC-gkWaZ8CbmZwXL18Gcp6e6uxrrd6alMN8seMnL3lTutO4WdU6Cp-GI0NzdKMwsKq1mipH5Ybs82X5jl2Ht8QuXjIkZHjpwz86fh7do5zOW7EZ44U4Q6jvpO2L0b2D0hFcYRF1KnxxPdJ36c1ijNXgZriiN73WbaTu8HkGYOW1UFgGRDHYZI7xN-MgpDisKLxFzvEjzNayvEBwR4CYObjKWUvKvwoBI7pH4nM9cm-mgc2uNPxEVPx0wXk2BMIcHioSXGMOSQ4JXgR9pb83cfVx0lOuJP9yQj_pVXmEEeTZ_hbCigSTAb8ibsLoF1agrJCpmHpnXbvRkNfnwn6XwPSSqX8rQ1qNvdw9AaRUOITUUpJ1OsBg_vYCfAnf6ZbW9UUzGKxWV27ajDdSzD4THCTVwMp89HzYbFTa3Or-B0RzZqKCQS4LMs4GMAew2cUtkJrkQCuQtnQzE7XaGq9dsfq3eh02x-sTdasTajaX7lbQ_PDEKR4n2KOsl33pNtHPB87ktbcle2xpX8v9WVlfVsrNElIH_g5wi4XHZXzAawOgfPzMassCPH6MXl74bGYF6CfmWUqI0zPk8jJ5idnIscSaweHapGP-oLUC-fqQIZdrPiG6oiPAXzCHT-IHJx_b_NoSl12Dkp6HYC0vYjGY7VcvBzYqHUE4UhlnJ2hUsgvT4WGI2EBz7LFKPDpjKvpSiEbrEVRr8DDRWT7BMo3Osay3mpp7Q_BsewWwnK2n-xjZx8lqsGP-TkpZsk7Be1h1n-kJRZBWZT5tdNzQjfNrtazjEbb1OVo-S8KwbZKah_bOdtC2ENiySP7BZHbwoDh6RuTRA3xAqEK5f0PQ3FZW9HbMg8eo6BRVmdWm8UjQ3lWxHnFvX96ka3NC_bcqXM2YGdjQ7cunr0KeP_962TurKvg7nVZJ3A8aZi6JdWlCPw-sXeLFaKK3r8m6gKI51uZqwsISuNSRfHvED7FS4bexstCu7HeMzVjSzN6mmF0DESZgFt8n8lx