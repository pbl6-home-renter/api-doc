get:
  tags:
  - Operation
  x-apidog-folder: IssueReport
  x-apidog-status: designing
  operationId: getIssues
  security:
    - BearerAuth: []
  summary: List issues
  description: 'landlord. Hàng đợi sự cố bảo trì. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 VALIDATION FAILED.'
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        roomId:
          type: string
          format: uuid
        buildingId:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, in_progress, resolved, cancelled]
  - name: sort
    in: query
    description: Một trường sắp xếp được endpoint hỗ trợ.
    schema:
      type: string
      enum: [createdAt]
      default: createdAt
  - name: order
    in: query
    schema:
      type: string
      enum:
      - asc
      - desc
      default: asc
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: format
    in: query
    description: Trả dữ liệu JSON có envelope.
    schema:
      type: string
      enum:
      - json
      default: json
  responses:
    '200':
      description: 'Thành công: Hàng đợi sự cố bảo trì.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ISSUES_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/IssueReportListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: ISSUES_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              title: Vòi xịt bồn cầu bị rò rỉ
              status: open
              description: Nước rò rỉ liên tục
              roomName: Ví dụ
              buildingName: Ví dụ
              reporterId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              buildingId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              category: PLUMBING
              urgency: HIGH
              createdAt: '2026-09-23T11:55:00.000Z'
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
  - Operation
  x-apidog-folder: IssueReport
  x-apidog-status: designing
  operationId: postIssues
  security:
    - BearerAuth: []
  summary: Report issue
  description: |-
    Tenant hiện tại hoặc landlord của phòng tạo sự cố gắn với hợp đồng active (P10-D86). Sau khi tạo, upload tối đa 5 ảnh/video private theo ownerType `issue_report`, purpose `issue_photo` và ID sự cố; không gửi media ID khi tạo. Lỗi nghiệp vụ: 403 FORBIDDEN · 404 ROOM NOT FOUND.

    Event `notification.requested` mang `data.messageKey` (`issue.created`, `issue.updated`, hoặc `issue.cancelled`), `issueId` và `contractId`. Web dịch nội dung theo key; Community kiểm tra lại recipient trước khi lưu và gửi thông báo.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/IssueReportCreateRequestDto
        example:
          roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          title: Vòi xịt bồn cầu bị rò rỉ
          description: Nước rò rỉ liên tục
          category: PLUMBING
          urgency: HIGH
  responses:
    '201':
      description: 'Thành công: Báo cáo sự cố.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - ISSUE_CREATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/IssueReportCreateResponseDto
          example:
            statusCode: 201
            code: ISSUE_CREATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: open
              title: Vòi xịt bồn cầu bị rò rỉ
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/issues/{issueId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      x-apidog-name: Not Found
      description: Không tìm thấy tài nguyên được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [404]
              code:
                type: string
                enum:
                  - ROOM_NOT_FOUND
                description: |-
                  - ROOM_NOT_FOUND: Không tìm thấy phòng.
          examples:
            room_not_found:
              summary: ROOM_NOT_FOUND — Không tìm thấy phòng.
              value:
                statusCode: 404
                code: ROOM_NOT_FOUND
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
