get:
  tags:
  - Operation
  x-apidog-folder: IssueReport
  operationId: getIssues
  security:
    - BearerAuth: []
  summary: List issues
  description: |-
    landlord. Hàng đợi sự cố bảo trì. Lỗi nghiệp vụ: 403 FORBIDDEN · 422 VALIDATION FAILED.

    ### Sequence diagram — List issues

    Luồng theo kiến trúc microservice: community-service sở hữu nghiệp vụ và community_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNq9Vs-L20YU_lce6sVLbZxsk0PcZsGxvBtnN_ZGUjZNWDBjaSxNV5pRRtImbsih9BBKKXTJIZRSyLKE0LSQpC0UrEMODvk_9J_0jST_WhtyaOketJbmzZtvvve9b-aRZguHag0tovcTym2qM-JKEhxywD-SxIInwYDK4j0kMmY2CwmPoQUkgpbPKP6u3KEDqMNNMWA-3ViN3VGxzf0O7JCYPiCj1QhDRZhUHjObgkFdFsVyTZipwmwRBAln8agWFRNW43QVty-i2JXUvLU3n9J3BqvRloqOKSfcPpezVdva2mnATtuCOglZ_fhinUVRQqMvBrK-dSuhctSAIfNjKqsQCRlXQUhHvYTEpSb7mha_uqIKQyEDEhd5d8q82fg1R3BSUp_ETPAac6pwxLL02wBiSUAiX-CzgJXzBpKSIzj48CZLz2JwMfBnBl42PuUwmrxKwM7GL5MitFgG12k14NLmFahYvV7_ZrN7t2-0b91um5ZZFopyZwnUAZVsOIIbdyxMl76wYZClP-Fj_Ja7-HXXBJvYHl0E1LRtGiGF4ohyiD2Wjd8lyAdBbCIb_20riO_iAugadBcuQuV2t3nbut4zOvfa-jpgRgMsJAQR_ZoA41GMxaKrUgCPEj_2SukYtWJL73_M0u9xspel380mz3ObDWh5yQhZR_QKfAhStUOE5Yy9yV-475hxeDg5tfE9S9_a1XNFg-PJc_iyVgq4ZikiivxmkX8tqZ9cvvI5RMkIywzEjoWEOEt_A9snLEAZzFdOcHcdBxyBY3nDYdxbcCeny4vszoVzX0mzqthANSJoilMFxxF7SUnLYapg9mQMoTc5DevvT5A07oGjqubOy2aWpF66cAEqne5Bc6-j91FRxt3-ftNo3mxbbQPNYDpyvd3U8w_XmvpUehurIjhfgBDFcsZRMulTBn6WPmPnRDEllvjMUV0yZNR3ip1GKM-AVPMiMkmdOk98nwx8WqfoZjnrBdGY_YSVM7krJs8Z6FYPmWdAHIep4hJ_X4qQolnQ6OqQ-NGS8PUsfY39maVPkmm93p9MxvivwDDVv5w8x2-DBIuOEpKqf39Zy-nmJlRy3ppWp9ftbzc7e7N--Nd06UUn_GBDbmJ9SUO0rKggDYv-B3frg4T5DkOwPuGOj2aGivgTdYKrfcNz6gq7q4vhMKKlmPRaUYxFOsqdH-Wdfz9BeDNFT34PVB-NX4zm2KwZthIIbuUsBCXCpzhH9VcJYtoqCjR31Yq22rtX5LJKKLsL68YqBz7Hp2wpUWVqGrlxne_pjSWdNfNFfZw9IyaWApEp5k8DOGa4L9RPpLAsSmR3SRZS-HRGTTGywC-mnLziRSLuJmjpfF3ffQaV7Z5xraPr7e5_oY3yVGHTvSAaxdZrG0F4qpohHKNpKed6SdS0UDA0oYgkeassnFfOXAD_p7i7Ag1AHKOFmVUU-Z4KAY7NxnKfbSja_QGxjxRIHqGAsMTY_h_ekPwIYXiF4erQUsXYQNOXSjaX0eA6XXSzbnOvb7aNg7bRbxtGz0CCCLiLVxk8c8rz_epXEaYuKxzkz9JIVwnZVAuYJjpif7ttta63dfgU0MxIIW60oo9zc8PsdXNRFx5eEoM2VeKBh9gCL_IT44lqp_zqoA7k9JnaZnq2HtY2XuQA72CUBIiphUcHHjs1axTS-vRFZ1EootwkPw4zXz63j1L1Oe4HkoThDDR3tKoWUETNHLyRPjrUkIaAHmoNONQcOiSJHx9qjzEoCZXll1dVrRHLhFY1KRLX0xq5R1c1vNjdE6IcfPwPhO4RDw)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as community-service
        participant D as PostgreSQL community_db
        participant T as tenancy-service
        C->>G: GET /api/v1/issues<br/>Query: filter, sort, order, pageSize, pageNo, format
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance community-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra query, header theo contract
        break query, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_QUERY_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc issue_reports theo phòng/building landlord có quyền#59; filter/offset
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>T: Đọc phòng/hợp đồng và quyền actor theo ngữ cảnh
        T-->>S: Kết quả tồn tại và quyền (service token, correlation-id)
        S->>S: Actor là landlord trong phạm vi tài sản
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        alt format=json hoặc mặc định
            S-->>G: 200 ISSUES_FETCHED + data theo DTO
            G-->>C: Chuyển tiếp JSON và header
        else format xuất tệp được hỗ trợ
            S-->>G: 200 File stream + Content-Type/Content-Disposition
            G-->>C: Chuyển tiếp tệp#59; không JSON wrapper
        end
    ```
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        roomId:
          type: string
          format: uuid
        buildingId:
          type: string
          format: uuid
        status:
          type: string
  - name: sort
    in: query
    description: Một trường sắp xếp được endpoint hỗ trợ.
    schema:
      type: string
      default: createdAt
  - name: order
    in: query
    schema:
      type: string
      enum:
      - asc
      - desc
      default: asc
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: format
    in: query
    description: json trả envelope; định dạng khác trả file stream.
    schema:
      type: string
      enum:
      - json
      - xlsx
      - csv
      - pdf
      default: json
  responses:
    '200':
      description: 'Thành công: Hàng đợi sự cố bảo trì.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - ISSUES_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/IssueReportListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: ISSUES_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              title: Vòi xịt bồn cầu bị rò rỉ
              status: open
              description: Nước rò rỉ liên tục
              roomName: Ví dụ
              buildingName: Ví dụ
              reporterName: Ví dụ
              category: PLUMBING
              urgency: HIGH
              createdAt: '2026-09-23T11:55:00.000Z'
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
        text/csv:
          schema:
            type: string
            format: binary
        application/pdf:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
