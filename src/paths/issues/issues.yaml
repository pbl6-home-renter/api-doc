    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as community-service
        participant D as PostgreSQL community_db
        participant T as tenancy-service
        participant I as identity-service
        participant O as Outbox worker (community)
        participant Q as RabbitMQ
        participant N as tenancy-service
        participant ND as PostgreSQL tenancy_db
        participant J as identity-service
        participant JD as PostgreSQL identity_db
        C->>G: POST /api/v1/issues<br/>Body: roomId, title, category, urgency, description<br/>issuePhotoMediaIds, taggedUserId, taggedRoomId
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance community-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Kiểm tra dữ liệu sự cố và ngữ cảnh roomId
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>T: Đọc phòng/hợp đồng và quyền actor theo ngữ cảnh
        T-->>S: Kết quả tồn tại và quyền (service token, correlation-id)
        S->>I: Đọc metadata/quyền issuePhotoMediaIds
        I-->>S: Kết quả kiểm tra ảnh sự cố
        break Context/phòng không tồn tại theo service sở hữu#59; không phải thiếu conversation đang cần resolve
            S-->>G: 404 (ROOM_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor có quyền báo sự cố tại phòng#59; issuePhotoMediaIds là ảnh hợp lệ, đúng quyền
        Note over S,D: issue.created còn được identity-service tiêu thụ để ghi audit
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (ISSUE_PHOTO_INVALID / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Tạo issue_report với reporterId từ actor và dữ liệu DTO
        S->>D: INSERT outbox (issue.created) cùng transaction
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 201 ISSUE_CREATED + data theo DTO<br/>Location: /api/v1/issues/{issueId}
        G-->>C: Chuyển tiếp status, body và header theo contract
        Note over O,ND: Xử lý bất đồng bộ sau commit#59; HTTP không chờ consumer hoàn tất
        O->>D: Đọc công việc chưa gửi trong outbox
        D-->>O: issue.created
        Note over O,Q: Event có eventId, occurredAt, schemaVersion, correlationId
        O->>Q: Publish issue.created
        Q-->>O: Publisher confirm
        O->>D: Xóa/đánh dấu bản ghi đã gửi
        Q-->>N: Deliver issue.created (at-least-once)
        N->>ND: Đồng bộ thông tin sự cố phục vụ dữ liệu tổng hợp#59; chống lặp theo issueId
        ND-->>N: Dữ liệu đã commit
        N-->>Q: ACK
        Q-->>J: Deliver issue.created trên queue audit riêng
        J->>JD: Ghi audit log#59; chống xử lý trùng theo eventId
        JD-->>J: Audit đã commit
        J-->>Q: ACK
        Note over O,Q: Broker lỗi: giữ outbox để gửi lại#59; consumer lỗi: retry 1s / 4s / 16s rồi DLQ
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/IssueReportCreateRequestDto
        example:
          roomId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          title: Vòi xịt bồn cầu bị rò rỉ
          description: Nước rò rỉ liên tục
          issuePhotoMediaIds:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
          category: PLUMBING
          urgency: HIGH
  responses:
    '201':
      description: 'Thành công: Báo cáo sự cố.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
