post:
  tags:
  - Property
  x-apidog-folder: Building
  x-apidog-status: released
  operationId: postBuildingsBuildingidReject
  security:
    - BearerAuth: []
  summary: Reject building
  description: |-
    admin. Reject Building pending; note bắt buộc, tối đa 500 ký tự. Thiếu note hoặc sai kiểu trả 422 VALIDATION_FAILED.
    Note rỗng hoặc chỉ có khoảng trắng trả 422 NOTE_REQUIRED (domain validation).
    Building không tồn tại/đã xóa trả 404 RESOURCE_NOT_FOUND; không còn pending trả 409 BUILDING_NOT_PENDING.
    Cập nhật Building và ghi outbox building.rejected trong cùng transaction; relay publish sau commit, chưa gửi notification cho landlord.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant TEN as Tenancy
        participant DB as Tenancy DB
        participant MQ as RabbitMQ

        GW->>TEN: POST /buildings/{buildingId}/reject {note}
        TEN->>TEN: Verify JWT, role admin và validate request
        TEN->>DB: BEGIN; SELECT building WHERE id=buildingId AND is_deleted=false FOR UPDATE
        alt Không tìm thấy
            TEN->>DB: ROLLBACK
            TEN-->>GW: 404 RESOURCE_NOT_FOUND
        else Không pending
            TEN->>DB: ROLLBACK
            TEN-->>GW: 409 BUILDING_NOT_PENDING
        else Note không hợp lệ
            TEN->>DB: ROLLBACK
            TEN-->>GW: 422 NOTE_REQUIRED / VALIDATION_FAILED
        else Hợp lệ
            TEN->>TEN: building.reject(adminId, note)
            TEN->>DB: UPDATE status=rejected, reviewed_by, reviewed_at, note<br/>+ INSERT outbox building.rejected; COMMIT
            Note over TEN,DB: Lỗi lưu Building/outbox sẽ rollback toàn bộ transaction
            TEN-->>GW: 200 BUILDING_REJECTED
            TEN-)MQ: Outbox relay publish building.rejected sau commit
        end
    ```
  parameters:
  - name: buildingId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BuildingRejectRequestDto
        example:
          note: Ownership proof is unreadable
  responses:
    '200':
      description: 'Thành công: Từ chối tòa nhà.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDING_REJECTED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BuildingRejectResponseDto
          example:
            statusCode: 200
            code: BUILDING_REJECTED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: rejected
              reviewNote: Ownership proof is unreadable
              reviewedAt: '2026-09-23T12:00:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - BUILDING_NOT_PENDING
                description: |-
                  - BUILDING_NOT_PENDING: Tòa nhà không ở trạng thái chờ duyệt.
          examples:
            building_not_pending:
              summary: BUILDING_NOT_PENDING — Tòa nhà không ở trạng thái chờ duyệt.
              value:
                statusCode: 409
                code: BUILDING_NOT_PENDING
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - NOTE_REQUIRED
                  - VALIDATION_FAILED
                description: |-
                  - NOTE_REQUIRED: Ghi chú là bắt buộc.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            note_required:
              summary: NOTE_REQUIRED — Ghi chú là bắt buộc.
              value:
                statusCode: 422
                code: NOTE_REQUIRED
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
