post:
  tags:
  - Property
  x-apidog-folder: Building
  x-apidog-status: released
  operationId: postBuildingsBuildingidReject
  security:
    - BearerAuth: []
  summary: Reject building
  description: |-
    Note rỗng hoặc chỉ có khoảng trắng trả 422 NOTE_REQUIRED (domain validation).
    Building không tồn tại/đã xóa trả 404 RESOURCE_NOT_FOUND; không còn pending trả 409 BUILDING_NOT_PENDING.
    Cập nhật Building và ghi outbox building.rejected trong cùng transaction; relay publish sau commit, chưa gửi notification cho landlord.
    
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant Guard as JWT/access guards
        participant C as BuildingController
        participant Bus as CQRS CommandBus
        participant H as Application handler
        Client->>GW: POST /api/v1/buildings/{buildingId}/reject
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke postBuildingsBuildingidReject
        C->>Bus: Execute command for postBuildingsBuildingidReject
        Bus->>H: Dispatch command handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  parameters:
  - name: buildingId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BuildingRejectRequestDto
        example:
          note: Ownership proof is unreadable
  responses:
    '200':
      description: 'Thành công: Từ chối tòa nhà.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDING_REJECTED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BuildingRejectResponseDto
          example:
            statusCode: 200
            code: BUILDING_REJECTED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: rejected
              reviewNote: Ownership proof is unreadable
              reviewedAt: '2026-09-23T12:00:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - BUILDING_NOT_PENDING
                description: |-
                  - BUILDING_NOT_PENDING: Tòa nhà không ở trạng thái chờ duyệt.
          examples:
            building_not_pending:
              summary: BUILDING_NOT_PENDING — Tòa nhà không ở trạng thái chờ duyệt.
              value:
                statusCode: 409
                code: BUILDING_NOT_PENDING
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - NOTE_REQUIRED
                  - VALIDATION_FAILED
                description: |-
                  - NOTE_REQUIRED: Ghi chú là bắt buộc.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            note_required:
              summary: NOTE_REQUIRED — Ghi chú là bắt buộc.
              value:
                statusCode: 422
                code: NOTE_REQUIRED
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
