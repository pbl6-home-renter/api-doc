post:
  tags:
  - Billing
  x-apidog-folder: RatePolicy
  x-apidog-status: designing
  operationId: postBuildingRatePoliciesBatch
  security:
    - BearerAuth: []
  summary: Save building rate set
  description: |-
    Chưa triển khai trong Tenancy-Service hiện tại; endpoint được giữ trong tài liệu thiết kế.
    landlord. Thiết lập một bộ đơn giá cấp building (bước 3/3 wizard). buildingId chỉ lấy từ path. Lỗi nghiệp vụ: 404 BUILDING_NOT_FOUND · 403 FORBIDDEN · 422 INVALID_RATE_KIND/TIER_CONFIG_INVALID/VALIDATION_FAILED.
  parameters:
  - name: buildingId
    in: path
    required: true
    description: UUID của tòa nhà cần cấu hình biểu giá dịch vụ.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BuildingRatePoliciesBatchCreateRequestDto
        example:
          rates:
          - type: electricity
            name: Điện EVN
            rateKind: tiered
            unitPrice: null
            steps:
            - { from: 0, to: 50, price: '1893' }
            - { from: 51, to: 100, price: '1956' }
            - { from: 101, to: 200, price: '2283' }
            - { from: 201, to: 300, price: '2833' }
            - { from: 301, to: 400, price: '2927' }
            - { from: 401, to: null, price: '3451' }
            billingUnit: kwh
          - type: water
            name: Nước theo người
            rateKind: per_head
            unitPrice: '100000'
            billingUnit: person
          - type: wifi
            name: Wifi
            rateKind: fixed_per_period
            unitPrice: '100000'
            billingUnit: room
  responses:
    "201":
      description: "Thành công: Thiết lập hàng loạt đơn giá dịch vụ tòa nhà."
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - RATE_POLICIES_BATCH_CREATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RatePolicyListResponseDto
    "400":
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    "401":
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    "503":
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    "403":
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      x-apidog-name: Not Found
      description: Không tìm thấy tài nguyên được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [404]
              code:
                type: string
                enum:
                  - BUILDING_NOT_FOUND
                description: |-
                  - BUILDING_NOT_FOUND: Không tìm thấy tòa nhà.
          examples:
            building_not_found:
              summary: BUILDING_NOT_FOUND — Không tìm thấy tòa nhà.
              value:
                statusCode: 404
                code: BUILDING_NOT_FOUND
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm quy tắc của endpoint.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - INVALID_RATE_KIND
                  - TIER_CONFIG_INVALID
                  - VALIDATION_FAILED
                description: |-
                  - INVALID_RATE_KIND: Phương pháp tính giá không hợp lệ cho loại dịch vụ.
                  - TIER_CONFIG_INVALID: Cấu hình bậc thang không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu biểu giá vi phạm ràng buộc khác của DTO.
          examples:
            invalid_rate_kind:
              summary: INVALID_RATE_KIND — Phương pháp tính giá không hợp lệ.
              value:
                statusCode: 422
                code: INVALID_RATE_KIND
            tier_config_invalid:
              summary: TIER_CONFIG_INVALID — Cấu hình bậc thang không hợp lệ.
              value:
                statusCode: 422
                code: TIER_CONFIG_INVALID
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu biểu giá vi phạm ràng buộc khác của DTO.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    "500":
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
