post:
  tags:
  - Billing
  x-apidog-folder: RatePolicy
  operationId: postBuildingRatePoliciesBatch
  security:
    - BearerAuth: []
  summary: Batch create rate policies for building
  description: |-
    landlord. Thiết lập hàng loạt các chính sách đơn giá tiện ích và phí dịch vụ cho tòa nhà (bước 3/3 wizard tạo tài sản). Lỗi nghiệp vụ: 404 BUILDING NOT FOUND · 403 FORBIDDEN · 422 VALIDATION FAILED.

    ### Sequence diagram — Batch create rate policies for building

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: POST /api/v1/buildings/{buildingId}/rate-policies/batch<br/>Body: buildingId, ratePolicies
        G->>G: Gắn correlation-id
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, path, header theo contract
        break JSON/body, path, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc building và chính sách đơn giá hiện tại
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (BUILDING_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor sở hữu building#59; body.buildingId khớp path#59; ratePolicies không rỗng và từng mục đúng DTO
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (BUILDING_ID_MISMATCH / RATE_POLICIES_REQUIRED / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Lưu các rate policy của building trong transaction#59; trả data theo response batch
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 201 RATE_POLICIES_BATCH_CREATED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: buildingId
    in: path
    required: true
    description: UUID của tòa nhà cần cấu hình biểu giá dịch vụ.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BuildingRatePoliciesBatchCreateRequestDto
        example:
          buildingId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
          ratePolicies:
          - category: ELECTRICITY
            name: Tiền điện sinh hoạt
            rateKind: PROGRESSIVE
            unit: kWh
            steps:
            - fromStep: 0
              toStep: 50
              stepPrice: 1806
          - category: WATER
            name: Tiền nước sinh hoạt
            rateKind: PER_PERSON
            unit: người/tháng
            unitPrice: 100000
          - category: INTERNET
            name: Internet Wifi tốc độ cao
            rateKind: PER_ROOM
            unit: phòng/tháng
            unitPrice: 100000
  responses:
    "201":
      description: "Thành công: Thiết lập hàng loạt đơn giá dịch vụ tòa nhà."
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - RATE_POLICIES_BATCH_CREATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/RatePolicyListResponseDto
    "400":
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    "401":
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    "403":
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      x-apidog-name: Not Found
      description: Không tìm thấy tài nguyên được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [404]
              code:
                type: string
                enum:
                  - BUILDING_NOT_FOUND
                description: |-
                  - BUILDING_NOT_FOUND: Không tìm thấy tòa nhà.
          examples:
            building_not_found:
              summary: BUILDING_NOT_FOUND — Không tìm thấy tòa nhà.
              value:
                statusCode: 404
                code: BUILDING_NOT_FOUND
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm quy tắc của endpoint.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - BUILDING_ID_MISMATCH
                  - RATE_POLICIES_REQUIRED
                  - VALIDATION_FAILED
                description: |-
                  - BUILDING_ID_MISMATCH: buildingId trong body khác buildingId trên đường dẫn.
                  - RATE_POLICIES_REQUIRED: Danh sách ratePolicies rỗng hoặc không có biểu giá hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu biểu giá vi phạm ràng buộc khác của DTO.
          examples:
            building_id_mismatch:
              summary: BUILDING_ID_MISMATCH — buildingId trong body khác buildingId trên đường dẫn.
              value:
                statusCode: 422
                code: BUILDING_ID_MISMATCH
            rate_policies_required:
              summary: RATE_POLICIES_REQUIRED — Danh sách ratePolicies rỗng hoặc không có biểu giá hợp lệ.
              value:
                statusCode: 422
                code: RATE_POLICIES_REQUIRED
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu biểu giá vi phạm ràng buộc khác của DTO.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    "500":
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
