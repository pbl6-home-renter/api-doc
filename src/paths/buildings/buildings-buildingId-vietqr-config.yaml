put:
  tags:
  - Property
  x-apidog-folder: Building
  operationId: putBuildingVietQrConfig
  security:
    - BearerAuth: []
  summary: Configure building VietQR payment
  description: |-
    landlord. Cấu hình tài khoản ngân hàng nhận tiền chuyển khoản và sinh mã VietQR động cho tòa nhà. Lỗi nghiệp vụ: 404 BUILDING NOT FOUND · 403 FORBIDDEN · 422 INVALID BANK ACCOUNT.

    ### Sequence diagram — Configure building VietQR payment

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: PUT /api/v1/buildings/{buildingId}/vietqr-config<br/>Body: bankCode, bankName, accountNumber, accountHolderName, branch<br/>isDefault
        G->>G: Gắn correlation-id
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, path, header theo contract
        break JSON/body, path, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc building và cấu hình VietQR hiện tại
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (BUILDING_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor sở hữu building#59; validate thông tin tài khoản ngân hàng
        Note over S,D: Endpoint cấu hình nhận tiền#59; không tạo payment và không xác nhận chuyển khoản
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (INVALID_BANK_ACCOUNT / VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Lưu cấu hình VietQR theo bankCode, bankName, accountNumber, accountHolderName, branch, isDefault
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 BUILDING_VIETQR_CONFIGURED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: buildingId
    in: path
    required: true
    description: UUID của tòa nhà cần cấu hình VietQR.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BuildingVietQrConfigRequestDto
        example:
          bankCode: MB
          bankName: Ngân hàng TMCP Quân Đội
          accountNumber: "0987654321"
          accountHolderName: NGUYEN VAN A
          branch: Chi nhánh Đà Nẵng
          isDefault: true
  responses:
    "200":
      description: "Thành công: Cấu hình tài khoản VietQR tòa nhà."
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDING_VIETQR_CONFIGURED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BuildingVietQrConfigResponseDto
          example:
            statusCode: 200
            code: BUILDING_VIETQR_CONFIGURED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              buildingId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              bankCode: MB
              bankName: Ngân hàng TMCP Quân Đội
              accountNumber: "0987654321"
              accountHolderName: NGUYEN VAN A
              branch: Chi nhánh Đà Nẵng
              qrSampleUrl: https://api.vietqr.io/image/970422-0987654321-sample.jpg
              isDefault: true
              createdAt: "2026-09-23T12:00:00.000Z"
              updatedAt: "2026-09-23T12:00:00.000Z"
    "400":
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    "401":
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    "403":
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      x-apidog-name: Not Found
      description: Không tìm thấy tài nguyên được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [404]
              code:
                type: string
                enum:
                  - BUILDING_NOT_FOUND
                description: |-
                  - BUILDING_NOT_FOUND: Không tìm thấy tòa nhà.
          examples:
            building_not_found:
              summary: BUILDING_NOT_FOUND — Không tìm thấy tòa nhà.
              value:
                statusCode: 404
                code: BUILDING_NOT_FOUND
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - INVALID_BANK_ACCOUNT
                  - VALIDATION_FAILED
                description: |-
                  - INVALID_BANK_ACCOUNT: Thông tin tài khoản ngân hàng không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            invalid_bank_account:
              summary: INVALID_BANK_ACCOUNT — Thông tin tài khoản ngân hàng không hợp lệ.
              value:
                statusCode: 422
                code: INVALID_BANK_ACCOUNT
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    "500":
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
