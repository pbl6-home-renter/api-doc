put:
  tags:
  - Property
  x-apidog-folder: Building
  operationId: putBuildingVietQrConfig
  security:
    - BearerAuth: []
  summary: Configure building VietQR payment
  description: "landlord. Cấu hình tài khoản ngân hàng nhận tiền chuyển khoản và sinh mã VietQR động cho tòa nhà. Lỗi nghiệp vụ: 404 BUILDING NOT FOUND · 403 FORBIDDEN · 422 INVALID BANK ACCOUNT."
  parameters:
  - name: buildingId
    in: path
    required: true
    description: UUID của tòa nhà cần cấu hình VietQR.
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BuildingVietQrConfigRequestDto
        example:
          bankCode: MB
          bankName: Ngân hàng TMCP Quân Đội
          accountNumber: "0987654321"
          accountHolderName: NGUYEN VAN A
          branch: Chi nhánh Đà Nẵng
          isDefault: true
  responses:
    "200":
      description: "Thành công: Cấu hình tài khoản VietQR tòa nhà."
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDING_VIETQR_CONFIGURED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BuildingVietQrConfigResponseDto
          example:
            statusCode: 200
            code: BUILDING_VIETQR_CONFIGURED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              buildingId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
              bankCode: MB
              bankName: Ngân hàng TMCP Quân Đội
              accountNumber: "0987654321"
              accountHolderName: NGUYEN VAN A
              branch: Chi nhánh Đà Nẵng
              qrSampleUrl: https://api.vietqr.io/image/970422-0987654321-sample.jpg
              isDefault: true
              createdAt: "2026-09-23T12:00:00.000Z"
              updatedAt: "2026-09-23T12:00:00.000Z"
    "400":
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    "401":
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    "403":
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      x-apidog-name: Not Found
      description: Không tìm thấy tài nguyên được yêu cầu.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [404]
              code:
                type: string
                enum:
                  - BUILDING_NOT_FOUND
                description: |-
                  - BUILDING_NOT_FOUND: Không tìm thấy tòa nhà.
          examples:
            building_not_found:
              summary: BUILDING_NOT_FOUND — Không tìm thấy tòa nhà.
              value:
                statusCode: 404
                code: BUILDING_NOT_FOUND
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - INVALID_BANK_ACCOUNT
                  - VALIDATION_FAILED
                description: |-
                  - INVALID_BANK_ACCOUNT: Thông tin tài khoản ngân hàng không hợp lệ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            invalid_bank_account:
              summary: INVALID_BANK_ACCOUNT — Thông tin tài khoản ngân hàng không hợp lệ.
              value:
                statusCode: 422
                code: INVALID_BANK_ACCOUNT
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    "500":
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
