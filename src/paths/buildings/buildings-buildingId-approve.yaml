post:
  tags:
  - Property
  x-apidog-folder: Building
  x-apidog-status: released
  operationId: postBuildingsBuildingidApprove
  security:
    - BearerAuth: []
  summary: Approve building
  description: |-
    admin. Approve Building pending; note bắt buộc, tối đa 500 ký tự. Thiếu note hoặc sai kiểu trả 422 VALIDATION_FAILED.
    Note rỗng hoặc chỉ có khoảng trắng trả 422 VALIDATION_FAILED; domain approve vẫn cho phép bỏ note khi gọi nội bộ.
    Building không tồn tại/đã xóa trả 404 RESOURCE_NOT_FOUND; không còn pending trả 409 BUILDING_NOT_PENDING.
    Cập nhật Building và ghi outbox building.approved trong cùng transaction; relay publish sau commit, chưa gửi notification cho landlord.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant TEN as Tenancy
        participant DB as Tenancy DB
        participant MQ as RabbitMQ

        GW->>TEN: POST /buildings/{buildingId}/approve {note}
        TEN->>TEN: Verify JWT, role admin và validate request
        TEN->>DB: BEGIN; SELECT building WHERE id=buildingId AND is_deleted=false FOR UPDATE
        alt Không tìm thấy
            TEN->>DB: ROLLBACK
            TEN-->>GW: 404 RESOURCE_NOT_FOUND
        else Không pending
            TEN->>DB: ROLLBACK
            TEN-->>GW: 409 BUILDING_NOT_PENDING
        else Note không hợp lệ
            TEN->>DB: ROLLBACK
            TEN-->>GW: 422 VALIDATION_FAILED
        else Hợp lệ
            TEN->>TEN: building.approve(adminId, note)
            TEN->>DB: UPDATE status=approved, reviewed_by, reviewed_at, note<br/>+ INSERT outbox building.approved; COMMIT
            Note over TEN,DB: Lỗi lưu Building/outbox sẽ rollback toàn bộ transaction
            TEN-->>GW: 200 BUILDING_APPROVED
            TEN-)MQ: Outbox relay publish building.approved sau commit
        end
    ```
  parameters:
  - name: buildingId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BuildingApproveRequestDto
        example:
          note: Ownership proof verified
  responses:
    '200':
      description: 'Thành công: Duyệt tòa nhà.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDING_APPROVED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BuildingApproveResponseDto
          example:
            statusCode: 200
            code: BUILDING_APPROVED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: approved
              reviewedAt: '2026-09-23T12:00:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - BUILDING_NOT_PENDING
                description: |-
                  - BUILDING_NOT_PENDING: Tòa nhà không ở trạng thái chờ duyệt.
          examples:
            building_not_pending:
              summary: BUILDING_NOT_PENDING — Tòa nhà không ở trạng thái chờ duyệt.
              value:
                statusCode: 409
                code: BUILDING_NOT_PENDING
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
