post:
  tags:
  - Property
  x-apidog-folder: Building
  operationId: postBuildingsBuildingidApprove
  security:
    - BearerAuth: []
  summary: Approve building
  description: 'admin. Duyệt tòa nhà. Lỗi nghiệp vụ: 404 NOT FOUND · 409 BUILDING NOT PENDING.'
  parameters:
  - name: buildingId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BuildingApproveRequestDto
        example:
          note: Ownership proof verified
  responses:
    '200':
      description: 'Thành công: Duyệt tòa nhà.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDING_APPROVED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BuildingApproveResponseDto
          example:
            statusCode: 200
            code: BUILDING_APPROVED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: approved
              reviewedAt: '2026-09-23T12:00:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - BUILDING_NOT_PENDING
                description: |-
                  - BUILDING_NOT_PENDING: Tòa nhà không ở trạng thái chờ duyệt.
          examples:
            building_not_pending:
              summary: BUILDING_NOT_PENDING — Tòa nhà không ở trạng thái chờ duyệt.
              value:
                statusCode: 409
                code: BUILDING_NOT_PENDING
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
