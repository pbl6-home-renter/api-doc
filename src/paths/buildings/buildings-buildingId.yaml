get:
  tags:
  - Property
  x-apidog-folder: Building
  x-apidog-status: designing
  operationId: getBuildingsBuildingid
  summary: Get public building details
  description: 'public. Đọc tòa nhà (chế độ công khai). Lỗi nghiệp vụ: 404 NOT FOUND.'
  security: []
  parameters:
  - name: buildingId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc tòa nhà (chế độ công khai).'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDING_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BuildingPublicDetailResponseDto
          example:
            statusCode: 200
            code: BUILDING_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Nhà trọ Thanh Xuân
              province: Thành phố Hồ Chí Minh
              ward: Phường Bến Nghé
              address: 12 Nguyễn Trãi
              status: approved
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenOnlyError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
patch:
  tags:
  - Property
  x-apidog-folder: Building
  x-apidog-status: designing
  operationId: patchBuildingsBuildingid
  security:
    - BearerAuth: []
  summary: Update building
  description: 'landlord. Cập nhật thông tin tòa nhà. Khi đổi address, backend geocode lại latitude/longitude
    từ address mới + ward + province hiện tại qua TrackAsia; geocode lỗi thì không cập nhật. Lỗi nghiệp vụ:
    404 NOT FOUND · 403 FORBIDDEN · 409 APPROVED BUILDING LOCKED · 422 VALIDATION FAILED · 422 GEOCODING FAILED
    · 503 GEOCODING UNAVAILABLE.'
  parameters:
  - name: buildingId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BuildingUpdateRequestDto
        example:
          name: Tòa nhà Rentify Central Park
          address: 123 Nguyễn Thị Minh Khai
  responses:
    '200':
      description: 'Thành công: Cập nhật thông tin tòa nhà.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDING_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BuildingUpdateResponseDto
          example:
            statusCode: 200
            code: BUILDING_UPDATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Tòa nhà Rentify Central Park
              address: 123 Nguyễn Thị Minh Khai
              status: approved
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      x-apidog-name: Service Unavailable
      description: Dịch vụ phụ thuộc (xác thực hoặc geocoding) tạm thời không khả dụng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [503]
              code:
                type: string
                enum:
                  - AUTH_UNAVAILABLE
                  - GEOCODING_UNAVAILABLE
                description: |-
                  - AUTH_UNAVAILABLE: Hạ tầng xác thực tạm thời không khả dụng.
                  - GEOCODING_UNAVAILABLE: Dịch vụ geocoding (TrackAsia) timeout hoặc lỗi; chưa tạo/cập nhật dữ liệu, client có thể thử lại.
          examples:
            auth_unavailable:
              summary: AUTH_UNAVAILABLE — Hạ tầng xác thực tạm thời không khả dụng.
              value:
                statusCode: 503
                code: AUTH_UNAVAILABLE
            geocoding_unavailable:
              summary: GEOCODING_UNAVAILABLE — Dịch vụ geocoding tạm thời không khả dụng.
              value:
                statusCode: 503
                code: GEOCODING_UNAVAILABLE
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - APPROVED_BUILDING_LOCKED
                description: |-
                  - APPROVED_BUILDING_LOCKED: Tòa nhà đã được duyệt nên không thể sửa các trường bị khóa.
          examples:
            approved_building_locked:
              summary: APPROVED_BUILDING_LOCKED — Tòa nhà đã được duyệt nên không thể sửa các trường bị khóa.
              value:
                statusCode: 409
                code: APPROVED_BUILDING_LOCKED
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - GEOCODING_FAILED
                  - VALIDATION_FAILED
                description: |-
                  - GEOCODING_FAILED: Không xác định được tọa độ từ địa chỉ (address, ward, province); người dùng cần sửa địa chỉ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
          examples:
            geocoding_failed:
              summary: GEOCODING_FAILED — Không xác định được tọa độ từ địa chỉ.
              value:
                statusCode: 422
                code: GEOCODING_FAILED
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
delete:
  tags:
  - Property
  x-apidog-folder: Building
  x-apidog-status: designing
  operationId: deleteBuildingsBuildingid
  security:
    - BearerAuth: []
  summary: Delete building
  description: 'landlord. Xóa mềm tòa nhà. Lỗi nghiệp vụ: 404 NOT FOUND · 409 BUILDING HAS ACTIVE CONTRACT.'
  parameters:
  - name: buildingId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '204':
      $ref: ../../openapi.yaml#/components/responses/NoContentResponse
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - BUILDING_HAS_ACTIVE_CONTRACT
                description: |-
                  - BUILDING_HAS_ACTIVE_CONTRACT: Tòa nhà còn hợp đồng đang hiệu lực.
          examples:
            building_has_active_contract:
              summary: BUILDING_HAS_ACTIVE_CONTRACT — Tòa nhà còn hợp đồng đang hiệu lực.
              value:
                statusCode: 409
                code: BUILDING_HAS_ACTIVE_CONTRACT
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
