    ### Sequence diagram — Update building

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNrFVk1v20YQ_SsD9aKgFJS4ySFqG4AWGZmxLCqk5DSBAWFFrqWFySVDLt0KQQ5BD0ERFKjRQ1EURWMYQdAPwwlSIKh0yEFG_gf_SWdJSpYl5dQA9UEmubOzM_PevNlHJSdwaalWiunDhHKHaowMIuLvccA_koiAJ36fRvl7SCLBHBYSLqAOJIa6xyg-l-_RPlRhJ-gzj15ZtW1IW7VtQIMI-jUZrVpY0sKm0SFzKFh0wGIRrTGzpZmgnHBnVIlz81UrTVq1g1gMImrfbc429Nx-bluv3LrVqEFb7dS3oEpCVj28Vu0nzHMZH8TVR7NHw338RT-q3toM3FENOPGpAsR1IxrHuaNG7qiRjs84OEEUUY8IFvAKcxU4YOnkWx9ERCDCtMFjPhP5vn5EyQHsvn-VTk4EDNDwFwbDdHzMYTT9IwEnHb9MctP8GDynXoPrGzeh3DHN3o7aut-z9Ltd3e7YRb0pdy8FtUsjtj-CO_c66G7ywoF-OvkZf8av-QC_btvgEGdIFwNSHQdTAxEcUA5iyNLxu0SBmGBsQTp-68gQ34k80DXRXb0G5W5L7Xa2TMt4oGvrArNq0MGCYES_J8B4LBAYuowoDCnxxLDA36rkCZ3_kE6e4dZhOvluvvXCs12D-jAZYc0xdhl6CJHkdCwUzGX6N2YtGIdvpscOvqeT146yBBkcTp_DV5WChZWOLEPu3879ry3pJzdufg5xMkKQgTgiiECkkz_B8QjzkQQXJyeYneGCG-Ba1jVo9xoG0-PLh2xf0OaObbaqfSSfgvQWQ0XWxaV4wJCik4CjjXOJUR_aICF0pmMIh9PjsHp-hIXkQ3AljoMZtgXemQ-QPiRXzgT0E0zSuYDbLuC4fvUqlI3Wrto0tF62qQqz14KavU1Tu7_wGRtuC38sdUfv6NbCwpauatmHTXW--coqw5bxDZGJJxz5OPmRgZdOfmJLjJvhRjzmyhbcZ9Rz8_LFyH2fKBlHWETdKk88j_Q9WqWoeBmoOY7o_YgVO_kgmD5noHVMBJZJLWCSO8RrR0FIUYBo_OU-8eKClq0AzwwOEQB7pjY5e7G_T0PgGP6pKFyfH2Vq4MAgnZyy7Px8ATn2DAKUjkwnzjCGBDWCL8Kuye8erj5NZoQ7P5qO8V-e5QziaPocv-WAIsHkgb_ywRpoNzagnCGjdgyz1butGs15O_9nQLS8lb_H9il0VgGPcNcLItfIm1BEOTWxb48ZuPKQpwXRtUqO6WLORXoHmTo9TDCGed9N__Jlt49fjBYLtr2yis8IbFFbPD_AZZnNsQ-HDN-xvzPQ1vXBdShbum12rbrea5md3m2z29I-In3VTFXidPKbtD1L5nXLWIKMGr_l829AwjBCzhXEwTq8KTQTOx59nJI1hSjYEgUenRczX3Gmb7CiGPYTWZWsNguFWleNz6B827Q2DU3TWx-jCMWsZDM4zo8Q9CdJNl6f8iWqFMG7C-TAqP_JUzxZGMnrIsfhqrbblrmra73NrtHUjFaj1zTr2x-H-8uJYFlRYsZnDlZzKGMN4RCnihwtL4ncFgYMp0RMkkxsFq4TC-n9D827qTeMloyDxzh-UP4urdZXBU5enKrFvWlJ53ItRj297MPc2TE6H-73DEvv_atkRWYV3N2UoQNHkWPZgK5JXnt94hwsBo098f4VdkbgS2kt82z2IduvKBmlTuAGzjejhXOqpTZ7tm7t6lZPtyzTQuAIDBYvsrPSb-CWOXG6bQRA1-BTwNFDlhL9EAZ4qRFJrOTzVyrhuolfUko-jXzCXLy3P9or4aJP90o12Cu5dJ8kntgrPUajJJRDr7jQl2ooYlQpRUEyGJZq2ZRSSnhdfhAExeLjfwH6III0)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: PATCH /api/v1/buildings/{buildingId}<br/>Body: name, address
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, path, header theo contract
        break JSON/body, path, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_PATH_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        Note over S: PATCH chỉ cập nhật field được gửi#59; field bị omit giữ nguyên
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc building, landlordId và trạng thái duyệt
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        break Không tìm thấy tài nguyên trong phạm vi truy cập
            S-->>G: 404 (RESOURCE_NOT_FOUND)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Actor sở hữu building#59; chặn building approved bị khóa chỉnh sửa
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm điều kiện trạng thái hoặc dữ liệu trùng đã kiểm tra
            S-->>G: 409 (APPROVED_BUILDING_LOCKED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: BEGIN transaction
        S->>D: Chỉ cập nhật name/address được gửi theo DTO
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 200 BUILDING_UPDATED + data theo DTO
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  parameters:
  - name: buildingId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BuildingUpdateRequestDto
        example:
          name: Tòa nhà Rentify Central Park
          address: 123 Nguyễn Thị Minh Khai
  responses:
    '200':
      description: 'Thành công: Cập nhật thông tin tòa nhà.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDING_UPDATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BuildingUpdateResponseDto
          example:
            statusCode: 200
            code: BUILDING_UPDATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Tòa nhà Rentify Central Park
              address: 123 Nguyễn Thị Minh Khai
              status: approved
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '409':
      x-apidog-name: Conflict
      description: Yêu cầu xung đột với trạng thái hiện tại hoặc dữ liệu đã tồn tại.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [409]
              code:
                type: string
                enum:
                  - APPROVED_BUILDING_LOCKED
                description: |-
                  - APPROVED_BUILDING_LOCKED: Tòa nhà đã được duyệt nên không thể sửa các trường bị khóa.
          examples:
            approved_building_locked:
              summary: APPROVED_BUILDING_LOCKED — Tòa nhà đã được duyệt nên không thể sửa các trường bị khóa.
              value:
                statusCode: 409
                code: APPROVED_BUILDING_LOCKED
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
