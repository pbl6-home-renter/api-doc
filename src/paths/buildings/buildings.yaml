get:
  tags:
  - Property
  x-apidog-folder: Building
  operationId: getBuildings
  summary: Search public buildings
  description: |-
    public. Tìm tòa nhà trên sàn công khai. Lỗi nghiệp vụ: 422 VALIDATION FAILED · 429 RATE LIMIT EXCEEDED.

    ### Sequence diagram — Search public buildings

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNq9Vt9r21YU_lcO2kvCbNyF9qHeGnAsJfXm2InkZusImCvp2rqLdK96dZXWK33aQxllsLCHUsYgIYTSbpCuHQyshz049P_Qf7JzJTnOj0JfxvxgS9a593zn-75zrh4bnvCp0TQS-iCl3KMmI2NJol0O-CGpEjyNXCrL-5hIxTwWE66gDSSBdsgoXi99TV1owKZwWUiXr8du6NjWVgc2iKIPyeR6hK0jHCr3mUfBpmOWKPmBMEeHKcoJ9yb1pAy_HmXqqC2RqLGkznZ3vmDou2Vsu766utGEDWsADRKzxv5nDTdloc_4OPnClY3V7ZTKSRNGLFRU1iARUtVASF_fxGRMHfY9La96ogYjISOiyq03qq3z6SkHT0hJQ6KY4HXm12CP5dkPEShJQCIRELKIVetcScke7Lx_k2fHCsYY-CuDIJ8ecZjMXqfg5dOXaRlapsE87SbcXLkNS4N-f7jZ6t0f2tb2PcsZOJUClPvlRU9gMrFPJbRrThMs7seCIU9x6obMQ1zB7C8-vpAI1iiRGK7EHuWLwuwmDBC7l2evUmA8UcgqvSoHBJSEKqjEs-slIWc_59kzXBrk2Y_nSxc7I6p2kE6QHg6K5dN_YpDakAnyrkp0inF4NDvy8D7P_kTUl9mF_dkhfFOvLFQfLJA75f5fLch_oOWtaaC-LjKgAjfj-MS7pMblsIQw8GZTiIPZUdw4O8B6eAC-lmi8EMap6r154wYsdXo7rW7HHKIq9v3hVstubVoDy8ZOmT-5a7XM4o-1ljmXb_m6zFe5idEZxxz9kf3CIMyz5-yK4lXNOyRkvnbaiNHQLytNvIBGpFbwyyT1GzwNQ-KGtEGx1T-5dftzUHn2eyHVAatW8rGYHTIwB300CwPi-0zzTsItKWKKnUeTOyMSJvQif2aenaLH8-xpOrfY2cFsij8lBghEPv3bAzk7xP_cNM9eoLpS98BvH-R0ZQWWCt5ag06_N1xvdbqW-V_RZZYm_cmD81kAJI4l9g22rhe8f0PQf--QuZBwP8RpgHZ4y7Gkomk9bYxXMQSszIzJnhVkoluqQdLQc6QhRqOEVj4z66VOF5mqSNlD5AotiMjn5KnZH5HeeHoyuaRyu2gqr4hxUTQMfEuAB9gQV8A9wu1OVIHxKWKUs9ccEmT_0gxiBV9HESafoBWmpx7KXyyJYT_PTnT_vySavHKKJCQtTHFhuvmLev5PGRdzzqmhnF0dAhxtxTQvL5ogRRi6xNvTIHmC7Y4erqT1RITDGJY4psIpOHu3jJNHavZvYSt3eti3vVZ36Fj2jmUPLdvu20gQgfHFEw0HX3Ua3Pkuwa0rLaPiuxoZ1wlZwQRr9zpds9PbcIbr1qB91zLhU8DOJWXPYt99nJ4vnX6vmILlwKq4wZ6sIM3VV4WS585AOp_rSrPjDyNbxyMd8DSmJEJMbZyTeOLXB5OYNuY3JktikRQT4eMwi_RFZ1S2LnA_lNhr56C5b9SMiCJq5uO7yeNdA2mI6K7RhF3DpyOShmrXeIJBaaznW_XSYjSVTGnNkCIdB0azGEg1A18JvhWievjkX1NYViM)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        C->>G: GET /api/v1/buildings<br/>Query: filter, sort, order, pageSize, pageNo, format
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        Note over C,S: Endpoint public, không yêu cầu Bearer token
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Kiểm tra query, header theo contract
        break query, header sai cú pháp/định dạng
            S-->>G: 400 (INVALID_QUERY_PARAMETER / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Đọc buildings approved, chưa xóa, landlord còn được phép hiển thị#59; áp filter/sort/offset
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>S: Chỉ công bố tòa nhà được phép xuất hiện trên sàn
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        alt format=json hoặc mặc định
            S-->>G: 200 BUILDINGS_FETCHED + data theo DTO
            G-->>C: Chuyển tiếp JSON và header
        else format xuất tệp được hỗ trợ
            S-->>G: 200 File stream + Content-Type/Content-Disposition
            G-->>C: Chuyển tiếp tệp#59; không JSON wrapper
        end
    ```
  security: []
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        province:
          type: string
        ward:
          type: string
        q:
          type: string
  - name: sort
    in: query
    description: Một trường sắp xếp được endpoint hỗ trợ.
    schema:
      type: string
      default: createdAt
  - name: order
    in: query
    schema:
      type: string
      enum:
      - asc
      - desc
      default: desc
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: format
    in: query
    description: json trả envelope; định dạng khác trả file stream.
    schema:
      type: string
      enum:
      - json
      - xlsx
      - csv
      - pdf
      default: json
  responses:
    '200':
      description: 'Thành công: Tìm tòa nhà trên sàn công khai.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDINGS_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/BuildingPublicListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: BUILDINGS_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Nhà trọ Thanh Xuân
              province: Thành phố Hồ Chí Minh
              ward: Phường Bến Nghé
              address: 12 Nguyễn Trãi
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
        text/csv:
          schema:
            type: string
            format: binary
        application/pdf:
          schema:
            type: string
            format: binary
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
  - Property
  x-apidog-folder: Building
  operationId: postBuildings
  security:
    - BearerAuth: []
  summary: Create building for approval
  description: |-
    landlord. Gửi tòa nhà để duyệt. Lỗi nghiệp vụ: 422 VALIDATION FAILED · 403 FORBIDDEN.

    ### Sequence diagram — Create building for approval

    Luồng theo kiến trúc microservice: tenancy-service sở hữu nghiệp vụ và tenancy_db.

    [🔍 Zoom diagram — xem toàn màn hình](https://mermaid.live/view#pako:eNq9VkFrG0cU_isP9aJQCSVucojaBmStomwsS85KdpxgEKPdsXbw7owyO6tUhBxKD6GUQkMPJZTQGBNC0xYnbaEgHXJQyP_Yf9I3OytZspT00FIdJO3Oe2--973vvZkHOVd4NFfORfReTLlLLUb6koQHHPBDYiV4HPaoNM8DIhVz2YBwBVUgEVQDRvF__jbtQQm2RY8F9MKqbV3bVnZsqBNF75PRqoWjLdpUDplLwaF9Fim5xqytzRTlhLujYmTMV60sbbUjItWXtH2rMXPoer1VW1vbMg-zYOoDIfe1WZ0KZIvxvlmvFq9dq5dhp9XuQIkMWGl4qdSLWaAtos96snRtU3ijMnAS0gIMpBgyJLgAnk6OuaoA94n0CkA8T9LIeCihSHA9EEJGaEgjV7KBYoKjVUg5U4zie3GfUxn5bFCliPCQucjqNvUYsb3IQKsbaPVkfMrBFVLSgOgwRYb7HbFk8lUIShKQ6AkBC5kyfj1JyRHsvXuVTE4U9NHwRwZ-Mj7mMJq-jMFNxi9iY2q2wX2qZbi8cRXynVaru11p3uk6tVu7tXannQmBcm8J1B6V7HAEN293MNzkuQu9ZPIEv8aveR_fbrXBJa5PFwFVXBcJAiWOKAfls2T8Ji5ARBCbSMZ_uRriG2WArkF38RLkd5uV3c6NlmPfrVnrgDll6CAhiOjnGBiPFCqGnpca-JQEys-E6RRNQm-_SybfoKufTL6eu55Fbpeh6scj5Byxa-gDkLrZIhSA8qd_YtaKcfhieuziczJ57RbOlQyG02ewX8zao9jRNJj4bRN_LaUfXbn6KUTxCIsMxFVCgkomv4AbEBaiCM52jjE72wNP4Frazmj3GvrT4-VNts5kc7PdapZ6KO6CZsSjGNqn6C44rrpLWlo11WVzp2MY-NPjQentYySP--Dp2vVn9cxqnHqD9tb6OFXQizEx96zE7awEly9ehLzd3Ks0bKubOpVg9pjJsbvZsu4svL5Rq1g1B19sVuY2F1bFc750AxTZCUepTb5nECSTH9g5Mc1KQgLm6e46ZDTwDD8RyjokhbT8TFKvxOMgIL2AlihO2bRepkQY_THLPHlfTJ8xsDotrBnTw4JpWZBgR4qB7n8afX5IgmipYaxkcop9nUwexbNKv308HeOPwTDjWU6f4TvDKlZW9_3T2Xhb4ndjA_Ipb5WO3Wp2r1fsxryP_jVd1pK4vAXsavo7Ae6j_HULBIR7gZCeYSnVtAliFQ3pi2lnGR6lk-FejDDmmp_-GupOGz8fnWGwTR9_60JIFcHKkXTLezqdL3GG6u4M9YzVUxE9NYanECWTn3Ryp9lQtDMgW4u7nqWWBnhfU6WdkI2RhXG_BAP3-00T9BzT-OdTwGhha6n-UgR0zo1Zcad_zDdQcvoSv7XieD_Gmc_XNdsnkL_ecjZty6o1_wsRZMcOSy2PQ40G-R2fugjC1-UcwBCT1sPtBdFuA8FwTkUkTnviaK14_m8V75ezCwJdKqUm_gSG2Tgw5vuZTDooOFP4J2ZCLKq1b4IttclmrW43daI8QvnjGFhabbx7FcP8BpKxZUa_1qmSZsbioXPMUnBPwdOJPlJLYaqt7W278_7OShMKcC9j0hQ45cQQJ3u7oEFoeoBjSiw9hspackGPuEeLuHH7d6-QIRHi3QPyPJ32KMQLhRTmCVzBiW43OzWnWWl02zVnr-Z0a47TcpAd7MHFe-SsvBt4zm_u2g3Lbta7VadW6dQs-BjSXk7ZxRmaXrIawk2P1vLqta30YPbX9h7OzvD1osBzXsV4G0uPJ92k647CXCEXUhkS5uEd-8FBDhdDepArw0HOo4ckDtRB7iEaxQOtjuzynSsrGdNCToq47-fK6XQv5PAeeleIbPHh32pZZfc)

    ```mermaid
    sequenceDiagram
        autonumber
        participant C as Client (Web / Mobile)
        participant G as API Gateway
        participant R as Service Registry
        participant S as tenancy-service
        participant D as PostgreSQL tenancy_db
        participant I as identity-service
        participant X as Geocoding
        C->>G: POST /api/v1/buildings<br/>Body: name, province, district, ward, address<br/>totalFloors, description, amenities, ownershipCertificateMediaIds
        G->>G: Gắn correlation-id, kiểm tra rate limit
        break Vượt giới hạn yêu cầu
            G-->>C: 429 (TOO_MANY_REQUESTS)
        end
        G->>G: Verify JWT cục bộ bằng JWKS cache
        break Access token thiếu, sai hoặc hết hạn
            G-->>C: 401 (UNAUTHORIZED)
        end
        G->>R: Tra cứu instance tenancy-service healthy
        R-->>G: Địa chỉ instance
        G->>S: Chuyển tiếp request, thông tin xác thực, correlation-id và X-Service-Token
        S->>S: Verify JWT cục bộ#59; suy ra actor từ claim, không tin userId do client tự gán
        S->>S: Kiểm tra JSON/body, header theo contract
        break JSON/body, header sai cú pháp/định dạng hoặc thiếu JSON body bắt buộc
            S-->>G: 400 (INVALID_JSON / INVALID_REQUEST_BODY / INVALID_HEADER / BAD_REQUEST)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>S: Validate field theo schema, required/nullable/enum#59; từ chối field ngoài DTO khi additionalProperties=false
        break Dữ liệu không đúng schema hoặc ràng buộc trường
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>D: Kiểm tra dữ liệu tòa nhà và landlord từ actor
        D-->>S: Dữ liệu hoặc kết quả không tìm thấy
        S->>I: Đọc metadata và quyền các media giấy tờ sở hữu
        I-->>S: Kết quả kiểm tra media
        S->>S: Kiểm tra địa chỉ, amenities và quyền sử dụng ownershipCertificateMediaIds
        break Không đúng role hoặc không có quyền trên tài nguyên
            S-->>G: 403 (FORBIDDEN)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        break Vi phạm quy tắc nghiệp vụ của endpoint sau khi kiểm tra dữ liệu
            S-->>G: 422 (VALIDATION_FAILED)
            G-->>C: Chuyển tiếp phản hồi lỗi
        end
        S->>X: Geocode địa chỉ đã validate
        X-->>S: Tọa độ theo kết quả geocode
        S->>D: BEGIN transaction
        S->>D: Lưu buildings của actor ở trạng thái chờ duyệt
        S->>D: COMMIT
        D-->>S: Dữ liệu đã lưu
        Note over S,D: Lỗi nội bộ: rollback transaction chưa commit (nếu có), trả 500 INTERNAL_SERVER_ERROR qua gateway
        S-->>G: 201 BUILDING_CREATED + data theo DTO<br/>Location: /api/v1/buildings/{buildingId}
        G-->>C: Chuyển tiếp status, body và header theo contract
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BuildingCreateRequestDto
        example:
          name: Nhà trọ Thanh Xuân
          province: Thành phố Hồ Chí Minh
          ward: Phường Bến Nghé
          address: 12 Nguyễn Trãi
          district: Quận 1
          ownershipCertificateMediaIds:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
  responses:
    '201':
      description: 'Thành công: Gửi tòa nhà để duyệt.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - BUILDING_CREATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BuildingCreateResponseDto
          example:
            statusCode: 201
            code: BUILDING_CREATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: pending
              latitude: '20.995100'
              longitude: '105.816649'
              createdAt: '2026-09-23T11:55:00.000Z'
      headers:
        Location:
          description: Đường dẫn tài nguyên được tạo.
          schema:
            type: string
            example: /api/v1/buildings/{buildingId}
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      $ref: ../../openapi.yaml#/components/responses/ValidationError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
