get:
  tags:
  - Property
  x-apidog-folder: Building
  x-apidog-status: released
  operationId: getBuildings
  summary: Search public buildings
  description: |-
    Public; không cần token. Chỉ trả Building `approved` và chưa xóa, kể cả khi người gọi là landlord/admin.
    `filter[province]` và `filter[ward]` so khớp chính xác; `filter[q]` tìm không phân biệt hoa/thường
    trong name hoặc address. Mỗi filter dài tối đa 100 ký tự. Điều kiện visibility nằm trong SQL trước
    khi đếm và phân trang. Sort chỉ nhận `createdAt` hoặc `name`, mặc định `createdAt desc`.
    Chỉ hỗ trợ `format=json`; xlsx/csv/pdf chưa triển khai. Rate limiting thuộc phạm vi gateway.
    Query không hợp lệ trả `422 VALIDATION_FAILED`; field ngoài contract trả `422 UNEXPECTED_FIELD`
    theo validation chung của service.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant TEN as Tenancy
        participant DB as Tenancy DB

        GW->>TEN: GET /api/v1/buildings (filter, sort, order, pageNo, pageSize; no token required)
        TEN->>TEN: Validate query; public access without authentication
        alt Invalid query
            TEN-->>GW: 422 VALIDATION_FAILED / UNEXPECTED_FIELD
        else Valid query
            TEN->>DB: SELECT buildings WHERE is_deleted = false AND status = approved<br/>AND province/ward filters AND (LOWER(name) LIKE q OR LOWER(address) LIKE q)<br/>ORDER BY whitelisted field; OFFSET / LIMIT
            DB-->>TEN: Public buildings
            TEN->>DB: COUNT with the same visibility and filter conditions (when needed by paginator)
            DB-->>TEN: totalItems
            TEN->>TEN: Map only id, name, province, ward, address
            TEN-->>GW: 200 BUILDINGS_FETCHED + pagination
        end
    ```
  security: []
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        province:
          type: string
          maxLength: 100
        ward:
          type: string
          maxLength: 100
        q:
          type: string
          maxLength: 100
  - name: sort
    in: query
    description: Một trường sắp xếp được endpoint hỗ trợ.
    schema:
      type: string
      enum: [createdAt, name]
      default: createdAt
  - name: order
    in: query
    schema:
      type: string
      enum:
      - asc
      - desc
      default: desc
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: format
    in: query
    description: Chỉ hỗ trợ JSON; export xlsx/csv/pdf chưa triển khai.
    schema:
      type: string
      enum:
      - json
      default: json
  responses:
    '200':
      description: 'Thành công: Tìm tòa nhà trên sàn công khai.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDINGS_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/BuildingPublicListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: BUILDINGS_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Nhà trọ Thanh Xuân
              province: Thành phố Hồ Chí Minh
              ward: Phường Bến Nghé
              address: 12 Nguyễn Trãi
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
    '422':
      description: Query không hợp lệ hoặc chứa field ngoài contract.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum: [VALIDATION_FAILED, UNEXPECTED_FIELD]
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
post:
  tags:
  - Property
  x-apidog-folder: Building
  x-apidog-status: released
  operationId: postBuildings
  security:
    - BearerAuth: []
  summary: Create building for approval
  description: |-
    Landlord. Tạo tòa nhà ở trạng thái `pending`; `landlordId` lấy từ JWT đã xác thực.
    Client không gửi `landlordId`, `status`, `district`, `latitude` hoặc `longitude`.
    Backend geocode từ `address` + `ward` + `province` qua TrackAsia trước transaction, không ghi đè địa chỉ.
    Geocode lỗi thì không tạo Building. Building và outbox `building.created` được ghi trong cùng transaction;
    relay publish sau khi commit. Trả `201 BUILDING_CREATED`.

    Body chỉ gồm `name`, `province`, `ward`, `address`; trường ngoài contract trả `422 UNEXPECTED_FIELD`.
    Lỗi: `401 UNAUTHORIZED`, `403 FORBIDDEN` / `ACCOUNT_LOCKED`,
    `422 VALIDATION_FAILED` / `UNEXPECTED_FIELD` / `GEOCODING_FAILED`,
    `503 AUTH_UNAVAILABLE` / `GEOCODING_UNAVAILABLE`.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant TEN as Tenancy
        participant GEO as TrackAsia
        participant DB as Tenancy DB
        participant RELAY as Outbox Relay
        participant MQ as RabbitMQ

        GW->>TEN: POST /api/v1/buildings + Bearer token
        TEN->>TEN: Verify JWT, landlord role and request
        TEN->>GEO: Geocode address, ward, province
        alt Geocoding failed or unavailable
            GEO-->>TEN: No matching address / provider error
            TEN-->>GW: 422 GEOCODING_FAILED / 503 GEOCODING_UNAVAILABLE
        else Coordinates found
            GEO-->>TEN: Latitude, longitude
            TEN->>DB: BEGIN
            TEN->>DB: INSERT buildings (pending, landlord from JWT)
            TEN->>DB: INSERT outbox_messages (building.created)
            alt Database operation fails
                TEN->>DB: ROLLBACK
                TEN-->>GW: 500 INTERNAL_SERVER_ERROR
            else Commit succeeds
                TEN->>DB: COMMIT
                TEN-->>GW: 201 BUILDING_CREATED
                RELAY->>DB: Claim committed outbox event
                RELAY->>MQ: Publish building.created
                MQ-->>RELAY: Publisher confirm
                RELAY->>DB: Mark outbox PUBLISHED
            end
        end
    ```
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../openapi.yaml#/components/schemas/BuildingCreateRequestDto
        example:
          name: Nhà trọ Thanh Xuân
          province: Thành phố Hồ Chí Minh
          ward: Phường Bến Nghé
          address: 12 Nguyễn Trãi
  responses:
    '201':
      description: 'Thành công: Gửi tòa nhà để duyệt.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 201
              code:
                type: string
                enum:
                - BUILDING_CREATED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BuildingCreateResponseDto
          example:
            statusCode: 201
            code: BUILDING_CREATED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: pending
              latitude: '20.995100'
              longitude: '105.816649'
              createdAt: '2026-09-23T11:55:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestBodyError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      x-apidog-name: Service Unavailable
      description: Dịch vụ phụ thuộc (xác thực hoặc geocoding) tạm thời không khả dụng.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [503]
              code:
                type: string
                enum:
                  - AUTH_UNAVAILABLE
                  - GEOCODING_UNAVAILABLE
                description: |-
                  - AUTH_UNAVAILABLE: Hạ tầng xác thực tạm thời không khả dụng.
                  - GEOCODING_UNAVAILABLE: Dịch vụ geocoding (TrackAsia) timeout hoặc lỗi; chưa tạo/cập nhật dữ liệu, client có thể thử lại.
          examples:
            auth_unavailable:
              summary: AUTH_UNAVAILABLE — Hạ tầng xác thực tạm thời không khả dụng.
              value:
                statusCode: 503
                code: AUTH_UNAVAILABLE
            geocoding_unavailable:
              summary: GEOCODING_UNAVAILABLE — Dịch vụ geocoding tạm thời không khả dụng.
              value:
                statusCode: 503
                code: GEOCODING_UNAVAILABLE
    '403':
      description: Chỉ landlord đang hoạt động được tạo tòa nhà.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [403]
              code:
                type: string
                enum: [FORBIDDEN, ACCOUNT_LOCKED]
          examples:
            forbidden:
              value: {statusCode: 403, code: FORBIDDEN}
            account_locked:
              value: {statusCode: 403, code: ACCOUNT_LOCKED}
    '422':
      x-apidog-name: Unprocessable Entity
      description: Dữ liệu hợp lệ về cấu trúc nhưng vi phạm ràng buộc trường hoặc quy tắc nghiệp vụ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode:
                type: integer
                enum: [422]
              code:
                type: string
                enum:
                  - GEOCODING_FAILED
                  - VALIDATION_FAILED
                  - UNEXPECTED_FIELD
                description: |-
                  - GEOCODING_FAILED: Không xác định được tọa độ từ địa chỉ (address, ward, province); người dùng cần sửa địa chỉ.
                  - VALIDATION_FAILED: Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
                  - UNEXPECTED_FIELD: Body chứa trường ngoài contract, ví dụ landlordId hoặc district.
          examples:
            geocoding_failed:
              summary: GEOCODING_FAILED — Không xác định được tọa độ từ địa chỉ.
              value:
                statusCode: 422
                code: GEOCODING_FAILED
            validation_failed:
              summary: VALIDATION_FAILED — Dữ liệu vi phạm ràng buộc schema hoặc quy tắc nghiệp vụ khác chưa có mã riêng.
              value:
                statusCode: 422
                code: VALIDATION_FAILED
            unexpected_field:
              summary: UNEXPECTED_FIELD — Body chứa trường ngoài contract.
              value:
                statusCode: 422
                code: UNEXPECTED_FIELD
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
