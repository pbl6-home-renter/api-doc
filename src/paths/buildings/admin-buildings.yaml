get:
  tags:
  - Property
  x-apidog-folder: Building
  x-apidog-status: released
  operationId: getAdminBuildings
  security:
    - BearerAuth: []
  summary: List buildings for admin approval
  description: |-
    admin. Hàng đợi duyệt và quản lý Building chưa bị xóa, lọc theo status, landlordId, province, ward và q.
    q tìm không phân biệt hoa/thường trong name hoặc address. Mặc định sort=createdAt, order=asc (cũ nhất trước).
    Chỉ hỗ trợ format=json; xlsx/csv/pdf trả 422 VALIDATION_FAILED. Trường query/filter không hỗ trợ trả 422 UNEXPECTED_FIELD.
    Lấy thông tin chủ nhà bằng một batch /internal/users; nếu Identity unavailable thì landlordName/landlordPhone là chuỗi rỗng và ghi log warn.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant TEN as Tenancy
        participant DB as Tenancy DB
        participant ID as Identity

        GW->>TEN: GET /admin/buildings?filter[status|landlordId|province|ward|q]&sort&order&pageNo&pageSize
        TEN->>TEN: Verify JWT, role admin và validate query
        TEN->>DB: SELECT + COUNT buildings WHERE is_deleted=false<br/>+ filters + sort whitelist + LIMIT/OFFSET
        DB-->>TEN: Buildings và totalItems
        TEN->>TEN: Gom landlordId duy nhất trong page
        opt Có landlordId
            TEN->>ID: GET /internal/users?ids=uuid,uuid (X-Service-Token)
            alt Identity trả lời
                ID-->>TEN: data [{id, name, phone, email, ...}]
            else Identity unavailable
                TEN->>TEN: Log warn, dùng thông tin liên hệ rỗng
            end
        end
        TEN-->>GW: 200 BUILDINGS_ADMIN_FETCHED {data, pagination}
    ```
  parameters:
  - name: filter
    in: query
    required: false
    style: deepObject
    explode: true
    description: Bộ lọc được endpoint hỗ trợ.
    schema:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        landlordId:
          type: string
          format: uuid
        province:
          type: string
        ward:
          type: string
        q:
          type: string
  - name: sort
    in: query
    description: Một trong các trường createdAt, name hoặc status.
    schema:
      type: string
      enum: [createdAt, name, status]
      default: createdAt
  - name: order
    in: query
    schema:
      type: string
      enum:
      - asc
      - desc
      default: asc
  - name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: pageNo
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: format
    in: query
    description: Chỉ hỗ trợ JSON envelope; giá trị khác json trả 422 VALIDATION_FAILED.
    schema:
      type: string
      enum:
      - json
      default: json
  responses:
    '200':
      description: 'Thành công: Hàng đợi duyệt và quản lý toàn bộ tòa nhà.'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            - pagination
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDINGS_ADMIN_FETCHED
              data:
                type: array
                items:
                  $ref: ../../openapi.yaml#/components/schemas/BuildingAdminListResponseDto
              pagination:
                type: object
                additionalProperties: false
                required:
                - type
                - pageNo
                - pageSize
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
                properties:
                  type:
                    type: string
                    enum:
                    - offset
                  pageNo:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
                    maximum: 100
                  totalItems:
                    type: integer
                    minimum: 0
                  totalPages:
                    type: integer
                    minimum: 0
                  hasNextPage:
                    type: boolean
                  hasPreviousPage:
                    type: boolean
          example:
            statusCode: 200
            code: BUILDINGS_ADMIN_FETCHED
            data:
            - id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Tòa nhà Rentify Central Park
              landlordId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              status: pending
              createdAt: '2026-09-20T08:00:00.000Z'
              landlordName: Ví dụ
              landlordPhone: '0901234567'
              documentsCount: 0
            pagination:
              type: offset
              pageNo: 1
              pageSize: 20
              totalItems: 1
              totalPages: 1
              hasNextPage: false
              hasPreviousPage: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestQueryError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '422':
      description: Filter, sort, order, pagination hoặc format không hợp lệ.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code]
            properties:
              statusCode: { type: integer, enum: [422] }
              code: { type: string, enum: [VALIDATION_FAILED, UNEXPECTED_FIELD] }
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
