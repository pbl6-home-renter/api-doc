get:
  tags:
  - Property
  x-apidog-folder: Building
  x-apidog-status: released
  operationId: getMeBuildingsBuildingid
  security:
    - BearerAuth: []
  summary: Get my building details
  description: |-
    Building không tồn tại, đã xóa hoặc thuộc landlord khác đều trả 404 RESOURCE_NOT_FOUND.
    
    **Sequence diagram**
    
    ```mermaid
    sequenceDiagram
        autonumber
        actor Client
        participant GW as API Gateway
        participant S as Tenancy-Service
        participant Guard as JWT/access guards
        participant C as MyBuildingController
        participant Bus as CQRS QueryBus
        participant H as Application handler
        Client->>GW: GET /api/v1/me/buildings/{buildingId}
        GW->>GW: Validate bearer token for protected route
        GW->>S: Proxy original HTTP request
        S->>Guard: Validate JWT, account state and route access
        Guard-->>C: Continue with authenticated context
        S->>C: Invoke getMeBuildingsBuildingid
        C->>Bus: Execute query for getMeBuildingsBuildingid
        Bus->>H: Dispatch query handler
        H-->>Bus: Return use-case result
        Bus-->>C: Result
        C-->>S: Return documented response
        S-->>GW: HTTP status and response body
        GW-->>Client: Forward HTTP response
    ```
  parameters:
  - name: buildingId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc tòa nhà của tôi (chế độ quản trị).'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDING_MY_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BuildingMyDetailResponseDto
          example:
            statusCode: 200
            code: BUILDING_MY_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Tòa nhà Rentify Central Park
              status: pending
              occupancyRate: '0%'
              reviewNote: null
              province: Thành phố Hồ Chí Minh
              ward: Phường Bến Nghé
              address: 12 Nguyễn Trãi
              occupiedRooms: 0
              amenities: null
              ownershipCertificateUrls: []
              vietQrConfigured: false
              ratePolicies: []
              createdAt: '2026-09-20T08:00:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
