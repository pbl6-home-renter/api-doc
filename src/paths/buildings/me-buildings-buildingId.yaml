get:
  tags:
  - Property
  x-apidog-folder: Building
  operationId: getMeBuildingsBuildingid
  security:
    - BearerAuth: []
  summary: Get my building details
  description: 'landlord. Đọc tòa nhà của tôi (chế độ quản trị). Lỗi nghiệp vụ: 404 NOT FOUND · 403 FORBIDDEN.'
  parameters:
  - name: buildingId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc tòa nhà của tôi (chế độ quản trị).'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDING_MY_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BuildingMyDetailResponseDto
          example:
            statusCode: 200
            code: BUILDING_MY_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Tòa nhà Rentify Central Park
              status: pending
              totalRooms: 12
              occupancyRate: '75.0'
              reviewNote: null
              province: Thành phố Hồ Chí Minh
              district: Quận 1
              ward: Phường Bến Nghé
              address: 12 Nguyễn Trãi
              occupiedRooms: 0
              vietQrConfigured: false
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
