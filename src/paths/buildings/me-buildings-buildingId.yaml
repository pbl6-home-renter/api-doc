get:
  tags:
  - Property
  x-apidog-folder: Building
  x-apidog-status: released
  operationId: getMeBuildingsBuildingid
  security:
    - BearerAuth: []
  summary: Get my building details
  description: |-
    landlord. Đọc tòa nhà của tôi (chế độ quản trị). Lỗi nghiệp vụ: 404 NOT FOUND · 403 FORBIDDEN.
    Building không tồn tại, đã xóa hoặc thuộc landlord khác đều trả 404 RESOURCE_NOT_FOUND.

    ```mermaid
    sequenceDiagram
        autonumber
        participant GW as API Gateway
        participant TEN as Tenancy
        participant DB as Tenancy DB

        GW->>TEN: GET /me/buildings/{buildingId}
        TEN->>TEN: Verify JWT, role landlord và validate buildingId
        TEN->>DB: SELECT building WHERE id=buildingId<br/>AND landlord_id=user.id AND is_deleted=false
        DB-->>TEN: Building hoặc null
        alt Không có Building thuộc người gọi
            TEN-->>GW: 404 RESOURCE_NOT_FOUND
        else Tìm thấy Building
            TEN->>TEN: Map detail DTO, note thành reviewNote
            TEN-->>GW: 200 BUILDING_MY_FETCHED {data}
        end
        Note over TEN,DB: Ownership được lọc ngay trong query; không lộ Building của landlord khác
    ```
  parameters:
  - name: buildingId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  responses:
    '200':
      description: 'Thành công: Đọc tòa nhà của tôi (chế độ quản trị).'
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - statusCode
            - code
            - data
            properties:
              statusCode:
                type: integer
                enum:
                - 200
              code:
                type: string
                enum:
                - BUILDING_MY_FETCHED
              data:
                $ref: ../../openapi.yaml#/components/schemas/BuildingMyDetailResponseDto
          example:
            statusCode: 200
            code: BUILDING_MY_FETCHED
            data:
              id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              name: Tòa nhà Rentify Central Park
              status: pending
              occupancyRate: '0%'
              reviewNote: null
              province: Thành phố Hồ Chí Minh
              ward: Phường Bến Nghé
              address: 12 Nguyễn Trãi
              occupiedRooms: 0
              amenities: null
              ownershipCertificateUrls: []
              vietQrConfigured: false
              ratePolicies: []
              createdAt: '2026-09-20T08:00:00.000Z'
    '400':
      $ref: ../../openapi.yaml#/components/responses/BadRequestPathError
    '401':
      $ref: ../../openapi.yaml#/components/responses/UnauthorizedError
    '503':
      $ref: ../../openapi.yaml#/components/responses/AuthUnavailableError
    '403':
      $ref: ../../openapi.yaml#/components/responses/ForbiddenError
    '404':
      $ref: ../../openapi.yaml#/components/responses/NotFoundError
    '429':
      $ref: ../../openapi.yaml#/components/responses/TooManyRequestsError
    '500':
      $ref: ../../openapi.yaml#/components/responses/InternalServerError
