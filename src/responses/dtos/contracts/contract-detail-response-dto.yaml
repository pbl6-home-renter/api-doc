type: object
x-apidog-folder: "Contract/Response"
title: ContractDetailResponseDto
description: Chi tiết hợp đồng
properties:
  id: { type: string, format: uuid , description: "Định danh duy nhất của tài nguyên." }
  roomId: { type: string, format: uuid , description: "Định danh duy nhất của phòng liên quan." }
  status: { type: string, enum: [draft, signed, active, suspended, expired, terminated] , description: "Trạng thái hiện tại của tài nguyên trong quy trình nghiệp vụ." }
  templateKey: { type: string, nullable: true, maxLength: 100, description: "Mẫu đã áp dụng; null nếu chưa chọn mẫu." }
  tenantId: { type: string, format: uuid, nullable: true , description: "Thông tin tenant id của tài nguyên trong ngữ cảnh DTO." }
  tenantName: { type: string, nullable: true, minLength: 1, maxLength: 254 , description: "Thông tin tenant name của tài nguyên trong ngữ cảnh DTO." }
  tenantPhone: { type: string, nullable: true, minLength: 10, maxLength: 12, pattern: '^0[0-9]{9}$|^\+84[0-9]{9}$', description: "Số điện thoại của người thuê; null khi chưa có thông tin." }
  rentPrice: { type: number, minimum: 0 , description: "Thông tin rent price của tài nguyên trong ngữ cảnh DTO." }
  depositAmount: { type: number, minimum: 0 , description: "Thông tin deposit amount của tài nguyên trong ngữ cảnh DTO." }
  startDate: { type: string, format: date , description: "Thông tin start date của tài nguyên trong ngữ cảnh DTO." }
  endDate: { type: string, format: date , description: "Thông tin end date của tài nguyên trong ngữ cảnh DTO." }
  vehicleCount: { type: integer, minimum: 0, maximum: 2147483647, nullable: true, description: "Số xe đã khai báo; null khi chưa khai báo." }
  description: { type: string, nullable: true, minLength: 1, maxLength: 500, description: "Ghi chú hợp đồng; chỉ sửa khi còn draft." }

required:
  - id
  - roomId
  - status
  - templateKey
  - tenantId
  - tenantName
  - tenantPhone
  - rentPrice
  - depositAmount
  - startDate
  - endDate
  - vehicleCount
  - description
