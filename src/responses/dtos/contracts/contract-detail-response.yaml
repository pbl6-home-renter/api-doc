type: object
x-apidog-folder: "Contract/Response"
title: ContractDetailResponseDto
description: Chi tiết hợp đồng
allOf:
  - $ref: '../../wrappers/success-single.yaml'
  - type: object
    properties:
      statusCode: { type: integer, enum: [200], example: 200 }
      code: { type: string, enum: [CONTRACT_FETCHED], example: CONTRACT_FETCHED }
      data:
        type: object
        properties:
          id: { type: string, format: uuid }
          roomId: { type: string, format: uuid }
          status: { type: string, enum: [draft, signed, active, suspended, expired, terminated] }
          tenantId: { type: string, format: uuid, nullable: true }
          tenantName: { type: string, nullable: true, minLength: 1, maxLength: 254 }
          tenantPhone: { type: string, nullable: true, minLength: 10, maxLength: 12, pattern: '^0[0-9]{9}$|^\+84[0-9]{9}$' }
          rentPrice: { type: integer, minimum: 0 }
          depositAmount: { type: integer, minimum: 0 }
          startDate: { type: string, format: date }
          endDate: { type: string, format: date }
          signedContractMediaId: { type: string, format: uuid, nullable: true }
        required: [id, roomId, status, tenantId, tenantName, tenantPhone, rentPrice, depositAmount, startDate, endDate, signedContractMediaId]
