type: object
x-apidog-folder: "Contract/Response"
title: ContractMyListResponseDto
description: Danh sách hợp đồng thuê phòng của khách thuê hiện tại

properties:
  id: { type: string, format: uuid, description: "Định danh duy nhất của hợp đồng." }
  contractCode: { type: string, description: "Mã hợp đồng (VD: HD-2026-0012)." }
  roomId: { type: string, format: uuid, description: "Định danh phòng liên quan." }
  roomName: { type: string, description: "Tên phòng trọ (VD: P.201)." }
  buildingName: { type: string, description: "Tên tòa nhà." }
  status:
    type: string
    enum: [draft, signed, active, suspended, expired, terminated]
    description: "Trạng thái hợp đồng."
  rentalType: { type: string, enum: [MONTHLY, DAILY], description: "Hình thức thuê dài hạn hoặc ngắn hạn theo ngày." }
  rentPrice: { type: integer, minimum: 0, description: "Giá thuê theo chu kỳ (VNĐ)." }
  depositAmount: { type: integer, minimum: 0, description: "Tiền đặt cọc phòng (VNĐ)." }
  startDate: { type: string, format: date-time, description: "Thời điểm bắt đầu hợp đồng." }
  endDate: { type: string, format: date-time, description: "Thời điểm kết thúc hợp đồng." }

required:
  - id
  - contractCode
  - roomId
  - roomName
  - buildingName
  - status
  - rentPrice
  - depositAmount
  - startDate
  - endDate
