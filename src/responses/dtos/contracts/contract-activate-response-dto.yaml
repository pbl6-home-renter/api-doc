type: object
x-apidog-folder: "Contract/Response"
title: ContractActivateResponseDto
description: Dữ liệu trong envelope 200 CONTRACT_ACTIVATED sau khi transaction kích hoạt hợp đồng thành công.
additionalProperties: false
properties:
  id: { type: string, format: uuid, description: "ID hợp đồng vừa được kích hoạt." }
  status: { type: string, enum: [active], example: active, description: "Trạng thái hợp đồng sau khi kích hoạt." }
  activatedAt:
    type: string
    format: date-time
    description: Thời điểm kích hoạt lưu trong contracts.activated_at; cùng giá trị với activatedAt của event contract.activated.
    example: '2026-11-01T03:00:00.000Z'

required:
  - id
  - status
  - activatedAt
