type: object
x-apidog-folder: ContractMember/Response
title: ContractMemberListResponseDto
description: Danh sách thành viên cùng cư trú trong hợp đồng thuê phòng
properties:
  id:
    type: string
    format: uuid
    description: Định danh thành viên hợp đồng.
  contractId:
    type: string
    format: uuid
    description: Định danh hợp đồng liên quan.
  tenantId:
    type: string
    format: uuid
    nullable: true
    description: Định danh tài khoản người dùng (nếu có tài khoản hệ thống).
  tenantName:
    type: string
    description: Họ và tên thành viên cư trú.
    nullable: true
  tenantPhone:
    type: string
    nullable: true
    description: Số điện thoại thành viên.
  status:
    type: string
    enum:
    - active
    - left
    description: 'Derived: active when leftAt is null or after today (UTC);
      otherwise left.'
    example: active
  joinedAt:
    type: string
    format: date
    description: Thời điểm thành viên bắt đầu vào ở.
  leftAt:
    type: string
    format: date
    nullable: true
    description: Thời điểm thành viên rời khỏi phòng (null nếu đang ở).
required:
- id
- contractId
- tenantId
- tenantName
- tenantPhone
- joinedAt
- leftAt
- status
