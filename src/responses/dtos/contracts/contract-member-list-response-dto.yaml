  code: { type: string, enum: [CONTRACT_MEMBERS_FETCHED], example: CONTRACT_MEMBERS_FETCHED , description: "Mã ổn định để client nhận diện kết quả nghiệp vụ." }
  data:
    type: array
    description: Dữ liệu kết quả của thao tác.
    items:
      type: object
      properties:
        id: { type: string, format: uuid , description: "Định danh duy nhất của tài nguyên." }
        contractId: { type: string, format: uuid , description: "Định danh duy nhất của hợp đồng liên quan." }
        tenantName: { type: string, nullable: true, minLength: 1, maxLength: 254 , description: "Thông tin tenant name của tài nguyên trong ngữ cảnh DTO." }
        joinedAt: { type: string, format: date , description: "Thông tin joined at của tài nguyên trong ngữ cảnh DTO." }
        leftAt: { type: string, format: date, nullable: true , description: "Thông tin left at của tài nguyên trong ngữ cảnh DTO." }
