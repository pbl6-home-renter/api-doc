type: object
x-apidog-folder: "Response/Contract"
title: ContractTemplateListResponse
description: Danh sách mẫu hợp đồng
allOf:
  - $ref: '../../wrappers/success-list.yaml'
  - type: object
    properties:
      statusCode: { type: integer, enum: [200], example: 200 }
      code: { type: string, enum: [CONTRACT_TEMPLATES_FETCHED], example: CONTRACT_TEMPLATES_FETCHED }
      data:
        type: array
        items:
          type: object
          properties:
            templateKey: { type: string }
            title: { type: string }
            version: { type: string }
          required: [templateKey, title, version]
      pagination:
        type: object
        properties:
          type: { type: string, enum: [offset], example: offset }
          pageNo: { type: integer, minimum: 1, example: 1 }
          pageSize: { type: integer, minimum: 1, maximum: 100, example: 20 }
          totalItems: { type: integer, minimum: 0, example: 1 }
          totalPages: { type: integer, minimum: 0, example: 1 }
          hasNextPage: { type: boolean, example: false }
          hasPreviousPage: { type: boolean, example: false }
        required: [type, pageNo, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
