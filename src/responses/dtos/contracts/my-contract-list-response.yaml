type: object
x-apidog-folder: "Response/Contract"
title: MyContractListResponse
description: Danh sách hợp đồng của tenant hiện tại
allOf:
  - $ref: '../../wrappers/success-list.yaml'
  - type: object
    properties:
      statusCode: { type: integer, enum: [200], example: 200 }
      code: { type: string, enum: [MY_CONTRACTS_FETCHED], example: MY_CONTRACTS_FETCHED }
      data:
        type: array
        items:
          type: object
          properties:
            id: { type: string, format: uuid }
            roomId: { type: string, format: uuid }
            status: { type: string, enum: [draft, signed, active, suspended, expired, terminated] }
            rentPrice: { type: integer, minimum: 0 }
            depositAmount: { type: integer, minimum: 0 }
          required: [id, roomId, status, rentPrice, depositAmount]
      pagination:
        type: object
        properties:
          type: { type: string, enum: [offset], example: offset }
          pageNo: { type: integer, minimum: 1, example: 1 }
          pageSize: { type: integer, minimum: 1, maximum: 100, example: 20 }
          totalItems: { type: integer, minimum: 0, example: 1 }
          totalPages: { type: integer, minimum: 0, example: 1 }
          hasNextPage: { type: boolean, example: false }
          hasPreviousPage: { type: boolean, example: false }
        required: [type, pageNo, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
