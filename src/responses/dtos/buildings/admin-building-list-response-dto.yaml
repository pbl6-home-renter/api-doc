type: object
x-apidog-folder: "Building/Response"
title: BuildingAdminListResponseDto
description: Danh sách tòa nhà dành cho admin

properties:
  id: { type: string, format: uuid, description: "Định danh duy nhất của tòa nhà." }
  name: { type: string, description: "Tên tòa nhà." }
  landlordId: { type: string, format: uuid, description: "Định danh chủ nhà." }
  landlordName: { type: string, description: "Tên chủ nhà." }
  landlordPhone: { type: string, description: "Số điện thoại của chủ nhà." }
  status: { type: string, enum: [pending, approved, rejected], description: "Trạng thái kiểm duyệt tòa nhà." }
  totalRooms: { type: integer, minimum: 0, description: "Tổng số phòng trong tòa nhà." }
  documentsCount: { type: integer, minimum: 0, description: "Số lượng tài liệu/giấy tờ sở hữu đã tải lên." }
  createdAt: { type: string, format: date-time, description: "Thời điểm bản ghi được tạo theo ISO 8601." }

required:
  - id
  - name
  - landlordId
  - landlordName
  - landlordPhone
  - status
  - totalRooms
  - documentsCount
  - createdAt
