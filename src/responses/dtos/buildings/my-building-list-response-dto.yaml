type: object
x-apidog-folder: "Building/Response"
title: BuildingMyListResponseDto
description: Danh sách tòa nhà thuộc quyền quản lý của chủ nhà hiện tại

properties:
  id: { type: string, format: uuid, description: "Định danh duy nhất của tòa nhà." }
  name: { type: string, description: "Tên tòa nhà." }
  address: { type: string, description: "Địa chỉ tòa nhà." }
  status:
    type: string
    description: Trạng thái kiểm duyệt của tòa nhà (pending, approved, rejected).
    enum: [pending, approved, rejected]
  occupiedRooms: { type: integer, minimum: 0, description: "Số lượng phòng đang có khách thuê; hiện tạm trả 0 khi chưa tích hợp thống kê occupancy." }
  occupancyRate: { type: string, example: "0%", description: "Tỷ lệ lấp đầy; hiện tạm trả '0%' khi chưa tích hợp thống kê occupancy." }
  rejectionReason: { type: string, nullable: true, description: "Lý do bị admin từ chối duyệt (nếu status = rejected)." }
  createdAt: { type: string, format: date-time, description: "Thời điểm tạo tòa nhà." }

required:
  - id
  - name
  - status
  - occupiedRooms
  - occupancyRate
