type: object
x-apidog-folder: "Building/Response"
title: BuildingMyListResponseDto
description: Danh sách tòa nhà thuộc quyền quản lý của chủ nhà hiện tại

properties:
  id: { type: string, format: uuid, description: "Định danh duy nhất của tòa nhà." }
  name: { type: string, description: "Tên tòa nhà." }
  address: { type: string, description: "Địa chỉ tòa nhà." }
  status:
    type: string
    description: Trạng thái kiểm duyệt của tòa nhà (pending, approved, rejected).
    enum: [pending, approved, rejected]
  totalRooms: { type: integer, minimum: 0, example: 4, description: "Tổng số phòng chưa xóa." }
  occupiedRooms: { type: integer, minimum: 0, example: 2, description: "Số phòng chưa xóa có trạng thái occupied." }
  occupancyRate: { type: string, example: "50%", description: "Tỷ lệ occupied trên tổng số phòng chưa xóa, làm tròn tối đa một chữ số thập phân; 0 phòng trả 0%." }
  rejectionReason: { type: string, nullable: true, minLength: 1, maxLength: 500, description: "Lý do từ chối; chỉ xuất hiện khi status = rejected, các trạng thái khác không trả field này." }
  createdAt: { type: string, format: date-time, description: "Thời điểm tạo tòa nhà." }

required:
  - id
  - name
  - status
  - occupiedRooms
  - totalRooms
  - occupancyRate
  - address
  - createdAt
