type: object
x-apidog-folder: "Building/Response"
title: BuildingAdminDetailResponseDto
description: Chi tiết tòa nhà dành cho admin

properties:
  statusCode: { type: integer, enum: [200], example: 200 , description: "Thông tin status code của tài nguyên trong ngữ cảnh DTO." }
  code: { type: string, enum: [ADMIN_BUILDING_FETCHED], example: ADMIN_BUILDING_FETCHED , description: "Mã ổn định để client nhận diện kết quả nghiệp vụ." }
  data:
    type: object
    description: Dữ liệu kết quả của thao tác.
    properties:
      id: { type: string, format: uuid , description: "Định danh duy nhất của tài nguyên." }
      name: { type: string , description: "Thông tin name của tài nguyên trong ngữ cảnh DTO." }
      address: { type: string, minLength: 1, maxLength: 254 , description: "Thông tin address của tài nguyên trong ngữ cảnh DTO." }
      landlordId: { type: string, format: uuid , description: "Thông tin landlord id của tài nguyên trong ngữ cảnh DTO." }
      status: { type: string, enum: [pending, approved, rejected] , description: "Trạng thái hiện tại của tài nguyên trong quy trình nghiệp vụ." }
      totalRooms: { type: integer, minimum: 0 , description: "Thông tin total rooms của tài nguyên trong ngữ cảnh DTO." }
      occupancyRate: { type: string , description: "Thông tin occupancy rate của tài nguyên trong ngữ cảnh DTO." }
      reviewNote: { type: string, nullable: true, minLength: 1, maxLength: 500 , description: "Thông tin review note của tài nguyên trong ngữ cảnh DTO." }
      createdAt: { type: string, format: date-time , description: "Thời điểm bản ghi được tạo, theo định dạng ngày giờ ISO 8601." }
    required: [id, name, address, landlordId, status, totalRooms, occupancyRate, reviewNote, createdAt]

required:
  - statusCode
  - code
  - data
