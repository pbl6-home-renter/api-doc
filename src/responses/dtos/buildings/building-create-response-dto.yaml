type: object
x-apidog-folder: "Building/Response"
title: BuildingCreateResponseDto
description: Phản hồi khi tạo tòa nhà thành công, chờ admin phê duyệt.

properties:
  id: { type: string, format: uuid, description: "Định danh duy nhất của tòa nhà vừa tạo." }
  status: { type: string, enum: [pending, approved, rejected], example: "pending", description: "Trạng thái kiểm duyệt của tòa nhà (mặc định là pending chờ duyệt sổ đỏ)." }
  latitude: { type: string, example: '20.995100', description: "Tọa độ vĩ độ được geocode từ địa chỉ." }
  longitude: { type: string, example: '105.816649', description: "Tọa độ kinh độ được geocode từ địa chỉ." }
  ownershipCertificateMediaIds:
    type: array
    description: Dành cho media flow sau này; hiện chưa lưu liên kết media nên trường này không được trả về.
    items:
      type: string
      format: uuid
  createdAt: { type: string, format: date-time, description: "Thời điểm tạo tòa nhà." }

required:
  - id
  - status
  - latitude
  - longitude
  - createdAt
