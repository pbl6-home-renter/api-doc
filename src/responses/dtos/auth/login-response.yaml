type: object
x-apidog-folder: Auth
title: LoginResponse
description: Phản hồi khi đăng nhập thành công

allOf:
  - $ref: '../../wrappers/success-single.yaml'

  - type: object
    properties:
      statusCode:
        type: integer
        enum:
          - 200
        example: 200

      code:
        type: string
        enum:
          - LOGGED_IN
        example: "LOGGED_IN"

      data:
        type: object
        properties:
          accessToken:
            type: string
            minLength: 1
            description: JWT access token dùng để truy cập các API được bảo vệ
            example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

          expiresIn:
            type: integer
            enum:
              - 900
            description: Thời gian sống của access token tính bằng giây
            example: 900

        required:
          - accessToken
          - expiresIn