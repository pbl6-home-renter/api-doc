type: object
x-apidog-folder: "Auth/Response"
title: RequestPasswordResetResponse
description: Phản hồi khi hệ thống đã tiếp nhận yêu cầu đặt lại mật khẩu

allOf:
  - $ref: '../../wrappers/success-single.yaml'

  - type: object
    properties:
      statusCode:
        type: integer
        enum:
          - 202
        example: 202

      code:
        type: string
        enum:
          - PASSWORD_RESET_REQUESTED
        example: "PASSWORD_RESET_REQUESTED"

      data:
        type: object
        properties:
          accepted:
            type: boolean
            enum:
              - true
            description: Hệ thống đã tiếp nhận yêu cầu xử lý
            example: true

        required:
          - accepted