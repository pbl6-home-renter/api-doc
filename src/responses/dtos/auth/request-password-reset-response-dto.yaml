type: object
x-apidog-folder: "Auth/Response"
title: AuthRequestPasswordResetResponseDto
description: Phản hồi khi hệ thống đã tiếp nhận yêu cầu đặt lại mật khẩu

properties:
  statusCode:
    type: integer
    description: Thông tin status code của tài nguyên trong ngữ cảnh DTO.
    enum:
      - 202
    example: 202

  code:
    type: string
    description: Mã ổn định để client nhận diện kết quả nghiệp vụ.
    enum:
      - PASSWORD_RESET_REQUESTED
    example: "PASSWORD_RESET_REQUESTED"

  data:
    type: object
    properties:
      accepted:
        type: boolean
        enum:
          - true
        description: Hệ thống đã tiếp nhận yêu cầu xử lý
        example: true

    required:
      - accepted

required:
  - statusCode
  - code
  - data
