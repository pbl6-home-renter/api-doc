type: object
x-apidog-folder: Auth
title: RegisterResponse
description: Phản hồi khi đăng ký tài khoản thành công

allOf:
  - $ref: '../../wrappers/success-single.yaml'

  - type: object
    properties:
      statusCode:
        type: integer
        enum:
          - 201
        example: 201

      code:
        type: string
        enum:
          - REGISTERED
        example: "REGISTERED"

      data:
        type: object
        properties:
          id:
            type: string
            format: uuid
            description: ID tài khoản vừa được tạo
            example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

          role:
            type: string
            enum:
              - tenant
              - landlord
            description: Vai trò của tài khoản
            example: "tenant"

          status:
            type: string
            enum:
              - active
            description: Trạng thái ban đầu của tài khoản
            example: "active"

        required:
          - id
          - role
          - status