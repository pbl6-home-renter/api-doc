type: object
x-apidog-folder: "Auth/Response"
title: AuthRefreshResponseDto
description: Phản hồi khi xoay vòng refresh session thành công

properties:
  accessToken:
    type: string
    minLength: 1
    description: Access token mới được phát hành
    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

  refreshToken:
    type: string
    minLength: 1
    description: Refresh token opaque mới sau khi xoay vòng phiên
    example: "rt_opaque_token_example"

required:
  - accessToken
  - refreshToken
