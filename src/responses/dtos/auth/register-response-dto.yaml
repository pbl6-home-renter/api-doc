type: object
x-apidog-folder: "Auth/Response"
title: AuthRegisterResponseDto
description: Phản hồi khi đăng ký tài khoản thành công

properties:
  statusCode:
    type: integer
    description: Thông tin status code của tài nguyên trong ngữ cảnh DTO.
    enum:
      - 201
    example: 201

  code:
    type: string
    description: Mã ổn định để client nhận diện kết quả nghiệp vụ.
    enum:
      - REGISTERED
    example: "REGISTERED"

  data:
    type: object
    properties:
      id:
        type: string
        format: uuid
        description: ID tài khoản vừa được tạo
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

      role:
        type: string
        enum:
          - tenant
          - landlord
        description: Vai trò của tài khoản
        example: "tenant"

      status:
        type: string
        enum:
          - active
        description: Trạng thái ban đầu của tài khoản
        example: "active"

    required:
      - id
      - role
      - status

required:
  - statusCode
  - code
  - data
