type: object
x-apidog-folder: Auth/Response
title: AuthLoginResponseDto
description: Phản hồi khi đăng nhập thành công
properties:
  accessToken:
    type: string
    minLength: 1
    description: JWT access token, thời hạn 15 phút.
  refreshToken:
    type: string
    minLength: 1
    description: Token opaque Base64URL từ 32 byte ngẫu nhiên, được trả trong JSON.
  user:
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      name:
        type: string
      email:
        type: string
        format: email
      phone:
        type: string
      role:
        type: string
        enum:
        - landlord
        - tenant
        - admin
    required:
    - id
    - name
    - email
    - phone
    - role
required:
- accessToken
- refreshToken
- user
additionalProperties: false
