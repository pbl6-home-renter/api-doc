type: object
x-apidog-folder: "Auth/Response"
title: AuthLoginResponseDto
description: Phản hồi khi đăng nhập thành công

properties:
  statusCode:
    type: integer
    description: Thông tin status code của tài nguyên trong ngữ cảnh DTO.
    enum:
      - 200
    example: 200

  code:
    type: string
    description: Mã ổn định để client nhận diện kết quả nghiệp vụ.
    enum:
      - LOGGED_IN
    example: "LOGGED_IN"

  data:
    type: object
    properties:
      accessToken:
        type: string
        minLength: 1
        description: JWT access token dùng để truy cập các API được bảo vệ
        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

      expiresIn:
        type: integer
        enum:
          - 900
        description: Thời gian sống của access token tính bằng giây
        example: 900

    required:
      - accessToken
      - expiresIn

required:
  - statusCode
  - code
  - data
