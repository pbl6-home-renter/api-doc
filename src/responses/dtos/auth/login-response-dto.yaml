type: object
x-apidog-folder: "Auth/Response"
title: AuthLoginResponseDto
description: Phản hồi khi đăng nhập thành công

properties:
  accessToken:
    type: string
    minLength: 1
    description: JWT access token dùng để truy cập các API được bảo vệ
    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

  refreshToken:
    type: string
    minLength: 1
    description: Refresh token opaque dùng để làm mới phiên đăng nhập
    example: "rt_opaque_token_example"

  profile:
    $ref: '../../../openapi.yaml#/components/schemas/UserCurrentResponseDto'


required:
  - accessToken
  - refreshToken
  - profile
