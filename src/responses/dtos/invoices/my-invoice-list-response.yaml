type: object
x-apidog-folder: "Billing/Response"
title: MyInvoiceListResponse
description: Danh sách hóa đơn của tenant hiện tại
allOf:
  - $ref: '../../wrappers/success-list.yaml'
  - type: object
    properties:
      statusCode: { type: integer, enum: [200], example: 200 }
      code: { type: string, enum: [MY_INVOICES_FETCHED], example: MY_INVOICES_FETCHED }
      data:
        type: array
        items:
          type: object
          properties:
            id: { type: string, format: uuid }
            code: { type: string, minLength: 1, maxLength: 32 }
            contractId: { type: string, format: uuid }
            period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
            totalAmount: { type: integer, minimum: 0 }
            invoiceStatus: { type: string, enum: [pending, issued, void] }
            issuedAt: { type: string, format: date-time, nullable: true }
          required: [id, code, contractId, period, totalAmount, invoiceStatus, issuedAt]
      pagination:
        type: object
        properties:
          type: { type: string, enum: [offset], example: offset }
          pageNo: { type: integer, minimum: 1, example: 1 }
          pageSize: { type: integer, minimum: 1, maximum: 100, example: 20 }
          totalItems: { type: integer, minimum: 0, example: 1 }
          totalPages: { type: integer, minimum: 0, example: 1 }
          hasNextPage: { type: boolean, example: false }
          hasPreviousPage: { type: boolean, example: false }
        required: [type, pageNo, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
