type: object
title: InvoiceUpdateResponseDto
additionalProperties: false
properties:
  id:
    type: string
    format: uuid
  otherFees:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          type: string
          pattern: ^-?(0|[1-9]\d*)(\.\d{1,4})?$
      required:
      - name
      - amount
  note:
    type: string
    nullable: true
  totalAmount:
    type: string
    pattern: ^(0|[1-9]\d*)(\.\d{1,4})?$
required:
- id
- otherFees
- note
- totalAmount
