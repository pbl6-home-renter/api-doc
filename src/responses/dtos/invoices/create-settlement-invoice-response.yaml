          period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
          rentAmount: { type: integer, minimum: 0 }
          breakdown: { type: array, nullable: true, items: { type: object } }
          otherFees: { type: array, nullable: true, items: { type: object } }
          totalAmount: { type: integer, minimum: 0 }
          invoiceStatus: { type: string, enum: [pending], example: pending }
          issuedAt: { type: string, format: date-time, nullable: true }
        required: [id, code, contractId, period, rentAmount, breakdown, otherFees, totalAmount, invoiceStatus, issuedAt]
