type: object
x-apidog-folder: "Response/Billing"
title: CreateSettlementInvoiceResponse
description: Phản hồi khi tạo hóa đơn quyết toán
allOf:
  - $ref: '../../wrappers/success-single.yaml'
  - type: object
    properties:
      statusCode: { type: integer, enum: [201], example: 201 }
      code: { type: string, enum: [SETTLEMENT_INVOICE_CREATED], example: SETTLEMENT_INVOICE_CREATED }
      data:
        type: object
        properties:
          id: { type: string, format: uuid }
          code: { type: string, minLength: 1, maxLength: 32 }
