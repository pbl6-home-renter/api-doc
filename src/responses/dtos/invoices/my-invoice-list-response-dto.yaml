type: object
title: InvoiceMyListResponseDto
additionalProperties: false
properties:
  id: &id001
    type: string
    format: uuid
  code:
    type: string
  contractId: *id001
  roomName:
    type: string
  period:
    type: string
    pattern: ^\d{4}-(0[1-9]|1[0-2])$
  totalAmount:
    type: string
    pattern: ^(0|[1-9]\d*)(\.\d{1,4})?$
  issuedAt:
    type: string
    format: date-time
    nullable: true
  invoiceStatus:
    type: string
    enum:
    - issued
required:
- id
- code
- contractId
- roomName
- period
- totalAmount
- issuedAt
- invoiceStatus
