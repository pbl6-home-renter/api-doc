type: object
x-apidog-folder: "Invoice/Response"
title: InvoiceMyListResponseDto
description: Danh sách hóa đơn của tenant hiện tại
properties:
  data:
    type: array
    description: Dữ liệu kết quả của thao tác.
    items:
      type: object
      properties:
        id: { type: string, format: uuid , description: "Định danh duy nhất của tài nguyên." }
        code: { type: string, minLength: 1, maxLength: 32 , description: "Mã ổn định để client nhận diện kết quả nghiệp vụ." }
        contractId: { type: string, format: uuid , description: "Định danh duy nhất của hợp đồng liên quan." }
        period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', description: "Kỳ hóa đơn theo định dạng YYYY-MM." }
        totalAmount: { type: integer, minimum: 0 , description: "Thông tin total amount của tài nguyên trong ngữ cảnh DTO." }
        invoiceStatus: { type: string, enum: [pending, issued, void] , description: "Thông tin invoice status của tài nguyên trong ngữ cảnh DTO." }
        issuedAt: { type: string, format: date-time, nullable: true , description: "Thông tin issued at của tài nguyên trong ngữ cảnh DTO." }
      required: [id, code, contractId, period, totalAmount, invoiceStatus, issuedAt]
  pagination:
    type: object
    description: Thông tin phân trang của danh sách kết quả.
    properties:
      type: { type: string, enum: [offset], example: offset , description: "Thông tin type của tài nguyên trong ngữ cảnh DTO." }
      pageNo: { type: integer, minimum: 1, example: 1 , description: "Số trang hiện tại trong kết quả phân trang." }
      pageSize: { type: integer, minimum: 1, maximum: 100, example: 20 , description: "Số lượng phần tử tối đa trên một trang." }
      totalItems: { type: integer, minimum: 0, example: 1 , description: "Tổng số phần tử phù hợp với truy vấn." }
      totalPages: { type: integer, minimum: 0, example: 1 , description: "Tổng số trang có thể truy cập." }
      hasNextPage: { type: boolean, example: false , description: "Cho biết còn trang kế tiếp hay không." }
      hasPreviousPage: { type: boolean, example: false , description: "Cho biết có trang trước đó hay không." }
    required: [type, pageNo, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]

required:
  - data
  - pagination
