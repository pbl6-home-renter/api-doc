type: object
title: InvoiceIssueResponseDto
additionalProperties: false
properties:
  requested:
    type: integer
    minimum: 1
  succeeded:
    type: array
    items:
      type: object
      title: InvoiceIssueSucceeded
      additionalProperties: false
      properties:
        id: &id001
          type: string
          format: uuid
        code:
          type: string
        invoiceStatus:
          type: string
          enum:
          - issued
        issuedAt:
          type: string
          format: date-time
      required:
      - id
      - code
      - invoiceStatus
      - issuedAt
  failed:
    type: array
    items:
      type: object
      title: InvoiceIssueFailed
      additionalProperties: false
      properties:
        invoiceId: *id001
        code:
          type: string
      required:
      - invoiceId
      - code
required:
- requested
- succeeded
- failed
