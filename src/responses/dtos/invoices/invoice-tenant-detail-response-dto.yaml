type: object
title: InvoiceTenantDetailResponseDto
additionalProperties: false
properties:
  id: &id001
    type: string
    format: uuid
  code:
    type: string
  contractId: *id001
  roomId: *id001
  roomName:
    type: string
  tenantName:
    type: string
    nullable: true
  tenantPhone:
    type: string
    nullable: true
  period:
    type: string
    pattern: ^\d{4}-(0[1-9]|1[0-2])$
  rentAmount: &id002
    type: string
    pattern: ^(0|[1-9]\d*)(\.\d{1,4})?$
  breakdown:
    type: array
    items:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
        rateKind:
          type: string
        unitPrice:
          type: string
          nullable: true
        quantity:
          type: string
        unit:
          type: string
        serviceStart:
          type: string
          format: date
        serviceEnd:
          type: string
          format: date
        prorateRatio:
          type: string
        amount: *id002
        tierDetail:
          type: array
          items:
            type: object
            properties:
              step:
                type: integer
              from:
                type: integer
              to:
                type: integer
                nullable: true
              price: *id002
              quantity:
                type: string
              amount: *id002
      required:
      - type
      - name
      - rateKind
      - unitPrice
      - quantity
      - unit
      - serviceStart
      - serviceEnd
      - prorateRatio
      - amount
  otherFees:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          type: string
          pattern: ^-?(0|[1-9]\d*)(\.\d{1,4})?$
      required:
      - name
      - amount
  totalAmount: *id002
  invoiceStatus:
    type: string
    enum:
    - issued
  issuedAt:
    type: string
    format: date-time
    nullable: true
  voidedInvoiceId:
    type: string
    format: uuid
    nullable: true
  note:
    type: string
    nullable: true
description: Tenant detail contains only an issued invoice from a current contract.
required:
- id
- code
- contractId
- roomId
- roomName
- tenantName
- tenantPhone
- period
- rentAmount
- breakdown
- otherFees
- totalAmount
- invoiceStatus
- issuedAt
- voidedInvoiceId
- note
