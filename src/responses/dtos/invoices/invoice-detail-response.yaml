type: object
x-apidog-folder: "Invoice/Response"
title: InvoiceDetailResponseDto
description: Chi tiết hóa đơn và tổng hợp thanh toán
allOf:
  - $ref: '../../wrappers/success-single.yaml'
  - type: object
    properties:
      statusCode: { type: integer, enum: [200], example: 200 }
      code: { type: string, enum: [INVOICE_FETCHED], example: INVOICE_FETCHED }
      data:
        type: object
        properties:
          id: { type: string, format: uuid }
          code: { type: string, minLength: 1, maxLength: 32 }
          period: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
          rentAmount: { type: integer, minimum: 0 }
          breakdown: { type: array, nullable: true, items: { type: object } }
          otherFees: { type: array, nullable: true, items: { type: object } }
          totalAmount: { type: integer, minimum: 0 }
          invoiceStatus: { type: string, enum: [pending, issued, void] }
          issuedAt: { type: string, format: date-time, nullable: true }
          paidAmount: { type: integer, minimum: 0 }
          remainingAmount: { type: integer, minimum: 0 }
        required: [id, code, period, rentAmount, breakdown, otherFees, totalAmount, invoiceStatus, issuedAt, paidAmount, remainingAmount]
