  queued:
    type: array
    description: Thông tin queued của tài nguyên trong ngữ cảnh DTO.
    items:
      type: object
      properties:
        invoiceId: { type: string, format: uuid , description: "Thông tin invoice id của tài nguyên trong ngữ cảnh DTO." }
        sentCount: { type: integer, minimum: 0 , description: "Thông tin sent count của tài nguyên trong ngữ cảnh DTO." }
