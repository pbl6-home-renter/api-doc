type: object
title: InvoiceListResponseDto
additionalProperties: false
properties:
  id: &id001
    type: string
    format: uuid
  code:
    type: string
  contractId: *id001
  roomId: *id001
  roomName:
    type: string
  tenantName:
    type: string
    nullable: true
  tenantPhone:
    type: string
    nullable: true
  period:
    type: string
    pattern: ^\d{4}-(0[1-9]|1[0-2])$
  totalAmount:
    type: string
    pattern: ^(0|[1-9]\d*)(\.\d{1,4})?$
  invoiceStatus:
    type: string
    enum:
    - pending
    - issued
    - void
  issuedAt:
    type: string
    format: date-time
    nullable: true
required:
- id
- code
- contractId
- roomId
- roomName
- tenantName
- tenantPhone
- period
- totalAmount
- invoiceStatus
- issuedAt
