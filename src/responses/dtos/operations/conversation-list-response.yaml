type: object
x-apidog-folder: Chat
title: ConversationListResponse
description: Danh sách cuộc hội thoại
allOf:
  - $ref: '../../wrappers/success-list.yaml'
  - type: object
    properties:
      statusCode: { type: integer, enum: [200], example: 200 }
      code: { type: string, enum: [CONVERSATIONS_FETCHED], example: CONVERSATIONS_FETCHED }
      data:
        type: array
        items:
          type: object
          properties:
            id: { type: string, format: uuid }
            type: { type: string, enum: [room, building, direct] }
            title: { type: string, nullable: true, minLength: 1, maxLength: 255 }
            unreadCount: { type: integer, minimum: 0 }
          required: [id, type, title, unreadCount]
      pagination:
        type: object
        properties:
          type: { type: string, enum: [offset], example: offset }
          pageNo: { type: integer, minimum: 1, example: 1 }
          pageSize: { type: integer, minimum: 1, maximum: 100, example: 20 }
          totalItems: { type: integer, minimum: 0, example: 1 }
          totalPages: { type: integer, minimum: 0, example: 1 }
          hasNextPage: { type: boolean, example: false }
          hasPreviousPage: { type: boolean, example: false }
        required: [type, pageNo, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
