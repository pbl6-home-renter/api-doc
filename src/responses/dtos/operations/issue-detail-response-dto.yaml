type: object
x-apidog-folder: "IssueReport/Response"
title: IssueReportDetailResponseDto
description: Chi tiết toàn diện về báo cáo sự cố và tiến độ xử lý bảo trì

properties:
  id: { type: string, format: uuid, description: "Định danh duy nhất của báo cáo sự cố." }
  roomId: { type: string, format: uuid, description: "Định danh phòng liên quan." }
  roomName: { type: string, description: "Tên phòng trọ (VD: P.201)." }
  buildingId: { type: string, format: uuid, description: "Định danh tòa nhà." }
  buildingName: { type: string, description: "Tên tòa nhà." }
  reporterId: { type: string, format: uuid, nullable: true, description: "Định danh người phản ánh." }
  reporterName: { type: string, description: "Họ và tên người phản ánh." }
  reporterPhone: { type: string, description: "Số điện thoại người phản ánh." }
  title: { type: string, minLength: 1, maxLength: 255, description: "Tiêu đề sự cố." }
  category:
    type: string
    enum: [PLUMBING, ELECTRICAL, APPLIANCE, STRUCTURAL, SECURITY, OTHER]
    description: "Nhóm sự cố."
    example: "ELECTRICAL"
  urgency:
    type: string
    enum: [LOW, MEDIUM, HIGH, EMERGENCY]
    description: "Mức độ khẩn cấp."
    example: "MEDIUM"
  description: { type: string, nullable: true, minLength: 1, maxLength: 500, description: "Nội dung mô tả hư hỏng." }
  status:
    type: string
    enum: [open, in_progress, resolved, cancelled]
    description: "Trạng thái xử lý sự cố."
  issuePhotoMediaIds:
    type: array
    description: Danh sách ID tệp ảnh chụp hiện trường ban đầu
    items: { type: string, format: uuid }
  assignedTo: { type: string, nullable: true, description: "Tên hoặc thông tin thợ sửa chữa / bên bảo hành được phân công." }
  repairCost: { type: integer, minimum: 0, nullable: true, description: "Chi phí sửa chữa thực tế (VNĐ)." }
  resolutionNote: { type: string, nullable: true, maxLength: 500, description: "Ghi chú kết quả xử lý bảo trì của chủ nhà." }
  resolutionMediaUrls:
    type: array
    description: Danh sách ảnh chụp nghiệm thu sau khi sửa chữa xong
    items: { type: string, format: uri }
  createdAt: { type: string, format: date-time, description: "Thời điểm gửi báo cáo." }
  closedAt: { type: string, format: date-time, nullable: true, description: "Thời điểm đóng sự cố." }

required:
  - id
  - roomId
  - roomName
  - buildingName
  - reporterName
  - title
  - category
  - urgency
  - status
  - createdAt
