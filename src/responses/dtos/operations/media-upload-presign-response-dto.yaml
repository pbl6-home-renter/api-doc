type: object
x-apidog-folder: "Media/Response"
title: MediaPresignUploadResponseDto
description: Phản hồi cấp upload ticket cho Media

properties:
  id:
    type: string
    format: uuid
    description: ID Media được cấp upload ticket
    example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

  ownerType:
    type: string
    enum:
      - user
      - room
      - building
      - contract
      - contract_member
      - meter_reading
      - issue_report
      - message
    description: Loại thực thể sở hữu file
    example: room

  ownerId:
    type: string
    format: uuid
    description: ID của thực thể sở hữu file
    example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

  purpose:
    type: string
    enum:
      - avatar
      - cover_photo
      - gallery_photo
      - ownership_proof
      - cccd_front
      - cccd_back
      - contract_template
      - contract_signed
      - meter_reading_evidence
      - issue_photo
      - chat_attachment
    description: Mục đích sử dụng của file đối với thực thể sở hữu
    example: cover_photo

  uploadUrl:
    type: string
    format: uri
    description: "Presigned URL (Cloudflare R2, S3 API) để client `PUT` thân file (raw binary, không multipart) trực tiếp lên storage. Chỉ gửi đúng các header trong `requiredHeaders`, không gửi `Authorization`. Hết hạn sau `expiresIn` giây."
    example: https://account-id.r2.cloudflarestorage.com/rentify-media-public/room/3fa85f64-5717-4562-b3fc-2c963f66afa6/3fa85f64-5717-4562-b3fc-2c963f66afa6.jpg?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=900&X-Amz-SignedHeaders=content-type%3Bhost&X-Amz-Signature=abc123

  requiredHeaders:
    type: object
    description: "Header bắt buộc khi PUT lên `uploadUrl`. `Content-Type` được ký vào URL nên phải gửi đúng giá trị này, sai thì storage trả 403."
    properties:
      Content-Type:
        type: string
        enum:
          - image/jpeg
          - image/png
          - image/webp
          - application/pdf
        description: MIME type phải gửi khi upload
        example: image/jpeg
    required:
      - Content-Type

  expiresIn:
    type: integer
    minimum: 1
    description: "Thời gian `uploadUrl` và upload ticket có hiệu lực, tính bằng giây (cấu hình `MEDIA_UPLOAD_TTL_SECONDS`, mặc định 900). Quá hạn thì complete-upload trả `410 TICKET_EXPIRED`, phải presign lại."
    example: 900


required:
  - id
  - ownerType
  - ownerId
  - purpose
  - uploadUrl
  - requiredHeaders
  - expiresIn
