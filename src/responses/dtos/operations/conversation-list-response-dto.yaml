type: object
x-apidog-folder: "Conversation/Response"
title: ConversationListResponseDto
description: Hội thoại hiển thị trong danh sách của user hiện tại, theo thời điểm hoạt động mới nhất.
properties:
  id: { type: string, format: uuid }
  kind: { type: string, enum: [direct, group] }
  contextType: { type: string, nullable: true, enum: [contract, building, null] }
  contextId: { type: string, format: uuid, nullable: true }
  title: { type: string, nullable: true, maxLength: 255 }
  displayName:
    type: string
    nullable: true
    maxLength: 255
    description: Tên hiển thị theo người đang xem. Direct dùng `displayName` snapshot của người còn lại trên ConversationMember (không cập nhật khi người đó đổi tên hồ sơ); group dùng `title` đã lưu. `null` chỉ khi dữ liệu cũ không có title/thành viên còn lại.
  avatarMediaId: { type: string, format: uuid, nullable: true }
  avatarUrl:
    type: string
    nullable: true
    description: 'Ảnh để hiển thị theo người đang xem. Group: `/api/v1/media/{avatarMediaId}` (private, FE tải qua `GET /media/{mediaId}/download-url`), `null` nếu nhóm chưa có ảnh. Direct: URL công khai avatar hiện tại của người còn lại, `null` nếu người đó chưa có avatar hoặc Identity không phản hồi (best effort).'
  unreadCount: { type: integer, minimum: 0, description: 'Số tin text/image/video/file/bot chưa đọc của người khác gửi; không tính system, read-only chỉ tới leftSequence.' }
  lastMessage:
    type: object
    nullable: true
    properties:
      id: { type: string, format: uuid }
      sequence: { type: string, pattern: '^\d+$', example: '42', description: Bigint sequence dưới dạng chuỗi thập phân. }
      senderName: { type: string, maxLength: 254, description: Tên người gửi được snapshot lúc gửi tin. }
      contentPreview: { type: string, maxLength: 120, description: Nội dung rút gọn; ảnh hiển thị Đã gửi ảnh. }
      type: { type: string, enum: [text, image, video, file, system, bot] }
      sentAt: { type: string, format: date-time }
      payload:
        type: object
        nullable: true
        description: Payload phân biệt theo action của system message; FE dùng để dựng preview bản địa hóa.
        oneOf:
          - $ref: ../../../openapi.yaml#/components/schemas/ConversationMembersAddedPayload
          - $ref: ../../../openapi.yaml#/components/schemas/ConversationMemberKickedPayload
          - $ref: ../../../openapi.yaml#/components/schemas/ConversationMemberLeftPayload
          - $ref: ../../../openapi.yaml#/components/schemas/ConversationAdminTransferredPayload
          - $ref: ../../../openapi.yaml#/components/schemas/ConversationMemberRoleChangedPayload
          - $ref: ../../../openapi.yaml#/components/schemas/ConversationTitleChangedPayload
          - $ref: ../../../openapi.yaml#/components/schemas/ConversationAvatarChangedPayload
        discriminator:
          propertyName: action
    required: [id, sequence, senderName, contentPreview, type, sentAt, payload]
required: [id, kind, displayName, unreadCount]
