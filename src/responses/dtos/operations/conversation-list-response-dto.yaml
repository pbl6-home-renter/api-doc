type: object
x-apidog-folder: "Conversation/Response"
title: ConversationListResponseDto
description: Hội thoại hiển thị trong danh sách của user hiện tại, theo thời điểm hoạt động mới nhất.
properties:
  id: { type: string, format: uuid }
  kind: { type: string, enum: [direct, group] }
  contextType: { type: string, nullable: true, enum: [contract, building] }
  contextId: { type: string, format: uuid, nullable: true }
  title: { type: string, nullable: true, maxLength: 255 }
  avatarMediaId: { type: string, format: uuid, nullable: true }
  unreadCount: { type: integer, minimum: 0 }
  lastMessage:
    type: object
    nullable: true
    properties:
      id: { type: string, format: uuid }
      sequence: { type: integer, format: int64 }
      senderName: { type: string, maxLength: 254, description: Tên người gửi được snapshot lúc gửi tin. }
      contentPreview: { type: string, maxLength: 120, description: Nội dung rút gọn; ảnh hiển thị Đã gửi ảnh. }
      type: { type: string, enum: [text, image, system, bot] }
      sentAt: { type: string, format: date-time }
required: [id, kind, unreadCount]
