type: object
x-apidog-folder: Dashboard/Response
title: DashboardResponseDto
description: Admin-only snapshot of non-deleted Tenancy buildings and rooms.
additionalProperties: false
required:
- totalBuildings
- pendingApprovalBuildings
- rejectedBuildings
- totalRooms
- roomsByStatus
- occupancyRate
- generatedAt
properties:
  totalBuildings:
    type: integer
    minimum: 0
    description: Approved buildings that are not soft-deleted.
  pendingApprovalBuildings:
    type: integer
    minimum: 0
    description: Pending buildings that are not soft-deleted.
  rejectedBuildings:
    type: integer
    minimum: 0
    description: Rejected buildings that are not soft-deleted.
  totalRooms:
    type: integer
    minimum: 0
    description: Non-deleted rooms in non-deleted approved buildings.
  roomsByStatus:
    type: object
    additionalProperties: false
    description: Counts of the rooms included in totalRooms, grouped by status.
    required: [available, occupied, maintenance]
    properties:
      available: { type: integer, minimum: 0 }
      occupied: { type: integer, minimum: 0 }
      maintenance: { type: integer, minimum: 0 }
  occupancyRate:
    type: number
    minimum: 0
    maximum: 100
    description: Occupied rooms divided by totalRooms, times 100, rounded to one decimal; 0 when totalRooms is 0.
  generatedAt:
    type: string
    format: date-time
    description: ISO 8601 time when the server calculated this snapshot.
