type: object
x-apidog-folder: "Message/Response"
title: MessageListResponseDto
description: Danh sách tin nhắn theo cursor
properties:
  id: { type: string, format: uuid , description: "Định danh duy nhất của tài nguyên." }
  conversationId: { type: string, format: uuid , description: "Thông tin conversation id của tài nguyên trong ngữ cảnh DTO." }
  senderUserId: { type: string, format: uuid, nullable: true, description: "ID user gửi tin; null với system message." }
  senderName: { type: string, maxLength: 254 }
  senderAvatarUrl: { type: string, nullable: true, description: 'URL công khai avatar hiện tại của người gửi (lấy từ Identity lúc đọc); `null` với system message, user chưa có avatar hoặc khi Identity không phản hồi (best effort).' }
  senderType: { type: string, enum: [user, system] }
  sequence: { type: string, pattern: '^\d+$', example: '42', description: Bigint sequence dưới dạng chuỗi thập phân. }
  clientMessageId: { type: string, format: uuid, nullable: true, description: "ID retry do client tạo; null với system message." }
  type: { type: string, enum: [text, image, video, file, system, bot] }
  content: { type: string, nullable: true , description: "Thông tin content của tài nguyên trong ngữ cảnh DTO." }
  mediaId: { type: string, format: uuid, nullable: true }
  payload:
    type: object
    nullable: true
    description: Payload có discriminator `action` cho system message.
    oneOf:
      - $ref: ../../../openapi.yaml#/components/schemas/ConversationMembersAddedPayload
      - $ref: ../../../openapi.yaml#/components/schemas/ConversationMemberKickedPayload
      - $ref: ../../../openapi.yaml#/components/schemas/ConversationMemberLeftPayload
      - $ref: ../../../openapi.yaml#/components/schemas/ConversationAdminTransferredPayload
      - $ref: ../../../openapi.yaml#/components/schemas/ConversationMemberRoleChangedPayload
    discriminator:
      propertyName: action
  replyTo:
    type: object
    nullable: true
    description: Trích dẫn tin gốc nếu đây là tin trả lời; `null` nếu không.
    allOf:
      - $ref: ../../../openapi.yaml#/components/schemas/MessageReplyReference
  createdAt: { type: string, format: date-time , description: "Thời điểm bản ghi được tạo, theo định dạng ngày giờ ISO 8601." }
required: [id, conversationId, senderUserId, senderName, senderAvatarUrl, senderType, sequence, clientMessageId, type, content, mediaId, payload, replyTo, createdAt]
