type: object
x-apidog-folder: "Media/Response"
title: MediaCompleteUploadResponseDto
description: Phản hồi khi Media được xác minh và sẵn sàng đọc

properties:
  id:
    type: string
    format: uuid
    description: ID Media đã sẵn sàng
    example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

  ownerType:
    type: string
    enum:
      - user
      - room
      - building
      - contract
      - contract_member
      - meter_reading
      - issue_report
      - message
    description: Loại thực thể sở hữu file
    example: room

  ownerId:
    type: string
    format: uuid
    description: ID của thực thể sở hữu file
    example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

  purpose:
    type: string
    enum:
      - avatar
      - cover_photo
      - gallery_photo
      - ownership_proof
      - cccd_front
      - cccd_back
      - contract_template
      - contract_signed
      - meter_reading_evidence
      - issue_photo
      - chat_attachment
    description: Mục đích sử dụng của file đối với thực thể sở hữu
    example: cover_photo

  fileType:
    type: string
    enum:
      - image
      - document
      - video
      - other
    description: Loại định dạng tệp tin
    example: image

  url:
    type: string
    minLength: 1
    description: "URL đọc file. Purpose public (`avatar`, `cover_photo`, `gallery_photo`): URL tuyệt đối cố định trên R2 public bucket, dùng trực tiếp trong `<img src>`. Purpose private (còn lại): đường dẫn API tương đối `/api/v1/media/{mediaId}`, phải gọi `GET` kèm Bearer token."
    example: https://pub-xxxx.r2.dev/room/3fa85f64-5717-4562-b3fc-2c963f66afa6/3fa85f64-5717-4562-b3fc-2c963f66afa6.webp


required:
  - id
  - ownerType
  - ownerId
  - purpose
  - fileType
  - url
