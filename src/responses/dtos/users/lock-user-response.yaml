type: object
x-apidog-folder: "User/Response"
title: UserLockResponseDto
description: Phản hồi sau khi khóa tài khoản thành công

allOf:
  - $ref: '../../wrappers/success-single.yaml'

  - type: object
    properties:
      statusCode:
        type: integer
        enum:
          - 200
        example: 200

      code:
        type: string
        enum:
          - USER_LOCKED
        example: "USER_LOCKED"

      data:
        type: object
        properties:
          userId:
            type: string
            format: uuid

          status:
            type: string
            enum:
              - locked
            example: "locked"

          lockReason:
            type: string
            minLength: 1
            maxLength: 500
            example: "Spam listing"

          lockedAt:
            type: string
            format: date-time
            example: "2026-09-23T11:55:00.000Z"

        required:
          - userId
          - status
          - lockReason
          - lockedAt