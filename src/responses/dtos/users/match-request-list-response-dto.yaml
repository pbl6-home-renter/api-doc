type: object
x-apidog-folder: "MatchRequest/Response"
title: MatchRequestListResponseDto
description: Danh sách yêu cầu kết nối tìm bạn ở ghép giữa 2 khách thuê

properties:
  id: { type: string, format: uuid, description: "Định danh duy nhất của yêu cầu kết nối." }
  requesterId: { type: string, format: uuid, description: "Định danh người gửi yêu cầu ghép." }
  requester:
    type: object
    description: Thông tin tóm tắt người gửi yêu cầu
    properties:
      id: { type: string, format: uuid }
      name: { type: string, example: "Nguyễn Văn A" }
      avatarUrl: { type: string, format: uri, nullable: true }
      phone: { type: string, nullable: true }
      gender: { type: string, enum: [male, female, other] }
    required: [id, name, gender]
  targetId: { type: string, format: uuid, description: "Định danh người nhận yêu cầu ghép." }
  target:
    type: object
    description: Thông tin tóm tắt người nhận yêu cầu
    properties:
      id: { type: string, format: uuid }
      name: { type: string, example: "Trần Thị B" }
      avatarUrl: { type: string, format: uri, nullable: true }
      phone: { type: string, nullable: true }
      gender: { type: string, enum: [male, female, other] }
    required: [id, name, gender]
  matchScore: { type: integer, minimum: 0, maximum: 100, nullable: true, description: "Điểm tương thích AI giữa hai bên (0 - 100%)." }
  message: { type: string, nullable: true, maxLength: 500, description: "Lời nhắn gửi kèm khi mời ghép phòng." }
  status: { type: string, enum: [pending, accepted, rejected, withdrawn], description: "Trạng thái yêu cầu ghép phòng." }
  createdAt: { type: string, format: date-time, description: "Thời điểm gửi yêu cầu." }

required:
  - id
  - requesterId
  - requester
  - targetId
  - target
  - status
  - createdAt
