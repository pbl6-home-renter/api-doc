type: object
x-apidog-folder: "Notification/Response"
title: NotificationListResponseDto
description: Notification business đã lưu cho recipient, không chứa message chat.
properties:
  id: { type: string, format: uuid }
  recipientUserId: { type: string, format: uuid }
  sourceService: { type: string }
  eventId: { type: string, format: uuid }
  type: { type: string, enum: [invoice, issue, system], description: "system dùng cho notification building/account/contract, gồm account lock/unlock và các thông báo nghiệp vụ hợp đồng." }
  title:
    type: string
    maxLength: 255
    description: "Account notice từ Identity giữ mã USER_ACCOUNT_LOCKED_TITLE hoặc USER_ACCOUNT_UNLOCKED_TITLE; Web dịch theo data.messageKey. P13-01 không phát thông báo hợp đồng do khóa/mở khóa; thông báo cũ vẫn được giữ. Các notice khác hoặc notice cũ có thể chứa nội dung văn bản."
  body:
    type: string
    maxLength: 2000
    description: "Account notice từ Identity giữ mã USER_ACCOUNT_LOCKED_BODY hoặc USER_ACCOUNT_UNLOCKED_BODY; Web dịch theo data.messageKey. P13-01 không phát thông báo hợp đồng do khóa/mở khóa; thông báo cũ vẫn được giữ. Các notice khác hoặc notice cũ có thể chứa nội dung văn bản."
  deepLink: { type: string, nullable: true }
  data:
    type: object
    nullable: true
    additionalProperties: true
    description: >-
      Snapshot tùy theo producer. Với P9-06, account notice từ identity chứa
      { messageKey, userId, status, eventType, lockedAt }; messageKey là
      user.locked hoặc user.unlocked, unlock có lockedAt = null.
      P13-01 no longer emits contract lock notifications. Existing notification data
      remains a historical snapshot and is not rewritten. IDs are UUIDs and non-null
      timestamps use ISO 8601 UTC. Account notice snapshots do not include phone.
  createdAt: { type: string, format: date-time }
  readAt: { type: string, format: date-time, nullable: true }
required: [id, recipientUserId, sourceService, eventId, type, title, body, createdAt, readAt]
