type: object
x-apidog-folder: "User/Response"
title: UserLockResponseDto
description: Phản hồi sau khi khóa tài khoản thành công

properties:
  userId:
    type: string
    description: Định danh duy nhất của người dùng liên quan.
    format: uuid

  status:
    type: string
    description: Trạng thái hiện tại của tài nguyên trong quy trình nghiệp vụ.
    enum:
      - locked
    example: "locked"

  lockReason:
    type: string
    description: Thông tin lock reason của tài nguyên trong ngữ cảnh DTO.
    minLength: 1
    maxLength: 500
    example: "Spam listing"

  lockedAt:
    type: string
    description: Thông tin locked at của tài nguyên trong ngữ cảnh DTO.
    format: date-time
    example: "2026-09-23T11:55:00.000Z"


required:
  - userId
  - status
  - lockReason
  - lockedAt
