type: object
x-apidog-folder: User/Response
title: UserDetailResponseDto
description: Phản hồi chi tiết một người dùng dành cho admin quản trị tài khoản
properties:
  id:
    type: string
    format: uuid
    description: Định danh duy nhất của người dùng.
    example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
  name:
    type: string
    description: Họ và tên người dùng.
    example: Lê Văn An
  email:
    type: string
    format: email
  phone:
    type: string
    description: Số điện thoại người dùng.
    example: '0901234567'
  role:
    type: string
    enum:
    - tenant
    - landlord
    - admin
    description: Vai trò người dùng (bất biến).
    example: landlord
  status:
    type: string
    enum:
    - active
    - locked
    description: Trạng thái tài khoản.
    example: active
  lockReason:
    type: string
    nullable: true
    description: Lý do bị khóa tài khoản (nếu status = locked).
    example: null
  lockedAt:
    type: string
    format: date-time
    nullable: true
    description: Thời điểm bị khóa tài khoản.
    example: null
  payoutAccount:
    type: object
    nullable: true
    description: 'Tài khoản nhận tiền của landlord. Tenant và admin nhận null. accountNumber được mask khi trả về
      client.

      '
    properties:
      bankCode:
        type: string
        description: Thông tin bank code của tài nguyên trong ngữ cảnh DTO.
        minLength: 4
        maxLength: 20
        example: '970415'
      accountNumber:
        type: string
        description: Số tài khoản đã được mask
        example: '**43210'
      accountName:
        type: string
        description: Thông tin account name của tài nguyên trong ngữ cảnh DTO.
        minLength: 1
        maxLength: 254
        example: NGUYEN VAN AN
    required:
    - bankCode
    - accountNumber
    - accountName
  buildingCount:
    type: integer
    minimum: 0
    description: Số lượng tòa nhà thuộc sở hữu (nếu là landlord).
    example: 2
  activeContractCount:
    type: integer
    minimum: 0
    description: Số lượng hợp đồng đang có hiệu lực.
    example: 1
required:
- id
- name
- email
- phone
- role
- status
- lockReason
- lockedAt
- payoutAccount
- buildingCount
- activeContractCount
additionalProperties: false
