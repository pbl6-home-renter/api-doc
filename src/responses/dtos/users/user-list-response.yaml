type: object
x-apidog-folder: User
title: UserListResponse
description: Danh sách người dùng dành cho admin với offset pagination

allOf:
  - $ref: '../../wrappers/success-list.yaml'

  - type: object
    properties:
      statusCode:
        type: integer
        enum:
          - 200
        example: 200

      code:
        type: string
        enum:
          - USERS_FETCHED
        example: "USERS_FETCHED"

      data:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              format: uuid

            name:
              type: string
              example: "Lê Văn An"

            role:
              type: string
              enum:
                - tenant
                - landlord
                - admin
              example: "tenant"

            status:
              type: string
              enum:
                - active
                - locked
              example: "active"

          required:
            - id
            - name
            - role
            - status

      pagination:
        type: object
        properties:
          type:
            type: string
            enum:
              - offset
            example: "offset"

          pageNo:
            type: integer
            minimum: 1
            example: 1

          pageSize:
            type: integer
            minimum: 1
            maximum: 100
            example: 20

          totalItems:
            type: integer
            minimum: 0
            example: 1

          totalPages:
            type: integer
            minimum: 0
            example: 1

          hasNextPage:
            type: boolean
            example: false

          hasPreviousPage:
            type: boolean
            example: false

        required:
          - type
          - pageNo
          - pageSize
          - totalItems
          - totalPages
          - hasNextPage
          - hasPreviousPage