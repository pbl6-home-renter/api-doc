type: object
x-apidog-folder: User/Response
title: UserListResponseDto
description: Danh sách người dùng dành cho admin quản trị tài khoản
properties:
  id:
    type: string
    format: uuid
    description: Định danh duy nhất của người dùng.
    example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
  name:
    type: string
    description: Họ và tên người dùng.
    example: Lê Văn An
  email:
    type: string
    format: email
  phone:
    type: string
    description: Số điện thoại người dùng.
    example: '0901234567'
  role:
    type: string
    enum:
    - tenant
    - landlord
    - admin
    description: Vai trò người dùng (bất biến, không thể thay đổi sau khi đăng ký).
    example: tenant
  status:
    type: string
    enum:
    - pending_verification
    - active
    - locked
    description: 'Trạng thái tài khoản (pending_verification: chưa xác minh email, active: bình thường, locked: bị khóa bởi admin).'
    example: active
  avatarUrl:
    type: string
    nullable: true
    description: URL công khai của avatar hiện tại (Identity, media `purpose=avatar`); `null` nếu user chưa có avatar.
    example: 'https://media.example.com/avatars/3fa85f64.jpg'
required:
- id
- name
- email
- phone
- role
- status
- avatarUrl
additionalProperties: false
