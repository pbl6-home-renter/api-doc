type: object
x-apidog-folder: "User/Response"
title: UserUnlockResponseDto
description: Phản hồi sau khi mở khóa tài khoản thành công

properties:
  userId:
    type: string
    description: Định danh duy nhất của người dùng liên quan.
    format: uuid
    example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

  status:
    type: string
    description: Trạng thái hiện tại của tài nguyên trong quy trình nghiệp vụ.
    enum:
      - active
    example: "active"

  unlockedAt:
    type: string
    format: date-time
    description: Thời điểm tài khoản được admin mở khóa thành công.
    example: "2026-09-29T14:30:00Z"

required:
  - userId
  - status
  - unlockedAt
