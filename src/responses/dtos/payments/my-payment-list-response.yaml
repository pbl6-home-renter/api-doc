type: object
x-apidog-folder: "Response/Billing"
title: MyPaymentListResponse
description: Danh sách thanh toán của người dùng hiện tại
allOf:
  - $ref: '../../wrappers/success-list.yaml'
  - type: object
    properties:
      statusCode: { type: integer, enum: [200], example: 200 }
      code: { type: string, enum: [MY_PAYMENTS_FETCHED], example: MY_PAYMENTS_FETCHED }
      data:
        type: array
        items:
          type: object
          properties:
            id: { type: string, format: uuid }
            invoiceId: { type: string, format: uuid, nullable: true }
            method: { type: string, enum: [vietqr, vnpay, momo, cash, mock] }
            paymentStatus: { type: string, enum: [pending, success, failed] }
            amount: { type: integer, minimum: 0 }
            transactionId: { type: string, nullable: true, minLength: 1, maxLength: 255 }
          required: [id, invoiceId, method, paymentStatus, amount, transactionId]
      pagination:
        type: object
        properties:
          type: { type: string, enum: [offset], example: offset }
          pageNo: { type: integer, minimum: 1, example: 1 }
          pageSize: { type: integer, minimum: 1, maximum: 100, example: 20 }
          totalItems: { type: integer, minimum: 0, example: 1 }
          totalPages: { type: integer, minimum: 0, example: 1 }
          hasNextPage: { type: boolean, example: false }
          hasPreviousPage: { type: boolean, example: false }
        required: [type, pageNo, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
