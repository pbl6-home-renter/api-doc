type: object
x-apidog-folder: "Payment/Response"
title: PaymentRecordCashResponseDto
description: Phản hồi khi ghi nhận thanh toán tiền mặt
allOf:
  - $ref: '../../wrappers/success-single.yaml'
  - type: object
    properties:
      statusCode: { type: integer, enum: [201], example: 201 }
      code: { type: string, enum: [CASH_PAYMENT_RECORDED], example: CASH_PAYMENT_RECORDED }
      data:
        type: object
        properties:
          paymentId: { type: string, format: uuid }
          invoiceId: { type: string, format: uuid }
          paymentStatus: { type: string, enum: [success], example: success }
          amount: { type: integer, minimum: 0 }
          invoiceStatus: { type: string, enum: [pending, issued, void] }
          paidAmount: { type: integer, minimum: 0 }
          remainingAmount: { type: integer, minimum: 0 }
          paymentState: { type: string, example: paid }
        required: [paymentId, invoiceId, paymentStatus, amount, invoiceStatus, paidAmount, remainingAmount, paymentState]
