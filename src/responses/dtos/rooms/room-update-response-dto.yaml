type: object
x-apidog-folder: "Room/Response"
title: RoomUpdateResponseDto
description: Phản hồi khi cập nhật phòng thành công

properties:
  id: { type: string, format: uuid , description: "Định danh duy nhất của tài nguyên." }
  name: { type: string , description: "Thông tin name của tài nguyên trong ngữ cảnh DTO." }
  floorNumber: { type: integer, nullable: true }
  description: { type: string, nullable: true }
  area: { type: number, nullable: true }
  amenities:
    type: object
    additionalProperties: false
    properties:
      aircon: { type: boolean }
      fridge: { type: boolean }
      wcInside: { type: boolean }
      waterHeater: { type: boolean }
      mezzanine: { type: boolean }
      table: { type: boolean }
      chair: { type: boolean }
  maxOccupancy: { type: integer, nullable: true }
  genderPolicy: { type: string, enum: [any, male, female] }
  rentPrice: { type: number, minimum: 0 }

required:
  - id
  - name
  - floorNumber
  - description
  - area
  - amenities
  - maxOccupancy
  - genderPolicy
  - rentPrice
