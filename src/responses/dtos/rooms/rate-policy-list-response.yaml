type: object
x-apidog-folder: "Billing/Response"
title: RatePolicyListResponse
description: Danh sách chính sách đơn giá

allOf:
  - $ref: '../../wrappers/success-list.yaml'
  - type: object
    properties:
      statusCode: { type: integer, enum: [200], example: 200 }
      code: { type: string, enum: [RATE_POLICIES_FETCHED], example: RATE_POLICIES_FETCHED }
      data:
        type: array
        items:
          type: object
          properties:
            id: { type: string, format: uuid }
            landlordId: { type: string, format: uuid }
            scope: { type: string, enum: [building, room] }
            roomId: { type: string, format: uuid, nullable: true }
            type: { type: string, enum: [electricity, water, wifi, cleaning, parking, maintenance, other] }
            rateKind: { type: string, enum: [flat, tiered, fixed_per_period, per_head, per_area_m2, per_vehicle] }
            isActive: { type: boolean }
          required: [id, landlordId, scope, roomId, type, rateKind, isActive]
      pagination:
        type: object
        properties:
          type: { type: string, enum: [offset], example: offset }
          pageNo: { type: integer, minimum: 1, example: 1 }
          pageSize: { type: integer, minimum: 1, maximum: 100, example: 20 }
          totalItems: { type: integer, minimum: 0, example: 1 }
          totalPages: { type: integer, minimum: 0, example: 1 }
          hasNextPage: { type: boolean, example: false }
          hasPreviousPage: { type: boolean, example: false }
        required: [type, pageNo, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
