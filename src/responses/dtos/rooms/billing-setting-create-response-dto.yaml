description: Cấu hình ngày thu dự kiến và nhắc nộp theo scope building hoặc room.
additionalProperties: false
properties:
  id:
    type: string
    format: uuid
  landlordId:
    type: string
    format: uuid
  scope:
    type: string
    enum: [building, room]
  buildingId:
    type: string
    format: uuid
    description: ID tòa nhà của setting; với scope room, server lấy từ Room.
  roomId:
    type: string
    format: uuid
    nullable: true
  paymentDueDay:
    type: integer
    minimum: 1
    maximum: 28
  remindDay:
    type: integer
    minimum: 1
    maximum: 28
    nullable: true
  botEnabled:
    type: boolean
  isActive:
    type: boolean
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
required: [id, landlordId, scope, buildingId, roomId, paymentDueDay, remindDay, botEnabled, isActive, createdAt, updatedAt]
