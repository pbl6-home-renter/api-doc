type: object
x-apidog-folder: "MeterReading/Response"
title: MeterReadingListResponseDto
description: Danh sách chỉ số công tơ
properties:
  id: { type: string, format: uuid , description: "Định danh duy nhất của tài nguyên." }
  roomId: { type: string, format: uuid , description: "Định danh duy nhất của phòng liên quan." }
  type: { type: string, enum: [electricity, water] , description: "Thông tin type của tài nguyên trong ngữ cảnh DTO." }
  period: { type: string, minLength: 7, maxLength: 7, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', description: "Kỳ ghi chỉ số theo định dạng YYYY-MM." }
  previousReading: { type: string , description: "Thông tin previous reading của tài nguyên trong ngữ cảnh DTO." }
  currentReading: { type: string , description: "Thông tin current reading của tài nguyên trong ngữ cảnh DTO." }
  readingDate: { type: string, format: date, nullable: true , description: "Thông tin reading date của tài nguyên trong ngữ cảnh DTO." }
  isBaseline: { type: boolean , description: "Thông tin is baseline của tài nguyên trong ngữ cảnh DTO." }
required: [id, roomId, type, period, previousReading, currentReading, readingDate, isBaseline]
