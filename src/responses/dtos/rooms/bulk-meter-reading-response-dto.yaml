type: object
x-apidog-folder: "MeterReading/Response"
title: BulkMeterReadingResponseDto
description: Phản hồi tổng hợp các chỉ số đã ghi thành công trong một request bulk và lượng tiêu thụ tương ứng. Một dòng không hợp lệ làm cả request thất bại, không trả kết quả từng dòng lỗi trong response thành công.

properties:
  buildingId:
    type: string
    format: uuid
    description: Định danh tòa nhà
    example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
  buildingName:
    type: string
    description: Tên tòa nhà
    example: "Nhà trọ Thanh Xuân"
  recordedMonth:
    type: string
    description: Kỳ chốt chỉ số (YYYY-MM)
    example: "2026-09"
  totalRoomsRecorded:
    type: integer
    minimum: 0
    description: Số roomId khác nhau có chỉ số được ghi thành công trong request này; không nhất thiết là toàn bộ phòng của tòa hoặc đã đủ cả điện và nước.
    example: 12
  totalElectricityUsage:
    type: string
    description: Tổng lượng điện tiêu thụ toàn tòa nhà trong kỳ (kWh)
    example: "1520.5"
  totalWaterUsage:
    type: string
    description: Tổng lượng nước tiêu thụ toàn tòa nhà trong kỳ (m3)
    example: "145.0"
  results:
    type: array
    description: Kết quả ghi nhận chi tiết theo từng phòng
    items:
      type: object
      properties:
        roomId:
          type: string
          format: uuid
          description: Định danh phòng
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        roomName:
          type: string
          description: Tên phòng
          example: "P.201"
        electricityReadingId:
          type: string
          format: uuid
          nullable: true
          description: ID bản ghi số điện
        electricityUsage:
          type: string
          nullable: true
          description: Lượng điện tiêu thụ (kWh)
          example: "130.5"
        waterReadingId:
          type: string
          format: uuid
          nullable: true
          description: ID bản ghi số nước
        waterUsage:
          type: string
          nullable: true
          description: Lượng nước tiêu thụ (m3)
          example: "12.0"
        status:
          type: string
          enum: [SUCCESS]
          description: Chỉ có SUCCESS trong response 201; lỗi trả HTTP error và rollback toàn bộ request.
          example: "SUCCESS"
        note:
          type: string
          nullable: true
          description: Ghi chú tùy chọn của kết quả thành công.
      required:
        - roomId
        - roomName
        - status

required:
  - buildingId
  - buildingName
  - recordedMonth
  - totalRoomsRecorded
  - totalElectricityUsage
  - totalWaterUsage
  - results
