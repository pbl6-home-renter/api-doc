type: object
x-apidog-folder: "MeterReading/Response"
title: MeterReadingListResponseDto
description: Danh sách chỉ số công tơ
allOf:
  - $ref: '../../wrappers/success-list.yaml'
  - type: object
    properties:
      statusCode: { type: integer, enum: [200], example: 200 }
      code: { type: string, enum: [METER_READINGS_FETCHED], example: METER_READINGS_FETCHED }
      data:
        type: array
        items:
          type: object
          properties:
            id: { type: string, format: uuid }
            roomId: { type: string, format: uuid }
            type: { type: string, enum: [electricity, water] }
            period: { type: string, minLength: 7, maxLength: 7, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
            previousReading: { type: string }
            currentReading: { type: string }
            readingDate: { type: string, format: date, nullable: true }
            isBaseline: { type: boolean }
          required: [id, roomId, type, period, previousReading, currentReading, readingDate, isBaseline]
      pagination:
        type: object
        properties:
          type: { type: string, enum: [offset], example: offset }
          pageNo: { type: integer, minimum: 1, example: 1 }
          pageSize: { type: integer, minimum: 1, maximum: 100, example: 20 }
          totalItems: { type: integer, minimum: 0, example: 1 }
          totalPages: { type: integer, minimum: 0, example: 1 }
          hasNextPage: { type: boolean, example: false }
          hasPreviousPage: { type: boolean, example: false }
        required: [type, pageNo, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
