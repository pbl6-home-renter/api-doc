type: object
x-apidog-folder: "Response/Property"
title: PublicRoomListResponse
description: Danh sách phòng công khai

allOf:
  - $ref: '../../wrappers/success-list.yaml'
  - type: object
    properties:
      statusCode: { type: integer, enum: [200], example: 200 }
      code: { type: string, enum: [ROOMS_FETCHED], example: ROOMS_FETCHED }
      data:
        type: array
        items:
          type: object
          properties:
            id: { type: string, format: uuid }
            buildingId: { type: string, format: uuid }
            name: { type: string, minLength: 1, maxLength: 254 }
            area: { type: string, example: '18.5' }
            rentPrice: { type: integer, minimum: 0 }
            genderPolicy: { type: string, enum: [any, male, female] }
          required: [id, buildingId, name, area, rentPrice, genderPolicy]
      pagination:
        type: object
        properties:
          type: { type: string, enum: [offset], example: offset }
          pageNo: { type: integer, minimum: 1, example: 1 }
          pageSize: { type: integer, minimum: 1, maximum: 100, example: 20 }
          totalItems: { type: integer, minimum: 0, example: 1 }
          totalPages: { type: integer, minimum: 0, example: 1 }
          hasNextPage: { type: boolean, example: false }
          hasPreviousPage: { type: boolean, example: false }
        required: [type, pageNo, pageSize, totalItems, totalPages, hasNextPage, hasPreviousPage]
