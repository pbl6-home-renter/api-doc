openapi: 3.0.3
info:
  title: PBL6 Home Renter API Specification
  description: >
    Tài liệu đặc tả hợp đồng API cho dự án PBL6 (Hệ thống quản lý nhà trọ và tìm bạn ở ghép).
    Được đồng bộ trực tiếp với Apidog từ Git repository theo kiến trúc modular component.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1
    description: Môi trường phát triển cục bộ (Local Development)

tags:
  - name: Auth
    description: Quản lý xác thực và phiên làm việc
  - name: User
    description: Hồ sơ người dùng, phân quyền và quản trị
  - name: Property
    description: Tòa nhà, phòng trọ và phòng yêu thích
  - name: Contract
    description: Hợp đồng thuê phòng và thành viên ở cùng
  - name: Billing
    description: Chính sách giá, chỉ số công tơ, hóa đơn và thanh toán
  - name: Operation
    description: Báo cáo sự cố, tệp tin phương tiện và nhật ký kiểm toán
  - name: Chat
    description: Hội thoại trao đổi theo phòng, tòa nhà và tin nhắn
  - name: Matching
    description: Hồ sơ roommate và yêu cầu kết nối ở ghép
  - name: Notification
    description: Thông báo người dùng và thiết bị push FCM

