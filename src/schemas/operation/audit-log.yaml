type: object
x-apidog-folder: AuditLog
title: AuditLog
description: Nhật ký thao tác admin, chỉ đọc và giữ vĩnh viễn. Actor đã xóa hoặc không
  tồn tại có actorName null; giữ actorId đã lưu.
additionalProperties: false
required:
- id
- actorId
- actorName
- action
- entityType
- entityId
- sourceService
- createdAt
- metadata
properties:
  id:
    type: string
    format: uuid
  actorId:
    type: string
    format: uuid
    nullable: true
  actorName:
    type: string
    nullable: true
  action:
    type: string
    enum:
    - user.locked
    - user.unlocked
    - user.updated
    - user.deleted
    - building.approved
    - building.rejected
  entityType:
    type: string
    enum:
    - user
    - building
  entityId:
    type: string
    format: uuid
    nullable: true
  sourceService:
    type: string
    enum:
    - identity
    - tenancy
  createdAt:
    type: string
    format: date-time
    description: Thời điểm lưu audit (UTC).
  metadata:
    type: object
    additionalProperties: true
    description: Metadata theo allowlist của action; không chứa beforeData/afterData
      hoặc giá trị cũ/mới.
    example:
      lockReason: Spam
