type: object
x-apidog-folder: Property
title: Building
description: Tòa nhà / khu nhà trọ cho thuê do chủ nhà đăng ký
allOf:
  - $ref: '../../common/base-entity.yaml'
  - type: object
    properties:
      landlordId:
        type: string
        format: uuid
        description: ID chủ nhà sở hữu tòa nhà
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      name:
        type: string
        minLength: 1
        maxLength: 254
        description: Tên tòa nhà
        example: "Nhà trọ Thanh Xuân"
      province:
        type: string
        minLength: 1
        maxLength: 100
        description: Tỉnh / Thành phố
        example: "Thành phố Hồ Chí Minh"
      ward:
        type: string
        minLength: 1
        maxLength: 100
        description: Phường / Xã / Thị trấn
        example: "Phường Bến Nghé"
      address:
        type: string
        minLength: 1
        maxLength: 254
        description: Địa chỉ chi tiết (số nhà, ngõ ngách, tên đường)
        example: "12 Nguyễn Trãi"
      latitude:
        type: number
        minimum: -90
        maximum: 90
        description: Tọa độ vĩ độ (geocode tự động)
        example: 20.995100
      longitude:
        type: number
        minimum: -180
        maximum: 180
        description: Tọa độ kinh độ (geocode tự động)
        example: 105.816649
      status:
        type: string
        enum: [pending, approved, rejected]
        default: pending
        description: Trạng thái duyệt tòa nhà của admin
        example: "pending"
      reviewedBy:
        type: string
        format: uuid
        nullable: true
        description: ID admin duyệt hoặc từ chối tòa nhà
        example: null
      reviewedAt:
        type: string
        format: date-time
        nullable: true
        description: Thời điểm admin duyệt hoặc từ chối
        example: null
      note:
        type: string
        nullable: true
        minLength: 1
        maxLength: 500
        description: Ghi chú lý do từ chối của admin
        example: null
    required:
      - landlordId
      - name
      - province
      - ward
      - address
      - latitude
      - longitude
      - status
