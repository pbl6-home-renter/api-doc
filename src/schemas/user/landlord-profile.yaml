type: object
x-apidog-folder: "User/Entity"
title: LandlordProfile
description: Hồ sơ chủ nhà (1-1 với User role landlord), chứa thông tin nhận tiền VietQR
allOf:
  - $ref: '../../common/base-entity.yaml'
  - type: object
    properties:
      userId:
        type: string
        format: uuid
        description: ID người dùng chủ nhà
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      bankCode:
        type: string
        nullable: true
        minLength: 4
        maxLength: 20
        description: Mã ngân hàng theo danh mục VietQR (vd 970436)
        example: "970436"
      accountNumber:
        type: string
        nullable: true
        pattern: '^[0-9]{6,20}$'
        description: Số tài khoản nhận tiền (sandbox/thật)
        example: "1234567890"
      accountName:
        type: string
        nullable: true
        minLength: 1
        maxLength: 254
        description: Tên chủ tài khoản viết không dấu
        example: "LEVANAN"
    required:
      - userId
