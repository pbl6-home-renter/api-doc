type: "object"
x-apidog-folder: "Moderation/Response"
title: "ReportAdminDetailResponseDto"
description: "Chi tiết báo cáo cho admin."
additionalProperties: false
required:
  - "id"
  - "reporter"
  - "reportedUser"
  - "category"
  - "description"
  - "evidenceCount"
  - "status"
  - "createdAt"
  - "resolvedAt"
  - "evidenceMediaIds"
  - "contextType"
  - "contextId"
  - "resolutionNote"
  - "resolvedBy"
properties:
  id:
    type: "string"
    format: "uuid"
  reporter:
    $ref: "../../openapi.yaml#/components/schemas/ModerationUserSummaryDto"
  reportedUser:
    $ref: "../../openapi.yaml#/components/schemas/ModerationUserSummaryDto"
  category:
    type: "string"
    enum:
      - "fraud"
      - "fake_listing"
      - "harassment"
      - "spam"
      - "impersonation"
      - "inappropriate_content"
      - "other"
    description: "6 loại gợi ý lý do khóa của P13-09 và `other`."
  description:
    type: "string"
  evidenceCount:
    type: "integer"
    minimum: 0
  status:
    type: "string"
    enum:
      - "pending"
      - "dismissed"
      - "actioned"
  createdAt:
    type: "string"
    format: "date-time"
  resolvedAt:
    type: "string"
    format: "date-time"
    nullable: true
  evidenceMediaIds:
    type: "array"
    items:
      type: "string"
      format: "uuid"
  contextType:
    type: "string"
    enum:
      - "conversation"
      - "contract"
    nullable: true
  contextId:
    type: "string"
    format: "uuid"
    nullable: true
  resolutionNote:
    type: "string"
    nullable: true
  resolvedBy:
    type: "object"
    allOf:
      - $ref: "../../openapi.yaml#/components/schemas/ModerationUserSummaryDto"
    nullable: true
