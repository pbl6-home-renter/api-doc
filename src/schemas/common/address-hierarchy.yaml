type: object
title: AddressHierarchy
properties:
  province:
    type: string
    example: "Thành phố Hồ Chí Minh"
  district:
    type: string
    example: "Quận 1"
  ward:
    type: string
    example: "Phường Bến Nghé"
  address:
    type: string
    example: "12 Nguyễn Trãi"
  latitude:
    type: number
    nullable: true
    example: 10.776889
  longitude:
    type: number
    nullable: true
    example: 106.700806