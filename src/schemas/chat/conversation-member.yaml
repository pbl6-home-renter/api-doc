type: object
x-apidog-folder: "ConversationMember"
title: ConversationMember
description: Thành viên tham gia cuộc trò chuyện
allOf:
  - $ref: '../../common/base-entity.yaml'
  - type: object
    properties:
      conversationId:
        type: string
        format: uuid
        description: ID cuộc hội thoại
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      userId:
        type: string
        format: uuid
        nullable: true
        description: ID người dùng tham gia
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      displayName:
        type: string
        maxLength: 254
        description: Tên hiển thị được snapshot khi thêm thành viên.
      participantType:
        type: string
        enum: [user, system]
        description: Phân biệt user với participant hệ thống như bot.
      role:
        type: string
        enum: [admin, member, system]
      status:
        type: string
        enum: [active, read_only]
      joinedAt:
        type: string
        format: date-time
        description: Thời điểm bắt đầu tham gia nhóm chat
        example: "2026-09-01T10:05:00Z"
      leftAt:
        type: string
        format: date-time
        nullable: true
        description: Thời điểm rời hoặc bị xóa khỏi hội thoại.
        example: null
      leftSequence:
        type: string
        pattern: '^\d+$'
        nullable: true
        description: Tin cuối được phép đọc khi membership ở trạng thái read_only.
      lastReadSequence:
        type: string
        pattern: '^\d+$'
        example: '12'
        description: Sequence cuối đã đọc; unread tính từ sequence kế tiếp.
    required:
      - conversationId
      - displayName
      - participantType
      - role
      - status
      - joinedAt
