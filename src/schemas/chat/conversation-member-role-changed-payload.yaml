title: ConversationMemberRoleChangedPayload
type: object
additionalProperties: false
required: [action, actorUserId, actorDisplayName, member, oldRole, newRole]
properties:
  action:
    type: string
    enum: [member_role_changed]
  actorUserId:
    type: string
    format: uuid
    description: User admin thực hiện thay đổi vai trò.
  actorDisplayName:
    type: string
    maxLength: 254
    description: Snapshot tên hiển thị của người thực hiện thao tác.
  member:
    type: object
    additionalProperties: false
    required: [userId, displayName]
    properties:
      userId:
        type: string
        format: uuid
      displayName:
        type: string
        maxLength: 254
  oldRole:
    type: string
    enum: [admin, member]
  newRole:
    type: string
    enum: [admin, member]
