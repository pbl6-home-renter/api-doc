type: object
x-apidog-folder: "Conversation"
title: Conversation
description: Hội thoại chat generic, có thể là chat tự do hoặc gắn với một context nghiệp vụ.
allOf:
  - $ref: '../../common/base-entity.yaml'
  - type: object
    properties:
      kind:
        type: string
        enum: [direct, group]
        description: Kiểu hội thoại.
        example: group
      contextType:
        type: string
        nullable: true
        enum: [contract, building]
        description: Loại tài nguyên liên kết; bỏ trống với chat tự do.
        example: contract
      contextId:
        type: string
        format: uuid
        nullable: true
        description: ID tài nguyên liên kết.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      title:
        type: string
        nullable: true
        minLength: 1
        maxLength: 255
        description: Tiêu đề cuộc hội thoại
        example: "Chat tòa nhà Thanh Xuân"
      avatarMediaId:
        type: string
        format: uuid
        nullable: true
        description: ID ảnh đại diện nhóm trong Media Service.
      unreadCount:
        type: integer
        minimum: 0
        description: Số tin chưa đọc của user hiện tại.
    required:
      - kind
