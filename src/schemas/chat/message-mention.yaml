type: object
title: MessageMention
description: Người dùng được @tag trong tin nhắn chat
allOf:
  - $ref: '../../common/base-entity.yaml'
  - type: object
    properties:
      messageId:
        type: string
        format: uuid
        description: ID tin nhắn chứa lượt nhắc tên
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      userId:
        type: string
        format: uuid
        description: ID người dùng được @tag
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
    required:
      - messageId
      - userId
