type: object
x-apidog-folder: "Message"
title: Message
description: Tin nhắn text, ảnh, system hoặc bot trong hội thoại.
allOf:
  - $ref: '../../common/base-entity.yaml'
  - type: object
    properties:
      conversationId:
        type: string
        format: uuid
        description: ID cuộc hội thoại chứa tin nhắn
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      senderUserId:
        type: string
        format: uuid
        nullable: true
        description: ID user gửi; null với system message và bot.
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      senderName:
        type: string
        maxLength: 254
        description: Tên người gửi được snapshot tại thời điểm tạo message.
      senderType:
        type: string
        enum: [user, system]
      type:
        type: string
        enum: [text, image, system, bot]
        description: Loại tin nhắn
        example: "text"
      content:
        type: string
        nullable: true
        description: Nội dung tin nhắn dạng văn bản
        example: "Đã chốt số điện tháng 09: 180 kWh"
      mediaId:
        type: string
        format: uuid
        nullable: true
        description: Media ID của ảnh đã upload qua Media Service.
      sequence:
        type: integer
        format: int64
        minimum: 1
      clientMessageId:
        type: string
        format: uuid
        description: ID idempotency do client tạo.
      payload:
        type: object
        nullable: true
        description: Payload is a discriminated union for implemented system actions.
        oneOf:
          - $ref: '../../openapi.yaml#/components/schemas/ConversationMembersAddedPayload'
          - $ref: '../../openapi.yaml#/components/schemas/ConversationMemberKickedPayload'
          - $ref: '../../openapi.yaml#/components/schemas/ConversationMemberLeftPayload'
          - $ref: '../../openapi.yaml#/components/schemas/ConversationAdminTransferredPayload'
          - $ref: '../../openapi.yaml#/components/schemas/ConversationMemberRoleChangedPayload'
        discriminator:
          propertyName: action
          mapping:
            members_added: '../../openapi.yaml#/components/schemas/ConversationMembersAddedPayload'
            member_kicked: '../../openapi.yaml#/components/schemas/ConversationMemberKickedPayload'
            member_left: '../../openapi.yaml#/components/schemas/ConversationMemberLeftPayload'
            admin_transferred: '../../openapi.yaml#/components/schemas/ConversationAdminTransferredPayload'
            member_role_changed: '../../openapi.yaml#/components/schemas/ConversationMemberRoleChangedPayload'
        example:
          action: members_added
          actorUserId: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
          members:
            - userId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              displayName: Nguyễn Văn A
    required:
      - conversationId
      - senderName
      - type
