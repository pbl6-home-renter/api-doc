title: ConversationMemberKickedPayload
type: object
additionalProperties: false
required: [action, actorUserId, actorDisplayName, member]
properties:
  action:
    type: string
    enum: [member_kicked]
  actorUserId:
    type: string
    format: uuid
    description: User admin thực hiện thao tác kick.
  actorDisplayName:
    type: string
    maxLength: 254
    description: Snapshot tên hiển thị của người thực hiện thao tác.
  member:
    type: object
    additionalProperties: false
    required: [userId, displayName]
    properties:
      userId:
        type: string
        format: uuid
      displayName:
        type: string
        maxLength: 254
