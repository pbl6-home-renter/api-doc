type: object
x-apidog-folder: "Invoice"
title: Invoice
description: Hóa đơn tiền phòng và chi phí dịch vụ theo từng kỳ
allOf:
  - $ref: '../../common/base-entity.yaml'
  - type: object
    properties:
      contractId:
        type: string
        format: uuid
        description: ID hợp đồng thuê phòng
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      code:
        type: string
        minLength: 1
        maxLength: 32
        description: Unique invoice code in the format INV-YYYYMM-XXXX.
        example: "INV-202609-8F2K"
      period:
        type: string
        minLength: 7
        maxLength: 7
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        description: Kỳ tính tiền (YYYY-MM)
        example: "2026-09"
      rentAmount:
        type: string
        pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,4})?$'
        description: Tiền thuê phòng sau prorate, decimal string làm tròn half-up tới 4 chữ số thập phân (P6-D65/D72)
        example: '3500000.0000'
      breakdown:
        type: array
        description: Snapshot điện, nước và phí dịch vụ; decimal lưu dạng string, tiền từng dòng làm tròn half-up 4 chữ số thập phân (P6-D65/D72)
        items:
          type: object
          properties:
            type:
              type: string
            name:
              type: string
            rateKind:
              type: string
            unitPrice:
              type: string
              nullable: true
              pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
            quantity:
              type: string
              pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
            unit:
              type: string
            serviceStart:
              type: string
              format: date
            serviceEnd:
              type: string
              format: date
            prorateRatio:
              type: string
              pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
            amount:
              type: string
              pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,4})?$'
            tierDetail:
              type: array
              items:
                type: object
      otherFees:
        type: array
        description: Phí phát sinh một lần hoặc giảm trừ/miễn giảm (D33 cho phép amount âm)
        items:
          type: object
          properties:
            name:
              type: string
            amount:
              type: string
              pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]{1,4})?$'
          required:
            - name
            - amount
      totalAmount:
        type: string
        pattern: '^(0|[1-9][0-9]*)$'
        description: Tổng tiền làm tròn half-up về số nguyên đồng của các dòng đã làm tròn 4 chữ số (P6-D72)
        example: '4610000'
      status:
        type: string
        enum: [pending, issued, void]
        default: pending
        description: Trạng thái hóa đơn (D39 bỏ overdue; hủy hóa đơn chuyển thành void)
        example: "pending"
      issuedAt:
        type: string
        format: date-time
        nullable: true
        description: Thời điểm hóa đơn được phát hành
        example: "2026-09-30T20:15:00Z"
      voidedInvoiceId:
        type: string
        format: uuid
        nullable: true
        description: ID hóa đơn cũ bị thay thế nếu hóa đơn này là bản sửa đổi (D37)
        example: null
      voidReason:
        type: string
        nullable: true
        minLength: 1
        maxLength: 500
        description: Lý do hủy hóa đơn, lưu khi chuyển trạng thái sang void (P6-D72)
      note:
        type: string
        nullable: true
        description: Ghi chú hóa đơn (vd lý do prorate)
        example: "Tháng nhập cư, prorate từ 15/09"
    required:
      - contractId
      - code
      - period
      - rentAmount
      - totalAmount
      - status
