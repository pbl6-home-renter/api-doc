type: object
x-apidog-folder: "RatePolicy"
title: RatePolicy
description: Bộ chính sách đơn giá dịch vụ và phí định kỳ (1 bộ áp dụng theo scope building hoặc room - D39)
allOf:
  - $ref: '../../common/base-entity.yaml'
  - type: object
    properties:
      landlordId:
        type: string
        format: uuid
        description: ID chủ nhà sở hữu bộ đơn giá
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      scope:
        type: string
        enum: [building, room]
        description: Phạm vi áp dụng chính sách giá
        example: "room"
      buildingId:
        type: string
        format: uuid
        nullable: true
        description: ID tòa nhà (bắt buộc khi scope = building)
        example: null
      roomId:
        type: string
        format: uuid
        nullable: true
        description: ID phòng (bắt buộc khi scope = room)
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      rates:
        type: array
        description: Danh sách các đơn giá dịch vụ và phí định kỳ
        items:
          $ref: '../../openapi.yaml#/components/schemas/RateItem'
      isActive:
        type: boolean
        default: true
        description: "true = áp dụng bộ này; false = tắt và kế thừa bộ cấp trên"
        example: true
    required:
      - landlordId
      - scope
      - rates
      - isActive
