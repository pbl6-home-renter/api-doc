type: object
title: MeterReading
description: Manual electricity or water reading with optional image evidence.
allOf:
- $ref: ../../common/base-entity.yaml
- type: object
  properties:
    id: &id001
      type: string
      format: uuid
    roomId: *id001
    buildingId: *id001
    type:
      type: string
      enum:
      - electricity
      - water
    period:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])$
    previousReading: &id002
      type: string
      pattern: ^(0|[1-9]\d*)(\.\d{1,2})?$
    currentReading: *id002
    consumption: *id002
    isBaseline:
      type: boolean
    evidenceMediaIds:
      type: array
      items: *id001
    evidenceMediaUrls:
      type: array
      items:
        type: string
    createdAt:
      type: string
      format: date-time
