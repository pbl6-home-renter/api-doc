type: object
title: BillingSetting
description: Cấu hình ngày thu dự kiến và nhắc nộp tiền (D39 - chỉ hiển thị, không sinh overdue tự động)
allOf:
  - $ref: '../../common/base-entity.yaml'
  - type: object
    properties:
      landlordId:
        type: string
        format: uuid
        description: ID chủ nhà sở hữu cấu hình
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      scope:
        type: string
        enum: [building, room]
        description: Phạm vi cấu hình (building hoặc room)
        example: "room"
      buildingId:
        type: string
        format: uuid
        nullable: true
        description: ID tòa nhà (bắt buộc khi scope = building)
        example: null
      roomId:
        type: string
        format: uuid
        nullable: true
        description: ID phòng (bắt buộc khi scope = room)
        example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      paymentDueDay:
        type: integer
        minimum: 1
        maximum: 28
        default: 5
        description: Ngày trong tháng dự kiến thu tiền (1-28, chỉ để hiển thị gợi ý)
        example: 5
      remindDay:
        type: integer
        minimum: 1
        maximum: 28
        nullable: true
        description: Ngày trong tháng gợi ý nhắc nộp tiền (null = không nhắc)
        example: 3
      botEnabled:
        type: boolean
        default: true
        description: Cho phép bot gửi card nhắc nộp vào room chat
        example: true
      isActive:
        type: boolean
        default: true
        description: "false = tắt và kế thừa cấp trên"
        example: true
    required:
      - landlordId
      - scope
      - paymentDueDay
      - botEnabled
      - isActive
