type: object
x-apidog-folder: PushDevice
title: PushDevice
description: FCM token Android thuộc user đang đăng nhập; đăng ký lại cùng token cập nhật bản ghi cũ.
allOf:
  - $ref: '../../common/base-entity.yaml'
  - type: object
    properties:
      userId: { type: string, format: uuid }
      token: { type: string, minLength: 1, maxLength: 512 }
      platform: { type: string, enum: [android] }
      lastSeenAt: { type: string, format: date-time }
      revokedAt: { type: string, format: date-time, nullable: true }
    required: [userId, token, platform, lastSeenAt, revokedAt]
