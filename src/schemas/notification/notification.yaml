type: object
x-apidog-folder: Notification
title: Notification
description: Một thông báo nghiệp vụ đã lưu cho một người nhận; không chứa message chat.
allOf:
  - $ref: '../../common/base-entity.yaml'
  - type: object
    properties:
      recipientUserId: { type: string, format: uuid }
      sourceService: { type: string, minLength: 1 }
      eventId: { type: string, format: uuid }
      type: { type: string, enum: [invoice, issue] }
      title: { type: string, minLength: 1, maxLength: 255 }
      body: { type: string, minLength: 1, maxLength: 2000 }
      deepLink: { type: string, nullable: true }
      data: { type: object, nullable: true, additionalProperties: true }
      readAt: { type: string, format: date-time, nullable: true }
    required: [recipientUserId, sourceService, eventId, type, title, body, readAt]
