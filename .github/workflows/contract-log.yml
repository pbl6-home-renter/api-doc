# Sau khi merge vào main: ghi entry vào reports/api-changelog.*, bundle lại (kèm lịch sử theo endpoint) và bot commit.
# Bot chỉ sửa reports/ và reference/ (ngoài paths filter) và commit kèm [skip ci] nên không tự kích hoạt lại.
# Nếu sau này bật branch protection cho main, cần thêm GitHub Actions vào bypass list của ruleset.
name: API contract log

on:
  push:
    branches: [main]
    paths: ['src/**']

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: contract-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup-contract-tools

      - name: Find merged PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: context.sha });
            const pr = data.find(item => item.merged_at) ?? data[0];
            const body = (pr?.body ?? '').replace(/<!--[\s\S]*?-->/g, '');
            const reason = body.match(/^##[ \t]*Lý do thay đổi API[ \t]*\r?\n([\s\S]*?)(?=^##\s|(?![\s\S]))/im)?.[1].trim() ?? '';
            require('fs').writeFileSync(`${process.env.RUNNER_TEMP}/reason.txt`, reason);
            core.setOutput('url', pr?.html_url ?? '');
            core.setOutput('number', pr?.number ?? '');

      - name: Update changelog and bundle
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pr_args=()
          [ -n "$PR_URL" ] && pr_args=(--pr "$PR_URL")
          message="chore(api-changelog): update contract changelog${PR_NUMBER:+ for #$PR_NUMBER} [skip ci]"

          # Nhánh main có thể đã tiến lên trong lúc chạy; làm lại trên bản mới nhất, tối đa 3 lần.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if ! echo "$BASE_SHA" | grep -q '^0*$'; then
              node scripts/contract-change-report.mjs --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA" \
                "${pr_args[@]}" --reason-file "$RUNNER_TEMP/reason.txt" --out reports/api-changelog.md
            fi
            npm run bundle
            git add reports/api-changelog.json reports/api-changelog.md reference/rentify.json
            if git diff --cached --quiet; then
              echo "Không có thay đổi cần commit."
              exit 0
            fi
            git commit -m "$message"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push bị từ chối (lần $attempt), thử lại trên main mới nhất."
          done
          exit 1
