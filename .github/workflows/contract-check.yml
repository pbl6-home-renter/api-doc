# Báo cáo thay đổi API contract trên từng PR; không chặn merge, chỉ gắn label và request reviewer.
name: API contract check

on:
  pull_request:
    branches: [main]
    paths: ['src/**']

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: contract-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-contract-tools

      - name: Extract change reason from PR body
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body ?? '').replace(/<!--[\s\S]*?-->/g, '');
            const reason = body.match(/^##[ \t]*Lý do thay đổi API[ \t]*\r?\n([\s\S]*?)(?=^##\s|(?![\s\S]))/im)?.[1].trim() ?? '';
            require('fs').writeFileSync(`${process.env.RUNNER_TEMP}/reason.txt`, reason);

      - run: npm run lint

      - name: Generate contract report
        id: report
        run: >
          node scripts/contract-change-report.mjs
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref "${{ github.event.pull_request.head.sha }}"
          --pr "${{ github.event.pull_request.html_url }}"
          --reason-file "$RUNNER_TEMP/reason.txt"
          --out "$RUNNER_TEMP/contract/pr-report.md"

      - name: Comment, label and request reviewers
        uses: actions/github-script@v7
        env:
          CLASSIFICATION: ${{ steps.report.outputs.classification }}
          REVIEWERS: ${{ vars.CONTRACT_REVIEWERS }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const issue_number = pr.number;
            const classification = process.env.CLASSIFICATION || 'NO_CHANGE';
            const reason = fs.readFileSync(`${process.env.RUNNER_TEMP}/reason.txt`, 'utf8').trim();
            const marker = '<!-- contract-change-report -->';

            let body = `${marker}\n**Kết quả kiểm tra API contract: ${classification}**\n\n`;
            if (classification !== 'NO_CHANGE' && !reason) {
              body += '> ⚠️ Chưa có lý do thay đổi. Hãy điền mục `## Lý do thay đổi API` trong mô tả PR; lý do sẽ được ghi vào changelog khi merge.\n\n';
            }
            if (['BREAKING', 'NEEDS_REVIEW'].includes(classification)) {
              body += '> Thay đổi có thể ảnh hưởng client đang chạy. Reviewer cần xác nhận phương án tương thích với FE/Mobile trước khi merge.\n\n';
            }
            body += fs.readFileSync(`${process.env.RUNNER_TEMP}/contract/pr-report.md`, 'utf8');
            if (body.length > 60000) body = `${body.slice(0, 60000)}\n\n…(đã cắt bớt; xem log của workflow)`;

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

            const label = 'api-breaking';
            const labelled = pr.labels.some(item => item.name === label);
            if (['BREAKING', 'NEEDS_REVIEW'].includes(classification)) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name: label, color: 'd73a4a', description: 'API contract change may break existing clients' });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
              if (!labelled) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
              const reviewers = (process.env.REVIEWERS || '').split(',').map(name => name.trim()).filter(name => name && name !== pr.user.login);
              if (reviewers.length) await github.rest.pulls.requestReviewers({ owner, repo, pull_number: issue_number, reviewers });
            } else if (labelled) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
            }
