RoomCreate:
  title: RoomCreate
  type: object
  required: [name]
  properties:
    name:
      type: string
      description: Tên phòng hiển thị cho người thuê.
      example: Phòng 101
    buildingId:
      type: string
      format: uuid
Room:
  title: Room
  type: object
  required: [id, name]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
